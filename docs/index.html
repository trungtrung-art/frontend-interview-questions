 HttpOnly | Câu 55 | — |\n| CORS, preflight, credentials | Câu 56 | — |\n| CDN, Cache-Control, ETag, 304, same-origin vs same-site | Câu 57, 58 | [09: DEFLATE, Brotli](./09-algorithms.md#10-compression--nén-dữ-liệu) |\n\n### Architecture\n\n| Chủ đề | Câu trong giáo án | Bổ sung |\n|---|---|---|\n| State architecture cho app nhiều team | Câu 59, 60 | [04-problem-solving-system-design.md](./04-problem-solving-system-design.md) |\n| React Query: staleTime, gcTime, query key, optimistic update | Câu 61, 62 | [09: LRU Cache](./09-algorithms.md#2-data-structures--cấu-trúc-dữ-liệu) |\n| RSC, Server vs Client Component, `\"use client\"` | Câu 63, 64 | — |\n| Hydration, mismatch, Streaming SSR, Suspense | Câu 65, 66 | — |\n| Server Action, đặt authentication ở đâu | Câu 67 | — |\n| Migrate app cũ, Next.js vs CRA, auth Next.js | Câu 68, 69, 70 | — |\n| Design system và component library | Câu 71, 72, DS-01 → DS-15 | — |\n\n### Security\n\n| Chủ đề | Câu trong giáo án |\n|---|---|\n| XSS trong React, ba dạng XSS | Câu 73, 74 |\n| Lưu token ở đâu | Câu 75 |\n| CSRF, SameSite, CSRF token | Câu 76 |\n| CSP, clickjacking, refresh token rotation, logout | Câu 77 |\n| 20 API cùng trả 401, gom về một refresh request | Câu 78 |\n| Refresh token cũng hết hạn giữa chừng | Câu 79 |\n\n### Performance\n\n| Chủ đề | Câu trong giáo án | Bổ sung |\n|---|---|---|\n| Xác định bottleneck, React DevTools Profiler | Câu 80, 81, 91, 92 | [03-performance-optimization.md](./03-performance-optimization.md) |\n| Search input lag, table lớn, giới hạn của virtualization | Câu 82, 83, 84 | [09: Hash Table, Sliding Window](./09-algorithms.md) |\n| LCP, INP, CLS và cách debug | Câu 85, 86, 93 | — |\n| Bundle tăng, code splitting, image | Câu 87, 88, 89 | [09: Compression](./09-algorithms.md#10-compression--nén-dữ-liệu) |\n| Memory leak sau vài giờ dùng | Câu 90, 95 | — |\n| React.memo dùng sai làm chậm hơn | Câu 94 | — |\n\n### System Design\n\n| Chủ đề | Câu trong giáo án | Bổ sung |\n|---|---|---|\n| Autocomplete / search box | Câu 96 | [09: Trie, Sliding Window](./09-algorithms.md) |\n| Data table lớn có sort, filter, pagination | Câu 97 | [09: Sorting, Binary Search](./09-algorithms.md#3-sorting--sắp-xếp) |\n| Dashboard realtime, chat streaming, WebSocket/SSE | Câu 98, 99, 100, 101, 102 | [09: Queue](./09-algorithms.md#2-data-structures--cấu-trúc-dữ-liệu) |\n| Infinite scroll, form builder, collaborative editor | Câu 103, 104, 105 | [09: LCS](./09-algorithms.md#6-dynamic-programming--quy-hoạch-động) |\n\n### Engineering và behavioral\n\n| Chủ đề | Câu trong giáo án | Bổ sung |\n|---|---|---|\n| Test checkout flow, phân tầng test | Câu 106, 107 | [08-testing-best-practices.md](./08-testing-best-practices.md) |\n| Chuyện perf có số liệu, refactor legacy | Câu 108, 109 | [05-behavioral-experience.md](./05-behavioral-experience.md) |\n| Bất đồng với PM/backend/designer, review PR, mentor | Câu 110, 111, 112 | [05-behavioral-experience.md](./05-behavioral-experience.md) |\n| Production incident | Câu 113 | — |\n| Double submit, hai tab cùng sửa, deploy đổi contract, chunk 404 | Câu 114, 115, 116, 117 | — |\n\n---\n\n## 3. Sáu Dạng Câu Hỏi Và Khung Trả Lời\n\nGiáo án có một template chung ở đầu file. Mục này chia nhỏ theo dạng, vì mỗi dạng ăn điểm ở chỗ khác nhau.\n\n### Dạng 1 — \"X là gì?\"\n\nBốn nhịp, khoảng 60–90 giây:\n\n1. Một câu định nghĩa, không vòng vo\n2. Cơ chế bên dưới: nó hoạt động thế nào\n3. Khi nào dùng và khi nào không\n4. Một bẫy hoặc trade-off\n\nVí dụ với closure (Câu 6): \"Closure là hàm nhớ được scope nơi nó được tạo ra, kể cả khi scope đó đã thoát.\" → cơ chế giữ tham chiếu tới biến, không phải copy giá trị → dùng cho private state, factory, hook → bẫy là giữ tham chiếu tới DOM node hoặc object lớn thì chặn GC, thành leak.\n\nNhịp 4 là chỗ phân biệt Senior với người học thuộc. Không bao giờ bỏ nhịp này.\n\n### Dạng 2 — \"A khác B thế nào?\"\n\nĐừng liệt kê song song hai danh sách. Chọn **trục so sánh** trước, rồi đi theo trục:\n\n1. Nêu trục: \"Hai cái này khác nhau ở ba trục: nơi lưu state, thời điểm chạy, và ai sở hữu dữ liệu\"\n2. Đi từng trục, mỗi trục nói cả A và B\n3. Kết: \"nên tôi chọn A khi ..., chọn B khi ...\"\n\nÁp dụng cho Câu 27 (bốn loại state), Câu 39 (ba loại effect), Câu 47 (SSR/SSG/ISR/CSR), Câu 58 (same-origin vs same-site).\n\n### Dạng 3 — \"Sao nó chậm / debug thế nào?\"\n\nInterviewer đang kiểm tra anh có phương pháp hay đoán mò. Luôn **đo trước, sửa sau**:\n\n1. Đo cái gì, bằng công cụ nào, con số nào\n2. Thu hẹp: network, render, layout hay bundle (Câu 80)\n3. Giả thuyết cụ thể, kèm cách xác nhận\n4. Sửa\n5. Đo lại và so với con số ban đầu\n\nCâu trả lời nhảy thẳng vào \"tôi sẽ thêm useMemo\" là trượt. Áp dụng cho Câu 80–95.\n\n### Dạng 4 — \"Thiết kế X\"\n\n1. Hỏi lại để chốt phạm vi: bao nhiêu user, bao nhiêu dữ liệu, realtime tới mức nào, mobile hay desktop\n2. Nêu ràng buộc tự đặt ra\n3. Vẽ luồng dữ liệu, không vẽ sơ đồ component\n4. Đưa **hai** phương án, không phải một\n5. Chọn một và nói rõ đánh đổi gì\n6. Nhắc bốn thứ hay bị quên: cache, lỗi, accessibility, cách đo\n\nBước 6 chính là Câu 72. Áp dụng cho Câu 96–105.\n\n### Dạng 5 — Live coding\n\n1. Nói cách làm trước khi gõ phím\n2. Viết bản chạy được trước, đừng tối ưu sớm\n3. Nói độ phức tạp của bản đang viết\n4. Nêu edge case trước khi bị hỏi: rỗng, một phần tử, trùng lặp, input rất lớn\n5. Chỉ tối ưu khi đã chạy đúng, và nói rõ tối ưu cái gì\n\nChuẩn bị bằng [09-algorithms.md](./09-algorithms.md) mục Ưu tiên ôn trước và [find-unclosed-tags.js](./find-unclosed-tags.js).\n\n### Dạng 6 — Behavioral\n\nSTAR có số liệu. Không có số thì câu chuyện thành kể lể:\n\n1. **S** — bối cảnh, một câu\n2. **T** — anh chịu trách nhiệm gì\n3. **A** — anh làm gì, cụ thể tới mức nêu được công cụ và quyết định\n4. **R** — kết quả kèm số: bao nhiêu phần trăm, từ bao nhiêu xuống bao nhiêu, trong bao lâu\n5. Một câu rút ra: lần sau làm khác chỗ nào\n\nXem mục [7](#7-sáu-câu-chuyện-dự-án-cần-chuẩn-bị) và Câu 108–113.\n\n---\n\n## 4. Bẫy Hay Trượt Ở Vòng Senior\n\nMỗi dòng là một câu trả lời nghe có vẻ đúng nhưng để lộ là chưa làm thật.\n\n| # | Bẫy | Thiếu gì | Đọc lại |\n|---|---|---|---|\n| 1 | \"Dùng `useMemo` cho nhanh hơn\" | Không nói được khi nào nó vô dụng hoặc phản tác dụng | Câu 31, 94 |\n| 2 | \"State chung thì đẩy hết vào Redux\" | Không tách server state khỏi client state | Câu 27, 60 |\n| 3 | \"Context thay được Redux\" | Quên Context làm re-render toàn bộ cây consumer | Câu 26, 33 |\n| 4 | \"JavaScript đơn luồng nên có event loop\" rồi dừng | Không nối sang microtask, starvation, và frame rendering | Câu 7, 8, 9 |\n| 5 | Dùng index làm `key` | Không nêu điều kiện nào thì index an toàn, nào thì hỏng | Câu 22 |\n| 6 | \"React tự escape nên không lo XSS\" | Quên `dangerouslySetInnerHTML`, `href=\"javascript:\"`, và CSP | Câu 73, 74, 77 |\n| 7 | \"Lưu token ở localStorage cho tiện\" | Không so với HttpOnly cookie, và không nhắc CSRF đi kèm | Câu 75, 76 |\n| 8 | \"Lazy load hết cho nhẹ\" | Lazy nhầm ảnh hero hoặc chunk trên đường LCP thì làm chậm thêm | Câu 88, 89, 93 |\n| 9 | \"Bảng lớn thì virtualize là xong\" | Quên row cao động, cell nặng, và chi phí đo lại | Câu 84 |\n| 10 | \"Giảm bundle thì LCP tốt lên\" | Không phân biệt bundle với TTFB và tài nguyên chặn render | Câu 93 |\n| 11 | Debounce và throttle dùng lẫn lộn | Không nói được cái nào cho ô search, cái nào cho scroll | Câu 13 |\n| 12 | \"Chỗ đó bị memory leak\" | Không mô tả được cách chứng minh bằng heap snapshot | Câu 18, 95 |\n| 13 | \"CORS là lỗi của backend\" | Không giải thích preflight, `OPTIONS`, `credentials` | Câu 56 |\n| 14 | \"SSR nhanh hơn CSR\" | Quên hydration và khoảng thời gian trang hiện mà chưa bấm được | Câu 46, 65, 66 |\n| 15 | \"Bọc `React.memo` cho chắc\" | Không biết so sánh props cũng tốn, và props tham chiếu mới thì memo vô dụng | Câu 23, 94 |\n| 16 | \"Đã viết test rồi\" | Không phân tầng unit / integration / E2E theo cái gì | Câu 106, 107 |\n| 17 | Kể chuyện behavioral không có con số | Không chứng minh được tác động | Câu 108 |\n| 18 | \"Deploy xong là xong\" | Quên user đang mở tab bản cũ, chunk 404, contract đổi | Câu 116, 117 |\n\n---\n\n## 5. Cây Follow-up\n\nCâu mở đầu thường dễ. Điểm số quyết định ở nhánh thứ hai và thứ ba. Tự hỏi mình theo các cây dưới đây — nếu gãy ở đâu thì đọc lại câu ghi kèm.\n\n| Câu mở đầu | Follow-up 1 | Follow-up 2 | Chỗ hay gãy |\n|---|---|---|---|\n| Closure là gì? (Câu 6) | Closure giữ gì trong bộ nhớ? | Nó gây leak thế nào, chứng minh ra sao? | Không nối được closure sang memory (Câu 14, 17, 18) |\n| Event loop hoạt động thế nào? (Câu 7) | Microtask khác macrotask ở đâu? | Starvation là gì, ảnh hưởng 60fps ra sao? | Dừng ở mức \"hàng đợi callback\" (Câu 8, 9) |\n| `useMemo` để làm gì? (Câu 23) | Khi nào nó vô dụng? | Vì sao memo khắp project lại chậm hơn? | Không biết chi phí của chính việc so sánh (Câu 31, 94) |\n| Khi nào dùng Context? (Câu 25) | Vì sao Context gây re-render thừa? | Vậy server state thì để đâu? | Không phân biệt bốn loại state (Câu 26, 27, 33, 60) |\n| Re-render là gì? (Câu 21) | Props không đổi sao vẫn render lại? | Re-render nhiều có luôn là vấn đề không? | Mặc định coi mọi re-render là xấu (Câu 24, 32) |\n| LCP là gì? (Câu 85) | Debug LCP cao theo thứ tự nào? | Bundle giảm 3MB mà LCP không đổi, vì sao? | Gắn LCP với kích thước bundle (Câu 86, 93) |\n| Token lưu ở đâu? (Câu 75) | Chống CSRF thế nào? | 20 API cùng trả 401 thì xử lý ra sao? | Không nghĩ tới hàng đợi refresh (Câu 76, 78, 79) |\n| Thiết kế autocomplete (Câu 96) | User gõ nhanh, response cũ về sau thì sao? | Cancel và cache thế nào? | Chỉ nói debounce rồi dừng (Câu 11, 12, 61) |\n| Table 10k rows chậm (Câu 83) | Virtualize rồi vẫn lag thì sao? | Row cao động thì đo thế nào? | Coi virtualization là thuốc chữa bách bệnh (Câu 84, 97) |\n| Hydration là gì? (Câu 65) | Mismatch xảy ra vì đâu? | Streaming SSR đổi gì trong luồng đó? | Không phân biệt render server và hydrate client (Câu 66) |\n\n---\n\n## 6. Số Liệu Và Tên Riêng Phải Thuộc\n\nSai tên API hoặc sai ngưỡng là mất điểm ngay, dù phần giải thích đúng.\n\n### Ngưỡng Core Web Vitals\n\n| Chỉ số | Tốt | Cần cải thiện | Kém |\n|---|---|---|---|\n| LCP | ≤ 2.5s | 2.5s – 4.0s | > 4.0s |\n| INP | ≤ 200ms | 200ms – 500ms | > 500ms |\n| CLS | ≤ 0.1 | 0.1 – 0.25 | > 0.25 |\n\nNgưỡng được tính ở phân vị 75 của lượt truy cập thật, không phải số đo trên máy anh.\n\n### Con số hay dùng\n\n- **16.7ms** — ngân sách một frame ở 60fps. Trừ công việc của browser, JS chỉ còn khoảng 10ms\n- **TTFB** dưới ~800ms là mốc thường được lấy làm mục tiêu\n- **~170KB JS nén gzip** cho lần tải đầu trên mobile — đây là mốc tham khảo hay được trích, không phải chuẩn bắt buộc. Nói rõ là \"mốc tôi dùng\", đừng nói như quy định\n- **Brotli nhỏ hơn gzip khoảng 15–20%** với văn bản\n\n### Tên phải gọi đúng\n\n- Hooks: `useSyncExternalStore`, `useDeferredValue`, `startTransition`, `useTransition`, `useInsertionEffect`, `useActionState`, `useOptimistic`\n- API: `structuredClone()`, `AbortController`, `IntersectionObserver`, `requestIdleCallback`, `queueMicrotask`\n- HTTP: `Cache-Control` (`max-age`, `s-maxage`, `stale-while-revalidate`), `ETag`, `304 Not Modified`, `SameSite` (`Strict`, `Lax`, `None`), `Content-Encoding` (`gzip`, `br`)\n- DevTools: panel **Performance**, panel **Memory** (heap snapshot, allocation instrumentation on timeline), tab **Coverage**, **Lighthouse**\n- React DevTools: **Profiler**, chế độ **Flamegraph** và **Ranked**\n\nChi tiết từ vựng: [glossary.md](./glossary.md).\n\n---\n\n## 7. Sáu Câu Chuyện Dự Án Cần Chuẩn Bị\n\nViết sẵn sáu câu chuyện này ra giấy trước buổi phỏng vấn. Mỗi câu 5–6 câu nói, theo khung STAR ở [dạng 6](#dạng-6--behavioral). Gần như mọi câu behavioral đều rơi vào một trong sáu ô.\n\n| # | Câu chuyện | Phải có con số gì | Câu liên quan |\n|---|---|---|---|\n| 1 | Một lần tối ưu hiệu năng | Trước và sau: LCP, INP, thời gian render, dung lượng bundle | Câu 108 |\n| 2 | Một bug khó, mất nhiều thời gian | Bao lâu mới tìm ra, công cụ nào, ảnh hưởng bao nhiêu user | Câu 90, 95, 113 |\n| 3 | Một lần bất đồng kỹ thuật | Hai phương án là gì, chốt theo tiêu chí nào, kết quả sau đó | Câu 110 |\n| 4 | Một quyết định kiến trúc | Đánh đổi gì, vì sao không chọn phương án kia, sau 6 tháng thấy đúng hay sai | Câu 59, 68, 109 |\n| 5 | Một lần làm hỏng production | Phát hiện sau bao lâu, khắc phục thế nào, sau đó thêm hàng rào gì | Câu 113, 116, 117 |\n| 6 | Một lần mentor hoặc nâng chất lượng team | Đổi cái gì trong quy trình, đo bằng gì | Câu 111, 112 |\n\nNếu một ô nào chưa có chuyện thật, đừng bịa. Nói thẳng là chưa gặp, rồi kể tình huống gần nhất và nói anh sẽ xử lý thế nào.\n\n---\n\n## 8. Checklist 24 Giờ Và Ngày Phỏng Vấn\n\n### Hôm trước\n\n- [ ] Đọc lại mục [4](#4-bẫy-hay-trượt-ở-vòng-senior) và [5](#5-cây-follow-up) của playbook\n- [ ] Đọc to sáu câu chuyện ở mục [7](#7-sáu-câu-chuyện-dự-án-cần-chuẩn-bị), bấm giờ mỗi câu dưới 2 phút\n- [ ] Rà lại ngưỡng Web Vitals và tên hook ở mục [6](#6-số-liệu-và-tên-riêng-phải-thuộc)\n- [ ] Đọc lại mô tả công việc, gạch ra ba chủ đề họ chắc chắn sẽ hỏi, mở đúng câu đó trong giáo án\n- [ ] Chuẩn bị 3–4 câu hỏi ngược ở mục [9](#9-câu-hỏi-nên-hỏi-ngược)\n- [ ] Nếu có vòng live coding: chạy thử editor, thử chia sẻ màn hình\n- [ ] Ngủ. Nhồi thêm câu mới đêm trước không có tác dụng\n\n### Trong ngày\n\n- [ ] 30 phút trước: chỉ liếc mục [6](#6-số-liệu-và-tên-riêng-phải-thuộc), không mở giáo án\n- [ ] Kiểm tra mic, camera, đường truyền, và tên hiển thị\n- [ ] Mở sẵn một file trắng để ghi chú và vẽ khi cần\n- [ ] Nghe hết câu hỏi rồi mới trả lời. Không rõ thì hỏi lại, đó là điểm cộng\n- [ ] Không biết thì nói không biết, rồi nói cách anh sẽ tìm ra\n- [ ] Trả lời xong một ý thì dừng, để họ hỏi tiếp. Đừng nói liên tục 5 phút\n\n---\n\n## 9. Câu Hỏi Nên Hỏi Ngược\n\nHỏi theo chủ đề anh thật sự quan tâm, đừng đọc thuộc cả danh sách. Ba đến bốn câu là đủ.\n\n**Về công việc**\n- Sáu tháng đầu, người làm tốt vị trí này sẽ tạo ra khác biệt gì?\n- Bài toán kỹ thuật khó nhất của team hiện giờ là gì?\n\n**Về cách làm việc**\n- Quy trình review PR đang ra sao? Một PR thường mất bao lâu để merge?\n- Team xử lý nợ kỹ thuật thế nào — có thời gian dành riêng hay gộp vào sprint?\n- Khi có incident trên production thì luồng xử lý và hậu kiểm thế nào?\n\n**Về kỹ thuật**\n- Frontend đang đo gì trong production, và ai xem những chỉ số đó?\n- Tỉ lệ test hiện tại nằm ở tầng nào là chính?\n- Có design system chưa, và team product dùng nó tới mức nào?\n\n**Về đội ngũ**\n- Team đang bao nhiêu người, chia theo sản phẩm hay theo tầng?\n- Người mới vào thường mất bao lâu để lên production lần đầu?\n\n---\n\n## 10. Bản Đồ Tài Liệu Trong Repo\n\n| File | Là gì | Dùng khi |\n|---|---|---|\n| [PLAYBOOK.md](./PLAYBOOK.md) | Chính file này | Bắt đầu ôn, và 24 giờ trước |\n| [ly-thuyet/01-giao-an-4-ngay-phong-van-frontend.md](./ly-thuyet/01-giao-an-4-ngay-phong-van-frontend.md) | 133 câu có đáp án đầy đủ, chín phần | Nguồn chính để học |\n| [01-javascript-questions.md](./01-javascript-questions.md) → [08-testing-best-practices.md](./08-testing-best-practices.md) | ~255 câu trắc nghiệm bốn lựa chọn | Tự kiểm tra nhanh, lấp lỗ hổng nền |\n| [09-algorithms.md](./09-algorithms.md) | 49 thuật toán, độ phức tạp, link mô phỏng | Chuẩn bị vòng live coding |\n| [find-unclosed-tags.js](./find-unclosed-tags.js) | Một bài live coding giải chi tiết bằng stack | Luyện cách vừa code vừa nói |\n| [glossary.md](./glossary.md) | Từ vựng kỹ thuật Anh–Việt A→Z | Khi phỏng vấn bằng tiếng Anh |\n| [en/](./en/) | Bản tiếng Anh của tám file trắc nghiệm | Phỏng vấn công ty nước ngoài |\n\n---\n\n*Cập nhật lần cuối: September 2026*\n", algo: "# Bảng Tra Cứu 49 Thuật Toán\n## Dành cho phỏng vấn Frontend\n\n---\n\n## 📋 Tổng Quan\n\nBảng tra cứu nhanh 49 thuật toán và cấu trúc dữ liệu, chia theo 10 nhóm. Mỗi dòng gồm độ phức tạp, tình huống dùng thực tế trong frontend, và link tới mô phỏng từng bước.\n\nNguồn mô phỏng: [alg0.dev](https://www.alg0.dev/) — Algorithm Visualizer của midudev, có mô phỏng tương tác Play/Step và code bằng JavaScript, Python, Java, C++, Rust.\n\n### Cách dùng:\n- ✅ Tra nhanh trước buổi phỏng vấn — không phải tài liệu học từ đầu\n- ✅ Cột **Khi nào dùng** viết theo góc nhìn frontend, không phải lý thuyết chung\n- ✅ Bấm ▶ để xem mô phỏng chạy từng bước trên alg0.dev\n- ✅ Xem mục [Ưu tiên ôn trước](#-ưu-tiên-ôn-trước) nếu ít thời gian\n\n### Ký hiệu:\n- `n` — số phần tử đầu vào\n- `V`, `E` — số đỉnh và số cạnh của đồ thị\n- `k` — khoảng giá trị (range) của dữ liệu\n- **TB** — trung bình · **Xấu nhất** — worst case\n\n---\n\n## 📚 Danh Sách Nhóm\n\n| # | Nhóm | Số lượng |\n|---|------|----------|\n| 01 | [Concepts — Khái niệm nền](#1-concepts--khái-niệm-nền) | 7 |\n| 02 | [Data Structures — Cấu trúc dữ liệu](#2-data-structures--cấu-trúc-dữ-liệu) | 8 |\n| 03 | [Sorting — Sắp xếp](#3-sorting--sắp-xếp) | 10 |\n| 04 | [Searching — Tìm kiếm](#4-searching--tìm-kiếm) | 4 |\n| 05 | [Graphs — Đồ thị](#5-graphs--đồ-thị) | 5 |\n| 06 | [Dynamic Programming — Quy hoạch động](#6-dynamic-programming--quy-hoạch-động) | 3 |\n| 07 | [Backtracking — Quay lui](#7-backtracking--quay-lui) | 3 |\n| 08 | [Divide and Conquer — Chia để trị](#8-divide-and-conquer--chia-để-trị) | 1 |\n| 09 | [Math — Toán học](#9-math--toán-học) | 2 |\n| 10 | [Compression — Nén dữ liệu](#10-compression--nén-dữ-liệu) | 6 |\n\n**Tổng cộng: 49 thuật toán**\n\n---\n\n## 1. Concepts — Khái niệm nền\n\nNhóm này không có độ phức tạp riêng vì chúng là khái niệm và kỹ thuật, không phải thuật toán cụ thể.\n\n| Khái niệm | Ý tưởng chính | Khi nào dùng trong FE | Demo |\n|---|---|---|---|\n| Big O Notation | Mô tả tốc độ tăng của chi phí theo kích thước input, bỏ qua hằng số | Ước lượng trước khi code; trả lời \"sao nó chậm khi data lớn\" | [▶](https://www.alg0.dev/big-o-notation) |\n| Recursion | Hàm gọi lại chính nó, thu nhỏ bài toán cho tới base case | Duyệt cây DOM, menu lồng nhau, comment tree, traverse JSON | [▶](https://www.alg0.dev/recursion) |\n| Two Pointers | Hai con trỏ chạy trên mảng đã sắp xếp, hạ O(n²) xuống O(n) | Tìm cặp có tổng bằng target, đảo mảng, khử trùng lặp tại chỗ | [▶](https://www.alg0.dev/two-pointers) |\n| Sliding Window | Cửa sổ trượt giữ trạng thái của đoạn liên tiếp, không tính lại từ đầu | Rate limit, moving average cho chart, chuỗi con dài nhất | [▶](https://www.alg0.dev/sliding-window) |\n| Space Complexity | Bộ nhớ phụ thuật toán dùng thêm ngoài input | Chọn in-place hay tạo mảng mới; quan trọng khi xử lý list lớn | [▶](https://www.alg0.dev/space-complexity) |\n| Memoization | Cache kết quả theo tham số để lần sau không tính lại | Chính là cơ chế đằng sau `useMemo`, `useCallback`, `React.memo` | [▶](https://www.alg0.dev/memoization) |\n| Greedy vs DP | Greedy chọn tối ưu cục bộ từng bước; DP xét mọi trạng thái con | Nhận ra khi nào tham lam là đủ, khi nào buộc phải quy hoạch động | [▶](https://www.alg0.dev/greedy-vs-dp) |\n\n---\n\n## 2. Data Structures — Cấu trúc dữ liệu\n\n| Cấu trúc | Độ phức tạp thao tác chính | Khi nào dùng trong FE | Demo |\n|---|---|---|---|\n| Stack | push O(1) · pop O(1) · tìm O(n) | Undo/redo, history của router, kiểm tra thẻ HTML đóng/mở, call stack | [▶](https://www.alg0.dev/stack) |\n| Queue | enqueue O(1) · dequeue O(1) · tìm O(n) | Hàng đợi request, task scheduler, nền của BFS | [▶](https://www.alg0.dev/queue) |\n| Linked List | thêm/xoá O(1) khi đã có con trỏ · truy cập O(n) | Chèn/xoá nhiều ở giữa; ghép với hash table để làm LRU cache | [▶](https://www.alg0.dev/linked-list) |\n| Hash Table | get/set/delete O(1) TB · O(n) xấu nhất khi đụng độ nhiều | `Object` và `Map` trong JS, khử trùng lặp, đếm tần suất, index lookup | [▶](https://www.alg0.dev/hash-table) |\n| Binary Search Tree | tìm/thêm/xoá O(log n) TB · O(n) xấu nhất khi cây suy biến | Dữ liệu cần vừa giữ thứ tự vừa tìm nhanh; thực tế dùng bản cân bằng (AVL, Red-Black) | [▶](https://www.alg0.dev/binary-search-tree) |\n| Heap | xem đỉnh O(1) · thêm/xoá O(log n) · tìm O(n) | Priority queue, lấy top-K, task theo độ ưu tiên, dùng trong Dijkstra | [▶](https://www.alg0.dev/heap) |\n| Trie | tìm/thêm/xoá O(L) với L là độ dài khoá | Autocomplete cho search box, gợi ý từ khoá, kiểm tra prefix | [▶](https://www.alg0.dev/trie) |\n| LRU Cache | get O(1) · put O(1) · evict O(1) | Cache response API, cache ảnh, giới hạn bộ nhớ phía client | [▶](https://www.alg0.dev/lru-cache) |\n\n> **Lưu ý:** LRU Cache O(1) đạt được bằng cách ghép Hash Table (tìm nhanh) với Doubly Linked List (đổi thứ tự nhanh). Đây là câu hỏi thiết kế hay gặp.\n\n---\n\n## 3. Sorting — Sắp xếp\n\n| Thuật toán | Time (TB) | Time (xấu nhất) | Space | Ổn định | Khi nào dùng | Demo |\n|---|---|---|---|---|---|---|\n| Bubble Sort | O(n²) | O(n²) | O(1) | Có | Chỉ để dạy học, không dùng trong code thật | [▶](https://www.alg0.dev/bubble-sort) |\n| Selection Sort | O(n²) | O(n²) | O(1) | Không | Khi số lần ghi phải ít nhất — đúng n−1 lần swap | [▶](https://www.alg0.dev/selection-sort) |\n| Insertion Sort | O(n²) | O(n²) | O(1) | Có | Mảng nhỏ hoặc gần như đã sắp xếp — chỉ O(n) khi đã sắp | [▶](https://www.alg0.dev/insertion-sort) |\n| Quick Sort | O(n log n) | O(n²) | O(log n) | Không | Mặc định cho mảng lớn: in-place và thân thiện cache | [▶](https://www.alg0.dev/quick-sort) |\n| Merge Sort | O(n log n) | O(n log n) | O(n) | Có | Khi cần ổn định hoặc cần đảm bảo O(n log n) trong mọi trường hợp | [▶](https://www.alg0.dev/merge-sort) |\n| Heap Sort | O(n log n) | O(n log n) | O(1) | Không | Cần O(n log n) đảm bảo mà chỉ được dùng O(1) bộ nhớ phụ | [▶](https://www.alg0.dev/heap-sort) |\n| Counting Sort | O(n+k) | O(n+k) | O(k) | Có | Số nguyên với khoảng giá trị k nhỏ — ví dụ sort theo rating 1–5 | [▶](https://www.alg0.dev/counting-sort) |\n| Radix Sort | O(d·(n+k)) | O(d·(n+k)) | O(n+k) | Có | Số nguyên hoặc chuỗi cùng độ dài — sort ID, mã bưu chính | [▶](https://www.alg0.dev/radix-sort) |\n| Shell Sort | ~O(n^1.25)–O(n^1.5) tuỳ gap | O(n²) bản gốc Shell · ~O(n^4/3) với Sedgewick | O(1) | Không | Bản cải tiến của Insertion cho mảng vừa, không tốn bộ nhớ phụ | [▶](https://www.alg0.dev/shell-sort) |\n| Bucket Sort | O(n+k) | O(n²) | O(n+k) | Có nếu sort trong bucket ổn định | Số thực phân bố tương đối đều trong một khoảng | [▶](https://www.alg0.dev/bucket-sort) |\n\n> **Ổn định (stable)** nghĩa là hai phần tử bằng nhau giữ nguyên thứ tự tương đối sau khi sắp xếp. Quan trọng khi sort bảng nhiều cột liên tiếp.\n\n> **Liên hệ thực tế:** `Array.prototype.sort()` trong V8 dùng **TimSort** — lai giữa Merge Sort và Insertion Sort, ổn định, O(n log n) xấu nhất và O(n) khi mảng gần như đã sắp. Đây là câu hỏi hay bị vặn thêm sau khi anh trả lời về Quick Sort.\n\n---\n\n## 4. Searching — Tìm kiếm\n\n| Thuật toán | Time (TB) | Time (xấu nhất) | Space | Điều kiện bắt buộc | Demo |\n|---|---|---|---|---|---|\n| Linear Search | O(n) | O(n) | O(1) | Không cần gì — dùng khi mảng nhỏ hoặc chưa sắp xếp | [▶](https://www.alg0.dev/linear-search) |\n| Binary Search | O(log n) | O(log n) | O(1) | Mảng phải đã sắp xếp | [▶](https://www.alg0.dev/binary-search) |\n| Jump Search | O(√n) | O(√n) | O(1) | Mảng đã sắp xếp; nhảy từng bước √n rồi quét lùi | [▶](https://www.alg0.dev/jump-search) |\n| Interpolation Search | O(log log n) khi dữ liệu phân bố đều | O(n) | O(1) | Mảng đã sắp xếp **và** phân bố đều | [▶](https://www.alg0.dev/interpolation-search) |\n\n---\n\n## 5. Graphs — Đồ thị\n\n| Thuật toán | Time | Space | Khi nào dùng trong FE | Demo |\n|---|---|---|---|---|\n| Breadth-First Search (BFS) | O(V+E) | O(V) | Đường ngắn nhất trên đồ thị không trọng số; duyệt cây DOM theo tầng | [▶](https://www.alg0.dev/bfs) |\n| Depth-First Search (DFS) | O(V+E) | O(V) | Phát hiện chu trình, duyệt sâu cấu trúc lồng nhau, tô màu vùng liên thông | [▶](https://www.alg0.dev/dfs) |\n| Dijkstra's Algorithm | O((V+E) log V) với binary heap | O(V) | Đường ngắn nhất khi cạnh có trọng số dương — routing, tính chi phí | [▶](https://www.alg0.dev/dijkstra) |\n| Prim's Algorithm | O((V+E) log V) với binary heap | O(V) | Cây khung nhỏ nhất — nối tất cả điểm với tổng chi phí thấp nhất | [▶](https://www.alg0.dev/prim) |\n| Topological Sort | O(V+E) | O(V) | Thứ tự phụ thuộc: bundler xếp module, task runner, resolve dependency | [▶](https://www.alg0.dev/topological-sort) |\n\n> **Lưu ý về Dijkstra và Prim:** con số O((V+E) log V) là bản cài bằng binary heap — bản thường gặp nhất. Dùng Fibonacci heap thì còn O(E + V log V), nhưng hiếm khi cài trong thực tế vì hằng số lớn.\n\n---\n\n## 6. Dynamic Programming — Quy hoạch động\n\n| Thuật toán | Time | Space | Ý tưởng | Demo |\n|---|---|---|---|---|\n| Fibonacci DP | O(n) | O(n), tối ưu còn O(1) | Memoization hoặc bottom-up thay cho đệ quy trần O(2ⁿ) | [▶](https://www.alg0.dev/fibonacci-dp) |\n| Knapsack 0/1 | O(n·W) | O(n·W), tối ưu còn O(W) | Bảng trạng thái theo (số món đã xét, sức chứa còn lại) | [▶](https://www.alg0.dev/knapsack) |\n| Longest Common Subsequence | O(m·n) | O(m·n), tối ưu còn O(min(m,n)) | Nền của thuật toán diff — `git diff`, so sánh version | [▶](https://www.alg0.dev/lcs) |\n\n---\n\n## 7. Backtracking — Quay lui\n\n| Bài toán | Time (xấu nhất) | Space | Ý tưởng | Demo |\n|---|---|---|---|---|\n| N-Queens | O(N!) | O(N) | Đặt từng quân hậu, gặp xung đột thì lùi lại thử vị trí khác | [▶](https://www.alg0.dev/n-queens) |\n| Sudoku Solver | O(9^m) với m là số ô trống | O(m) | Thử 1–9 cho mỗi ô, vi phạm luật thì quay lui | [▶](https://www.alg0.dev/sudoku-solver) |\n| Maze Pathfinding | O(4^(R·C)) lý thuyết; thực tế O(R·C) khi đánh dấu ô đã thăm | O(R·C) | Thử 4 hướng, đánh dấu đã đi, gặp ngõ cụt thì lùi | [▶](https://www.alg0.dev/maze-pathfinding) |\n\n---\n\n## 8. Divide and Conquer — Chia để trị\n\n| Bài toán | Time | Space | Ý tưởng | Demo |\n|---|---|---|---|---|\n| Tower of Hanoi | O(2ⁿ) | O(n) — độ sâu đệ quy | Chuyển n−1 đĩa sang cọc phụ, chuyển đĩa lớn nhất, rồi chuyển n−1 đĩa về | [▶](https://www.alg0.dev/tower-of-hanoi) |\n\n---\n\n## 9. Math — Toán học\n\n| Thuật toán | Time | Space | Ý tưởng và ứng dụng | Demo |\n|---|---|---|---|---|\n| Euclidean Algorithm | O(log min(a,b)) | O(1) | Tìm ƯCLN bằng phép chia dư liên tiếp — rút gọn phân số, tính tỉ lệ khung hình | [▶](https://www.alg0.dev/euclidean) |\n| Sieve of Eratosthenes | O(n log log n) | O(n) | Đánh dấu bội của từng số nguyên tố để lọc mọi số nguyên tố ≤ n | [▶](https://www.alg0.dev/sieve-of-eratosthenes) |\n\n---\n\n## 10. Compression — Nén dữ liệu\n\nNhóm này dùng cột khác với các nhóm trên. Lý do: LZ77, LZW, DEFLATE và Brotli không phải thuật toán có độ phức tạp sách giáo khoa gọn gàng — DEFLATE và Brotli là **định dạng nén** ghép nhiều kỹ thuật, chi phí thay đổi theo mức nén và kích thước cửa sổ. Ghi Big O cho chúng sẽ là con số giả.\n\n| Thuật toán | Cơ chế | Hiệu quả nén | Dùng ở đâu trong FE | Demo |\n|---|---|---|---|---|\n| Run-Length Encoding | Thay chuỗi ký tự lặp liên tiếp bằng cặp (ký tự, số lần) | Rất tốt với dữ liệu lặp nhiều; **phình to** với dữ liệu ngẫu nhiên | Ảnh bitmap đơn sắc, mask, sprite đơn giản | [▶](https://www.alg0.dev/run-length-encoding) |\n| LZ77 | Thay đoạn lặp bằng con trỏ lùi (khoảng cách, độ dài) trong cửa sổ trượt | Là lõi của gzip và Brotli | Không dùng trực tiếp — nền của DEFLATE | [▶](https://www.alg0.dev/lz77) |\n| LZW | Xây từ điển động ngay khi quét, không cần gửi kèm từ điển | ~40–60% với văn bản | Định dạng GIF, TIFF, PDF | [▶](https://www.alg0.dev/lzw) |\n| Huffman Coding | Mã độ dài thay đổi: ký tự hay gặp thì mã ngắn hơn. Dựng cây mất O(n log n) | ~20–30% với văn bản | Lớp mã hoá entropy bên trong DEFLATE, JPEG, MP3 | [▶](https://www.alg0.dev/huffman-coding) |\n| DEFLATE | LZ77 + Huffman | ~60–70% với text, JS, CSS | `Content-Encoding: gzip`, nén bundle, định dạng PNG và ZIP | [▶](https://www.alg0.dev/deflate) |\n| Brotli | LZ77 + Huffman + từ điển tĩnh ~120KB các chuỗi web hay gặp, 11 mức nén | Nhỏ hơn gzip khoảng 15–20% với văn bản | `Content-Encoding: br`, nén static asset, mặc định trên CDN hiện đại | [▶](https://www.alg0.dev/brotli) |\n\n---\n\n## 🎯 Ưu Tiên Ôn Trước\n\nNếu chỉ còn ít thời gian, 11 mục dưới đây là những thứ thực sự hay bị hỏi trong phỏng vấn frontend.\n\n| Ưu tiên | Mục | Vì sao hay bị hỏi |\n|---|---|---|\n| 1 | [Big O Notation](#1-concepts--khái-niệm-nền) | Nền cho mọi câu \"chỗ này chậm ở đâu, sửa thế nào\" |\n| 2 | [Hash Table](#2-data-structures--cấu-trúc-dữ-liệu) | `Object` và `Map`, khử trùng lặp, đếm tần suất — gặp nhiều nhất |\n| 3 | [Memoization](#1-concepts--khái-niệm-nền) | Nối thẳng sang `useMemo`, `useCallback`, `React.memo` |\n| 4 | [Binary Search](#4-searching--tìm-kiếm) | Gần như luôn xuất hiện ở vòng live-coding |\n| 5 | [Two Pointers](#1-concepts--khái-niệm-nền) | Dạng bài live-coding phổ biến, dễ ghi điểm |\n| 6 | [Sliding Window](#1-concepts--khái-niệm-nền) | Chuỗi con dài nhất, rate limit, moving average |\n| 7 | [Stack](#2-data-structures--cấu-trúc-dữ-liệu) | Undo/redo, kiểm tra thẻ đóng/mở — xem [find-unclosed-tags.js](./find-unclosed-tags.js) |\n| 8 | [BFS và DFS](#5-graphs--đồ-thị) | Duyệt cây DOM và mọi cấu trúc lồng nhau |\n| 9 | [Quick Sort vs Merge Sort](#3-sorting--sắp-xếp) | Dẫn tới câu \"`Array.sort()` cài bằng gì\" → TimSort |\n| 10 | [LRU Cache](#2-data-structures--cấu-trúc-dữ-liệu) | Bài thiết kế hay gặp ở vòng system design |\n| 11 | [DEFLATE và Brotli](#10-compression--nén-dữ-liệu) | Vòng performance: \"giảm bundle size bằng cách nào\" |\n\n---\n\n## 📖 Tài Liệu Tham Khảo\n\n- [alg0.dev](https://www.alg0.dev/) — mô phỏng tương tác cho cả 49 thuật toán trên\n- [MDN — Array.prototype.sort()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort)\n- [V8 blog — Getting things sorted in V8](https://v8.dev/blog/array-sort) — vì sao V8 chọn TimSort\n- [web.dev — Brotli](https://web.dev/articles/codelab-text-compression-brotli)\n- \"Introduction to Algorithms\" (CLRS) — sách tra cứu chuẩn về độ phức tạp\n\n---\n\n## 🔗 Liên Quan Trong Repo\n\n- [04-problem-solving-system-design.md](./04-problem-solving-system-design.md) — câu hỏi problem solving và system design\n- [03-performance-optimization.md](./03-performance-optimization.md) — Web Vitals và tối ưu, liên quan nhóm Compression\n- [find-unclosed-tags.js](./find-unclosed-tags.js) — bài toán dùng Stack, có lời giải chi tiết\n\n---\n\n*Cập nhật lần cuối: September 2026*\n" };
const QUIZ = [{"id":"01-1","topic":"JavaScript","group":"JUNIOR LEVEL","title":"Closures","prompt":"**Output của đoạn code sau là gì?**\n\n```javascript\nfor (var i = 0; i \u003C 3; i++) {\n  setTimeout(() => console.log(i), 1000);\n}\n```","opts":[{"k":"A","t":"`0, 0, 0`"},{"k":"B","t":"`0, 1, 2`"},{"k":"C","t":"`3, 3, 3`"},{"k":"D","t":"`undefined, undefined, undefined`"}],"ans":"C","expl":"**Giải thích:**\n- `var` có function scope, không có block scope\n- Khi setTimeout callback được execute, vòng lặp đã kết thúc và `i = 3`\n- Tất cả 3 callbacks đều reference cùng một biến `i`\n\n**Cách fix:**\n```javascript\n// Cách 1: Sử dụng let\nfor (let i = 0; i \u003C 3; i++) {\n  setTimeout(() => console.log(i), 1000);\n}\n\n// Cách 2: Sử dụng IIFE\nfor (var i = 0; i \u003C 3; i++) {\n  (function(j) {\n    setTimeout(() => console.log(j), 1000);\n  })(i);\n}\n```\n\n**Tham khảo:** [MDN - Closures](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures)\n\n---"},{"id":"01-2","topic":"JavaScript","group":"JUNIOR LEVEL","title":"Hoisting","prompt":"**Output của đoạn code sau là gì?**\n\n```javascript\nconsole.log(a);\nconsole.log(b);\nvar a = 1;\nlet b = 2;\n```","opts":[{"k":"A","t":"`ReferenceError`, `ReferenceError`"},{"k":"B","t":"`undefined`, `undefined`"},{"k":"C","t":"`1`, `2`"},{"k":"D","t":"`undefined`, `ReferenceError`"}],"ans":"D","expl":"**Giải thích:**\n- `var` được hoisted và initialized với `undefined`\n- `let` được hoisted nhưng không initialized → Temporal Dead Zone (TDZ)\n- Access biến trong TDZ sẽ throw ReferenceError\n\n**Tham khảo:** [MDN - Hoisting](https://developer.mozilla.org/en-US/docs/Glossary/Hoisting)\n\n---"},{"id":"01-3","topic":"JavaScript","group":"JUNIOR LEVEL","title":"== vs ===","prompt":"**Kết quả của các biểu thức sau?**\n\n```javascript\nconsole.log(1 == '1');\nconsole.log(1 === '1');\nconsole.log(null == undefined);\nconsole.log(null === undefined);\n```","opts":[{"k":"A","t":"`true, false, false, false`"},{"k":"B","t":"`true, true, true, true`"},{"k":"C","t":"`true, false, true, false`"},{"k":"D","t":"`false, false, true, true`"}],"ans":"C","expl":"**Giải thích:**\n- `==` (loose equality) thực hiện type coercion\n- `===` (strict equality) không coerce types\n- `null == undefined` là `true` theo spec\n- `null === undefined` là `false` vì khác type\n\n**Tham khảo:** [MDN - Equality comparisons](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Equality_comparisons_and_sameness)\n\n---"},{"id":"01-4","topic":"JavaScript","group":"JUNIOR LEVEL","title":"Array Methods","prompt":"**Output của đoạn code sau là gì?**\n\n```javascript\nconst arr = [1, 2, 3, 4, 5];\nconst result = arr.filter(x => x > 2).map(x => x * 2);\nconsole.log(result);\n```","opts":[{"k":"A","t":"`[2, 4, 6, 8, 10]`"},{"k":"B","t":"`[3, 4, 5]`"},{"k":"C","t":"`[6, 8, 10, undefined, undefined]`"},{"k":"D","t":"`[6, 8, 10]`"}],"ans":"D","expl":"**Giải thích:**\n- `filter(x => x > 2)` trả về `[3, 4, 5]`\n- `map(x => x * 2)` nhân mỗi phần tử với 2 → `[6, 8, 10]`\n\n**Tham khảo:** [MDN - Array.prototype.filter()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/filter)\n\n---"},{"id":"01-5","topic":"JavaScript","group":"JUNIOR LEVEL","title":"typeof operator","prompt":"**Output của các expression sau?**\n\n```javascript\nconsole.log(typeof null);\nconsole.log(typeof undefined);\nconsole.log(typeof NaN);\nconsole.log(typeof []);\n```","opts":[{"k":"A","t":"`null, undefined, NaN, array`"},{"k":"B","t":"`null, undefined, number, array`"},{"k":"C","t":"`object, undefined, number, object`"},{"k":"D","t":"`object, undefined, NaN, object`"}],"ans":"C","expl":"**Giải thích:**\n- `typeof null` là `object` (bug lịch sử của JS)\n- `typeof undefined` là `undefined`\n- `typeof NaN` là `number` (NaN là \"Not a Number\" nhưng type vẫn là number)\n- `typeof []` là `object` (arrays là objects trong JS)\n\n**Tham khảo:** [MDN - typeof](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/typeof)\n\n---"},{"id":"01-6","topic":"JavaScript","group":"JUNIOR LEVEL","title":"this keyword","prompt":"**Output của đoạn code sau là gì?**\n\n```javascript\nconst obj = {\n  name: 'John',\n  greet: function() {\n    console.log(this.name);\n  },\n  greetArrow: () => {\n    console.log(this.name);\n  }\n};\n\nobj.greet();\nobj.greetArrow();\n```","opts":[{"k":"A","t":"`undefined`, `undefined`"},{"k":"B","t":"`undefined`, `John`"},{"k":"C","t":"`John`, `undefined`"},{"k":"D","t":"`John`, `John`"}],"ans":"C","expl":"**Giải thích:**\n- Regular function: `this` được bind dựa trên cách function được gọi\n- Arrow function: `this` được inherit từ enclosing scope (lexical this)\n- `greetArrow` là arrow function, `this` là global/window, không có `name`\n\n**Tham khảo:** [MDN - Arrow functions](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions)\n\n---"},{"id":"01-7","topic":"JavaScript","group":"JUNIOR LEVEL","title":"Spread Operator","prompt":"**Output của đoạn code sau là gì?**\n\n```javascript\nconst arr1 = [1, 2, 3];\nconst arr2 = [...arr1];\narr2.push(4);\n\nconsole.log(arr1);\nconsole.log(arr2);\n```","opts":[{"k":"A","t":"`[1,2,3,4]`, `[1,2,3]`"},{"k":"B","t":"Error"},{"k":"C","t":"`[1,2,3,4]`, `[1,2,3,4]`"},{"k":"D","t":"`[1,2,3]`, `[1,2,3,4]`"}],"ans":"D","expl":"**Giải thích:**\n- Spread operator tạo shallow copy\n- `arr2` là array mới, independent của `arr1`\n- Push vào `arr2` không ảnh hưởng `arr1`\n\n**Tham khảo:** [MDN - Spread syntax](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax)\n\n---"},{"id":"01-8","topic":"JavaScript","group":"JUNIOR LEVEL","title":"Object Reference","prompt":"**Output của đoạn code sau là gì?**\n\n```javascript\nconst obj1 = { a: 1, b: { c: 2 } };\nconst obj2 = { ...obj1 };\nobj2.a = 10;\nobj2.b.c = 20;\n\nconsole.log(obj1.a);\nconsole.log(obj1.b.c);\n```","opts":[{"k":"A","t":"`1`, `2`"},{"k":"B","t":"`10`, `2`"},{"k":"C","t":"`10`, `20`"},{"k":"D","t":"`1`, `20`"}],"ans":"D","expl":"**Giải thích:**\n- Spread operator chỉ tạo **shallow copy**\n- `obj2.a = 10` thay đổi primitive → không ảnh hưởng `obj1`\n- `obj2.b.c = 20` thay đổi nested object → `obj1.b` và `obj2.b` reference cùng object\n\n**Deep copy solution:**\n```javascript\nconst obj2 = JSON.parse(JSON.stringify(obj1));\n// hoặc\nconst obj2 = structuredClone(obj1);\n```\n\n**Tham khảo:** [MDN - Shallow copy](https://developer.mozilla.org/en-US/docs/Glossary/Shallow_copy)\n\n---"},{"id":"01-9","topic":"JavaScript","group":"JUNIOR LEVEL","title":"Truthy/Falsy","prompt":"**Giá trị nào sau đây là falsy trong JavaScript?**","opts":[{"k":"A","t":"`0, '', null, undefined, NaN, false`"},{"k":"B","t":"`0, '', null, undefined, NaN, false, {}`"},{"k":"C","t":"`0, '', null, undefined, false`"},{"k":"D","t":"`0, '', null, undefined, NaN, false, []`"}],"ans":"A","expl":"**Giải thích:**\n- Có đúng 6 falsy values trong JavaScript\n- `[]` và `{}` là truthy (empty array và empty object)\n\n**Tham khảo:** [MDN - Falsy](https://developer.mozilla.org/en-US/docs/Glossary/Falsy)\n\n---"},{"id":"01-10","topic":"JavaScript","group":"JUNIOR LEVEL","title":"String Methods","prompt":"**Output của đoạn code sau?**\n\n```javascript\nconst str = 'Hello World';\nconsole.log(str.slice(-5));\nconsole.log(str.substring(-5));\n```","opts":[{"k":"A","t":"`World`, `Hello World`"},{"k":"B","t":"`Hello`, `Hello`"},{"k":"C","t":"Error"},{"k":"D","t":"`World`, `World`"}],"ans":"A","expl":"**Giải thích:**\n- `slice(-5)` lấy 5 ký tự cuối cùng → `World`\n- `substring(-5)` coi negative number như 0 → `Hello World`\n\n**Tham khảo:** [MDN - String.prototype.slice()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/slice)\n\n---"},{"id":"01-11","topic":"JavaScript","group":"MIDDLE LEVEL","title":"Promise","prompt":"**Output của đoạn code sau là gì?**\n\n```javascript\nconsole.log('1');\n\nsetTimeout(() => console.log('2'), 0);\n\nPromise.resolve().then(() => console.log('3'));\n\nconsole.log('4');\n```","opts":[{"k":"A","t":"`1, 2, 3, 4`"},{"k":"B","t":"`1, 4, 2, 3`"},{"k":"C","t":"`1, 4, 3, 2`"},{"k":"D","t":"`1, 3, 4, 2`"}],"ans":"C","expl":"**Giải thích:**\n- Event Loop priority: Call Stack → Microtask Queue → Macrotask Queue\n- Synchronous code (`1`, `4`) chạy trước\n- Promise callbacks (microtask) chạy trước setTimeout (macrotask)\n\n**Tham khảo:** [JavaScript Event Loop](https://javascript.info/event-loop)\n\n---"},{"id":"01-12","topic":"JavaScript","group":"MIDDLE LEVEL","title":"Event Loop","prompt":"**Output của đoạn code sau?**\n\n```javascript\nasync function async1() {\n  console.log('async1 start');\n  await async2();\n  console.log('async1 end');\n}\n\nasync function async2() {\n  console.log('async2');\n}\n\nconsole.log('script start');\nasync1();\nconsole.log('script end');\n```","opts":[{"k":"A","t":"`script start, async1 start, script end, async2, async1 end`"},{"k":"B","t":"`script start, async1 start, async2, script end, async1 end`"},{"k":"C","t":"`script start, async1 start, async2, async1 end, script end`"},{"k":"D","t":"`script start, script end, async1 start, async2, async1 end`"}],"ans":"B","expl":"**Giải thích:**\n- `async/await` là syntactic sugar cho Promises\n- Code trước `await` chạy synchronously\n- Code sau `await` được wrap trong Promise và đưa vào microtask queue\n\n**Tham khảo:** [MDN - async function](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function)\n\n---"},{"id":"01-13","topic":"JavaScript","group":"MIDDLE LEVEL","title":"Prototype","prompt":"**Output của đoạn code sau là gì?**\n\n```javascript\nfunction Animal(name) {\n  this.name = name;\n}\n\nAnimal.prototype.speak = function() {\n  return `${this.name} makes a sound`;\n};\n\nconst dog = new Animal('Dog');\nconsole.log(dog.speak());\nconsole.log(dog.hasOwnProperty('speak'));\nconsole.log(dog.hasOwnProperty('name'));\n```","opts":[{"k":"A","t":"`Dog makes a sound`, `true`, `false`"},{"k":"B","t":"`Dog makes a sound`, `true`, `true`"},{"k":"C","t":"`Dog makes a sound`, `false`, `true`"},{"k":"D","t":"`undefined`, `false`, `true`"}],"ans":"C","expl":"**Giải thích:**\n- `speak` được định nghĩa trên prototype, không phải own property\n- `name` được định nghĩa trong constructor, là own property\n- `hasOwnProperty` chỉ check own properties, không check prototype chain\n\n**Tham khảo:** [MDN - Inheritance and prototype chain](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain)\n\n---"},{"id":"01-14","topic":"JavaScript","group":"MIDDLE LEVEL","title":"Debounce vs Throttle","prompt":"**Sự khác biệt chính giữa Debounce và Throttle?**","opts":[{"k":"A","t":"Debounce chờ đến khi không còn event nào, Throttle giới hạn số lần chạy trong khoảng thời gian"},{"k":"B","t":"Không có sự khác biệt"},{"k":"C","t":"Debounce chạy function ngay lập tức, Throttle delay function"},{"k":"D","t":"Throttle chờ đến khi không còn event, Debounce giới hạn số lần chạy"}],"ans":"A","expl":"**Giải thích:**\n- **Debounce:** Chờ đến khi user ngừng action một khoảng thời gian mới execute (search input)\n- **Throttle:** Giới hạn số lần execute trong khoảng thời gian (scroll event)\n\n```javascript\n// Debounce: Chỉ search khi user ngừng gõ 300ms\nconst debouncedSearch = debounce(search, 300);\n\n// Throttle: Chỉ handle scroll tối đa 1 lần/100ms\nconst throttledScroll = throttle(handleScroll, 100);\n```\n\n**Tham khảo:** [CSS-Tricks - Debouncing and Throttling](https://css-tricks.com/debouncing-throttling-explained-examples/)\n\n---"},{"id":"01-15","topic":"JavaScript","group":"MIDDLE LEVEL","title":"Object.freeze vs Object.seal","prompt":"**Sự khác biệt giữa Object.freeze() và Object.seal()?**","opts":[{"k":"A","t":"Không có sự khác biệt"},{"k":"B","t":"Cả hai đều chỉ ngăn xóa properties"},{"k":"C","t":"`freeze` ngăn thêm/xóa/sửa properties, `seal` chỉ ngăn thêm/xóa"},{"k":"D","t":"`seal` ngăn thêm/xóa/sửa properties, `freeze` chỉ ngăn thêm/xóa"}],"ans":"C","expl":"**Giải thích:**\n- `Object.freeze()`: Không thể add, delete, hoặc modify properties\n- `Object.seal()`: Không thể add hoặc delete, nhưng có thể modify existing properties\n\n```javascript\nconst frozen = Object.freeze({ a: 1 });\nfrozen.a = 2; // Không có effect\nfrozen.b = 3; // Không có effect\n\nconst sealed = Object.seal({ a: 1 });\nsealed.a = 2; // Works! a = 2\nsealed.b = 3; // Không có effect\n```\n\n**Tham khảo:** [MDN - Object.freeze()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze)\n\n---"},{"id":"01-16","topic":"JavaScript","group":"MIDDLE LEVEL","title":"WeakMap vs Map","prompt":"**Điều nào sau đây đúng về WeakMap?**","opts":[{"k":"A","t":"WeakMap có property `.size`"},{"k":"B","t":"Có thể iterate qua WeakMap"},{"k":"C","t":"Keys phải là objects và được garbage collected khi không còn reference"},{"k":"D","t":"Keys có thể là primitive values"}],"ans":"C","expl":"**Giải thích:**\n- WeakMap keys phải là objects\n- Keys được held \"weakly\" - có thể bị garbage collected\n- Không thể iterate, không có `.size` property\n- Use case: Store private data, caching\n\n**Tham khảo:** [MDN - WeakMap](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/WeakMap)\n\n---"},{"id":"01-17","topic":"JavaScript","group":"MIDDLE LEVEL","title":"Generator Function","prompt":"**Output của đoạn code sau?**\n\n```javascript\nfunction* generator() {\n  yield 1;\n  yield 2;\n  return 3;\n}\n\nconst gen = generator();\nconsole.log(gen.next().value);\nconsole.log(gen.next().value);\nconsole.log(gen.next().value);\nconsole.log(gen.next().value);\n```","opts":[{"k":"A","t":"`1, 2, 3, 3`"},{"k":"B","t":"`1, 2, 3, undefined`"},{"k":"C","t":"`1, 2, undefined, undefined`"},{"k":"D","t":"`1, 2, 3, Error`"}],"ans":"B","expl":"**Giải thích:**\n- `yield` pause function và return value với `done: false`\n- `return` kết thúc generator với `done: true`\n- Sau khi generator done, các `next()` tiếp theo return `{ value: undefined, done: true }`\n\n**Tham khảo:** [MDN - function*](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/function*)\n\n---"},{"id":"01-18","topic":"JavaScript","group":"MIDDLE LEVEL","title":"Proxy","prompt":"**Output của đoạn code sau?**\n\n```javascript\nconst handler = {\n  get: function(target, prop) {\n    return prop in target ? target[prop] : 'Property not found';\n  }\n};\n\nconst obj = new Proxy({ a: 1, b: 2 }, handler);\nconsole.log(obj.a);\nconsole.log(obj.c);\n```","opts":[{"k":"A","t":"`1`, `undefined`"},{"k":"B","t":"`1`, `Property not found`"},{"k":"C","t":"Error"},{"k":"D","t":"`undefined`, `Property not found`"}],"ans":"B","expl":"**Giải thích:**\n- Proxy intercept operations trên object\n- `get` trap được gọi khi access property\n- Handler trả về custom value cho non-existent properties\n\n**Tham khảo:** [MDN - Proxy](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Proxy)\n\n---"},{"id":"01-19","topic":"JavaScript","group":"MIDDLE LEVEL","title":"call, apply, bind","prompt":"**Output của đoạn code sau?**\n\n```javascript\nconst obj = { num: 2 };\n\nfunction multiply(a, b) {\n  return this.num * a * b;\n}\n\nconsole.log(multiply.call(obj, 3, 4));\nconsole.log(multiply.apply(obj, [3, 4]));\nconsole.log(multiply.bind(obj, 3)(4));\n```","opts":[{"k":"A","t":"`24, 24, 24`"},{"k":"B","t":"`24, 24, 12`"},{"k":"C","t":"`NaN, NaN, NaN`"},{"k":"D","t":"`24, [24], 24`"}],"ans":"A","expl":"**Giải thích:**\n- `call(thisArg, arg1, arg2)`: Gọi function với `this` và arguments riêng lẻ\n- `apply(thisArg, [args])`: Gọi function với `this` và array of arguments\n- `bind(thisArg, arg1)`: Trả về new function với `this` và partial arguments\n\nTất cả đều tính: `2 * 3 * 4 = 24`\n\n**Tham khảo:** [MDN - Function.prototype.call()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/call)\n\n---"},{"id":"01-20","topic":"JavaScript","group":"MIDDLE LEVEL","title":"Symbol","prompt":"**Điều nào sau đây SAI về Symbol?**","opts":[{"k":"A","t":"Symbol được liệt kê trong Object.keys()"},{"k":"B","t":"Symbol có thể được sử dụng làm object key"},{"k":"C","t":"Symbol luôn unique"},{"k":"D","t":"Symbol.for('key') tạo ra symbol global có thể reuse"}],"ans":"A","expl":"**Giải thích:**\n- Symbol KHÔNG được liệt kê trong:\n  - `Object.keys()`\n  - `for...in` loop\n  - `JSON.stringify()`\n- Để get Symbol keys: `Object.getOwnPropertySymbols()`\n\n**Tham khảo:** [MDN - Symbol](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Symbol)\n\n---"},{"id":"01-21","topic":"JavaScript","group":"SENIOR LEVEL","title":"Memory Leak","prompt":"**Trường hợp nào sau đây có thể gây Memory Leak trong JavaScript?**","opts":[{"k":"A","t":"Sử dụng closure không đúng cách"},{"k":"B","t":"Không remove event listeners"},{"k":"C","t":"Circular references với closures"},{"k":"D","t":"Tất cả các đáp án trên"}],"ans":"D","expl":"**Giải thích:**\nCommon causes of memory leaks:\n1. **Closures giữ reference:** Variables trong closure không được release\n2. **Event listeners không remove:** DOM elements bị remove nhưng listeners vẫn còn\n3. **Circular references:** Objects reference lẫn nhau với closures\n\n**Prevention:**\n```javascript\n// Always remove event listeners\nelement.addEventListener('click', handler);\n// Later:\nelement.removeEventListener('click', handler);\n\n// Use WeakMap/WeakSet for caching\nconst cache = new WeakMap();\n```\n\n**Tham khảo:** [Chrome DevTools - Memory Leaks](https://developer.chrome.com/docs/devtools/memory-problems/)\n\n---"},{"id":"01-22","topic":"JavaScript","group":"SENIOR LEVEL","title":"Event Delegation","prompt":"**Ưu điểm chính của Event Delegation?**","opts":[{"k":"A","t":"Tăng tốc độ xử lý event"},{"k":"B","t":"Chỉ hoạt động với click events"},{"k":"C","t":"Giảm memory usage và handle dynamic elements"},{"k":"D","t":"Bắt buộc phải sử dụng với React"}],"ans":"C","expl":"**Giải thích:**\nEvent Delegation benefits:\n1. **Less memory:** Một listener thay vì nhiều listeners\n2. **Dynamic elements:** Tự động handle elements được add sau\n3. **Better performance:** Ít listeners = ít memory\n\n```javascript\n// Instead of adding listener to each button\ndocument.querySelector('.container').addEventListener('click', (e) => {\n  if (e.target.matches('.button')) {\n    // Handle button click\n  }\n});\n```\n\n**Tham khảo:** [JavaScript.info - Event delegation](https://javascript.info/event-delegation)\n\n---"},{"id":"01-23","topic":"JavaScript","group":"SENIOR LEVEL","title":"Module Pattern","prompt":"**Output của đoạn code sau?**\n\n```javascript\nconst Module = (function() {\n  let privateVar = 0;\n\n  return {\n    increment: function() {\n      return ++privateVar;\n    },\n    getCount: function() {\n      return privateVar;\n    }\n  };\n})();\n\nconsole.log(Module.increment());\nconsole.log(Module.increment());\nconsole.log(Module.getCount());\nconsole.log(Module.privateVar);\n```","opts":[{"k":"A","t":"`1, 2, 2, undefined`"},{"k":"B","t":"`1, 2, 2, 0`"},{"k":"C","t":"`1, 1, 1, undefined`"},{"k":"D","t":"Error"}],"ans":"A","expl":"**Giải thích:**\n- Module Pattern sử dụng IIFE + closure để create private variables\n- `privateVar` không thể access từ bên ngoài\n- `Module.privateVar` là `undefined` vì không được expose\n\n**Tham khảo:** [JavaScript Module Pattern](https://www.patterns.dev/vanilla/module-pattern/)\n\n---"},{"id":"01-24","topic":"JavaScript","group":"SENIOR LEVEL","title":"Currying","prompt":"**Implement một curry function sao cho:**\n\n```javascript\nconst add = (a, b, c) => a + b + c;\nconst curriedAdd = curry(add);\ncurriedAdd(1)(2)(3) // returns 6\ncurriedAdd(1, 2)(3) // returns 6\ncurriedAdd(1)(2, 3) // returns 6\n```\n\n**Đâu là implementation đúng?**","opts":[{"k":"A","t":"```javascript\nfunction curry(fn) {\n  return function curried(...args) {\n    if (args.length >= fn.length) {\n      return fn.apply(this, args);\n    }\n    return function(...args2) {\n      return curried.apply(this, args.concat(args2));\n    }\n  }\n}\n```"},{"k":"B","t":"```javascript\nfunction curry(fn) {\n  return (...args) => args.reduce((acc, arg) => acc + arg, 0);\n}\n```"},{"k":"C","t":"```javascript\nfunction curry(fn) {\n  return function(...args) {\n    return fn(...args);\n  }\n}\n```"},{"k":"D","t":"```javascript\nfunction curry(fn) {\n  return fn.bind(this);\n}\n```"}],"ans":"A","expl":"**Giải thích:**\n- Curry function check số arguments đã nhận\n- Nếu đủ args (`args.length >= fn.length`), execute function\n- Nếu chưa đủ, return function mới để nhận thêm args\n\n**Tham khảo:** [JavaScript.info - Currying](https://javascript.info/currying-partials)\n\n---"},{"id":"01-25","topic":"JavaScript","group":"SENIOR LEVEL","title":"Web Workers","prompt":"**Điều nào SAI về Web Workers?**","opts":[{"k":"A","t":"Web Workers chạy trong background thread"},{"k":"B","t":"Web Workers có thể import scripts"},{"k":"C","t":"Communication với main thread qua postMessage"},{"k":"D","t":"Web Workers có thể trực tiếp access DOM"}],"ans":"D","expl":"**Giải thích:**\n- Web Workers chạy trong separate thread\n- **KHÔNG** có access đến DOM, window, document\n- Communicate với main thread qua `postMessage()`\n- Có thể import scripts với `importScripts()`\n\n**Tham khảo:** [MDN - Web Workers](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API)\n\n---"},{"id":"01-26","topic":"JavaScript","group":"SENIOR LEVEL","title":"Service Workers","prompt":"**Service Worker có thể làm gì?**","opts":[{"k":"A","t":"Cache assets cho offline access"},{"k":"B","t":"Intercept network requests"},{"k":"C","t":"Handle push notifications"},{"k":"D","t":"Tất cả các đáp án trên"}],"ans":"D","expl":"**Giải thích:**\nService Workers capabilities:\n- Cache assets (CacheStorage API)\n- Intercept fetch requests\n- Background sync\n- Push notifications\n\n**Tham khảo:** [MDN - Service Worker](https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API)\n\n---"},{"id":"01-27","topic":"JavaScript","group":"SENIOR LEVEL","title":"Execution Context","prompt":"**Thứ tự đúng của các phase trong Execution Context?**","opts":[{"k":"A","t":"Execution Phase → Creation Phase"},{"k":"B","t":"Memory Phase → Execution Phase → Cleanup Phase"},{"k":"C","t":"Creation Phase → Execution Phase"},{"k":"D","t":"Hoisting Phase → Creation Phase → Execution Phase"}],"ans":"C","expl":"**Giải thích:**\n1. **Creation Phase:**\n   - Create Scope Chain\n   - Create variables, functions, arguments\n   - Determine value of `this`\n\n2. **Execution Phase:**\n   - Assign values\n   - Execute code line by line\n\n**Tham khảo:** [JavaScript Execution Context](https://www.freecodecamp.org/news/execution-context-how-javascript-works-behind-the-scenes/)\n\n---"},{"id":"01-28","topic":"JavaScript","group":"SENIOR LEVEL","title":"Tail Call Optimization","prompt":"**Đoạn code nào có thể được tối ưu bằng Tail Call Optimization?**","opts":[{"k":"A","t":"```javascript\nfunction factorial(n) {\n  if (n \u003C= 1) return 1;\n  return n * factorial(n - 1);\n}\n```"},{"k":"B","t":"```javascript\nfunction factorial(n, acc = 1) {\n  if (n \u003C= 1) return acc;\n  return factorial(n - 1, n * acc);\n}\n```"},{"k":"C","t":"Cả A và B"},{"k":"D","t":"Không đoạn nào"}],"ans":"B","expl":"**Giải thích:**\nTail Call Optimization (TCO) yêu cầu:\n- Return statement là function call\n- Không có operations sau recursive call\n\n```javascript\n// ❌ Không TCO: có phép nhân sau recursive call\nreturn n * factorial(n - 1);\n\n// ✅ TCO: return trực tiếp recursive call\nreturn factorial(n - 1, n * acc);\n```\n\n**Note:** TCO chỉ được implement trong Safari, không phải Chrome/Firefox\n\n**Tham khảo:** [ES6 Tail Call Optimization](https://2ality.com/2015/06/tail-call-optimization.html)\n\n---"},{"id":"01-29","topic":"JavaScript","group":"SENIOR LEVEL","title":"Shared Array Buffer","prompt":"**Điều nào đúng về SharedArrayBuffer?**","opts":[{"k":"A","t":"Cho phép share memory giữa main thread và workers"},{"k":"B","t":"Yêu cầu cross-origin isolation headers"},{"k":"C","t":"Cần sử dụng Atomics API để tránh race conditions"},{"k":"D","t":"Tất cả các đáp án trên"}],"ans":"D","expl":"**Giải thích:**\nSharedArrayBuffer:\n- Share memory giữa main thread và workers\n- Yêu cầu COOP/COEP headers (cross-origin isolation)\n- Cần Atomics API để synchronize và avoid race conditions\n\n```javascript\n// Required headers\nCross-Origin-Opener-Policy: same-origin\nCross-Origin-Embedder-Policy: require-corp\n```\n\n**Tham khảo:** [MDN - SharedArrayBuffer](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/SharedArrayBuffer)\n\n---"},{"id":"01-30","topic":"JavaScript","group":"SENIOR LEVEL","title":"Performance","prompt":"**Cách nào tốt nhất để đo performance của một function?**","opts":[{"k":"A","t":"`Date.now()` trước và sau function"},{"k":"B","t":"`setTimeout()` với delay 0"},{"k":"C","t":"`console.time()` và `console.timeEnd()`"},{"k":"D","t":"`performance.now()` trước và sau function\n---"}],"ans":"D","expl":"**Giải thích:**\n- `performance.now()` có độ chính xác cao nhất (microseconds)\n- `Date.now()` chỉ có độ chính xác milliseconds\n- `console.time()` tiện lợi nhưng không programmatic\n- `performance.now()` không bị ảnh hưởng bởi system clock changes\n\n```javascript\nconst start = performance.now();\n// ... code to measure\nconst end = performance.now();\nconsole.log(`Execution time: ${end - start} ms`);\n```\n\n**Tham khảo:** [MDN - performance.now()](https://developer.mozilla.org/en-US/docs/Web/API/Performance/now)\n\n---"},{"id":"02-1","topic":"ReactJS","group":"JUNIOR LEVEL","title":"Virtual DOM","prompt":"**Virtual DOM trong React là gì?**","opts":[{"k":"A","t":"Một bản sao của Real DOM được lưu trong database"},{"k":"B","t":"Một CSS framework"},{"k":"C","t":"Một lightweight JavaScript representation của Real DOM"},{"k":"D","t":"Một browser API"}],"ans":"C","expl":"**Giải thích:**\n- Virtual DOM là một JavaScript object representation của Real DOM\n- React so sánh Virtual DOM mới với cũ (diffing)\n- Chỉ update những phần thay đổi vào Real DOM (reconciliation)\n- Giảm thiểu expensive DOM manipulations\n\n**Tham khảo:** [React - Virtual DOM](https://legacy.reactjs.org/docs/faq-internals.html)\n\n---"},{"id":"02-2","topic":"ReactJS","group":"JUNIOR LEVEL","title":"JSX","prompt":"**Output của đoạn code sau?**\n\n```jsx\nconst element = (\n  \u003Cdiv>\n    {false && \u003Cp>Hello\u003C/p>}\n    {null}\n    {undefined}\n    {0}\n    {'' && \u003Cp>World\u003C/p>}\n  \u003C/div>\n);\n```","opts":[{"k":"A","t":"Không hiển thị gì"},{"k":"B","t":"Error"},{"k":"C","t":"Hiển thị \"0\""},{"k":"D","t":"Hiển thị \"Hello World 0\""}],"ans":"C","expl":"**Giải thích:**\n- `false`, `null`, `undefined` → không render\n- `0` → render \"0\" (falsy nhưng vẫn là valid renderable value)\n- `''` (empty string) → không render\n\n**Best practice:**\n```jsx\n// ❌ Có thể render 0\n{items.length && \u003CList />}\n\n// ✅ Sử dụng ternary hoặc boolean conversion\n{items.length > 0 && \u003CList />}\n{items.length ? \u003CList /> : null}\n{!!items.length && \u003CList />}\n```\n\n**Tham khảo:** [React - Conditional Rendering](https://react.dev/learn/conditional-rendering)\n\n---"},{"id":"02-3","topic":"ReactJS","group":"JUNIOR LEVEL","title":"State vs Props","prompt":"**Điều nào sau đây ĐÚNG về State và Props?**","opts":[{"k":"A","t":"Props được truyền từ parent, State được quản lý bởi component"},{"k":"B","t":"Props có thể thay đổi bởi component nhận nó"},{"k":"C","t":"State và Props là giống nhau"},{"k":"D","t":"State là immutable"}],"ans":"A","expl":"**Giải thích:**\n- **Props:** Passed from parent, read-only trong component\n- **State:** Managed internally by component, có thể update\n- Props flow down (unidirectional data flow)\n\n**Tham khảo:** [React - Passing Props](https://react.dev/learn/passing-props-to-a-component)\n\n---"},{"id":"02-4","topic":"ReactJS","group":"JUNIOR LEVEL","title":"useState","prompt":"**Output của đoạn code sau?**\n\n```jsx\nfunction Counter() {\n  const [count, setCount] = useState(0);\n\n  const handleClick = () => {\n    setCount(count + 1);\n    setCount(count + 1);\n    setCount(count + 1);\n  };\n\n  return \u003Cbutton onClick={handleClick}>{count}\u003C/button>;\n}\n```\n\n**Sau khi click button, count sẽ là?**","opts":[{"k":"A","t":"0"},{"k":"B","t":"3"},{"k":"C","t":"Error"},{"k":"D","t":"1"}],"ans":"D","expl":"**Giải thích:**\n- React batches state updates\n- `count` trong cả 3 setCount calls đều là `0` (closure)\n- Tất cả đều set `count = 0 + 1 = 1`\n\n**Solution với functional update:**\n```jsx\nconst handleClick = () => {\n  setCount(c => c + 1); // 0 -> 1\n  setCount(c => c + 1); // 1 -> 2\n  setCount(c => c + 1); // 2 -> 3\n};\n```\n\n**Tham khảo:** [React - useState](https://react.dev/reference/react/useState)\n\n---"},{"id":"02-5","topic":"ReactJS","group":"JUNIOR LEVEL","title":"useEffect Dependencies","prompt":"**useEffect nào sẽ chạy khi component re-render?**\n\n```jsx\n// A\nuseEffect(() => {\n  console.log('A');\n});\n\n// B\nuseEffect(() => {\n  console.log('B');\n}, []);\n\n// C\nuseEffect(() => {\n  console.log('C');\n}, [someValue]);\n```","opts":[{"k":"A","t":"Chỉ A"},{"k":"B","t":"A và C (nếu someValue thay đổi)"},{"k":"C","t":"Tất cả"},{"k":"D","t":"Chỉ B"}],"ans":"B","expl":"**Giải thích:**\n- **No dependencies:** Chạy sau mỗi render\n- **Empty array `[]`:** Chỉ chạy 1 lần sau initial render\n- **With dependencies:** Chạy khi dependencies thay đổi\n\n**Tham khảo:** [React - useEffect](https://react.dev/reference/react/useEffect)\n\n---"},{"id":"02-6","topic":"ReactJS","group":"JUNIOR LEVEL","title":"Keys in Lists","prompt":"**Tại sao cần key khi render list trong React?**","opts":[{"k":"A","t":"Để React identify items đã thay đổi, thêm, hoặc xóa"},{"k":"B","t":"Không cần thiết, chỉ là convention"},{"k":"C","t":"Để SEO"},{"k":"D","t":"Để styling"}],"ans":"A","expl":"**Giải thích:**\n- Keys giúp React identify items trong list\n- Efficient updates: React biết item nào thay đổi, thêm, xóa\n- Preserve state: Component với key giữ nguyên sẽ preserve state\n\n**Bad practices:**\n```jsx\n// ❌ Sử dụng index khi list có thể reorder\n{items.map((item, index) => \u003CItem key={index} />)}\n\n// ✅ Sử dụng unique, stable ID\n{items.map(item => \u003CItem key={item.id} />)}\n```\n\n**Tham khảo:** [React - Rendering Lists](https://react.dev/learn/rendering-lists#keeping-list-items-in-order-with-key)\n\n---"},{"id":"02-7","topic":"ReactJS","group":"JUNIOR LEVEL","title":"Controlled vs Uncontrolled","prompt":"**Đâu là Controlled Component?**","opts":[{"k":"A","t":"```jsx\n\u003Cinput defaultValue=\"hello\" />\n```"},{"k":"B","t":"```jsx\n\u003Cinput value={value} onChange={handleChange} />\n```"},{"k":"C","t":"```jsx\n\u003Cinput ref={inputRef} />\n```"},{"k":"D","t":"Cả A và C"}],"ans":"B","expl":"**Giải thích:**\n- **Controlled:** React state là \"single source of truth\", value và onChange\n- **Uncontrolled:** DOM là source of truth, sử dụng ref để get value\n\n```jsx\n// Controlled\nconst [value, setValue] = useState('');\n\u003Cinput value={value} onChange={e => setValue(e.target.value)} />\n\n// Uncontrolled\nconst inputRef = useRef();\n\u003Cinput ref={inputRef} defaultValue=\"hello\" />\n```\n\n**Tham khảo:** [React - Controlled Components](https://react.dev/learn/sharing-state-between-components#controlled-and-uncontrolled-components)\n\n---"},{"id":"02-8","topic":"ReactJS","group":"JUNIOR LEVEL","title":"Event Handling","prompt":"**Cách đúng để pass argument vào event handler?**","opts":[{"k":"A","t":"`onClick={handleClick(id)}`"},{"k":"B","t":"`onClick={() => handleClick(id)}`"},{"k":"C","t":"`onClick={handleClick.bind(this, id)}`"},{"k":"D","t":"B và C đều đúng"}],"ans":"D","expl":"**Giải thích:**\n- A sẽ gọi function ngay lập tức khi render\n- B: Arrow function wrapper - common pattern\n- C: bind() - also works, older pattern\n\n**Tham khảo:** [React - Handling Events](https://react.dev/learn/responding-to-events)\n\n---"},{"id":"02-9","topic":"ReactJS","group":"JUNIOR LEVEL","title":"Conditional Rendering","prompt":"**Output của component sau?**\n\n```jsx\nfunction App({ items }) {\n  return (\n    \u003Cdiv>\n      {items.length && \u003CList items={items} />}\n    \u003C/div>\n  );\n}\n// Khi items = []\n```","opts":[{"k":"A","t":"Error"},{"k":"B","t":"Render `0`"},{"k":"C","t":"Render `\u003CList />`"},{"k":"D","t":"Không render gì"}],"ans":"B","expl":"**Giải thích:**\n- `[].length` = `0`\n- `0 && anything` = `0` (falsy value)\n- React renders `0` vì nó là number\n\n**Fix:**\n```jsx\n{items.length > 0 && \u003CList items={items} />}\n// hoặc\n{items.length ? \u003CList items={items} /> : null}\n```\n\n---"},{"id":"02-10","topic":"ReactJS","group":"JUNIOR LEVEL","title":"Fragment","prompt":"**Khi nào nên sử dụng React.Fragment?**","opts":[{"k":"A","t":"Khi render list"},{"k":"B","t":"Không bao giờ cần thiết"},{"k":"C","t":"Khi cần wrap multiple elements mà không thêm DOM node"},{"k":"D","t":"Khi cần styling"}],"ans":"C","expl":"**Giải thích:**\n- Fragment wrap multiple elements mà không thêm extra DOM node\n- Useful khi cần return multiple elements từ component\n\n```jsx\n// Adds extra div\n\u003Cdiv>\n  \u003CHeader />\n  \u003CContent />\n\u003C/div>\n\n// No extra DOM node\n\u003C>\n  \u003CHeader />\n  \u003CContent />\n\u003C/>\n\n// With key (in lists)\n\u003CReact.Fragment key={id}>\n  \u003CHeader />\n  \u003CContent />\n\u003C/React.Fragment>\n```\n\n**Tham khảo:** [React - Fragment](https://react.dev/reference/react/Fragment)\n\n---"},{"id":"02-11","topic":"ReactJS","group":"MIDDLE LEVEL","title":"useCallback","prompt":"**Khi nào nên sử dụng useCallback?**","opts":[{"k":"A","t":"Để tăng performance cho mọi function"},{"k":"B","t":"Khi pass callback xuống child components được memo"},{"k":"C","t":"Khi sử dụng với useState"},{"k":"D","t":"Cho tất cả functions"}],"ans":"B","expl":"**Giải thích:**\n- useCallback memoize function reference\n- Useful khi passing callbacks to memoized child components\n- Không cần cho mọi function - premature optimization\n\n```jsx\nconst MemoizedChild = React.memo(({ onClick }) => {\n  return \u003Cbutton onClick={onClick}>Click\u003C/button>;\n});\n\nfunction Parent() {\n  // ✅ useCallback needed - Child is memoized\n  const handleClick = useCallback(() => {\n    console.log('clicked');\n  }, []);\n\n  return \u003CMemoizedChild onClick={handleClick} />;\n}\n```\n\n**Tham khảo:** [React - useCallback](https://react.dev/reference/react/useCallback)\n\n---"},{"id":"02-12","topic":"ReactJS","group":"MIDDLE LEVEL","title":"useMemo vs useCallback","prompt":"**Sự khác biệt giữa useMemo và useCallback?**","opts":[{"k":"A","t":"useMemo cache value, useCallback cache function"},{"k":"B","t":"useMemo cho arrays, useCallback cho objects"},{"k":"C","t":"useCallback cache value, useMemo cache function"},{"k":"D","t":"Không có sự khác biệt"}],"ans":"A","expl":"**Giải thích:**\n```jsx\n// useMemo: cache computed value\nconst memoizedValue = useMemo(() => computeExpensiveValue(a, b), [a, b]);\n\n// useCallback: cache function reference\nconst memoizedFn = useCallback(() => {\n  doSomething(a, b);\n}, [a, b]);\n\n// useCallback(fn, deps) === useMemo(() => fn, deps)\n```\n\n**Tham khảo:** [React - useMemo](https://react.dev/reference/react/useMemo)\n\n---"},{"id":"02-13","topic":"ReactJS","group":"MIDDLE LEVEL","title":"useRef","prompt":"**Điều nào ĐÚNG về useRef?**","opts":[{"k":"A","t":"useRef chỉ dùng cho DOM references"},{"k":"B","t":"useRef persist value qua các re-renders mà không trigger re-render"},{"k":"C","t":"useRef giống như useState"},{"k":"D","t":"Thay đổi `.current` sẽ trigger re-render"}],"ans":"B","expl":"**Giải thích:**\n- useRef returns mutable ref object với `.current` property\n- Changes to `.current` don't trigger re-render\n- Persists across re-renders\n- Use cases: DOM refs, storing previous values, mutable values\n\n```jsx\nconst renderCount = useRef(0);\nrenderCount.current++; // Doesn't trigger re-render\n\nconst inputRef = useRef(null);\n\u003Cinput ref={inputRef} />\ninputRef.current.focus(); // Access DOM element\n```\n\n**Tham khảo:** [React - useRef](https://react.dev/reference/react/useRef)\n\n---"},{"id":"02-14","topic":"ReactJS","group":"MIDDLE LEVEL","title":"Context API","prompt":"**Vấn đề chính của Context API?**","opts":[{"k":"A","t":"Không thể nested contexts"},{"k":"B","t":"Gây re-render tất cả consumers khi context value thay đổi"},{"k":"C","t":"Không hoạt động với functional components"},{"k":"D","t":"Chỉ hoạt động với class components"}],"ans":"B","expl":"**Giải thích:**\n- Khi context value thay đổi, ALL consumers re-render\n- Even if consumer chỉ cần một phần của context value\n- Solutions: Split contexts, memoization, state management libraries\n\n```jsx\n// Problem: All consumers re-render\nconst AppContext = createContext({ user: null, theme: 'light' });\n\n// Solution: Split contexts\nconst UserContext = createContext(null);\nconst ThemeContext = createContext('light');\n```\n\n**Tham khảo:** [React - useContext](https://react.dev/reference/react/useContext)\n\n---"},{"id":"02-15","topic":"ReactJS","group":"MIDDLE LEVEL","title":"React.memo","prompt":"**Khi nào React.memo KHÔNG hoạt động?**","opts":[{"k":"A","t":"Khi sử dụng với hooks"},{"k":"B","t":"Khi props là objects/arrays được tạo mới mỗi render"},{"k":"C","t":"Khi component có state"},{"k":"D","t":"Khi props là primitives"}],"ans":"B","expl":"**Giải thích:**\n- React.memo shallow compare props\n- New object/array reference mỗi render → always different → always re-render\n\n```jsx\n// ❌ Won't work - new object every render\n\u003CMemoizedComponent style={{ color: 'red' }} />\n\n// ✅ Works - stable reference\nconst style = useMemo(() => ({ color: 'red' }), []);\n\u003CMemoizedComponent style={style} />\n\n// ✅ Custom comparison\nconst MemoizedComponent = React.memo(Component, (prev, next) => {\n  return prev.id === next.id;\n});\n```\n\n**Tham khảo:** [React - memo](https://react.dev/reference/react/memo)\n\n---"},{"id":"02-16","topic":"ReactJS","group":"MIDDLE LEVEL","title":"Custom Hooks","prompt":"**Output của custom hook sau?**\n\n```jsx\nfunction useCounter(initial = 0) {\n  const [count, setCount] = useState(initial);\n  const increment = () => setCount(c => c + 1);\n  return { count, increment };\n}\n\nfunction App() {\n  const counter1 = useCounter(0);\n  const counter2 = useCounter(0);\n\n  counter1.increment();\n\n  return \u003Cdiv>{counter1.count} - {counter2.count}\u003C/div>;\n}\n```\n\n**Điều gì xảy ra?**","opts":[{"k":"A","t":"Error hoặc unexpected behavior"},{"k":"B","t":"Infinite loop"},{"k":"C","t":"Hiển thị \"1 - 1\""},{"k":"D","t":"Hiển thị \"1 - 0\""}],"ans":"A","expl":"**Giải thích:**\n- Gọi `increment()` trong render body (không trong event handler)\n- Violates \"don't call setState during render\"\n- Causes infinite loop hoặc error\n\n**Correct usage:**\n```jsx\nfunction App() {\n  const counter1 = useCounter(0);\n\n  // ✅ Call in event handler\n  return \u003Cbutton onClick={counter1.increment}>{counter1.count}\u003C/button>;\n}\n```\n\n---"},{"id":"02-17","topic":"ReactJS","group":"MIDDLE LEVEL","title":"useReducer","prompt":"**Khi nào nên sử dụng useReducer thay vì useState?**","opts":[{"k":"A","t":"Khi state logic phức tạp hoặc state tiếp theo phụ thuộc vào state trước"},{"k":"B","t":"Không bao giờ, useState luôn tốt hơn"},{"k":"C","t":"Luôn luôn"},{"k":"D","t":"Khi có 1 state đơn giản"}],"ans":"A","expl":"**Giải thích:**\nuseReducer tốt hơn khi:\n- State logic phức tạp với multiple sub-values\n- Next state phụ thuộc vào previous state\n- Cần pass dispatch xuống nhiều levels\n\n```jsx\nconst reducer = (state, action) => {\n  switch (action.type) {\n    case 'increment': return { count: state.count + 1 };\n    case 'decrement': return { count: state.count - 1 };\n    default: return state;\n  }\n};\n\nconst [state, dispatch] = useReducer(reducer, { count: 0 });\n```\n\n**Tham khảo:** [React - useReducer](https://react.dev/reference/react/useReducer)\n\n---"},{"id":"02-18","topic":"ReactJS","group":"MIDDLE LEVEL","title":"Error Boundaries","prompt":"**Điều nào ĐÚNG về Error Boundaries?**","opts":[{"k":"A","t":"Có thể implement bằng functional components"},{"k":"B","t":"Catch errors trong event handlers"},{"k":"C","t":"Chỉ có thể implement bằng class components với componentDidCatch"},{"k":"D","t":"Catch tất cả các loại errors"}],"ans":"C","expl":"**Giải thích:**\n- Error Boundaries chỉ có thể implement với class components\n- Sử dụng `componentDidCatch` và `getDerivedStateFromError`\n- KHÔNG catch: event handlers, async code, SSR errors, errors trong boundary itself\n\n```jsx\nclass ErrorBoundary extends React.Component {\n  state = { hasError: false };\n\n  static getDerivedStateFromError(error) {\n    return { hasError: true };\n  }\n\n  componentDidCatch(error, errorInfo) {\n    logErrorToService(error, errorInfo);\n  }\n\n  render() {\n    if (this.state.hasError) {\n      return \u003Ch1>Something went wrong.\u003C/h1>;\n    }\n    return this.props.children;\n  }\n}\n```\n\n**Tham khảo:** [React - Error Boundaries](https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary)\n\n---"},{"id":"02-19","topic":"ReactJS","group":"MIDDLE LEVEL","title":"Reconciliation","prompt":"**React reconciliation algorithm làm gì?**","opts":[{"k":"A","t":"So sánh Virtual DOM trees và update Real DOM hiệu quả"},{"k":"B","t":"Manage state"},{"k":"C","t":"Compile JSX thành JavaScript"},{"k":"D","t":"Handle routing"}],"ans":"A","expl":"**Giải thích:**\n- Reconciliation là process so sánh 2 Virtual DOM trees\n- Tìm minimum number of operations để update Real DOM\n- Uses heuristics: different types → recreate, same type → update attributes\n\n**Tham khảo:** [React - Reconciliation](https://legacy.reactjs.org/docs/reconciliation.html)\n\n---"},{"id":"02-20","topic":"ReactJS","group":"MIDDLE LEVEL","title":"Lifting State Up","prompt":"**\"Lifting state up\" có nghĩa là?**","opts":[{"k":"A","t":"Sử dụng Redux"},{"k":"B","t":"Di chuyển state lên ancestor component gần nhất cần share data"},{"k":"C","t":"Sử dụng Context"},{"k":"D","t":"Di chuyển state lên global store"}],"ans":"B","expl":"**Giải thích:**\n- Move state up to closest common ancestor\n- Cho phép sibling components share state\n- Parent owns state, passes down via props\n\n```jsx\n// Before: State in Child\nfunction Child() {\n  const [value, setValue] = useState('');\n  // ...\n}\n\n// After: State lifted to Parent\nfunction Parent() {\n  const [value, setValue] = useState('');\n  return (\n    \u003C>\n      \u003CChild1 value={value} onChange={setValue} />\n      \u003CChild2 value={value} />\n    \u003C/>\n  );\n}\n```\n\n**Tham khảo:** [React - Sharing State](https://react.dev/learn/sharing-state-between-components)\n\n---"},{"id":"02-21","topic":"ReactJS","group":"SENIOR LEVEL","title":"Fiber Architecture","prompt":"**React Fiber là gì?**","opts":[{"k":"A","t":"Một state management library"},{"k":"B","t":"Một CSS-in-JS library"},{"k":"C","t":"Một testing framework"},{"k":"D","t":"Reimplementation của React core algorithm cho incremental rendering"}],"ans":"D","expl":"**Giải thích:**\n- React Fiber là reimplementation của React's core algorithm (v16+)\n- Enables incremental rendering: split work into chunks\n- Pause, abort, resume work\n- Assign priority to different types of updates\n- Foundation for Concurrent Mode\n\n**Tham khảo:** [React Fiber Architecture](https://github.com/acdlite/react-fiber-architecture)\n\n---"},{"id":"02-22","topic":"ReactJS","group":"SENIOR LEVEL","title":"Concurrent Mode","prompt":"**Concurrent Mode trong React cho phép?**","opts":[{"k":"A","t":"Server-side rendering only"},{"k":"B","t":"Multi-threading trong JavaScript"},{"k":"C","t":"Interruptible rendering, prioritize updates"},{"k":"D","t":"Chạy multiple React instances"}],"ans":"C","expl":"**Giải thích:**\n- Concurrent Mode enables interruptible rendering\n- React có thể pause rendering để handle more urgent updates\n- Features: useTransition, useDeferredValue, Suspense for data fetching\n\n```jsx\n// UI stays responsive during expensive updates\nconst [isPending, startTransition] = useTransition();\n\nstartTransition(() => {\n  setSearchQuery(input); // Low priority update\n});\n```\n\n**Tham khảo:** [React - Concurrent React](https://react.dev/blog/2022/03/29/react-v18#what-is-concurrent-react)\n\n---"},{"id":"02-23","topic":"ReactJS","group":"SENIOR LEVEL","title":"Suspense","prompt":"**Suspense component được sử dụng cho?**","opts":[{"k":"A","t":"Hiển thị fallback UI trong khi chờ something (lazy loading, data fetching)"},{"k":"B","t":"Error handling"},{"k":"C","t":"Routing"},{"k":"D","t":"Animation"}],"ans":"A","expl":"**Giải thích:**\n- Suspense cho phép \"wait\" for something và show fallback\n- Use cases: lazy loading, data fetching (với compatible libraries)\n\n```jsx\nconst LazyComponent = React.lazy(() => import('./LazyComponent'));\n\nfunction App() {\n  return (\n    \u003CSuspense fallback={\u003CLoading />}>\n      \u003CLazyComponent />\n    \u003C/Suspense>\n  );\n}\n```\n\n**Tham khảo:** [React - Suspense](https://react.dev/reference/react/Suspense)\n\n---"},{"id":"02-24","topic":"ReactJS","group":"SENIOR LEVEL","title":"Code Splitting","prompt":"**Cách implement code splitting trong React?**","opts":[{"k":"A","t":"`React.lazy(() => import('./Component'))`"},{"k":"B","t":"`import('./Component')`"},{"k":"C","t":"`React.split('./Component')`"},{"k":"D","t":"`require('./Component')`"}],"ans":"A","expl":"**Giải thích:**\n```jsx\n// Code splitting với React.lazy\nconst OtherComponent = React.lazy(() => import('./OtherComponent'));\n\nfunction App() {\n  return (\n    \u003CSuspense fallback={\u003Cdiv>Loading...\u003C/div>}>\n      \u003COtherComponent />\n    \u003C/Suspense>\n  );\n}\n\n// Route-based code splitting\nconst Home = lazy(() => import('./routes/Home'));\nconst About = lazy(() => import('./routes/About'));\n```\n\n**Tham khảo:** [React - Code Splitting](https://react.dev/reference/react/lazy)\n\n---"},{"id":"02-25","topic":"ReactJS","group":"SENIOR LEVEL","title":"Server Components","prompt":"**Điều nào ĐÚNG về React Server Components?**","opts":[{"k":"A","t":"Là cách viết khác của SSR"},{"k":"B","t":"Có thể sử dụng hooks như useState"},{"k":"C","t":"Chạy trên server, không bundle JavaScript cho client"},{"k":"D","t":"Chạy trên client"}],"ans":"C","expl":"**Giải thích:**\n- React Server Components (RSC) chạy trên server\n- Zero bundle size - không ship JavaScript cho client\n- Có thể directly access databases, file system\n- KHÔNG thể sử dụng hooks (useState, useEffect) hoặc browser APIs\n- Client Components cho interactivity\n\n```jsx\n// Server Component (default in Next.js App Router)\nasync function ServerComponent() {\n  const data = await db.query('SELECT * FROM posts');\n  return \u003Cdiv>{data.map(post => \u003Cp>{post.title}\u003C/p>)}\u003C/div>;\n}\n\n// Client Component\n'use client';\nfunction ClientComponent() {\n  const [count, setCount] = useState(0);\n  return \u003Cbutton onClick={() => setCount(c => c + 1)}>{count}\u003C/button>;\n}\n```\n\n**Tham khảo:** [React - Server Components](https://react.dev/reference/rsc/server-components)\n\n---"},{"id":"02-26","topic":"ReactJS","group":"SENIOR LEVEL","title":"Hydration","prompt":"**Hydration trong React là gì?**","opts":[{"k":"A","t":"Adding CSS to components"},{"k":"B","t":"Caching components"},{"k":"C","t":"Attaching event listeners đến server-rendered HTML"},{"k":"D","t":"Fetching data"}],"ans":"C","expl":"**Giải thích:**\n- Server renders HTML\n- Client receives HTML → page visible ngay\n- Hydration: React attaches event listeners và makes it interactive\n- \"Dry\" HTML → \"Hydrated\" interactive app\n\n**Tham khảo:** [React - hydrateRoot](https://react.dev/reference/react-dom/client/hydrateRoot)\n\n---"},{"id":"02-27","topic":"ReactJS
