onent React được publish lên npm cho các đội cùng dùng"},{"k":"C","t":"Bộ file Figma có đủ màu, khoảng cách và kiểu chữ để designer dùng chung"},{"k":"D","t":"Một file CSS chứa biến toàn cục mà mọi dự án import vào"}],"ans":"A","expl":"**Giải thích:**\nThư viện component chỉ là một tầng. Thiếu design token thì không đổi theme được vì màu nằm rải trong từng component. Thiếu tài liệu thì không ai dùng, đội product tự viết component riêng và hệ thống chết dần. Thiếu quy tắc phiên bản thì bên dùng không dám nâng cấp vì không biết bản mới phá cái gì. Thiếu chuẩn accessibility thì mỗi lần dùng lại phải tự lo, đúng cái mà hệ thống sinh ra để gánh hộ.\n\n**Đánh đổi:** một design system đầy đủ cần người duy trì riêng. Với một sản phẩm và một đội, chi phí đó không hoàn lại được — một thư mục component dùng chung là đủ. Nó chỉ đáng khi có nhiều đội cần thống nhất giao diện và cần phát hành độc lập theo nhịp riêng.\n\nB, C và D đều là một lớp của A. Riêng C là chỗ hay lẫn nhất: có token trong Figma mà không có đường đồng bộ sang code thì hai bên trôi khỏi nhau sau vài tháng.\n\n---"},{"id":"04-26","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"Monorepo vs Polyrepo","prompt":"**Khi nào monorepo phù hợp cho frontend?**","opts":[{"k":"A","t":"Luôn nên dùng monorepo, vì mọi thứ nằm một chỗ thì dễ tìm hơn"},{"k":"B","t":"Chỉ khi cả công ty dùng chung một ngôn ngữ lập trình"},{"k":"C","t":"Khi nhiều dự án dùng chung code, cần thống nhất công cụ, và cần đổi nhiều package trong cùng một commit rồi phát hành phối hợp"},{"k":"D","t":"Chỉ khi đội dưới năm người, vì đông hơn thì CI sẽ quá chậm"}],"ans":"C","expl":"**Giải thích:**\nYếu tố quyết định là **thay đổi nguyên tử xuyên package**. Sửa một component dùng chung mà ba nơi đang dùng nó phải sửa theo: ở polyrepo là ba pull request, một vòng publish phiên bản, và một khoảng thời gian các repo không khớp nhau. Ở monorepo là một commit, CI kiểm cả ba nơi cùng lúc.\n\n**Đánh đổi:** monorepo không làm chi phí biến mất mà dời nó sang công cụ. CI bắt buộc phải biết chỉ build lại phần đã đổi, nếu không mỗi commit là build toàn bộ. Phân quyền cũng thô hơn, khó giới hạn ai được sửa gì. Đổi lại, polyrepo giữ từng repo đơn giản nhưng làm việc nâng cấp code dùng chung chậm và dễ bỏ sót.\n\nD nhầm nguyên nhân: chi phí CI đi theo khối lượng code và chất lượng cache, không theo số người. Với cache từ xa, monorepo hàng trăm người vẫn chạy nhanh. A và B đều là quy tắc cứng cho một quyết định vốn phụ thuộc mức độ phụ thuộc giữa các dự án.\n\n---"},{"id":"04-27","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"SSR vs CSR vs SSG","prompt":"**Khi nào chọn SSR, CSR, SSG?**","opts":[{"k":"A","t":"Depends on framework only"},{"k":"B","t":"SSR cho tất cả"},{"k":"C","t":"SSR: SEO + dynamic content, CSR: interactive apps + authenticated content, SSG: static content + blogs"},{"k":"D","t":"CSR cho tất cả"}],"ans":"C","expl":"**Giải thích:**\nRendering strategy selection:\n\n| Strategy | Use Case | SEO | Initial Load | Interactivity |\n|----------|----------|-----|--------------|---------------|\n| **CSR** | Dashboards, authenticated apps | ❌ | Slow | Fast |\n| **SSR** | Dynamic content + SEO | ✅ | Fast | Medium |\n| **SSG** | Blogs, docs, marketing | ✅ | Fastest | Fast |\n| **ISR** | E-commerce, news | ✅ | Fast | Fast |\n\n```jsx\n// Next.js examples\n\n// SSG - Static Generation\nexport async function getStaticProps() {\n  const posts = await fetchPosts();\n  return { props: { posts } };\n}\n\n// SSR - Server-side Rendering\nexport async function getServerSideProps(context) {\n  const user = await fetchUser(context.params.id);\n  return { props: { user } };\n}\n\n// ISR - Incremental Static Regeneration\nexport async function getStaticProps() {\n  const products = await fetchProducts();\n  return {\n    props: { products },\n    revalidate: 60 // Regenerate every 60 seconds\n  };\n}\n\n// CSR - Client-side only\nfunction Dashboard() {\n  const { data, isLoading } = useQuery('dashboard', fetchDashboard);\n  // ...\n}\n```\n\n---"},{"id":"04-28","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"Testing Strategy","prompt":"**Testing pyramid cho frontend?**","opts":[{"k":"A","t":"Chỉ viết E2E vì nó kiểm được luồng thật của người dùng"},{"k":"B","t":"Chỉ viết unit test vì chạy nhanh và dễ giữ cho xanh"},{"k":"C","t":"Chia đều ba tầng để tầng nào cũng có độ phủ như nhau"},{"k":"D","t":"Nhiều unit test, ít hơn integration test, rất ít E2E; component test bằng React Testing Library nằm ở tầng integration"}],"ans":"D","expl":"**Giải thích:**\nHình tháp phản ánh hai thứ cùng tăng theo tầng: chi phí chạy và độ dao động. Một unit test hỏng chỉ rõ hàm nào sai; một E2E hỏng chỉ nói \"luồng thanh toán lỗi\" và mất nửa ngày để biết lỗi ở đâu. Càng lên cao càng chậm phản hồi và càng khó khoanh vùng.\n\n**Đánh đổi:** với frontend, hình tháp nghiêm ngặt không phải lúc nào cũng đúng. Unit test cho component thuần hiển thị thường kiểm tra chi tiết cài đặt chứ không kiểm hành vi, nên sửa refactor là gãy test dù chức năng không đổi. Nhiều đội chuyển sang hình \"chiếc cúp\" — tầng integration dày hơn tầng unit — vì phần lớn lỗi frontend nằm ở chỗ các mảnh ghép lại với nhau, không nằm trong từng mảnh.\n\nA cho tín hiệu chậm và hay đỏ giả, đội sẽ bắt đầu bỏ qua kết quả CI. B bỏ lọt đúng loại lỗi hay xảy ra nhất. C tốn nhất ở tầng đắt nhất mà không đổi lại được tương xứng.\n\n---"},{"id":"04-29","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"Error Monitoring","prompt":"**Production error monitoring strategy?**","opts":[{"k":"A","t":"Đọc log server mỗi khi có người dùng báo lỗi"},{"k":"B","t":"Dịch vụ theo dõi lỗi kèm source map để đọc được stack trace, ngữ cảnh người dùng và số hiệu bản build, cùng cảnh báo theo ngưỡng"},{"k":"C","t":"Bọc toàn bộ ứng dụng trong một Error Boundary và hiện thông báo xin lỗi"},{"k":"D","t":"Rải `console.log` ở những chỗ nghi ngờ rồi nhờ người dùng gửi ảnh chụp màn hình"}],"ans":"B","expl":"**Giải thích:**\nBa mảnh phải có đủ mới dùng được. Không có source map thì stack trace của bundle đã minify chỉ là `a.js:1:28471`, vô giá trị. Không có số hiệu bản build thì không biết bản vá đã lên hay chưa, và lỗi cũ vẫn chảy về làm nhiễu. Không có ngữ cảnh người dùng và trình duyệt thì không tái hiện được, mà phần lớn lỗi frontend chỉ xảy ra trên một loại thiết bị.\n\n**Đánh đổi:** source map để lộ mã nguồn, nên đẩy riêng lên dịch vụ theo dõi chứ đừng phục vụ công khai từ CDN. Và lượng lỗi tăng theo lưu lượng, một vòng lặp lỗi có thể bắn hàng triệu sự kiện trong vài phút — phải lấy mẫu và đặt trần, nếu không là vỡ hoá đơn.\n\nC mới làm nửa việc: Error Boundary bắt được lỗi và giữ cho trang không trắng, nhưng bản thân nó không báo cho ai. Nó là phần giao diện, cần gắn thêm phần gửi báo cáo. A và D đều phụ thuộc vào việc người dùng chịu khó báo, mà đa số họ chỉ lặng lẽ rời đi.\n\n---"},{"id":"04-30","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"CI/CD for Frontend","prompt":"**CI/CD pipeline cho frontend project nên include?**","opts":[{"k":"A","t":"Lint, kiểm tra kiểu, unit test, build, phân tích kích thước bundle, E2E, bản xem trước cho mỗi pull request, rồi deploy production"},{"k":"B","t":"Chỉ build và deploy, còn test để người review tự chạy trên máy"},{"k":"C","t":"Chạy toàn bộ test trên mọi commit của mọi nhánh để bắt lỗi sớm nhất"},{"k":"D","t":"Deploy thẳng lên production mỗi khi merge, không cần môi trường trung gian"}],"ans":"A","expl":"**Giải thích:**\nThứ tự quan trọng ngang nội dung: xếp phép kiểm rẻ lên trước để một lỗi gõ sai bị chặn sau 30 giây thay vì sau 12 phút. Lint và kiểm tra kiểu chạy trong vài giây, E2E chạy cuối.\n\nHai bước hay bị bỏ mà đáng giá nhất: **phân tích kích thước bundle** là thứ chặn được tình huống một pull request làm bundle tăng 300KB mà không ai biết — đặt ngưỡng và cho CI đỏ khi vượt. **Bản xem trước cho mỗi pull request** đổi việc review từ đọc diff sang bấm thử, bắt được lỗi giao diện mà không test nào bắt được.\n\n**Đánh đổi:** chạy đủ bộ E2E trên mọi pull request thì chậm và hay đỏ giả, đội sẽ bắt đầu bấm merge bỏ qua. Cách dung hoà phổ biến là chạy một tập E2E rút gọn cho luồng quan trọng ở pull request, còn bộ đầy đủ chạy hằng đêm hoặc trước khi phát hành.\n\nB đẩy việc kiểm cho người, và người sẽ quên. C đốt phút CI cho rất ít tín hiệu thêm. D bỏ mất chỗ để phát hiện lỗi trước khi người dùng thật gặp.\n\n---"},{"id":"04-31","topic":"System Design","group":"SCENARIO-BASED QUESTIONS","title":"Legacy Code Migration","prompt":"**Bạn join team với large legacy jQuery codebase. Migration strategy?**","opts":[{"k":"A","t":"Strangler fig pattern: wrap legacy, incrementally migrate, coexist during transition, prioritize high-value areas"},{"k":"B","t":"Hire new team"},{"k":"C","t":"Rewrite từ đầu"},{"k":"D","t":"Keep jQuery forever"}],"ans":"A","expl":"**Giải thích:**\nLegacy migration strategy (Strangler Fig Pattern):\n\n```\nPhase 1: Wrap                Phase 2: Migrate              Phase 3: Complete\n┌──────────────┐            ┌──────────────┐              ┌──────────────┐\n│   Wrapper    │            │   Wrapper    │              │              │\n│  ┌────────┐  │            │  ┌────────┐  │              │   Modern     │\n│  │ React  │  │            │  │ React  │  │              │    App       │\n│  │  App   │  │            │  │  App   │  │              │              │\n│  └────────┘  │            │  └───┬────┘  │              │              │\n│  ┌────────┐  │            │      │       │              │              │\n│  │ jQuery │  │            │  ┌───▼────┐  │              │              │\n│  │ Legacy │  │            │  │  Less  │  │              │              │\n│  └────────┘  │            │  │ jQuery │  │              │              │\n└──────────────┘            └──────────────┘              └──────────────┘\n```\n\n**Steps:**\n1. **Assess:** Map dependencies, identify high-value areas\n2. **Setup:** Configure modern tooling alongside legacy\n3. **Bridge:** Create communication layer between old and new\n4. **Migrate incrementally:** Start with leaf components\n5. **Remove legacy:** Delete old code as features migrate\n\n```javascript\n// Bridge pattern example\n// legacy-bridge.js\nwindow.LegacyBridge = {\n  emit(event, data) {\n    window.dispatchEvent(new CustomEvent(`legacy:${event}`, { detail: data }));\n  },\n  on(event, callback) {\n    window.addEventListener(`react:${event}`, (e) => callback(e.detail));\n  }\n};\n\n// In React\nuseEffect(() => {\n  const handler = (e) => setData(e.detail);\n  window.addEventListener('legacy:dataUpdate', handler);\n  return () => window.removeEventListener('legacy:dataUpdate', handler);\n}, []);\n\n// Communicate back\nwindow.dispatchEvent(new CustomEvent('react:ready', { detail: { version: '1.0' } }));\n```\n\n---"},{"id":"04-32","topic":"System Design","group":"SCENARIO-BASED QUESTIONS","title":"Performance Crisis","prompt":"**Production app suddenly slow, users complaining. Immediate actions?**","opts":[{"k":"A","t":"Check monitoring, identify root cause (recent deploy? traffic spike? third-party?), communicate status, fix or rollback"},{"k":"B","t":"Blame backend"},{"k":"C","t":"Deploy rollback và investigate"},{"k":"D","t":"Ignore until morning"}],"ans":"A","expl":"**Giải thích:**\nProduction incident response:\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                    INCIDENT RESPONSE FLOW                     │\n├─────────────────────────────────────────────────────────────┤\n│                                                               │\n│  1. DETECT          2. ASSESS           3. COMMUNICATE       │\n│  ┌─────────┐        ┌─────────┐         ┌─────────┐         │\n│  │Monitor- │───────▶│Severity │────────▶│Status   │         │\n│  │ing Alert│        │Check    │         │Page     │         │\n│  └─────────┘        └─────────┘         └─────────┘         │\n│                                               │               │\n│  4. INVESTIGATE     5. MITIGATE         6. RESOLVE          │\n│  ┌─────────┐        ┌─────────┐         ┌─────────┐         │\n│  │Check    │◀───────│Rollback │◀────────│Fix &    │         │\n│  │Recent   │        │OR       │         │Deploy   │         │\n│  │Changes  │        │Hotfix   │         │         │         │\n│  └─────────┘        └─────────┘         └─────────┘         │\n│                                               │               │\n│  7. POST-MORTEM                                              │\n│  ┌───────────────────────────────────────────┐              │\n│  │ - Root cause analysis                      │              │\n│  │ - Prevention measures                      │              │\n│  │ - Documentation                            │              │\n│  └───────────────────────────────────────────┘              │\n└─────────────────────────────────────────────────────────────┘\n```\n\n**Checklist:**\n1. Check error monitoring (Sentry, LogRocket)\n2. Review recent deployments\n3. Check infrastructure (CDN, API, third-party services)\n4. Assess impact and communicate\n5. Decide: rollback vs hotfix\n6. Execute fix\n7. Post-mortem và prevent future occurrences\n\n---"},{"id":"04-33","topic":"System Design","group":"SCENARIO-BASED QUESTIONS","title":"Security Incident","prompt":"**Report XSS vulnerability trong app. Response?**","opts":[{"k":"A","t":"Ghi vào backlog và xử lý ở sprint sau cho đúng quy trình"},{"k":"B","t":"Vá ngay chỗ được báo rồi đóng ticket"},{"k":"C","t":"Đánh giá mức nghiêm trọng và phạm vi ảnh hưởng, vá ngay, rà soát những chỗ khác dùng cùng kiểu code, thêm test chặn tái diễn, rồi họp rút kinh nghiệm"},{"k":"D","t":"Chờ xác nhận có ai khai thác thật chưa rồi mới quyết định mức ưu tiên"}],"ans":"C","expl":"**Giải thích:**\nChỗ được báo là triệu chứng, không phải bệnh. Nếu một nơi dùng `dangerouslySetInnerHTML` mà không làm sạch dữ liệu, gần như chắc chắn còn nơi khác làm y hệt — người viết chỗ đó không biết là sai thì đã viết nhiều lần. Bước rà soát cùng kiểu code là bước phân biệt xử lý sự cố với vá tạm. Test chặn tái diễn là thứ giữ cho lỗi không quay lại sau vài tháng khi người khác sửa vào đúng chỗ đó.\n\n**Đánh đổi:** \"đánh giá trước\" và \"vá ngay\" mâu thuẫn nhau khi bản vá có rủi ro. Với XSS thì bản vá thường nhỏ mà phơi nhiễm đang diễn ra liên tục, nên vá nhanh là đúng. Nhưng với lỗ hổng nằm trong luồng xác thực, một bản vá vội có thể gây sự cố lớn hơn chính lỗ hổng — lúc đó đánh giá kỹ rồi vá có kiểm soát mới đúng.\n\nB sửa được ca bệnh, bỏ qua cả lớp bệnh. D nhầm ở chỗ không thấy dấu vết khai thác không có nghĩa là chưa bị khai thác — XSS thường không để lại log phía server. A sai mức ưu tiên: lỗ hổng bảo mật đang mở không xếp hàng cùng tính năng mới.\n\n---"},{"id":"04-34","topic":"System Design","group":"SCENARIO-BASED QUESTIONS","title":"Team Velocity Drop","prompt":"**Team velocity giảm, technical debt tăng. Address how?**","opts":[{"k":"A","t":"Làm thêm giờ cho tới khi bắt kịp tiến độ đã cam kết"},{"k":"B","t":"Tuyển thêm người để tăng năng lực của đội"},{"k":"C","t":"Dừng làm tính năng mới vài sprint để viết lại phần code cũ"},{"k":"D","t":"Dành một phần cố định mỗi sprint cho việc dọn nợ, đo xem chỗ nào thực sự làm chậm, cải thiện công cụ, giảm số việc làm dở song song, và trả nợ dần theo mức ảnh hưởng"}],"ans":"D","expl":"**Giải thích:**\nĐiểm mấu chốt là **đo trước khi sửa**. Nợ kỹ thuật mà đội cảm thấy khó chịu nhất thường không phải nợ đang tốn tiền nhất. Thứ tốn thật hay nằm ở chỗ ít ai nhắc: build mất 8 phút, test hay đỏ giả nên phải chạy lại hai ba lần, môi trường staging dựng bằng tay. Cải thiện công cụ thường cho hiệu quả cao hơn viết lại code, mà rủi ro gần bằng không.\n\nGiảm số việc làm dở song song là đòn bẩy nhanh nhất và không tốn gì: đội làm 8 việc cùng lúc thì thời gian chờ và chi phí chuyển ngữ cảnh ăn hết năng suất, dù mỗi người vẫn bận rộn.\n\n**Đánh đổi:** tỉ lệ cố định, chẳng hạn 20% mỗi sprint, thì dễ lập kế hoạch và không phải thuyết phục lại mỗi lần, nhưng quá chậm khi có một nút thắt lớn chi phối tất cả. Một đợt tập trung dọn dẹp thì nhanh hơn nhưng dừng giao hàng và rất khó thuyết phục. Chọn theo hình dạng của vấn đề: chi phí rải đều thì dùng tỉ lệ cố định, chi phí dồn vào một chỗ thì dứt điểm chỗ đó.\n\nA tiêu vào sức người và làm chất lượng tệ thêm, vòng lặp càng xấu. B là quan sát cũ của Brooks — thêm người vào dự án đang chậm làm nó chậm hơn, vì người cũ phải dừng lại để hướng dẫn. C là canh bạc: viết lại gần như luôn vượt thời gian dự tính, mà trong lúc đó sản phẩm đứng yên.\n\n---"},{"id":"04-35","topic":"System Design","group":"SCENARIO-BASED QUESTIONS","title":"Cross-team Dependency","prompt":"**Feature requires backend API chưa ready. Approach?**","opts":[{"k":"A","t":"Define contract together, mock API, develop in parallel, integration testing khi ready"},{"k":"B","t":"Wait for backend"},{"k":"C","t":"Build temporary backend"},{"k":"D","t":"Skip feature\n---"}],"ans":"A","expl":"**Giải thích:**\nAPI contract-first development:\n\n```typescript\n// 1. Define contract together\n// api-contracts/user.ts\ninterface UserAPI {\n  getUser: (id: string) => Promise\u003CUser>;\n  updateUser: (id: string, data: UpdateUserDTO) => Promise\u003CUser>;\n}\n\ninterface User {\n  id: string;\n  name: string;\n  email: string;\n  role: 'admin' | 'user';\n}\n\n// 2. Create mock server\n// mocks/handlers.ts\nimport { rest } from 'msw';\n\nexport const handlers = [\n  rest.get('/api/users/:id', (req, res, ctx) => {\n    return res(\n      ctx.json({\n        id: req.params.id,\n        name: 'John Doe',\n        email: 'john@example.com',\n        role: 'user'\n      })\n    );\n  }),\n\n  rest.patch('/api/users/:id', async (req, res, ctx) => {\n    const body = await req.json();\n    return res(\n      ctx.json({\n        id: req.params.id,\n        ...body\n      })\n    );\n  })\n];\n\n// 3. Setup MSW in development\n// src/mocks/browser.ts\nimport { setupWorker } from 'msw';\nimport { handlers } from './handlers';\n\nexport const worker = setupWorker(...handlers);\n\n// 4. Develop frontend independently\nfunction UserProfile({ userId }) {\n  const { data: user, isLoading } = useQuery(\n    ['user', userId],\n    () => api.getUser(userId)\n  );\n\n  // Works with mock data during development\n  // Seamlessly switches to real API when ready\n}\n\n// 5. Integration testing when API ready\ndescribe('User API Integration', () => {\n  beforeAll(() => {\n    // Disable mocks for integration tests\n    worker.stop();\n  });\n\n  it('fetches real user data', async () => {\n    const user = await api.getUser('123');\n    expect(user).toMatchSchema(UserSchema);\n  });\n});\n```\n\n---"},{"id":"06-1","topic":"TypeScript","group":"BASIC TYPES","title":"Type vs Interface","prompt":"**Sự khác biệt giữa `type` và `interface`?**\n\n```typescript\ntype UserType = {\n  name: string;\n  age: number;\n};\n\ninterface UserInterface {\n  name: string;\n  age: number;\n}\n```","opts":[{"k":"A","t":"Interface chỉ dùng cho objects"},{"k":"B","t":"Type chỉ dùng cho primitives"},{"k":"C","t":"Không có sự khác biệt"},{"k":"D","t":"Interface có thể extend và merge declarations, type có thể dùng union/intersection"}],"ans":"D","expl":"**Giải thích:**\n\n| Feature | interface | type |\n|---------|-----------|------|\n| Extend | `extends` keyword | `&` intersection |\n| Merge declarations | ✅ Yes | ❌ No |\n| Union types | ❌ No | ✅ Yes |\n| Implement | ✅ Yes | ✅ Yes |\n| Primitives | ❌ No | ✅ Yes |\n\n```typescript\n// Interface merging\ninterface User {\n  name: string;\n}\ninterface User {\n  age: number;\n}\n// User now has both name and age\n\n// Type union (interface can't do this)\ntype Result = Success | Error;\ntype ID = string | number;\n```\n\n**Best practice:** Use `interface` for public API definitions (better error messages, extensible). Use `type` for unions, complex types.\n\n**Tham khảo:** [TypeScript Handbook - Types vs Interfaces](https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#differences-between-type-aliases-and-interfaces)\n\n---"},{"id":"06-2","topic":"TypeScript","group":"BASIC TYPES","title":"unknown vs any","prompt":"**Sự khác biệt giữa `unknown` và `any`?**\n\n```typescript\nlet valueAny: any = 10;\nlet valueUnknown: unknown = 10;\n\nvalueAny.foo.bar; // ?\nvalueUnknown.foo.bar; // ?\n```","opts":[{"k":"A","t":"`any` bypass type checking, `unknown` yêu cầu type narrowing trước khi sử dụng"},{"k":"B","t":"Không có sự khác biệt"},{"k":"C","t":"`unknown` chỉ dùng cho functions"},{"k":"D","t":"`any` là type-safe hơn `unknown`"}],"ans":"A","expl":"**Giải thích:**\n\n```typescript\nlet valueAny: any = 10;\nlet valueUnknown: unknown = 10;\n\n// any - bypasses type checking completely\nvalueAny.foo.bar; // ✅ No error (dangerous!)\nvalueAny.anything(); // ✅ No error\n\n// unknown - requires type narrowing\nvalueUnknown.foo.bar; // ❌ Error: Object is of type 'unknown'\n\n// Must narrow first\nif (typeof valueUnknown === 'string') {\n  valueUnknown.toUpperCase(); // ✅ Now it's safe\n}\n\n// Or use type assertion (risky)\n(valueUnknown as { foo: { bar: string } }).foo.bar;\n```\n\n**Best practice:** Prefer `unknown` over `any`. It forces you to validate types.\n\n**Tham khảo:** [TypeScript Handbook - unknown](https://www.typescriptlang.org/docs/handbook/2/functions.html#unknown)\n\n---"},{"id":"06-3","topic":"TypeScript","group":"BASIC TYPES","title":"never type","prompt":"**Khi nào sử dụng `never` type?**","opts":[{"k":"A","t":"Khi function throw error hoặc có infinite loop - never reaches end"},{"k":"B","t":"Khi function không return gì"},{"k":"C","t":"Cho optional parameters"},{"k":"D","t":"Thay thế cho `void`"}],"ans":"A","expl":"**Giải thích:**\n\n```typescript\n// never - function never returns\nfunction throwError(message: string): never {\n  throw new Error(message);\n}\n\nfunction infiniteLoop(): never {\n  while (true) {}\n}\n\n// void - function returns undefined\nfunction logMessage(message: string): void {\n  console.log(message);\n  // implicitly returns undefined\n}\n\n// never in exhaustive checks\ntype Shape = Circle | Square;\n\nfunction getArea(shape: Shape): number {\n  switch (shape.kind) {\n    case 'circle':\n      return Math.PI * shape.radius ** 2;\n    case 'square':\n      return shape.side ** 2;\n    default:\n      const _exhaustive: never = shape;\n      return _exhaustive; // Error if Shape adds new type\n  }\n}\n```\n\n**Tham khảo:** [TypeScript Handbook - never](https://www.typescriptlang.org/docs/handbook/2/narrowing.html#the-never-type)\n\n---"},{"id":"06-4","topic":"TypeScript","group":"BASIC TYPES","title":"Type Assertion","prompt":"**Đâu là type assertion đúng?**\n\n```typescript\nconst canvas = document.getElementById('canvas');\n```","opts":[{"k":"A","t":"`canvas as HTMLCanvasElement`"},{"k":"B","t":"`\u003CHTMLCanvasElement>canvas`"},{"k":"C","t":"Cả A và B đều đúng"},{"k":"D","t":"`canvas: HTMLCanvasElement`"}],"ans":"C","expl":"**Giải thích:**\n\n```typescript\n// Both are valid type assertions\nconst canvas1 = document.getElementById('canvas') as HTMLCanvasElement;\nconst canvas2 = \u003CHTMLCanvasElement>document.getElementById('canvas');\n\n// Note: Angle bracket syntax conflicts with JSX\n// In .tsx files, use `as` syntax\n\n// Double assertion for \"impossible\" conversions\nconst value = (expr as unknown) as TargetType;\n```\n\n**Best practice:** Use `as` syntax, especially in React/JSX projects.\n\n---"},{"id":"06-5","topic":"TypeScript","group":"BASIC TYPES","title":"Literal Types","prompt":"**Output của đoạn code sau?**\n\n```typescript\nlet x = 'hello';\nconst y = 'hello';\n\ntype X = typeof x; // ?\ntype Y = typeof y; // ?\n```","opts":[{"k":"A","t":"`X = string`, `Y = 'hello'`"},{"k":"B","t":"`X = string`, `Y = string`"},{"k":"C","t":"Error"},{"k":"D","t":"`X = 'hello'`, `Y = 'hello'`"}],"ans":"A","expl":"**Giải thích:**\n\n```typescript\nlet x = 'hello';     // Type: string (widened)\nconst y = 'hello';   // Type: 'hello' (literal type - const narrowing)\n\ntype X = typeof x;   // string\ntype Y = typeof y;   // 'hello'\n\n// as const for literal types with let\nlet z = 'hello' as const; // Type: 'hello'\n\n// as const for objects\nconst config = {\n  endpoint: '/api',\n  timeout: 3000\n} as const;\n// Type: { readonly endpoint: '/api'; readonly timeout: 3000 }\n```\n\n---"},{"id":"06-6","topic":"TypeScript","group":"BASIC TYPES","title":"Optional vs Undefined","prompt":"**Sự khác biệt giữa optional property và property với undefined?**\n\n```typescript\ninterface A {\n  prop?: string;\n}\n\ninterface B {\n  prop: string | undefined;\n}\n```","opts":[{"k":"A","t":"Không có sự khác biệt"},{"k":"B","t":"Cả hai đều bắt buộc có property"},{"k":"C","t":"B cho phép không có property"},{"k":"D","t":"A cho phép không có property, B yêu cầu property phải tồn tại (có thể là undefined)"}],"ans":"D","expl":"**Giải thích:**\n\n```typescript\ninterface A {\n  prop?: string;  // Property may not exist\n}\n\ninterface B {\n  prop: string | undefined;  // Property must exist, but can be undefined\n}\n\nconst a1: A = {};           // ✅ OK\nconst a2: A = { prop: undefined }; // ✅ OK\n\nconst b1: B = {};           // ❌ Error: property 'prop' is missing\nconst b2: B = { prop: undefined }; // ✅ OK\n\n// Practical difference with exactOptionalPropertyTypes\n// tsconfig: \"exactOptionalPropertyTypes\": true\ninterface Strict {\n  prop?: string;  // Can only be string or missing, NOT undefined\n}\n```\n\n---"},{"id":"06-7","topic":"TypeScript","group":"BASIC TYPES","title":"Readonly","prompt":"**Đoạn code nào compile thành công?**\n\n```typescript\ninterface Config {\n  readonly apiKey: string;\n  endpoints: readonly string[];\n}\n\nconst config: Config = {\n  apiKey: 'abc123',\n  endpoints: ['api.example.com']\n};\n\n// A\nconfig.apiKey = 'new-key';\n\n// B\nconfig.endpoints.push('new-endpoint');\n\n// C\nconfig.endpoints = ['new-endpoint'];\n\n// D\nconsole.log(config.apiKey);\n```","opts":[{"k":"A","t":"A, B, C, D"},{"k":"B","t":"Chỉ D"},{"k":"C","t":"C và D"},{"k":"D","t":"B và D"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\ninterface Config {\n  readonly apiKey: string;        // Cannot reassign\n  endpoints: readonly string[];   // Cannot modify array\n}\n\nconst config: Config = {\n  apiKey: 'abc123',\n  endpoints: ['api.example.com']\n};\n\n// A - Error: Cannot assign to 'apiKey' because it is a read-only property\nconfig.apiKey = 'new-key';\n\n// B - Error: Property 'push' does not exist on type 'readonly string[]'\nconfig.endpoints.push('new-endpoint');\n\n// C - Error: Cannot assign to 'endpoints' because it is a read-only property\nconfig.endpoints = ['new-endpoint'];\n\n// D - ✅ OK - reading is allowed\nconsole.log(config.apiKey);\n```\n\n---"},{"id":"06-8","topic":"TypeScript","group":"BASIC TYPES","title":"Enum","prompt":"**Output của đoạn code sau?**\n\n```typescript\nenum Direction {\n  Up,\n  Down,\n  Left = 10,\n  Right\n}\n\nconsole.log(Direction.Up);\nconsole.log(Direction.Down);\nconsole.log(Direction.Left);\nconsole.log(Direction.Right);\n```","opts":[{"k":"A","t":"`'Up', 'Down', 'Left', 'Right'`"},{"k":"B","t":"`0, 1, 2, 3`"},{"k":"C","t":"`0, 1, 10, 11`"},{"k":"D","t":"`1, 2, 10, 11`"}],"ans":"C","expl":"**Giải thích:**\n\n```typescript\nenum Direction {\n  Up,       // 0 (starts at 0 by default)\n  Down,     // 1 (auto-increment)\n  Left = 10,// 10 (explicit value)\n  Right     // 11 (continues from previous)\n}\n\n// String enums\nenum DirectionStr {\n  Up = 'UP',\n  Down = 'DOWN',\n}\n\n// const enum - inlined at compile time\nconst enum ConstDirection {\n  Up,\n  Down,\n}\n\n// Prefer union types over enums for simple cases\ntype Direction = 'up' | 'down' | 'left' | 'right';\n```\n\n---"},{"id":"06-9","topic":"TypeScript","group":"BASIC TYPES","title":"Tuple","prompt":"**Đoạn code nào có lỗi?**\n\n```typescript\nconst tuple: [string, number] = ['hello', 42];\n\n// A\ntuple[0] = 'world';\n\n// B\ntuple[1] = 'not a number';\n\n// C\ntuple.push('extra');\n\n// D\nconst [first, second] = tuple;\n```","opts":[{"k":"A","t":"Không có lỗi"},{"k":"B","t":"Chỉ B"},{"k":"C","t":"B và C"},{"k":"D","t":"Chỉ C"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\nconst tuple: [string, number] = ['hello', 42];\n\n// A - ✅ OK - correct type\ntuple[0] = 'world';\n\n// B - ❌ Error: Type 'string' is not assignable to type 'number'\ntuple[1] = 'not a number';\n\n// C - ✅ Compiles! (TypeScript limitation)\n// Tuples allow push/pop at runtime despite fixed type\ntuple.push('extra');\n// To prevent: use readonly tuple\nconst strictTuple: readonly [string, number] = ['hello', 42];\nstrictTuple.push('x'); // ❌ Error\n\n// D - ✅ OK - destructuring\nconst [first, second] = tuple;\n```\n\n---"},{"id":"06-10","topic":"TypeScript","group":"BASIC TYPES","title":"Non-null Assertion","prompt":"**Non-null assertion operator (!) làm gì?**\n\n```typescript\nfunction getValue(): string | null {\n  return 'hello';\n}\n\nconst value = getValue()!;\n```","opts":[{"k":"A","t":"Throws error nếu null"},{"k":"B","t":"Convert null thành empty string"},{"k":"C","t":"Check runtime null"},{"k":"D","t":"Asserts value is not null/undefined, remove from type"}],"ans":"D","expl":"**Giải thích:**\n\n```typescript\nfunction getValue(): string | null {\n  return 'hello';\n}\n\n// Non-null assertion: tells TypeScript \"I know this isn't null\"\nconst value = getValue()!; // Type: string (not string | null)\n\n// ⚠️ Warning: No runtime check!\n// If getValue() actually returns null, you'll get runtime error\n\n// Safer alternatives:\n// 1. Nullish coalescing\nconst safe1 = getValue() ?? 'default';\n\n// 2. Type guard\nconst result = getValue();\nif (result !== null) {\n  // result is string here\n}\n\n// 3. Optional chaining\nconst length = getValue()?.length;\n```\n\n---"},{"id":"06-11","topic":"TypeScript","group":"ADVANCED TYPES","title":"Union & Intersection","prompt":"**Type của `result` là gì?**\n\n```typescript\ntype A = { a: string; common: number };\ntype B = { b: string; common: boolean };\n\ntype Union = A | B;\ntype Intersection = A & B;\n\nconst union: Union = ???\nconst intersection: Intersection = ???\n```","opts":[{"k":"A","t":"Union cần cả a và b, Intersection cần một trong hai"},{"k":"B","t":"Union cần một trong hai (a hoặc b + common), Intersection cần tất cả (a, b, common nhưng common conflict)"},{"k":"C","t":"Không có sự khác biệt"},{"k":"D","t":"Error vì common type khác nhau"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\ntype A = { a: string; common: number };\ntype B = { b: string; common: boolean };\n\ntype Union = A | B;\n// Can be A OR B\n// Must have properties that exist in at least one type\n\nconst union1: Union = { a: 'hello', common: 1 };     // ✅ A\nconst union2: Union = { b: 'world', common: true };  // ✅ B\nconst union3: Union = { a: 'hi', b: 'bye', common: 1 }; // ✅ Can have both\n\ntype Intersection = A & B;\n// Must have ALL properties from both types\n// common has conflicting types: number & boolean = never\n\nconst inter: Intersection = {\n  a: 'hello',\n  b: 'world',\n  common: ???  // Type is 'never' - no value can satisfy both\n};\n```\n\n---"},{"id":"06-12","topic":"TypeScript","group":"ADVANCED TYPES","title":"Discriminated Unions","prompt":"**Pattern nào đúng cho discriminated union?**\n\n```typescript\n// A\ntype Shape = Circle | Square;\ntype Circle = { radius: number };\ntype Square = { side: number };\n\n// B\ntype Shape = Circle | Square;\ntype Circle = { kind: 'circle'; radius: number };\ntype Square = { kind: 'square'; side: number };\n```","opts":[{"k":"A","t":"Pattern B đúng - có discriminant property"},{"k":"B","t":"Pattern A đúng"},{"k":"C","t":"Cả hai đều sai"},{"k":"D","t":"Cả hai đều đúng"}],"ans":"A","expl":"**Giải thích:**\n\n```typescript\n// Discriminated Union - has a common literal property\ntype Shape =\n  | { kind: 'circle'; radius: number }\n  | { kind: 'square'; side: number };\n\nfunction getArea(shape: Shape): number {\n  switch (shape.kind) {\n    case 'circle':\n      // TypeScript knows shape is Circle here\n      return Math.PI * shape.radius ** 2;\n    case 'square':\n      // TypeScript knows shape is Square here\n      return shape.side ** 2;\n  }\n}\n\n// Without discriminant - harder to narrow\ntype ShapeBad = Circle | Square;\ntype Circle = { radius: number };\ntype Square = { side: number };\n\nfunction getAreaBad(shape: ShapeBad): number {\n  // How to tell if it's Circle or Square?\n  if ('radius' in shape) {\n    return Math.PI * shape.radius ** 2;\n  }\n  return shape.side ** 2;\n}\n```\n\n---"},{"id":"06-13","topic":"TypeScript","group":"ADVANCED TYPES","title":"Type Guards","prompt":"**Cách nào là valid type guard?**\n\n```typescript\n// A\nfunction isString(value: unknown): value is string {\n  return typeof value === 'string';\n}\n\n// B\nfunction isString(value: unknown): boolean {\n  return typeof value === 'string';\n}\n\n// C\nconst isString = (value: unknown) => typeof value === 'string';\n```","opts":[{"k":"A","t":"Tất cả đều là type guards"},{"k":"B","t":"Chỉ A là type guard (type predicate)"},{"k":"C","t":"A và B là type guards"},{"k":"D","t":"Chỉ C là type guard"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\n// Type predicate - tells TypeScript how to narrow\nfunction isString(value: unknown): value is string {\n  return typeof value === 'string';\n}\n\n// Using the type guard\nfunction process(value: unknown) {\n  if (isString(value)) {\n    // TypeScript knows value is string here\n    console.log(value.toUpperCase());\n  }\n}\n\n// Without type predicate - doesn't narrow\nfunction isStringBool(value: unknown): boolean {\n  return typeof value === 'string';\n}\n\nfunction processBad(value: unknown) {\n  if (isStringBool(value)) {\n    // value is still 'unknown' - no narrowing!\n    value.toUpperCase(); // ❌ Error\n  }\n}\n\n// Custom type guards for complex types\ninterface User {\n  name: string;\n  email: string;\n}\n\nfunction isUser(obj: unknown): obj is User {\n  return (\n    typeof obj === 'object' &&\n    obj !== null &&\n    'name' in obj &&\n    'email' in obj\n  );\n}\n```\n\n**Tham khảo:** [TypeScript - Type Predicates](https://www.typescriptlang.org/docs/handbook/2/narrowing.html#using-type-predicates)\n\n---"},{"id":"06-14","topic":"TypeScript","group":"ADVANCED TYPES","title":"Conditional Types","prompt":"**Result type là gì?**\n\n```typescript\ntype IsString\u003CT> = T extends string ? 'yes' : 'no';\n\ntype A = IsString\u003Cstring>;\ntype B = IsString\u003Cnumber>;\ntype C = IsString\u003C'hello'>;\n```","opts":[{"k":"A","t":"`A = 'yes'`, `B = 'no'`, `C = 'no'`"},{"k":"B","t":"`A = 'yes'`, `B = 'no'`, `C = 'yes'`"},{"k":"C","t":"`A = 'yes'`, `B = 'yes'`, `C = 'yes'`"},{"k":"D","t":"Error"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\ntype IsString\u003CT> = T extends string ? 'yes' : 'no';\n\ntype A = IsString\u003Cstring>;   // 'yes' - string extends string\ntype B = IsString\u003Cnumber>;   // 'no' - number doesn't extend string\ntype C = IsString\u003C'hello'>;  // 'yes' - 'hello' extends string (literal is subtype)\n\n// Distributive conditional types\ntype ToArray\u003CT> = T extends any ? T[] : never;\ntype Result = ToArray\u003Cstring | number>; // string[] | number[]\n\n// Prevent distribution with [T]\ntype ToArrayNonDist\u003CT> = [T] extends [any] ? T[] : never;\ntype Result2 = ToArrayNonDist\u003Cstring | number>; // (string | number)[]\n```\n\n---"},{"id":"06-15","topic":"TypeScript","group":"ADVANCED TYPES","title":"infer Keyword","prompt":"**Result type là gì?**\n\n```typescript\ntype ReturnType\u003CT> = T extends (...args: any[]) => infer R ? R : never;\n\ntype Fn = (x: number) => string;\ntype Result = ReturnType\u003CFn>;\n```","opts":[{"k":"A","t":"`never`"},{"k":"B","t":"`string`"},{"k":"C","t":"`Fn`"},{"k":"D","t":"`number`"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\n// infer keyword - captures type within conditional\ntype ReturnType\u003CT> = T extends (...args: any[]) => infer R ? R : never;\n\ntype Fn = (x: number) => string;\ntype Result = ReturnType\u003CFn>; // string\n\n// More infer examples\ntype FirstArg\u003CT> = T extends (first: infer F, ...args: any[]) => any ? F : never;\ntype First = FirstArg\u003C(a: string, b: number) => void>; // string\n\ntype ArrayElement\u003CT> = T extends (infer E)[] ? E : never;\ntype Element = ArrayElement\u003Cstring[]>; // string\n\ntype PromiseValue\u003CT> = T extends Promise\u003Cinfer V> ? V : never;\ntype Value = PromiseValue\u003CPromise\u003Cnumber>>; // number\n```\n\n---"},{"id":"06-16","topic":"TypeScript","group":"ADVANCED TYPES","title":"Mapped Types","prompt":"**Result type là gì?**\n\n```typescript\ntype Original = {\n  name: string;\n  age: number;\n};\n\ntype Readonly\u003CT> = {\n  readonly [K in keyof T]: T[K];\n};\n\ntype Result = Readonly\u003COriginal>;\n```","opts":[{"k":"A","t":"`{ readonly name: string; readonly age: number }`"},{"k":"B","t":"Error"},{"k":"C","t":"`{ name: readonly string; age: readonly number }`"},{"k":"D","t":"Same as Original"}],"ans":"A","expl":"**Giải thích:**\n\n```typescript\ntype Original = {\n  name: string;\n  age: number;\n};\n\n// Mapped type - transforms each property\ntype Readonly\u003CT> = {\n  readonly [K in keyof T]: T[K];\n};\n\ntype Result = Readonly\u003COriginal>;\n// { readonly name: string; readonly age: number }\n\n// More mapped type examples\ntype Optional\u003CT> = {\n  [K in keyof T]?: T[K];\n};\n\ntype Nullable\u003CT> = {\n  [K in keyof T]: T[K] | null;\n};\n\n// Key remapping (TS 4.1+)\ntype Getters\u003CT> = {\n  [K in keyof T as `get${Capitalize\u003Cstring & K>}`]: () => T[K];\n};\n\ntype UserGetters = Getters\u003COriginal>;\n// { getName: () => string; getAge: () => number }\n```\n\n---"},{"id":"06-17","topic":"TypeScript","group":"ADVANCED TYPES","title":"Template Literal Types","prompt":"**Type của `EventName` là gì?**\n\n```typescript\ntype Events = 'click' | 'focus' | 'blur';\ntype EventName = `on${Capitalize\u003CEvents>}`;\n```","opts":[{"k":"A","t":"Error"},{"k":"B","t":"`'onclick' | 'onfocus' | 'onblur'`"},{"k":"C","t":"`'onClick' | 'onFocus' | 'onBlur'`"},{"k":"D","t":"`string`"}],"ans":"C","expl":"**Giải thích:**\n\n```typescript\ntype Events = 'click' | 'focus' | 'blur';\n\n// Template literal type\ntype EventName = `on${Capitalize\u003CEvents>}`;\n// 'onClick' | 'onFocus' | 'onBlur'\n\n// Built-in string manipulation types\ntype Upper = Uppercase\u003C'hello'>;      // 'HELLO'\ntype Lower = Lowercase\u003C'HELLO'>;      // 'hello'\ntype Cap = Capitalize\u003C'hello'>;       // 'Hello'\ntype Uncap = Uncapitalize\u003C'Hello'>;   // 'hello'\n\n// Complex template literals\ntype PropEventHandler\u003CT extends string> = `on${Capitalize\u003CT>}Change`;\ntype NameHandler = PropEventHandler\u003C'name'>; // 'onNameChange'\n\n// CSS-like types\ntype Color = 'red' | 'blue';\ntype Size = 'sm' | 'md' | 'lg';\ntype ClassName = `${Color}-${Size}`; // 'red-sm' | 'red-md' | 'red-lg' | 'blue-sm' | 'blue-md' | 'blue-lg'\n```\n\n---"},{"id":"06-18","topic":"TypeScript","group":"ADVANCED TYPES","title":"Index Signatures","prompt":"**Đoạn code nào có lỗi?**\n\n```typescript\ninterface Dictionary {\n  [key: string]: number;\n  length: number;\n  // A\n  name: string;\n}\n\n// B\ninterface Dict2 {\n  [key: string]: number | string;\n  length: number;\n  name: string;\n}\n```","opts":[{"k":"A","t":"Cả A và B đều lỗi"},{"k":"B","t":"Chỉ A lỗi (name: string không compatible với index signature number)"},{"k":"C","t":"Chỉ B lỗi"},{"k":"D","t":"Không có lỗi"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\n// A - Error\ninterface Dictionary {\n  [key: string]: number;\n  length: number;    // ✅ OK - number matches index signature\n  name: string;      // ❌ Error - string doesn't match number index signature\n}\n\n// B - OK\ninterface Dict2 {\n  [key: string]: number | string;  // Union allows both\n  length: number;    // ✅ OK - number is in union\n  name: string;      // ✅ OK - string is in union\n}\n\n// Solution for A\ninterface DictionaryFixed {\n  [key: string]: number | string;\n  length: number;\n  name: string;\n}\n\n// Or use intersection\ntype DictionaryAlt = {\n  [key: string]: number;\n} & {\n  name: string;\n};\n```\n\n---"},{"id":"06-19","topic":"TypeScript","group":"ADVANCED TYPES","title":"keyof","prompt":"**Type của `Keys` là gì?**\n\n```typescript\ninterface Person {\n  name: string;\n  age: number;\n  address: string;\n}\n\ntype Keys = keyof Person;\n```","opts":[{"k":"A","t":"`'name' | 'age' | 'address'`"},{"k":"B","t":"`string`"},{"k":"C","t":"`['name', 'age', 'address']`"},{"k":"D","t":"`{ name: string; age: number; address: string }`"}],"ans":"A","expl":"**Giải thích:**\n\n```typescript\ninterface Person {\n  name: string;\n  age: number;\n  address: string;\n}\n\ntype Keys = keyof Person; // 'name' | 'age' | 'address'\n\n// Using keyof\nfunction getProperty\u003CT, K extends keyof T>(obj: T, key: K): T[K] {\n  return obj[key];\n}\n\nconst person: Person = { name: 'John', age: 30, address: '123 Main' };\nconst name = getProperty(person, 'name'); // string\nconst age = getProperty(person, 'age');   // number\ngetProperty(person, 'invalid');           // ❌ Error\n\n// keyof with index signatures\ntype StringDict = { [key: string]: number };\ntype DictKeys = keyof StringDict; // string | number (number because array indices)\n```\n\n---"},{"id":"06-20","topic":"TypeScript","group":"ADVANCED TYPES","title":"typeof in Types","prompt":"**Sự khác biệt giữa typeof trong runtime và type context?**\n\n```typescript\nconst user = { name: 'John', age: 30 };\n\n// Runtime\nconsole.log(typeof user);\n\n// Type context\ntype User = typeof user;\n```","opts":[{"k":"A","t":"Cả hai đều return 'object'"},{"k":"B","t":"Runtime: `'object'`, Type context: `{ name: string; age: number }`"},{"k":"C","t":"Error trong type context"},{"k":"D","t":"Cả hai đều return type structure"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\nconst user = { name: 'John', age: 30 };\n\n// Runtime typeof - returns string\nconsole.log(typeof user); // 'object'\n\n// Type context typeof - returns type structure\ntype User = typeof user; // { name: string; age: number }\n\n// Combining with keyof\ntype UserKeys = keyof typeof user; // 'name' | 'age'\n\n// With const assertion\nconst config = {\n  api: '/api',\n  version: 1\n} as const;\n\ntype Config = typeof config;\n// { readonly api: '/api'; readonly version: 1 }\n\n// typeof with functions\nfunction createUser(name: string) {\n  return { name, createdAt: new Date() };\n}\n\ntype CreateUserReturn = ReturnType\u003Ctypeof createUser>;\n// { name: string; createdAt: Date }\n```\n\n---"},{"id":"06-21","topic":"TypeScript","group":"GENERICS","title":"Generic Basics","prompt":"**Đâu là generic function đúng để get array element?**\n\n```typescript\n// A\nfunction getFirst(arr: any[]): any {\n  return arr[0];\n}\n\n// B\nfunction getFirst\u003CT>(arr: T[]): T {\n  return arr[0];\n}\n\n// C\nfunction getFirst\u003CT>(arr: T[]): T | undefined {\n  return arr[0];\n}\n```","opts":[{"k":"A","t":"C là best practice (handle empty array)"},{"k":"B","t":"Tất cả đều equivalent"},{"k":"C","t":"A là best practice"},{"k":"D","t":"B là best practice"}],"ans":"A","expl":"**Giải thích:**\n\n```typescript\n// A - any loses type information\nfunction getFirstAny(arr: any[]): any {\n  return arr[0]; // No type safety\n}\n\n// B - preserves type but doesn't handle empty array\nfunction getFirstB\u003CT>(arr: T[]): T {\n  return arr[0]; // What if arr is empty? Returns undefined but typed as T\n}\n\n// C - Best practice: explicit about undefined possibility\nfunction getFirstC\u003CT>(arr: T[]): T | undefined {\n  return arr[0];\n}\n\n// Or use overloads for more specific typing\nfunction getFirst\u003CT>(arr: [T, ...T[]]): T;  // Non-empty array\nfunction getFirst\u003CT>(arr: T[]): T | undefined;  // Possibly empty\nfunction getFirst\u003CT>(arr: T[]): T | undefined {\n  return arr[0];\n}\n\nconst result1 = getFirst([1, 2, 3] as [number, ...number[]]); // number\nconst result2 = getFirst([1, 2, 3]); // number | undefined\n```\n\n---"},{"id":"06-22","topic":"TypeScript","group":"GENERICS","title":"Generic Constraints","prompt":"**Code nào compile thành công?**\n\n```typescript\nfunction getLength\u003CT extends { length: number }>(item: T): number {\n  return item.length;\n}\n\n// A\ngetLength('hello');\n\n// B\ngetLength([1, 2, 3]);\n\n// C\ngetLength({ length: 10 });\n\n// D\ngetLength(123);\n```","opts":[{"k":"A","t":"A, B, C"},{"k":"B","t":"A, B, C, D"},{"k":"C","t":"Chỉ B và C"},{"k":"D","t":"A, B, C nhưng D lỗi"}],"ans":"D","expl":"**Giải thích:**\n\n```typescript\n// Generic constraint: T must have length property\nfunction getLength\u003CT extends { length: number }>(item: T): number {\n  return item.length;\n}\n\n// A - ✅ string has length\ngetLength('hello'); // 5\n\n// B - ✅ array has length\ngetLength([1, 2, 3]); // 3\n\n// C - ✅ object with length property\ngetLength({ length: 10 }); // 10\n\n// D - ❌ Error: number doesn't have length\ngetLength(123);\n// Argument of type 'number' is not assignable to parameter\n// of type '{ length: number }'\n\n// More constraint examples\ninterface HasId {\n  id: number;\n}\n\nfunction processEntities\u003CT extends HasId>(entities: T[]): number[] {\n  return entities.map(e => e.id);\n}\n```\n\n---"},{"id":"06-23","topic":"TypeScript","group":"GENERICS","title":"Multiple Type Parameters","prompt":"**Type của `result` là gì?**\n\n```typescript\nfunction merge\u003CT, U>(obj1: T, obj2: U): T & U {\n  return { ...obj1, ...obj2 };\n}\n\nconst result = merge({ name: 'John' }, { age: 30 });\n```","opts":[{"k":"A","t":"`{ name: string; age: number }`"},{"k":"B","t":"`any`"},{"k":"C","t":"`{ name: string } | { age: number }`"},{"k":"D","t":"`object`"}],"ans":"A","expl":"**Giải thích:**\n\n```typescript\nfunction merge\u003CT, U>(obj1: T, obj2: U): T & U {\n  return { ...obj1, ...obj2 };\n}\n\nconst result = merge({ name: 'John' }, { age: 30 });\n// Type: { name: string } & { age: number }\n// Which simplifies to: { name: string; age: number }\n\n// TypeScript infers T and U from arguments\n// T = { name: string }\n// U = { age: number }\n// T & U = { name: string; age: number }\n\n// More examples\nconst merged = merge(\n  { a: 1, b: 2 },\n  { b: 'override', c: 3 }\n);\n// Type: { a: number; b: number } & { b: string; c: number }\n// Note: b has type number & string which is never in strict mode\n```\n\n---"},{"id":"06-24","topic":"TypeScript","group":"GENERICS","title":"Generic Defaults","prompt":"**Code nào sử dụng generic default đúng?**\n\n```typescript\n// A\ninterface Container\u003CT = string> {\n  value: T;\n}\nconst container: Container = { value: 'hello' };\n\n// B\nfunction process\u003CT = number>(value: T): T {\n  return value;\n}\nconst result = process('hello'); // result type?\n```","opts":[{"k":"A","t":"A error, B correct"},{"k":"B","t":"A correct, B result là `string` (inferred)"},{"k":"C","t":"A correct, B result là `number`"},{"k":"D","t":"Both error"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\n// A - Default generic parameter\ninterface Container\u003CT = string> {\n  value: T;\n}\n\nconst container: Container = { value: 'hello' }; // ✅ T defaults to string\nconst numContainer: Container\u003Cnumber> = { value: 42 }; // ✅ Explicit type\n\n// B - Default parameter with inference\nfunction process\u003CT = number>(value: T): T {\n  return value;\n}\n\nconst result = process('hello');\n// result type is 'string', NOT 'number'\n// TypeScript infers T from argument, default is only used when\n// T cannot be inferred\n\nconst resultDefault = process(); // ❌ Error - cannot infer T\n// Would need: process\u003Cnumber>() or process(42)\n\n// Default is useful when type cannot be inferred\nfunction createArray\u003CT = string>(): T[] {\n  return [];\n}\n\nconst arr = createArray(); // string[] (uses default)\nconst numArr = createArray\u003Cnumber>(); // number[]\n```\n\n---"},{"id":"06-25","topic":"TypeScript","group":"GENERICS","title":"Generic Classes","prompt":"**Type của `data` khi get từ NumberBox?**\n\n```typescript\nclass Box\u003CT> {\n  constructor(private value: T) {}\n\n  getValue(): T {\n    return this.value;\n  }\n}\n\nconst numberBox = new Box(42);\nconst data = numberBox.getValue();\n```","opts":[{"k":"A","t":"`42`"},{"k":"B","t":"`any`"},{"k":"C","t":"`unknown`"},{"k":"D","t":"`number`"}],"ans":"D","expl":"**Giải thích:**\n\n```typescript\nclass Box\u003CT> {\n  constructor(private value: T) {}\n\n  getValue(): T {\n    return this.value;\n  }\n}\n\n// TypeScript infers T from constructor argument\nconst numberBox = new Box(42); // Box\u003Cnumber>\nconst data = numberBox.getValue(); // number\n\n// Explicit type parameter\nconst stringBox = new Box\u003Cstring>('hello'); // Box\u003Cstring>\n\n// Complex generic class\nclass Repository\u003CT extends { id: number }> {\n  private items: T[] = [];\n\n  add(item: T): void {\n    this.items.push(item);\n  }\n\n  findById(id: number): T | undefined {\n    return this.items.find(item => item.id === id);\n  }\n}\n\ninterface User {\n  id: number;\n  name: string;\n}\n\nconst userRepo = new Repository\u003CUser>();\nuserRepo.add({ id: 1, name: 'John' });\nconst user = userRepo.findById(1); // User | undefined\n```\n\n---"},{"id":"06-26","topic":"TypeScript","group":"TYPE MANIPULATION","title":"Utility Types - Partial & Required","prompt":"**Types của `PartialUser` và `RequiredUser` là gì?**\n\n```typescript\ninterface User {\n  name: string;\n  age?: number;\n}\n\ntype PartialUser = Partial\u003CUser>;\ntype RequiredUser = Required\u003CUser>;\n```","opts":[{"k":"A","t":"Error"},{"k":"B","t":"Giống nhau"},{"k":"C","t":"`PartialUser`: tất cả optional, `RequiredUser`: tất cả required"},{"k":"D","t":"`PartialUser`: tất cả required, `RequiredUser`: tất cả optional"}],"ans":"C","expl":"**Giải thích:**\n\n```typescript\ninterface User {\n  name: string;\n  age?: number;\n}\n\n// Partial - makes all properties optional\ntype PartialUser = Partial\u003CUser>;\n// { name?: string; age?: number }\n\n// Required - makes all properties required\ntype RequiredUser = Required\u003CUser>;\n// { name: string; age: number }\n\n// Implementation\ntype MyPartial\u003CT> = {\n  [K in keyof T]?: T[K];\n};\n\ntype MyRequired\u003CT> = {\n  [K in keyof T]-?: T[K];  // -? removes optional modifier\n};\n\n// Use case: Partial for updates\nfunction updateUser(id: string, updates: Partial\u003CUser>) {\n  // Can update name only, age only, or both\n}\n\nupdateUser('1', { name: 'Jane' }); // ✅\nupdateUser('1', { age: 31 }); // ✅\n```\n\n---"},{"id":"06-27","topic":"TypeScript","group":"TYPE MANIPULATION","title":"Pick & Omit","prompt":"**Type của `Result` là gì?**\n\n```typescript\ninterface User {\n  id: number;\n  name: string;\n  email: string;\n  password: string;\n}\n\ntype PublicUser = Omit\u003CUser, 'password'>;\ntype Credentials = Pick\u003CUser, 'email' | 'password'>;\n```","opts":[{"k":"A","t":"Error"},{"k":"B","t":"`PublicUser` không có password, `Credentials` có email và password"},{"k":"C","t":"Cả hai đều có tất cả properties"},{"k":"D","t":"`PublicUser` có password, `Credentials` không có"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\ninterface User {\n  id: number;\n  name: string;\n  email: string;\n  password: string;\n}\n\n// Omit - removes specified properties\ntype PublicUser = Omit\u003CUser, 'password'>;\n// { id: number; name: string; email: string }\n\n// Pick - keeps only specified properties\ntype Credentials = Pick\u003CUser, 'email' | 'password'>;\n// { email: string; password: string }\n\n// Implementation\ntype MyOmit\u003CT, K extends keyof T> = Pick\u003CT, Exclude\u003Ckeyof T, K>>;\n\ntype MyPick\u003CT, K extends keyof T> = {\n  [P in K]: T[P];\n};\n\n// Use cases\nfunction createPublicUser(user: User): PublicUser {\n  const { password, ...publicUser } = user;\n  return publicUser;\n}\n\nfunction login(credentials: Credentials): Promise\u003CUser> {\n  // ...\n}\n```\n\n---"},{"id":"06-28","topic":"TypeScript","group":"TYPE MANIPULATION","title":"Record","prompt":"**Type của `Result` là gì?**\n\n```typescript\ntype Status = 'pending' | 'approved' | 'rejected';\ntype StatusMap = Record\u003CStatus, number>;\n```","opts":[{"k":"A","t":"`Status[]`"},{"k":"B","t":"`{ pending: number; approved: number; rejected: number }`"},{"k":"C","t":"`{ [key: string]: number }`"},{"k":"D","t":"`number[]`"}],"ans":"B","expl":"**Giải thích:**\n\n```typescript\ntype Status = 'pending' | 'approved' | 'rejected';\n\n// Record creates object type with specified keys and value type\ntype StatusMap = Record\u003CStatus, number>;\n// { pending: number; approved: number; rejected: number }\n\n// Implementation\ntype MyRecord\u003CK extends keyof any, V> = {\n  [P in K]: V;\n};\n\n// Use cases\nconst statusCounts: StatusMap = {\n  pending: 5,\n  approved: 10,\n  rejected: 2\n};\n\n// Dynamic keys\ntype PageViews = Record\u003Cstring, number>;\nconst views: PageViews = {\n  '/home': 100,\n  '/about': 50,\n};\n\n// Typed keys with union\ntype Roles = 'admin' | 'user' | 'guest';\ntype Permissions = Record\u003CRoles, string[]>;\nconst perms: Permissions = {\n  admin: ['read', 'write', 'delete'],\n  user: ['read', 'write'],\n  guest: ['read'],\n};\n```\n\n---"},{"id":"06-29","topic":"TypeScript","group":"TYPE MANIPULATION","title":"Extract & Exclude","prompt":"**Types là gì?**\n\n```typescript\ntype T = 'a' | 'b' | 'c' | 'd';\n\ntype Extracted = Extract\u003CT, 'a' | 'b' | 'e'>;\ntype Excluded = Exclude\u003CT, 'a' | 'b'>;\n```","opts":[{"k":"A","t":"Error"},{"k":"B","t":"`Extracted = 'e'`, `Excluded = 'a' | 'b' | 'c' | 'd'`"},{"k":"C","t":"`Extracted = 'a' | 'b'`, `Excluded = 'c' | 'd'`"},{"k":"D","t":"`Extracted = 'a' | 'b' | 'e'`, `Excluded = 'a' | 'b'`"}],"ans":"C","expl":"**Giải thích:**\n\n```typescript\ntype T = 'a' | 'b' | 'c' | 'd';\n\n// Extract - keeps types that extend the union\ntype Extracted = Extract\u003CT, 'a' | 'b' | 'e'>;\n// 'a' | 'b' (keeps 'a' and 'b', 'e' not in T so ignored)\n\n// Exclude - removes types that extend the union\ntype Excluded = Exclude\u003CT, 'a' | 'b'>;\n// 'c' | 'd'\n\n// Implementation\ntype MyExtract\u003CT, U> = T extends U ? T : never;\ntype MyExclude\u003CT, U> = T extends U ? never : T;\n\n// Use cases\ntype AllEvents = 'click' | 'focus' | 'blur' | 'submit' | 'reset';\ntype MouseEvents = Extract\u003CAllEvents, 'click'>;\ntype FormEvents = Extract\u003CAllEvents, 'submit' | 'reset'>;\ntype NonFormEvents = Exclude\u003CAllEvents, 'submit' | 'reset'>;\n\n// With objects\ntype Animal = { type: 'dog' } | { type: 'cat' } | { type: 'bird' };\ntype Mammal = Extract\u003CAnimal, { type: 'dog' | 'cat' }>;\n```\n\n---"},{"id":"06-30","topic":"TypeScript","group":"TYPE MANIPULATION","title":"NonNullable","prompt":"**Type của `Result` là gì?**\n\n```typescript\ntype Nullable = string | null | undefined;\ntype Result = NonNullable\u003CNullable>;\n```","opts":[{"k":"A","t":"`string | null | undefined`"},{"k":"B","t":"`never`"},{"k":"C","t":"`null | undefined`"},{"k":"D","t":"`string`"}],"ans":"D","expl":"**Giải thích:**\n\n```typescript\ntype Nullable = string | null | undefined;\n\n// NonNullable removes null and undefined\ntype Result = NonNullable\u003CNullable>; // string\n\n// Implementation\ntype MyNonNullable\u003CT> = T extends null | undefined ? never : T;\n\n// Use cases\nfunction processValue\u003CT>(value: T): NonNullable\u003CT> {\n  if (value === null || value === undefined) {\n    throw new Error('Value is null or undefined');\n  }\n  return value as NonNullable\u003CT>;\n}\n\nconst maybeString: string | null = 'hello';\nconst definitelyString = processValue(maybeString); // string\n```\n\n---"},{"id":"06-31","topic":"TypeScript","group":"REACT + TYPESCRIPT","title":"Component Props","prompt":"**Cách định nghĩa props đúng cho React component?**\n\n```typescript\n// A\ninterface Props {\n  name: string;\n  age?: number;\n  children: React.ReactNode;\n}\n\n// B\ntype Props = {\n  name: string;\n  age?: number;\n  children: React.ReactNode;\n};\n\n// C\nfunction Component(props: { name: string }) {}\n\n// D\nAll above are correct\n```","opts":[{"k":"A","t":"Chỉ A"},{"k":"B","t":"Chỉ B"},{"k":"C","t":"A và B"},{"k":"D","t":"Tất cả đều đúng"}],"ans":"D","expl":"**Giải thích:**\n\n```tsx\n// All valid ways to define props\n\n// A - Interface\ninterface Props {\n  name: string;\n  age?: number;\n  children: React.ReactNode;\n}\n\n// B - Type alias\ntype Props = {\n  name: string;\n  age?: number;\n  children: React.ReactNode;\n};\n\n// C - Inline type\nfunction Component(props: { name: string }) {\n  return \u003Cdiv>{props.name}\u003C/div>;\n}\n\n// Best practices:\n// 1. Use interface for public component APIs\ninterface ButtonProps {\n  variant: 'primary' | 'secondary';\n  onClick: () => void;\n  children: React.ReactNode;\n}\n\n// 2. Use PropsWithChildren for convenience\nimport { PropsWithChildren } from 'react';\n\ninterface CardProps {\n  title: string;\n}\n\nfunction Card({ title, children }: PropsWithChildren\u003CCardProps>) {\n  return (\n    \u003Cdiv>\n      \u003Ch2>{title}\u003C/h2>\n      {children}\n    \u003C/div>\n  );\n}\n\n// 3. Component type annotation\nconst Button: React.FC\u003CButtonProps> = ({ variant, onClick, children }) => {\n  return \u003Cbutton onClick={onClick}>{children}\u003C/button>;\n};\n```\n\n---"},{"id":"06-32","topic":"TypeScript","group":"REACT + TYPESCRIPT","title":"Event Handlers","prompt":"**Type đúng cho onChange handler?**\n\n```typescript\nconst Input: React.FC = () => {\n  const handleChange = (e: ???) => {\n    console.log(e.target.value);\n  };\n\n  return \u003Cinput onChange={handleChange} />;\n};\n```","opts":[{"k":"A","t":"`React.FormEvent`"},{"k":"B","t":"`React.ChangeEvent\u003CHTMLInputElement>`"},{"k":"C","t":"`any`"},{"k":"D","t":"`Event`"}],"ans":"B","expl":"**Giải thích:**\n\n```tsx\n// Common event types\nconst Input: React.FC = () => {\n  // Input change\n  const handleChange = (e: React.ChangeEvent\u003CHTMLInputElement>) => {\n    console.log(e.target.value);\n  };\n\n  // Form submit\n  const handleSubmit = (e: React.FormEvent\u003CHTMLFormElement>) => {\n    e.preventDefault();\n  };\n\n  // Click\n  const handleClick = (e: React.MouseEvent\u003CHTMLButtonElement>) => {\n    console.log(e.clientX, e.clientY);\n  };\n\n  // Keyboard\n  const handleKeyDown = (e: React.KeyboardEvent\u003CHTMLInputElement>) => {\n    if (e.key === 'Enter') {\n      // ...\n    }\n  };\n\n  // Focus\n  const handleFocus = (e: React.FocusEvent\u003CHTMLInputElement>) => {\n    console.log('focused');\n  };\n\n  return (\n    \u003Cform onSubmit={handleSubmit}>\n      \u003Cinput\n        onChange={handleChange}\n        onKeyDown={handleKeyDown}\n        onFocus={handleFocus}\n      />\n      \u003Cbutton onClick={handleClick}>Submit\u003C/button>\n    \u003C/form>\n  );\n};\n```\n\n---"},{"id":"06-33","topic":"TypeScript","group":"REACT + TYPESCRIPT","title":"useRef Types","prompt":"**Sự khác biệt giữa các useRef types?**\n\n```typescript\n// A\nconst ref1 = useRef\u003CHTMLDivElement>(null);\n\n// B\nconst ref2 = useRef\u003CHTMLDivElement>(null!);\n\n// C\nconst ref3 = useRef\u003CHTMLDivElement | null>(null);\n```","opts":[{"k":"A","t":"Tất cả đều mutable"},{"k":"B","t":"Không có sự khác biệt"},{"k":"C","t":"A: readonly ref, B: mutable (asserts not null), C: mutable ref"},{"k":"D","t":"Tất cả đều readonly"}],"ans":"C","expl":"**Giải thích:**\n\n```tsx\n// A - For DOM refs, readonly (can't reassign .current)\nconst ref1 = useRef\u003CHTMLDivElement>(null);\n// ref1.current is HTMLDivElement | null\n// ref1.current = something; // ❌ Error: readonly\n\n// B - Non-null assertion, mutable but risky\nconst ref2 = useRef\u003CHTMLDivElement>(null!);\n// ref2.current is HTMLDivElement (non-null asserted)\n// ref2.current = something; // ✅ OK\n// ⚠️ Will be null initially until ref is attached!\n\n// C - Explicit mutable ref\nconst ref3 = useRef\u003CHTMLDivElement | null>(null);\n// ref3.current is HTMLDivElement | null\n// ref3.current = something; // ✅ OK\n\n// Use cases:\n// A - For attaching to JSX elements\nfunction Component1() {\n  const divRef = useRef\u003CHTMLDivElement>(null);\n  return \u003Cdiv ref={divRef} />;\n}\n\n// C - For storing mutable values\nfunction Component2() {\n  const intervalRef = useRef\u003Cnumber | null>(null);\n\n  useEffect(() => {\n    intervalRef.current = window.setInterval(() => {}, 1000);\n    return () => {\n      if (intervalRef.current) {\n        clearInterval(intervalRef.current);\n      }\n    };\n  }, []);\n}\n```\n\n---"},{"id":"06-34","topic":"TypeScript","group":"REACT + TYPESCRIPT","title":"Generic Components","prompt":"**Cách viết generic component đúng?**\n\n```typescript\n// A\nfunction List\u003CT>({ items, render }: { items: T[]; render: (item: T) => React.ReactNode }) {\n  return \u003C>{items.map(render)}\u003C/>;\n}\n\n// Usage\n\u003CList items={[1, 2, 3]} render={(item) => \u003Cspan>{item}\u003C/span>} />\n```","opts":[{"k":"A","t":"Need to use class components"},{"k":"B","t":"Incorrect - cannot use generics with React components"},{"k":"C","t":"Need explicit type parameter"},{"k":"D","t":"Correct"}],"ans":"D","expl":"**Giải thích:**\n\n```tsx\n// Generic components are fully supported\n\n// Basic generic component\nfunction List\u003CT>({\n  items,\n  render,\n}: {\n  items: T[];\n  render: (item: T) => React.ReactNode;\n}) {\n  return \u003Cul>{items.map((item, i) => \u003Cli key={i}>{render(item)}\u003C/li>)}\u003C/ul>;\n}\n\n// Usage - type is inferred\n\u003CList\n  items={[1, 2, 3]}\n  render={(item) => \u003Cspan>{item * 2}\u003C/span>}\n/>\n\n\u003CList\n  items={[{ name: 'John' }, { name: 'Jane' }]}\n  render={(user) => \u003Cspan>{user.name}\u003C/span>}\n/>\n\n// More complex generic component\ninterface SelectProps\u003CT> {\n  items: T[];\n  value: T;\n  onChange: (value: T) => void;\n  getLabel: (item: T) => string;\n  getValue: (item: T) => string | number;\n}\n\nfunction Select\u003CT>({\n  items,\n  value,\n  onChange,\n  getLabel,\n  getValue,\n}: SelectProps\u003CT>) {\n  return (\n    \u003Cselect\n      value={getValue(value) as string}\n      onChange={(e) => {\n        const selected = items.find(\n          (item) => String(getValue(item)) === e.target.value\n        );\n        if (selected) onChange(selected);\n      }}\n    >\n      {items.map((item) => (\n        \u003Coption key={getValue(item)} value={getValue(item)}>\n          {getLabel(item)}\n        \u003C/option>\n      ))}\n    \u003C/select>\n  );\n}\n```\n\n---"},{"id":"06-35","topic":"TypeScript","group":"REACT + TYPESCRIPT","title":"Custom Hooks Types","prompt":"**Return type đúng cho custom hook?**\n\n```typescript\nfunction useToggle(initial: boolean): ??? {\n  const [value, setValue] = useState(initial);\n  const toggle = useCallback(() => setValue(v => !v), []);\n  return [value, toggle];\n}\n\n// Usage\nconst [isOpen, toggleOpen] = useToggle(false);\ntoggleOpen(); // Should work\n```","opts":[{"k":"A","t":"A hoặc B (B là default inference)"},{"k":"B","t":"`[boolean, () => void]`"},{"k":"C","t":"`(boolean | (() => void))[]`"},{"k":"D","t":"`{ value: boolean; toggle: () => void }`\n---"}],"ans":"B","expl":"**Giải thích:**\n\n```tsx\n// Without explicit type, TypeScript infers array union\nfunction useToggleBad(initial: boolean) {\n  const [value, setValue] = useState(initial);\n  const toggle = useCallback(() => setValue(v => !v), []);\n  return [value, toggle];\n  // Inferred: (boolean | (() => void))[]\n  // Problem: can't destructure with correct types\n}\n\n// Solution 1: Explicit tuple return type\nfunction useToggle(initial: boolean): [boolean, () => void] {\n  const [value, setValue] = useState(initial);\n  const toggle = useCallback(() => setValue(v => !v), []);\n  return [value, toggle];\n}\n\n// Solution 2: as const\nfunction useToggle2(initial: boolean) {\n  const [value, setValue] = useState(initial);\n  const toggle = useCallback(() => setValue(v => !v), []);\n  return [value, toggle] as const;\n  // Returns: readonly [boolean, () => void]\n}\n\n// Solution 3: Object return (often preferred)\nfunction useToggle3(initial: boolean) {\n  const [value, setValue] = useState(initial);\n  const toggle = useCallback(() => setValue(v => !v), []);\n  return { value, toggle };\n}\n\n// Usage\nconst [isOpen, toggleOpen] = useToggle(false);\ntoggleOpen(); // ✅ TypeScript knows it's a function\n```\n\n---"},{"id":"07-1","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"Semantic HTML","prompt":"**Đâu là cách sử dụng semantic HTML đúng?**\n\n```html\n\u003C!-- A -->\n\u003Cdiv class=\"header\">\n  \u003Cdiv class=\"nav\">...\u003C/div>\n\u003C/div>\n\n\u003C!-- B -->\n\u003Cheader>\n  \u003Cnav>...\u003C/nav>\n\u003C/header>\n```","opts":[{"k":"A","t":"Cả A và B đều đúng"},{"k":"B","t":"Chỉ B đúng - semantic elements tốt hơn cho accessibility và SEO"},{"k":"C","t":"Chỉ A đúng - div flexible hơn"},{"k":"D","t":"Không có sự khác biệt"}],"ans":"B","expl":"**Giải thích:**\nSemantic HTML benefits:\n- **Accessibility:** Screen readers understand structure\n- **SEO:** Search engines understand content hierarchy\n- **Maintainability:** Code is self-documenting\n\n```html\n\u003C!-- ❌ Non-semantic -->\n\u003Cdiv class=\"header\">\n  \u003Cdiv class=\"nav\">\n    \u003Cdiv class=\"nav-item\">Home\u003C/div>\n  \u003C/div>\n\u003C/div>\n\n\u003C!-- ✅ Semantic -->\n\u003Cheader>\n  \u003Cnav>\n    \u003Cul>\n      \u003Cli>\u003Ca href=\"/\">Home\u003C/a>\u003C/li>\n    \u003C/ul>\n  \u003C/nav>\n\u003C/header>\n\n\u003C!-- Common semantic elements -->\n\u003Cmain>       \u003C!-- Main content -->\n\u003Carticle>    \u003C!-- Self-contained content -->\n\u003Csection>    \u003C!-- Thematic grouping -->\n\u003Caside>      \u003C!-- Tangentially related content -->\n\u003Cfigure>     \u003C!-- Image with caption -->\n\u003Cfigcaption> \u003C!-- Caption for figure -->\n\u003Ctime>       \u003C!-- Date/time -->\n\u003Cmark>       \u003C!-- Highlighted text -->\n```\n\n**Tham khảo:** [MDN - Semantic HTML](https://developer.mozilla.org/en-US/docs/Glossary/Semantics#semantics_in_html)\n\n---"},{"id":"07-2","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"ARIA Roles","prompt":"**Khi nào nên sử dụng ARIA attributes?**","opts":[{"k":"A","t":"Thay thế tất cả semantic HTML"},{"k":"B","t":"Luôn luôn"},{"k":"C","t":"Chỉ khi semantic HTML không thể express được"},{"k":"D","t":"Không bao giờ cần thiết"}],"ans":"C","expl":"**Giải thích:**\nARIA rules:\n1. **First rule of ARIA:** Don't use ARIA if native HTML works\n2. Use ARIA when no semantic equivalent exists\n3. All interactive elements must have accessible names\n\n```html\n\u003C!-- ❌ Unnecessary ARIA -->\n\u003Cbutton role=\"button\">Click me\u003C/button>\n\n\u003C!-- ✅ Native HTML sufficient -->\n\u003Cbutton>Click me\u003C/button>\n\n\u003C!-- ✅ ARIA needed for custom widgets -->\n\u003Cdiv role=\"tablist\">\n  \u003Cbutton role=\"tab\" aria-selected=\"true\" aria-controls=\"panel1\">Tab 1\u003C/button>\n  \u003Cbutton role=\"tab\" aria-selected=\"false\" aria-controls=\"panel2\">Tab 2\u003C/button>\n\u003C/div>\n\u003Cdiv role=\"tabpanel\" id=\"panel1\">Content 1\u003C/div>\n\u003Cdiv role=\"tabpanel\" id=\"panel2\" hidden>Content 2\u003C/div>\n\n\u003C!-- ✅ ARIA for dynamic content -->\n\u003Cdiv aria-live=\"polite\" aria-atomic=\"true\">\n  \u003C!-- Screen reader announces changes here -->\n\u003C/div>\n```\n\n**Tham khảo:** [W3C - ARIA Authoring Practices](https://www.w3.org/WAI/ARIA/apg/)\n\n---"},{"id":"07-3","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"Accessible Forms","prompt":"**Form nào accessible hơn?**\n\n```html\n\u003C!-- A -->\n\u003Cinput type=\"text\" placeholder=\"Enter name\">\n\n\u003C!-- B -->\n\u003Clabel for=\"name\">Name\u003C/label>\n\u003Cinput type=\"text\" id=\"name\" aria-describedby=\"name-hint\">\n\u003Cspan id=\"name-hint\">Enter your full name\u003C/span>\n```","opts":[{"k":"A","t":"Form B - có label và description cho screen readers"},{"k":"B","t":"Cả hai đều không accessible"},{"k":"C","t":"Giống nhau"},{"k":"D","t":"Form A"}],"ans":"A","expl":"**Giải thích:**\nAccessible form requirements:\n1. **Labels:** Every input needs associated label\n2. **Error messages:** Linked to inputs\n3. **Instructions:** Describe expected format\n\n```html\n\u003C!-- ❌ Inaccessible -->\n\u003Cinput type=\"text\" placeholder=\"Enter name\">\n\u003C!-- Problems: no label, placeholder disappears, not announced -->\n\n\u003C!-- ✅ Accessible -->\n\u003Cdiv class=\"form-group\">\n  \u003Clabel for=\"name\">Full Name\u003C/label>\n  \u003Cinput\n    type=\"text\"\n    id=\"name\"\n    name=\"name\"\n    aria-describedby=\"name-hint name-error\"\n    aria-invalid=\"false\"\n    required\n  >\n  \u003Cspan id=\"name-hint\" class=\"hint\">Enter your first and last name\u003C/span>\n  \u003Cspan id=\"name-error\" class=\"error\" role=\"alert\" hidden>\n    Name is required\n  \u003C/span>\n\u003C/div>\n\n\u003C!-- Error state -->\n\u003Cinput\n  type=\"email\"\n  id=\"email\"\n  aria-invalid=\"true\"\n  aria-describedby=\"email-error\"\n>\n\u003Cspan id=\"email-error\" role=\"alert\">Please enter a valid email address\u003C/span>\n```\n\n---"},{"id":"07-4","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"Heading Hierarchy","prompt":"**Heading structure nào đúng?**\n\n```html\n\u003C!-- A -->\n\u003Ch1>Page Title\u003C/h1>\n\u003Ch3>Section\u003C/h3>\n\u003Ch2>Subsection\u003C/h2>\n\n\u003C!-- B -->\n\u003Ch1>Page Title\u003C/h1>\n\u003Ch2>Section\u003C/h2>\n\u003Ch3>Subsection\u003C/h3>\n```","opts":[{"k":"A","t":"Heading order không quan trọng"},{"k":"B","t":"Structure A đúng"},{"k":"C","t":"Có thể skip heading levels"},{"k":"D","t":"Structure B đúng - headings phải sequential"}],"ans":"D","expl":"**Giải thích:**\nHeading hierarchy rules:\n- Only one `\u003Ch1>` per page\n- Don't skip levels (h1 → h3)\n- Headings create document outline\n\n```html\n\u003C!-- ❌ Incorrect - skipped h2 -->\n\u003Ch1>Page Title\u003C/h1>\n\u003Ch3>Section\u003C/h3>  \u003C!-- Should be h2 -->\n\u003Ch2>Subsection\u003C/h2>  \u003C!-- Should be h3 -->\n\n\u003C!-- ✅ Correct hierarchy -->\n\u003Ch1>Page Title\u003C/h1>\n  \u003Ch2>Section 1\u003C/h2>\n    \u003Ch3>Subsection 1.1\u003C/h3>\n    \u003Ch3>Subsection 1.2\u003C/h3>\n  \u003Ch2>Section 2\u003C/h2>\n    \u003Ch3>Subsection 2.1\u003C/h3>\n      \u003Ch4>Detail 2.1.1\u003C/h4>\n```\n\n**Tham khảo:** [WebAIM - Headings](https://webaim.org/techniques/semanticstructure/)\n\n---"},{"id":"07-5","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"Image Accessibility","prompt":"**Alt text nào phù hợp cho decorative image?**","opts":[{"k":"A","t":"`alt=\"image\"`"},{"k":"B","t":"`alt=\"\"`"},{"k":"C","t":"`alt=\"decorative image\"`"},{"k":"D","t":"Bỏ alt attribute"}],"ans":"B","expl":"**Giải thích:**\nAlt text guidelines:\n- **Informative images:** Describe content\n- **Decorative images:** Empty alt (`alt=\"\"`)\n- **Functional images:** Describe action\n- **Complex images:** Link to long description\n\n```html\n\u003C!-- Informative -->\n\u003Cimg src=\"chart.png\" alt=\"Sales increased 25% in Q4 2024\">\n\n\u003C!-- Decorative - empty alt -->\n\u003Cimg src=\"decorative-border.png\" alt=\"\">\n\n\u003C!-- Functional (image as link) -->\n\u003Ca href=\"/home\">\n  \u003Cimg src=\"logo.png\" alt=\"Company Name - Go to homepage\">\n\u003C/a>\n\n\u003C!-- Complex image -->\n\u003Cfigure>\n  \u003Cimg src=\"complex-chart.png\" alt=\"Q4 sales by region\" aria-describedby=\"chart-desc\">\n  \u003Cfigcaption id=\"chart-desc\">\n    Detailed description of the chart...\n  \u003C/figcaption>\n\u003C/figure>\n\n\u003C!-- ❌ Don't do -->\n\u003Cimg src=\"photo.jpg\" alt=\"image\">  \u003C!-- Meaningless -->\n\u003Cimg src=\"photo.jpg\">  \u003C!-- Missing alt -->\n```\n\n---"},{"id":"07-6","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"Focus Management","prompt":"**Thuộc tính nào giúp custom element focusable?**","opts":[{"k":"A","t":"`focus=\"true\"`"},{"k":"B","t":"`accessible=\"true\"`"},{"k":"C","t":"`tabindex=\"0\"`"},{"k":"D","t":"`focusable=\"true\"`"}],"ans":"C","expl":"**Giải thích:**\ntabindex values:\n- `tabindex=\"0\"`: Add to natural tab order\n- `tabindex=\"-1\"`: Programmatically focusable, not in tab order\n- `tabindex=\"1+\"`: Avoid - changes natural order\n\n```html\n\u003C!-- Make custom element focusable -->\n\u003Cdiv role=\"button\" tabindex=\"0\" onclick=\"handleClick()\">\n  Custom Button\n\u003C/div>\n\n\u003C!-- Skip link (focusable but hidden until focused) -->\n\u003Ca href=\"#main\" class=\"skip-link\">Skip to main content\u003C/a>\n\u003Cstyle>\n.skip-link {\n  position: absolute;\n  left: -9999px;\n}\n.skip-link:focus {\n  left: 0;\n}\n\u003C/style>\n\n\u003C!-- Programmatically focusable (for modals) -->\n\u003Cdiv role=\"dialog\" tabindex=\"-1\" id=\"modal\">\n  Modal content\n\u003C/div>\n\u003Cscript>\n  document.getElementById('modal').focus();\n\u003C/script>\n```\n\n---"},{"id":"07-7","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"Color Contrast","prompt":"**WCAG AA minimum contrast ratio cho normal text là?**","opts":[{"k":"A","t":"3:1"},{"k":"B","t":"7:1"},{"k":"C","t":"2:1"},{"k":"D","t":"4.5:1"}],"ans":"D","expl":"**Giải thích:**\nWCAG contrast requirements:\n- **AA Normal text:** 4.5:1\n- **AA Large text (18pt+):** 3:1\n- **AAA Normal text:** 7:1\n- **AAA Large text:** 4.5:1\n\n```css\n/* ❌ Poor contrast */\n.bad {\n  color: #777;\n  background: #fff;  /* Ratio: 4.48:1 - fails AA */\n}\n\n/* ✅ Good contrast */\n.good {\n  color: #595959;\n  background: #fff;  /* Ratio: 7:1 - passes AAA */\n}\n\n/* Tools to check:\n   - Chrome DevTools\n   - WebAIM Contrast Checker\n   - Lighthouse\n*/\n```\n\n**Tham khảo:** [WebAIM Contrast Checker](https://webaim.org/resources/contrastchecker/)\n\n---"},{"id":"07-8","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"Skip Links","prompt":"**Skip link dùng để làm gì?**","opts":[{"k":"A","t":"Skip CSS animations"},{"k":"B","t":"Skip advertisements"},{"k":"C","t":"Cho phép keyboard users skip navigation đến main content"},{"k":"D","t":"Skip loading images"}],"ans":"C","expl":"**Giải thích:**\nSkip links allow keyboard users to bypass repetitive content:\n\n```html\n\u003Cbody>\n  \u003C!-- Skip link - first focusable element -->\n  \u003Ca href=\"#main-content\" class=\"skip-link\">\n    Skip to main content\n  \u003C/a>\n\n  \u003Cheader>\n    \u003Cnav>\n      \u003C!-- Long navigation menu -->\n    \u003C/nav>\n  \u003C/header>\n\n  \u003Cmain id=\"main-content\" tabindex=\"-1\">\n    \u003C!-- Main content -->\n  \u003C/main>\n\u003C/body>\n\n\u003Cstyle>\n.skip-link {\n  position: absolute;\n  top: -40px;\n  left: 0;\n  padding: 8px;\n  background: #000;\n  color: #fff;\n  z-index: 100;\n}\n\n.skip-link:focus {\n  top: 0;\n}\n\u003C/style>\n```\n\n---"},{"id":"07-9","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"Live Regions","prompt":"**ARIA attribute nào để announce dynamic content changes?**","opts":[{"k":"A","t":"`aria-update=\"auto\"`"},{"k":"B","t":"`aria-dynamic=\"true\"`"},{"k":"C","t":"`aria-live=\"polite\"` hoặc `aria-live=\"assertive\"`"},{"k":"D","t":"`aria-announce=\"true\"`"}],"ans":"C","expl":"**Giải thích:**\nARIA live regions announce dynamic changes:\n\n```html\n\u003C!-- Polite - waits for user to finish -->\n\u003Cdiv aria-live=\"polite\">\n  Search results will appear here\n\u003C/div>\n\n\u003C!-- Assertive - interrupts immediately -->\n\u003Cdiv aria-live=\"assertive\" role=\"alert\">\n  Error: Form submission failed\n\u003C/div>\n\n\u003C!-- Atomic - announces entire region -->\n\u003Cdiv aria-live=\"polite\" aria-atomic=\"true\">\n  \u003Cspan>Items in cart:\u003C/span>\n  \u003Cspan>5\u003C/span>  \u003C!-- Announces \"Items in cart: 5\" -->\n\u003C/div>\n\n\u003C!-- Status messages -->\n\u003Cdiv role=\"status\">\n  Form saved successfully\n\u003C/div>\n\n\u003C!-- Loading indicator -->\n\u003Cdiv aria-busy=\"true\" aria-live=\"polite\">\n  Loading...\n\u003C/div>\n```\n\n---"},{"id":"07-10","topic":"HTML/CSS","group":"SEMANTIC HTML & ACCESSIBILITY","title":"Button vs Link","prompt":"**Khi nào dùng `\u003Cbutton>` vs `\u003Ca>`?**","opts":[{"k":"A","t":"Button cho actions, Link cho navigation"},{"k":"B","t":"Link cho actions, Button cho navigation"},{"k":"C","t":"Chỉ dùng button"},{"k":"D","t":"Không có sự khác biệt"}],"ans":"A","expl":"**Giải thích:**\n```html\n\u003C!-- Button - for actions -->\n\u003Cbutton type=\"button\" onclick=\"submitForm()\">Submit\u003C/button>\n\u003Cbutton type=\"button\" onclick=\"openModal()\">Open Settings\u003C/button>\n\n\u003C!-- Link - for navigation -->\n\u003Ca href=\"/about\">About Us\u003C/a>\n\u003Ca href=\"/products\">View Products\u003C/a>\n\n\u003C!-- ❌ Wrong usage -->\n\u003Ca href=\"#\" onclick=\"submitForm()\">Submit\u003C/a>\n\u003Cdiv onclick=\"goToPage()\">Click here\u003C/div>\n\n\u003C!-- ✅ Button styled as link (if needed) -->\n\u003Cbutton class=\"link-style\" onclick=\"doAction()\">\n  Looks like link, acts like button\n\u003C/button>\n```\n\n**Key differences:**\n- Buttons: trigger actions, no URL change\n- Links: navigate to new page/location\n- Screen readers announce differently\n- Keyboard: Enter for buttons, Enter/Space for links\n\n---"},{"id":"07-11","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"Flexbox Alignment","prompt":"**Cách center cả horizontal và vertical với flexbox?**\n\n```css\n.container {\n  display: flex;\n  /* A */\n  justify-content: center;\n  align-items: center;\n\n  /* B */\n  justify-items: center;\n  align-content: center;\n}\n```","opts":[{"k":"A","t":"Option A"},{"k":"B","t":"Option B"},{"k":"C","t":"Cả A và B đều đúng"},{"k":"D","t":"Không có option nào đúng"}],"ans":"A","expl":"**Giải thích:**\n```css\n/* Flexbox centering */\n.container {\n  display: flex;\n  justify-content: center;  /* Main axis (horizontal by default) */\n  align-items: center;      /* Cross axis (vertical by default) */\n}\n\n/* Grid centering */\n.container-grid {\n  display: grid;\n  place-items: center;  /* Shorthand for align-items + justify-items */\n}\n\n/* Note: justify-items doesn't exist in Flexbox */\n```\n\n**Alignment properties:**\n\n| Property | Flexbox | Grid |\n|----------|---------|------|\n| justify-content | Main axis | Inline axis |\n| align-items | Cross axis | Block axis |\n| align-content | Multi-line cross axis | Block axis tracks |\n| justify-items | ❌ Not available | Inline axis items |\n\n---"},{"id":"07-12","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"flex Property","prompt":"**`flex: 1 0 auto` có nghĩa là gì?**","opts":[{"k":"A","t":"`flex-grow: auto`, `flex-shrink: 1`, `flex-basis: 0`"},{"k":"B","t":"`flex-grow: 1`, `flex-shrink: 0`, `flex-basis: auto`"},{"k":"C","t":"`flex-grow: 0`, `flex-shrink: 1`, `flex-basis: auto`"},{"k":"D","t":"Error"}],"ans":"B","expl":"**Giải thích:**\n```css\n/* flex: grow shrink basis */\nflex: 1 0 auto;\n/* flex-grow: 1   - Item can grow */\n/* flex-shrink: 0 - Item won't shrink */\n/* flex-basis: auto - Use content/width as base */\n\n/* Common patterns */\nflex: 1;        /* flex: 1 1 0% - Equal width flex items */\nflex: auto;     /* flex: 1 1 auto - Grow/shrink based on content */\nflex: none;     /* flex: 0 0 auto - Fixed size */\nflex: 0 1 auto; /* Default - can shrink, won't grow */\n\n/* Use case: Flexible center column */\n.sidebar { flex: 0 0 200px; }  /* Fixed 200px */\n.main { flex: 1 1 0; }         /* Takes remaining space */\n```\n\n---"},{"id":"07-13","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"Grid Template","prompt":"**Code nào tạo 3-column grid với column giữa flexible?**\n\n```css\n/* A */\n.grid {\n  display: grid;\n  grid-template-columns
