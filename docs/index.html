const viewList = () => {
  const w = el('div');
  const query = state.query.trim().toLowerCase();

  let pool = state.section
    ? SECTIONS.find(({ title }) => title === state.section)?.questions ?? []
    : QUESTIONS;
  if (state.filter !== 'all') pool = pool.filter(({ id }) => statOf(id) === state.filter);
  if (query) pool = pool.filter(({ id, title, section }) => `${id} ${title} ${section}`.toLowerCase().includes(query));

  w.appendChild(el('div', 'qhead',
    `<h2>${esc(state.section ? shortSec(state.section) : 'Toàn bộ câu hỏi')}</h2><span class="meta">${pool.length} câu</span>`));

  const filters = el('div', 'filters');
  for (const [value, label] of [['all', 'Tất cả'], ['none', 'Chưa rà'], ['vague', 'Mơ hồ'], ['known', 'Biết rõ']]) {
    const chip = el('button', 'chip', label);
    chip.setAttribute('aria-pressed', state.filter === value);
    chip.onclick = () => { state.filter = value; draw(); };
    filters.appendChild(chip);
  }
  w.appendChild(filters);

  if (!pool.length) {
    w.appendChild(el('div', 'empty', 'Không có câu nào khớp. Thử bỏ bớt bộ lọc.'));
    return w;
  }

  const list = el('div', 'qlist');
  const grouped = !state.section && !query && state.filter === 'all';
  if (grouped) {
    for (const { title, questions } of SECTIONS) {
      list.appendChild(el('h3', 'blk', esc(shortSec(title))));
      for (const q of questions) list.appendChild(qrow(q));
    }
  } else {
    for (const q of pool) list.appendChild(qrow(q));
  }
  w.appendChild(list);
  return w;
};

const viewQuiz = () => {
  if (state.quiz) return state.quiz.i >= state.quiz.ids.length ? viewQuizDone() : viewQuizRun();

  const w = el('div');
  const done = qzDone();
  const right = qzRight();

  w.appendChild(el('div', 'qhead', `<h2>Trắc nghiệm</h2><span class="meta">${QUIZ.length} câu · ${QUIZ_TOPICS.length} chủ đề</span>`));

    <div class="card a"><div class="lbl">Đã làm</div><div class="val">${done}<small>/${QUIZ.length}</small></div></div>
    <div class="card k"><div class="lbl">Đúng</div><div class="val">${right}</div></div>
    <div class="card v"><div class="lbl">Sai</div><div class="val">${done - right}</div><div class="note">nên làm lại</div></div>
    <div class="card"><div class="lbl">Tỉ lệ đúng</div><div class="val">${pct(right, done)}<small>%</small></div></div>`));

  w.appendChild(el('h3', 'blk', 'Chọn bộ câu'));
  const picks = [
    { key: 'all', label: 'Tất cả chủ đề', ids: QUIZ.map(({ id }) => id) },
    ...(qzWrongIds().length ? [{ key: 'wrong', label: 'Câu đã làm sai', ids: qzWrongIds() }] : []),
    ...(qzNewIds().length ? [{ key: 'new', label: 'Câu chưa làm', ids: qzNewIds() }] : []),
    ...QUIZ_TOPICS.map(topic => ({ key: topic, label: topic, ids: QUIZ.filter(q => q.topic === topic).map(({ id }) => id) })),
  ];

  const setup = el('div', 'setup');
  for (const { key, label, ids } of picks) {
    const tried = ids.filter(id => qzRes(id)).length;
    const correct = ids.filter(id => qzRes(id)?.ok).length;
    const card = el('button', 'tcard', `
      <div class="t">${esc(label)}</div>
      <div class="s">${ids.length} câu · đã làm ${tried}${tried ? ` · đúng ${pct(correct, tried)}%` : ''}</div>
      <div class="tr"><i style="width:${width(correct, ids.length)};background:var(--known)"></i><i style="width:${width(tried - correct, ids.length)};background:var(--poor)"></i></div>`);
    card.setAttribute('aria-pressed', state.quizPick === key);
    card.onclick = () => {
      state.quizPick = key;
      LS.set('quizPick', key);
      draw();
    };
    setup.appendChild(card);
  }
  w.appendChild(setup);

  const pool = qzPool();
  w.appendChild(el('h3', 'blk', 'Số câu mỗi lượt'));
  const lens = el('div', 'filters');
  for (const [len, label] of [[10, '10 câu'], [20, '20 câu'], [0, `Tất cả ${pool.length} câu`]]) {
    if (len && len >= pool.length) continue;
    const chip = el('button', 'chip', label);
    chip.onclick = () => startQuiz(pool, len);
    lens.appendChild(chip);
  }
  if (!pool.length) lens.appendChild(el('div', 'empty', 'Bộ này đang trống.'));
  w.appendChild(lens);
  return w;
};

const viewQuizRun = () => {
  const { ids, i, picked, right } = state.quiz;
  const q = QUIZ_BY_ID.get(ids[i]);
  const w = el('div', 'qz');

  w.appendChild(el('div', 'qzmeta', `
    <span class="step">${i + 1} / ${ids.length}</span>
    <span class="track"><i style="width:${width(i, ids.length)}"></i></span>
    <span class="score">đúng ${right}</span>`));
  w.appendChild(el('div', 'qztopic', `${esc(q.topic)} · ${esc(q.group)}`));
  w.appendChild(el('h2', 'qztitle', esc(q.title)));
  w.appendChild(render(q.prompt));

  const box = el('div', 'opts');
  for (const { k, t } of q.opts) {
    const btn = el('button', 'opt');
    btn.appendChild(el('span', 'k', `${k})`));
    const body = el('span', 't');
    body.appendChild(render(t));
    btn.appendChild(body);

    if (picked) {
      btn.disabled = true;
      if (k === q.ans) {
        btn.dataset.r = 'right';
        btn.appendChild(el('span', 'mark', 'đúng'));
      } else if (k === picked) {
        btn.dataset.r = 'wrong';
        btn.appendChild(el('span', 'mark', 'đã chọn'));
      }
    } else {
      btn.onclick = () => pickAnswer(k);
    }
    box.appendChild(btn);
  }
  w.appendChild(box);
  if (!picked) return w;

  const ok = picked === q.ans;
  const verdict = el('div', 'verdict', ok ? 'Đúng' : `Chưa đúng — đáp án là ${q.ans}`);
  verdict.dataset.r = ok ? 'right' : 'wrong';
  w.appendChild(verdict);
  w.appendChild(el('div', 'expl')).appendChild(render(q.expl));

  const actions = el('div', 'qzactions');
  const next = el('button', 'btn', i + 1 >= ids.length ? 'Xem kết quả' : 'Câu tiếp →');
  next.onclick = nextQuestion;
  const stop = el('button', 'btn ghost', 'Dừng lượt này');
  stop.onclick = () => { state.quiz = null; draw(); };
  actions.append(next, stop);
  w.appendChild(actions);
  return w;
};

const verdictLine = score =>
  score >= 80 ? 'Mảng này nắm chắc rồi, chuyển sang chủ đề khác được.'
  : score >= 50 ? 'Ổn, nhưng còn chỗ hổng. Làm lại những câu sai bên dưới.'
  : 'Nên đọc lại lý thuyết của chủ đề này trước khi làm tiếp.';

const viewQuizDone = () => {
  const { ids, right } = state.quiz;
  const score = pct(right, ids.length);
  const wrong = ids.filter(id => state.quizRes[id] && !state.quizRes[id].ok);
  const w = el('div', 'qz');

  w.appendChild(el('div', 'hero', `
    <div class="eyebrow">Kết quả lượt này</div>
    <h2>${right} trên ${ids.length} câu · ${score}%</h2>
    <p>${verdictLine(score)}</p>`));

  if (wrong.length) {
    w.appendChild(el('h3', 'blk', 'Những câu làm sai'));
    const list = el('div', 'qlist');
    for (const id of wrong) {
      const q = QUIZ_BY_ID.get(id);
      const btn = el('button', 'qrow', `
        <span class="id">${esc(q.topic.slice(0, 4))}</span>
        <span class="ttl">${esc(q.title)}</span>
        <span class="tags"><span class="hasnote">chọn ${state.quizRes[id].picked} · đúng ${q.ans}</span></span>`);
      btn.dataset.st = 'vague';
      btn.onclick = () => startQuiz([id]);
      list.appendChild(btn);
    }
    w.appendChild(list);
  }

  const actions = el('div', 'qzactions');
  if (wrong.length) {
    const again = el('button', 'btn', `Làm lại ${wrong.length} câu sai`);
    again.onclick = () => startQuiz(wrong);
    actions.appendChild(again);
  }
  const back = el('button', 'btn ghost', 'Chọn bộ khác');
  back.onclick = () => { state.quiz = null; draw(); };
  actions.appendChild(back);
  w.appendChild(actions);
  return w;
};

/* ===================== sao lưu ===================== */
const BACKUP_FORMAT = 'on-luyen-frontend';

const toast = msg => {
  for (const old of document.querySelectorAll('.toast')) old.remove();
  const node = el('div', 'toast', esc(msg));
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 3200);
};

const backupPayload = () => ({
  format: BACKUP_FORMAT,
  version: 1,
  exportedAt: new Date().toISOString(),
  status: state.status,
  notes: state.notes,
  quiz: state.quizRes,
  route: state.route,
});

const mergeBackup = data => {
  if (data?.format !== BACKUP_FORMAT) return 0;
  const { notes = {}, status = {}, quiz = {}, route } = data;
  const changed = Object.entries(notes).filter(([id, text]) => text !== state.notes[id]).length;
  Object.assign(state.notes, notes);
  Object.assign(state.status, status);
  Object.assign(state.quizRes, quiz);
  if (route) state.route = route;
  saveNotes();
  saveProgress();
  saveQuiz();
  return changed;
};


const exportData = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(backupPayload(), null, 2)], { type: 'application/json' }));
  const link = el('a');
  link.href = url;
  link.download = `${BACKUP_FORMAT}-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Đã xuất ${noteCount()} ghi chú và ${qzDone()} kết quả trắc nghiệm`);
};

const importData = file => {
  const reader = new FileReader();
  reader.onerror = () => toast('Không đọc được file');
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch {
      toast('File không đọc được — cần đúng file JSON đã xuất từ trang này');
      return;
    }
    if (data?.format !== BACKUP_FORMAT) {
      toast('File không đúng định dạng của trang này');
      return;
    }
    const added = mergeBackup(data);
    draw();
    toast(`Đã nhập xong — ${added} ghi chú được cập nhật`);
  };
  reader.readAsText(file);
};

/* ===================== nối thẳng với file trong repo ===================== */
/*
 * File System Access API cho phép trang ghi thẳng vào một file người dùng đã
 * chọn. Chọn một lần, quyền và "tay cầm" file được cất trong IndexedDB nên lần
 * mở sau vẫn còn — chỉ cần bấm cho phép lại. Firefox và Safari chưa có API này,
 * ở đó trang tự rơi về nút xuất/nhập thủ công.
 */
const FS_OK = typeof window.showSaveFilePicker === 'function';
const IDB_KEY = 'repoFile';

const idb = {
  open: () => new Promise((resolve, reject) => {
    const req = indexedDB.open('fe-onluyen', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }),
  run: async (mode, fn) => {
    const db = await idb.open();
    return new Promise((resolve, reject) => {
      const req = fn(db.transaction('kv', mode).objectStore('kv'));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  get: key => idb.run('readonly', store => store.get(key)),
  set: (key, value) => idb.run('readwrite', store => store.put(value, key)),
  del: key => idb.run('readwrite', store => store.delete(key)),
};

const link = { handle: null, name: '', ready: false };

let linkTimer = null;
let linkWriting = false;

const writeLinked = async () => {
  if (!link.ready || linkWriting) return;
  linkWriting = true;
  try {
    const stream = await link.handle.createWritable();
    await stream.write(JSON.stringify(backupPayload(), null, 2));
    await stream.close();
  } catch {
    link.ready = false;
    drawLinkState();
    toast(`Mất quyền ghi vào ${link.name} — bấm nối lại`);
  } finally {
    linkWriting = false;
  }
};

const queueLinkedWrite = () => {
  if (!link.ready) return;
  clearTimeout(linkTimer);
  linkTimer = setTimeout(writeLinked, 1200);
};

const drawLinkState = () => {
  const btn = document.getElementById('link');
  if (!btn) return;
  btn.hidden = !FS_OK;
  btn.dataset.on = link.ready ? '1' : '0';
  btn.title = link.ready
    ? `Đang ghi thẳng vào ${link.name}`
    : link.handle
      ? `Bấm để cấp quyền ghi lại vào ${link.name}`
      : 'Nối với một file trong repo để ghi chú tự lưu vào đó';
  const box = document.getElementById('linkline');
  if (box) box.replaceChildren(...linkLineParts());
};

const pickRepoFile = async () => {
  try {
    link.handle = await window.showSaveFilePicker({
      suggestedName: 'ghi-chu.json',
      types: [{ description: 'Ghi chú ôn luyện', accept: { 'application/json': ['.json'] } }],
    });
    link.name = link.handle.name;
    link.ready = true;
    await idb.set(IDB_KEY, link.handle);

    // file đã có sẵn nội dung (ví dụ vừa pull từ git) thì nạp vào trước
    const file = await link.handle.getFile();
    if (file.size) {
      try {
        const merged = mergeBackup(JSON.parse(await file.text()));
        if (merged) toast(`Đã nạp ${merged} ghi chú từ ${link.name}`);
      } catch {
        /* file rỗng hoặc không đúng định dạng: cứ ghi đè bằng dữ liệu hiện tại */
      }
    }
    await writeLinked();
    draw();
    toast(`Ghi chú giờ tự lưu vào ${link.name}`);
  } catch {
    /* người dùng bấm huỷ hộp thoại */
  }
};

const relink = async () => {
  try {
    const granted = await link.handle.requestPermission({ mode: 'readwrite' });
    if (granted !== 'granted') return toast('Chưa được cấp quyền ghi vào file');
    link.ready = true;
    const file = await link.handle.getFile();
    if (file.size) {
      try {
        const merged = mergeBackup(JSON.parse(await file.text()));
        if (merged) toast(`Đã nạp ${merged} ghi chú từ ${link.name}`);
      } catch {
        /* bỏ qua nội dung hỏng */
      }
    }
    draw();
    drawLinkState();
  } catch {
    toast('Không nối lại được, thử chọn lại file');
  }
};

const onLinkButton = () => (link.handle && !link.ready ? relink() : pickRepoFile());

const unlinkFile = async () => {
  link.handle = null;
  link.name = '';
  link.ready = false;
  try { await idb.del(IDB_KEY); } catch { /* không sao */ }
  draw();
  toast('Đã ngắt nối, ghi chú quay về lưu trong trình duyệt');
};

const linkLineParts = () => {
  const parts = [];
  const text = document.createElement('span');
  if (!FS_OK) {
    text.innerHTML = '<b>Ghi chú chỉ nằm trong trình duyệt này.</b> Trình duyệt của anh chưa hỗ trợ ghi thẳng vào file, '
      + 'nên thỉnh thoảng bấm nút xuất ở góc phải trên rồi cất file JSON vào repo. ';
    parts.push(text);
    const btn = el('button', '', 'Xuất ngay');
    btn.onclick = exportData;
    parts.push(btn);
    return parts;
  }
  if (link.ready) {
    text.innerHTML = `<b>Đang tự ghi vào ${esc(link.name)}.</b> Mỗi lần anh sửa ghi chú là file được cập nhật. `
      + 'Nhớ <code>git add notes/ &amp;&amp; git commit</code> để giữ lại. ';
    parts.push(text);
    const btn = el('button', '', 'Ngắt nối');
    btn.onclick = unlinkFile;
    parts.push(btn);
    return parts;
  }
  if (link.handle) {
    text.innerHTML = `<b>Đã nối với ${esc(link.name)} nhưng chưa được cấp quyền ghi.</b> `
      + 'Trình duyệt hỏi lại quyền sau mỗi lần mở trang. ';
    parts.push(text);
    const btn = el('button', '', 'Cấp quyền lại');
    btn.onclick = relink;
    parts.push(btn);
    return parts;
  }
  text.innerHTML = '<b>Ghi chú đang chỉ nằm trong trình duyệt này.</b> Nối với một file trong repo '
    + 'thì mỗi lần gõ là tự ghi vào đó, chỉ còn việc commit. ';
  parts.push(text);
  const btn = el('button', '', 'Nối với file trong repo');
  btn.onclick = pickRepoFile;
  parts.push(btn);
  return parts;
};

const restoreLink = async () => {
  if (!FS_OK) return drawLinkState();
  try {
    const handle = await idb.get(IDB_KEY);
    if (!handle) return drawLinkState();
    link.handle = handle;
    link.name = handle.name;
    link.ready = (await handle.queryPermission({ mode: 'readwrite' })) === 'granted';
    if (link.ready) {
      const file = await handle.getFile();
      if (file.size) {
        try { mergeBackup(JSON.parse(await file.text())); } catch { /* bỏ qua */ }
      }
    }
    draw();
    drawLinkState();
  } catch {
    drawLinkState();
  }
};

/* ===================== giao diện chung ===================== */
const THEMES = ['system', 'dark', 'light'];

const applyTheme = theme => {
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  LS.set('theme', theme);
};
applyTheme(LS.get('theme', 'system'));

document.getElementById('theme').onclick = () => {
  const current = LS.get('theme', 'system');
  applyTheme(THEMES[(THEMES.indexOf(current) + 1) % THEMES.length]);
};

document.getElementById('link').onclick = onLinkButton;
document.getElementById('export').onclick = exportData;
document.getElementById('import').onclick = () => document.getElementById('importfile').click();
document.getElementById('importfile').onchange = ({ target }) => {
  const [file] = target.files ?? [];
  if (file) importData(file);
  target.value = '';
};

const rail = document.getElementById('rail');
let scrim = null;

const closeRail = () => {
  rail.dataset.open = '0';
  scrim?.remove();
  scrim = null;
};

document.getElementById('railtoggle').onclick = () => {
  if (rail.dataset.open === '1') return closeRail();
  rail.dataset.open = '1';
  scrim = el('div', 'scrim');
  scrim.onclick = closeRail;
  document.body.appendChild(scrim);
};

const searchBox = document.getElementById('q');
let searchTimer = null;
searchBox.oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = searchBox.value;
    if (state.query && (state.mode !== 'giaoan' || state.question)) {
      Object.assign(state, { mode: 'giaoan', question: null, section: null, docsec: null, filter: 'all' });
    }
    draw();
  }, 140);
};

const NUMBER_KEYS = { 1: 'A', 2: 'B', 3: 'C', 4: 'D' };

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);

  if (e.key === '/' && !typing) {
    e.preventDefault();
    searchBox.focus();
    searchBox.select();
    return;
  }
  if (e.key === 'Escape') {
    if (document.activeElement === searchBox) searchBox.blur();
    closeRail();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;

  const { quiz } = state;
  if (state.mode === 'quiz' && quiz && quiz.i < quiz.ids.length) {
    if (!quiz.picked) {
      const key = NUMBER_KEYS[e.key] ?? (/^[a-d]$/i.test(e.key) ? e.key.toUpperCase() : null);
      if (key && QUIZ_BY_ID.get(quiz.ids[quiz.i]).opts.some(o => o.k === key)) {
        e.preventDefault();
        pickAnswer(key);
        return;
      }
    } else if (e.key === 'Enter' || e.key === 'n') {
      e.preventDefault();
      nextQuestion();
      return;
    }
  }

  if (state.question && (e.key === 'j' || e.key === 'k')) {
    const idx = QUESTIONS.findIndex(({ id }) => id === state.question);
    const target = QUESTIONS[e.key === 'j' ? idx + 1 : idx - 1];
    if (target) go({ question: target.id });
  }
});

draw();
drawLinkState();
restoreLink();
</script>
