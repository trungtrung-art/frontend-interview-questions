: 200px 1fr 200px;\n}\n\n/* B */\n.grid {\n  display: grid;\n  grid-template-columns: 200px auto 200px;\n}\n```","opts":[{"k":"A","t":"Chỉ A đúng"},{"k":"B","t":"Chỉ B đúng"},{"k":"C","t":"Cả A và B đều đúng nhưng behavior khác nhau"},{"k":"D","t":"Cả A và B giống nhau"}],"ans":"C","expl":"**Giải thích:**\n```css\n/* Both create 3 columns with flexible middle */\n\n/* A: 1fr - takes available space */\n.grid-a {\n  display: grid;\n  grid-template-columns: 200px 1fr 200px;\n}\n/* Middle column fills remaining space,\n   will never be smaller than content */\n\n/* B: auto - based on content */\n.grid-b {\n  display: grid;\n  grid-template-columns: 200px auto 200px;\n}\n/* Middle column sizes to content,\n   may collapse if empty */\n\n/* Difference shows with small containers:\n   - 1fr: distributes space proportionally\n   - auto: content-based, can be 0 */\n```\n\n---"},{"id":"07-14","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"Grid Area","prompt":"**Cách định nghĩa và sử dụng grid-area?**\n\n```css\n.container {\n  display: grid;\n  grid-template-areas:\n    \"header header\"\n    \"sidebar main\"\n    \"footer footer\";\n}\n\n.header { grid-area: ???; }\n```","opts":[{"k":"A","t":"`grid-area: \"header\";`"},{"k":"B","t":"`grid-area: header;`"},{"k":"C","t":"`grid-area: 1 / 1 / 2 / 3;`"},{"k":"D","t":"B và C đều đúng"}],"ans":"D","expl":"**Giải thích:**\n```css\n.container {\n  display: grid;\n  grid-template-areas:\n    \"header header\"\n    \"sidebar main\"\n    \"footer footer\";\n  grid-template-columns: 200px 1fr;\n  grid-template-rows: auto 1fr auto;\n}\n\n/* Using named area */\n.header { grid-area: header; }\n.sidebar { grid-area: sidebar; }\n.main { grid-area: main; }\n.footer { grid-area: footer; }\n\n/* Using line numbers (row-start / col-start / row-end / col-end) */\n.header { grid-area: 1 / 1 / 2 / 3; }\n\n/* Note: Named areas don't use quotes in grid-area */\n/* grid-area: \"header\"; ❌ Wrong */\n/* grid-area: header;   ✅ Correct */\n```\n\n---"},{"id":"07-15","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"Flexbox vs Grid","prompt":"**Khi nào nên dùng Grid thay vì Flexbox?**","opts":[{"k":"A","t":"Grid cho 2D layout, Flexbox cho 1D layout"},{"k":"B","t":"Luôn dùng Grid"},{"k":"C","t":"Grid cho navigation, Flexbox cho page layout"},{"k":"D","t":"Không có sự khác biệt"}],"ans":"A","expl":"**Giải thích:**\n```css\n/* Flexbox: 1D layout (row OR column) */\n.navbar {\n  display: flex;\n  justify-content: space-between;\n}\n\n/* Grid: 2D layout (rows AND columns) */\n.page-layout {\n  display: grid;\n  grid-template-columns: 200px 1fr;\n  grid-template-rows: auto 1fr auto;\n}\n\n/* Use Flexbox when:\n   - Single row/column of items\n   - Content determines size\n   - Unknown number of items */\n\n/* Use Grid when:\n   - 2D layout needed\n   - Precise placement required\n   - Layout defines content placement */\n```\n\n---"},{"id":"07-16","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"gap Property","prompt":"**`gap` property hoạt động với gì?**","opts":[{"k":"A","t":"Cả Grid và Flexbox"},{"k":"B","t":"Chỉ inline elements"},{"k":"C","t":"Chỉ Grid"},{"k":"D","t":"Chỉ Flexbox"}],"ans":"A","expl":"**Giải thích:**\n```css\n/* gap works with both Grid and Flexbox */\n\n/* Grid */\n.grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 20px;              /* row-gap and column-gap */\n  row-gap: 20px;          /* vertical gap */\n  column-gap: 10px;       /* horizontal gap */\n}\n\n/* Flexbox */\n.flex {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 20px;              /* Works in modern browsers */\n}\n\n/* Before gap support in Flexbox */\n.flex-old > * {\n  margin: 10px;\n}\n.flex-old {\n  margin: -10px;\n}\n```\n\n---"},{"id":"07-17","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"auto-fill vs auto-fit","prompt":"**Sự khác biệt giữa `auto-fill` và `auto-fit`?**\n\n```css\n/* A */\ngrid-template-columns: repeat(auto-fill, minmax(200px, 1fr));\n\n/* B */\ngrid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n```","opts":[{"k":"A","t":"`auto-fill` giữ empty tracks, `auto-fit` collapse empty tracks"},{"k":"B","t":"`auto-fill` chỉ hoạt động với fixed sizes"},{"k":"C","t":"Không có sự khác biệt"},{"k":"D","t":"`auto-fit` giữ empty tracks, `auto-fill` collapse empty tracks"}],"ans":"A","expl":"**Giải thích:**\n```css\n/* auto-fill: Creates tracks even if empty */\n.grid-fill {\n  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));\n}\n/* With 3 items and 800px container:\n   Creates 4 tracks, last one empty but exists */\n\n/* auto-fit: Collapses empty tracks */\n.grid-fit {\n  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n}\n/* With 3 items and 800px container:\n   Creates 3 tracks, items expand to fill space */\n\n/* Visible difference: when few items in wide container\n   auto-fill: items stay at minmax size\n   auto-fit: items stretch to fill container */\n```\n\n---"},{"id":"07-18","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"Order Property","prompt":"**Flexbox `order` property ảnh hưởng gì?**","opts":[{"k":"A","t":"DOM order"},{"k":"B","t":"Visual order only"},{"k":"C","t":"Tab order"},{"k":"D","t":"B và C"}],"ans":"B","expl":"**Giải thích:**\n```css\n/* order changes visual order, NOT DOM or tab order */\n.item-1 { order: 3; }\n.item-2 { order: 1; }\n.item-3 { order: 2; }\n\n/* Visual: item-2, item-3, item-1 */\n/* Tab order: item-1, item-2, item-3 (unchanged) */\n\n/* ⚠️ Accessibility issue:\n   Screen readers and keyboard navigation follow DOM order\n   Visual order mismatch causes confusion */\n\n/* Better approach: Change HTML order if possible */\n```\n\n---"},{"id":"07-19","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"align-self","prompt":"**`align-self` override property nào?**","opts":[{"k":"A","t":"`align-items`"},{"k":"B","t":"`align-content`"},{"k":"C","t":"`justify-items`"},{"k":"D","t":"`justify-content`"}],"ans":"A","expl":"**Giải thích:**\n```css\n.container {\n  display: flex;\n  align-items: center;  /* All items centered on cross axis */\n}\n\n.special-item {\n  align-self: flex-end;  /* Override for this item only */\n}\n\n/* Grid equivalent */\n.grid {\n  display: grid;\n  align-items: center;\n}\n\n.grid-item {\n  align-self: start;\n  justify-self: end;  /* Grid also has justify-self */\n}\n```\n\n---"},{"id":"07-20","topic":"HTML/CSS","group":"CSS LAYOUT (FLEXBOX & GRID)","title":"Subgrid","prompt":"**CSS Subgrid cho phép làm gì?**","opts":[{"k":"A","t":"Animate grid items"},{"k":"B","t":"Nested grid với independent tracks"},{"k":"C","t":"Create circular grids"},{"k":"D","t":"Child grid inherit track sizes từ parent grid"}],"ans":"D","expl":"**Giải thích:**\n```css\n/* Parent grid */\n.parent {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 20px;\n}\n\n/* Child grid inherits parent tracks */\n.child {\n  display: grid;\n  grid-template-columns: subgrid;  /* Uses parent's column tracks */\n  grid-column: span 2;\n}\n\n/* Use case: Card layouts where content aligns across cards */\n.cards {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n}\n\n.card {\n  display: grid;\n  grid-template-rows: subgrid;\n  grid-row: span 3;  /* Header, content, footer aligned across cards */\n}\n```\n\n**Tham khảo:** [MDN - Subgrid](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Grid_Layout/Subgrid)\n\n---"},{"id":"07-21","topic":"HTML/CSS","group":"CSS ARCHITECTURE","title":"CSS Specificity","prompt":"**Specificity cao nhất đến thấp nhất?**\n\n```css\n/* A */ #id { }\n/* B */ .class { }\n/* C */ element { }\n/* D */ !important\n```","opts":[{"k":"A","t":"A > B > C > D"},{"k":"B","t":"D > A > B > C"},{"k":"C","t":"D > B > A > C"},{"k":"D","t":"A > D > B > C"}],"ans":"B","expl":"**Giải thích:**\nSpecificity hierarchy (highest to lowest):\n1. `!important` (avoid using)\n2. Inline styles (`style=\"\"`)\n3. ID selectors (`#id`)\n4. Class, attribute, pseudo-class (`.class`, `[attr]`, `:hover`)\n5. Element, pseudo-element (`div`, `::before`)\n\n```css\n/* Specificity calculation: (ID, Class, Element) */\n\np { }                    /* (0,0,1) */\n.class { }               /* (0,1,0) */\n#id { }                  /* (1,0,0) */\np.class { }              /* (0,1,1) */\n#id .class p { }         /* (1,1,1) */\n\n/* !important overrides everything */\np { color: red !important; }  /* Wins over #id */\n\n/* Specificity battles */\n.button { color: blue; }        /* (0,1,0) */\ndiv.button { color: red; }      /* (0,1,1) - Wins */\n#submit { color: green; }       /* (1,0,0) - Wins over both */\n```\n\n---"},{"id":"07-22","topic":"HTML/CSS","group":"CSS ARCHITECTURE","title":"BEM Naming","prompt":"**BEM class name đúng?**","opts":[{"k":"A","t":"`.cardHeaderLarge`"},{"k":"B","t":"`.card-header-large`"},{"k":"C","t":"`.card_header_large`"},{"k":"D","t":"`.card__header--large`"}],"ans":"D","expl":"**Giải thích:**\nBEM (Block Element Modifier):\n```css\n/* Block */\n.card { }\n\n/* Element (part of block) */\n.card__header { }\n.card__body { }\n.card__footer { }\n\n/* Modifier (variation) */\n.card--featured { }\n.card__header--large { }\n\n/* Full example */\n.card { }\n.card--featured { }\n.card__header { }\n.card__header--large { }\n.card__title { }\n.card__body { }\n.card__button { }\n.card__button--primary { }\n```\n\n```html\n\u003Carticle class=\"card card--featured\">\n  \u003Cheader class=\"card__header card__header--large\">\n    \u003Ch2 class=\"card__title\">Title\u003C/h2>\n  \u003C/header>\n  \u003Cdiv class=\"card__body\">Content\u003C/div>\n  \u003Cbutton class=\"card__button card__button--primary\">Action\u003C/button>\n\u003C/article>\n```\n\n---"},{"id":"07-23","topic":"HTML/CSS","group":"CSS ARCHITECTURE","title":"CSS-in-JS","prompt":"**Ưu điểm của CSS-in-JS?**","opts":[{"k":"A","t":"Scoped styles, dynamic styling, co-location với components"},{"k":"B","t":"Better browser support"},{"k":"C","t":"Faster runtime performance"},{"k":"D","t":"Smaller bundle size"}],"ans":"A","expl":"**Giải thích:**\nCSS-in-JS benefits:\n- **Scoped styles:** No global conflicts\n- **Dynamic styling:** Based on props/state\n- **Co-location:** Styles with component\n- **Dead code elimination:** Unused styles removed\n\n```jsx\n// styled-components example\nconst Button = styled.button`\n  background: ${props => props.primary ? 'blue' : 'white'};\n  color: ${props => props.primary ? 'white' : 'blue'};\n  padding: 10px 20px;\n  border: 2px solid blue;\n\n  &:hover {\n    opacity: 0.8;\n  }\n`;\n\n// Usage\n\u003CButton primary>Primary\u003C/Button>\n\u003CButton>Secondary\u003C/Button>\n```\n\n**Trade-offs:**\n- Runtime cost\n- Larger bundle\n- Learning curve\n\n---"},{"id":"07-24","topic":"HTML/CSS","group":"CSS ARCHITECTURE","title":"CSS Modules","prompt":"**CSS Modules giải quyết vấn đề gì?**","opts":[{"k":"A","t":"Class name collisions (scoped locally by default)"},{"k":"B","t":"Performance"},{"k":"C","t":"Browser compatibility"},{"k":"D","t":"Animation"}],"ans":"A","expl":"**Giải thích:**\nCSS Modules scope class names locally:\n\n```css\n/* Button.module.css */\n.button {\n  padding: 10px;\n}\n\n.primary {\n  background: blue;\n}\n```\n\n```jsx\nimport styles from './Button.module.css';\n\nfunction Button({ primary }) {\n  return (\n    \u003Cbutton className={`${styles.button} ${primary ? styles.primary : ''}`}>\n      Click me\n    \u003C/button>\n  );\n}\n\n// Output: \u003Cbutton class=\"Button_button__x7f2s Button_primary__k9d3j\">\n```\n\n---"},{"id":"07-25","topic":"HTML/CSS","group":"CSS ARCHITECTURE","title":"Critical CSS","prompt":"**Critical CSS là gì?**","opts":[{"k":"A","t":"Inline CSS cho above-the-fold content để improve FCP"},{"k":"B","t":"CSS cho important elements"},{"k":"C","t":"CSS cho error messages"},{"k":"D","t":"Minified CSS"}],"ans":"A","expl":"**Giải thích:**\nCritical CSS improves FCP:\n\n```html\n\u003Chead>\n  \u003C!-- Critical CSS inlined -->\n  \u003Cstyle>\n    /* Above-the-fold styles */\n    header { background: #fff; }\n    .hero { min-height: 100vh; }\n  \u003C/style>\n\n  \u003C!-- Non-critical CSS loaded async -->\n  \u003Clink rel=\"preload\" href=\"styles.css\" as=\"style\" onload=\"this.onload=null;this.rel='stylesheet'\">\n  \u003Cnoscript>\u003Clink rel=\"stylesheet\" href=\"styles.css\">\u003C/noscript>\n\u003C/head>\n```\n\n**Tools:**\n- Critical (npm package)\n- Critters (webpack plugin)\n- PurgeCSS\n\n---"},{"id":"07-26","topic":"HTML/CSS","group":"MODERN CSS FEATURES","title":"CSS Variables","prompt":"**Cách define và use CSS custom property?**\n\n```css\n/* Define */\n:root {\n  ???\n}\n\n/* Use */\n.element {\n  color: ???;\n}\n```","opts":[{"k":"A","t":"`--primary: blue;` và `color: var(--primary);`"},{"k":"B","t":"`primary: blue;` và `color: primary;`"},{"k":"C","t":"`$primary: blue;` và `color: $primary;`"},{"k":"D","t":"`@primary: blue;` và `color: @primary;`"}],"ans":"A","expl":"**Giải thích:**\n```css\n/* Define custom properties */\n:root {\n  --primary-color: #007bff;\n  --spacing-unit: 8px;\n  --font-size-base: 16px;\n}\n\n/* Use custom properties */\n.button {\n  background: var(--primary-color);\n  padding: var(--spacing-unit);\n  font-size: var(--font-size-base);\n}\n\n/* With fallback */\n.element {\n  color: var(--undefined-var, black);\n}\n\n/* Scoped variables */\n.dark-theme {\n  --primary-color: #4dabf7;\n}\n\n/* Dynamic with JavaScript */\ndocument.documentElement.style.setProperty('--primary-color', 'red');\n```\n\n---"},{"id":"07-27","topic":"HTML/CSS","group":"MODERN CSS FEATURES","title":"CSS Container Queries","prompt":"**Container queries cho phép làm gì?**","opts":[{"k":"A","t":"Style based on viewport size"},{"k":"B","t":"Style based on container size"},{"k":"C","t":"Style based on network"},{"k":"D","t":"Style based on content"}],"ans":"B","expl":"**Giải thích:**\n```css\n/* Define container */\n.card-container {\n  container-type: inline-size;\n  container-name: card;\n}\n\n/* Query container size */\n@container card (min-width: 400px) {\n  .card {\n    display: flex;\n    flex-direction: row;\n  }\n}\n\n@container card (max-width: 399px) {\n  .card {\n    display: block;\n  }\n}\n\n/* Compare to media queries */\n@media (min-width: 400px) { } /* Viewport based */\n@container (min-width: 400px) { } /* Container based */\n```\n\n**Tham khảo:** [MDN - Container Queries](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Container_Queries)\n\n---"},{"id":"07-28","topic":"HTML/CSS","group":"MODERN CSS FEATURES","title":":has() Selector","prompt":"**`:has()` pseudo-class làm gì?**\n\n```css\n.card:has(img) { }\n```","opts":[{"k":"A","t":"Select img inside card"},{"k":"B","t":"Select all cards"},{"k":"C","t":"Error - invalid selector"},{"k":"D","t":"Select cards that contain an img element (parent selector)"}],"ans":"D","expl":"**Giải thích:**\n`:has()` is the \"parent selector\":\n\n```css\n/* Select card that contains an image */\n.card:has(img) {\n  display: grid;\n  grid-template-columns: 200px 1fr;\n}\n\n/* Select card without image */\n.card:not(:has(img)) {\n  display: block;\n}\n\n/* Select label when input is invalid */\nlabel:has(+ input:invalid) {\n  color: red;\n}\n\n/* Select form with at least one invalid input */\nform:has(input:invalid) {\n  border: 2px solid red;\n}\n\n/* Select parent of focused element */\n.container:has(:focus) {\n  outline: 2px solid blue;\n}\n```\n\n---"},{"id":"07-29","topic":"HTML/CSS","group":"MODERN CSS FEATURES","title":"@layer","prompt":"**CSS @layer dùng để làm gì?**","opts":[{"k":"A","t":"Group media queries"},{"k":"B","t":"Create animation layers"},{"k":"C","t":"Control cascade order của styles"},{"k":"D","t":"Create z-index layers"}],"ans":"C","expl":"**Giải thích:**\n`@layer` controls cascade order:\n\n```css\n/* Define layer order */\n@layer reset, base, components, utilities;\n\n/* Styles in later layers win */\n@layer reset {\n  * { margin: 0; padding: 0; }\n}\n\n@layer base {\n  p { color: black; }\n}\n\n@layer components {\n  .text { color: blue; }\n}\n\n@layer utilities {\n  .text-red { color: red !important; }\n}\n\n/* Unlayered styles have highest priority */\np { color: green; }  /* Wins over all layers */\n```\n\n---"},{"id":"07-30","topic":"HTML/CSS","group":"MODERN CSS FEATURES","title":"clamp()","prompt":"**`clamp()` function làm gì?**\n\n```css\nfont-size: clamp(1rem, 2.5vw, 2rem);\n```","opts":[{"k":"A","t":"Calculate average"},{"k":"B","t":"Error"},{"k":"C","t":"Return minimum, preferred, maximum - fluid value within range"},{"k":"D","t":"Randomly pick value"}],"ans":"C","expl":"**Giải thích:**\n```css\n/* clamp(minimum, preferred, maximum) */\n.title {\n  font-size: clamp(1rem, 2.5vw, 2rem);\n  /* Minimum: 1rem (16px) */\n  /* Preferred: 2.5vw (scales with viewport) */\n  /* Maximum: 2rem (32px) */\n}\n\n/* Fluid spacing */\n.container {\n  padding: clamp(1rem, 5vw, 3rem);\n}\n\n/* Alternative to media queries */\n.card {\n  width: clamp(300px, 50%, 600px);\n}\n\n/* Other math functions */\n.element {\n  width: min(100%, 600px);\n  height: max(200px, 50vh);\n  margin: calc(10px + 2vw);\n}\n```\n\n---"},{"id":"07-31","topic":"HTML/CSS","group":"RESPONSIVE DESIGN","title":"Mobile-first","prompt":"**Mobile-first approach nghĩa là?**","opts":[{"k":"A","t":"Use max-width media queries"},{"k":"B","t":"Design for mobile only"},{"k":"C","t":"Hide content on mobile"},{"k":"D","t":"Base styles cho mobile, use min-width media queries để enhance"}],"ans":"D","expl":"**Giải thích:**\n```css\n/* Mobile-first approach */\n\n/* Base styles for mobile */\n.container {\n  padding: 10px;\n  font-size: 14px;\n}\n\n/* Enhance for larger screens */\n@media (min-width: 768px) {\n  .container {\n    padding: 20px;\n    font-size: 16px;\n  }\n}\n\n@media (min-width: 1024px) {\n  .container {\n    padding: 40px;\n    max-width: 1200px;\n    margin: 0 auto;\n  }\n}\n\n/* Desktop-first (not recommended) */\n.container {\n  max-width: 1200px;\n}\n\n@media (max-width: 1023px) {\n  .container {\n    max-width: 768px;\n  }\n}\n\n@media (max-width: 767px) {\n  .container {\n    max-width: 100%;\n  }\n}\n```\n\n---"},{"id":"07-32","topic":"HTML/CSS","group":"RESPONSIVE DESIGN","title":"Viewport Units","prompt":"**Sự khác biệt giữa `vh` và `dvh`?**","opts":[{"k":"A","t":"Không có sự khác biệt"},{"k":"B","t":"`vh` accounts for dynamic viewport"},{"k":"C","t":"`dvh` không được support"},{"k":"D","t":"`dvh` accounts for dynamic viewport (mobile browser UI)"}],"ans":"D","expl":"**Giải thích:**\n```css\n/* vh - Static viewport height */\n.hero {\n  height: 100vh;\n  /* Problem: Doesn't account for mobile browser UI */\n  /* URL bar, bottom navigation can cover content */\n}\n\n/* dvh - Dynamic viewport height */\n.hero {\n  height: 100dvh;\n  /* Adjusts when mobile browser UI appears/disappears */\n}\n\n/* Other viewport units */\n.element {\n  height: 100svh;  /* Small viewport (UI visible) */\n  height: 100lvh;  /* Large viewport (UI hidden) */\n  height: 100dvh;  /* Dynamic (current state) */\n}\n\n/* Fallback for older browsers */\n.hero {\n  height: 100vh;\n  height: 100dvh;\n}\n```\n\n---"},{"id":"07-33","topic":"HTML/CSS","group":"RESPONSIVE DESIGN","title":"Responsive Images","prompt":"**Cách provide responsive images?**\n\n```html\n\u003Cimg\n  srcset=\"small.jpg 300w, medium.jpg 600w, large.jpg 1200w\"\n  sizes=\"(max-width: 600px) 300px, 600px\"\n  src=\"medium.jpg\"\n>\n```","opts":[{"k":"A","t":"Browser chooses best image based on viewport và pixel density"},{"k":"B","t":"Only `src` image is loaded"},{"k":"C","t":"Error"},{"k":"D","t":"Browser loads all images"}],"ans":"A","expl":"**Giải thích:**\n```html\n\u003Cimg\n  srcset=\"\n    small.jpg 300w,\n    medium.jpg 600w,\n    large.jpg 1200w\n  \"\n  sizes=\"\n    (max-width: 600px) 300px,\n    (max-width: 1200px) 600px,\n    1200px\n  \"\n  src=\"medium.jpg\"\n  alt=\"Responsive image\"\n>\n\n\u003C!-- Browser selection process:\n1. Parse sizes to determine display width\n2. Calculate required resolution (display width × DPR)\n3. Choose smallest image that meets requirement -->\n\n\u003C!-- Art direction with picture element -->\n\u003Cpicture>\n  \u003Csource\n    media=\"(min-width: 800px)\"\n    srcset=\"wide.jpg\"\n  >\n  \u003Csource\n    media=\"(min-width: 400px)\"\n    srcset=\"medium.jpg\"\n  >\n  \u003Cimg src=\"narrow.jpg\" alt=\"Art directed image\">\n\u003C/picture>\n```\n\n---"},{"id":"07-34","topic":"HTML/CSS","group":"RESPONSIVE DESIGN","title":"aspect-ratio","prompt":"**`aspect-ratio` property làm gì?**\n\n```css\n.video {\n  aspect-ratio: 16 / 9;\n  width: 100%;\n}\n```","opts":[{"k":"A","t":"Maintain aspect ratio, height calculated from width"},{"k":"B","t":"Crop image"},{"k":"C","t":"Error - invalid property"},{"k":"D","t":"Stretch to fill"}],"ans":"A","expl":"**Giải thích:**\n```css\n/* Maintain aspect ratio */\n.video-container {\n  aspect-ratio: 16 / 9;\n  width: 100%;\n  /* Height automatically calculated */\n}\n\n/* Square */\n.avatar {\n  aspect-ratio: 1;  /* Same as 1 / 1 */\n  width: 100px;\n  /* Height will be 100px */\n}\n\n/* With object-fit for images */\n.thumbnail {\n  aspect-ratio: 4 / 3;\n  width: 200px;\n  object-fit: cover;  /* Crop to fit */\n}\n\n/* Old method with padding hack */\n.video-container-old {\n  position: relative;\n  padding-bottom: 56.25%;  /* 9/16 = 0.5625 */\n  height: 0;\n}\n.video-container-old iframe {\n  position: absolute;\n  width: 100%;\n  height: 100%;\n}\n```\n\n---"},{"id":"07-35","topic":"HTML/CSS","group":"RESPONSIVE DESIGN","title":"prefers-reduced-motion","prompt":"**Media query này dùng để làm gì?**\n\n```css\n@media (prefers-reduced-motion: reduce) {\n  * {\n    animation: none !important;\n  }\n}\n```","opts":[{"k":"A","t":"Reduce file size"},{"k":"B","t":"Respect user's motion preferences (accessibility)"},{"k":"C","t":"Improve performance"},{"k":"D","t":"Disable JavaScript\n---"}],"ans":"B","expl":"**Giải thích:**\n```css\n/* Respect user's motion preferences */\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n/* Progressive enhancement approach */\n.element {\n  /* No animation by default */\n}\n\n@media (prefers-reduced-motion: no-preference) {\n  .element {\n    animation: fade-in 0.5s ease;\n  }\n}\n\n/* Other preference queries */\n@media (prefers-color-scheme: dark) {\n  /* Dark mode styles */\n}\n\n@media (prefers-contrast: high) {\n  /* High contrast styles */\n}\n```\n\n---"},{"id":"08-1","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"Testing Pyramid","prompt":"**Testing pyramid có cấu trúc như thế nào?**","opts":[{"k":"A","t":"Unit tests > Integration tests > E2E tests"},{"k":"B","t":"E2E tests > Integration tests > Unit tests"},{"k":"C","t":"Integration tests > Unit tests > E2E tests"},{"k":"D","t":"Tất cả test types bằng nhau"}],"ans":"A","expl":"**Giải thích:**\nTesting Pyramid (từ nhiều đến ít):\n```\n        /\\\n       /E2E\\        (Few - Slow, Expensive)\n      /─────\\\n     / Integ \\      (Some)\n    /─────────\\\n   /   Unit    \\    (Many - Fast, Cheap)\n  /─────────────\\\n```\n\n**Characteristics:**\n| Type | Speed | Cost | Confidence | Quantity |\n|------|-------|------|------------|----------|\n| Unit | Fast | Low | Low | Many |\n| Integration | Medium | Medium | Medium | Some |\n| E2E | Slow | High | High | Few |\n\n---"},{"id":"08-2","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"Unit vs Integration","prompt":"**Sự khác biệt giữa unit test và integration test?**","opts":[{"k":"A","t":"Unit test chậm hơn integration test"},{"k":"B","t":"Integration test dễ viết hơn"},{"k":"C","t":"Không có sự khác biệt"},{"k":"D","t":"Unit test test isolated units, integration test test multiple units working together"}],"ans":"D","expl":"**Giải thích:**\n```javascript\n// Unit Test - isolated unit\nfunction add(a, b) {\n  return a + b;\n}\n\ntest('add function', () => {\n  expect(add(1, 2)).toBe(3);\n});\n\n// Integration Test - multiple units together\nfunction calculateTotal(items) {\n  const subtotal = items.reduce((sum, item) => sum + item.price, 0);\n  const tax = calculateTax(subtotal);\n  const discount = applyDiscount(subtotal);\n  return subtotal + tax - discount;\n}\n\ntest('calculateTotal with tax and discount', () => {\n  const items = [{ price: 100 }, { price: 50 }];\n  const total = calculateTotal(items);\n  expect(total).toBe(150 + 15 - 10); // 155\n});\n```\n\n---"},{"id":"08-3","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"Test Coverage","prompt":"**Test coverage 100% có nghĩa là?**","opts":[{"k":"A","t":"Ứng dụng production-ready"},{"k":"B","t":"Tất cả lines/branches được execute trong tests, không đảm bảo no bugs"},{"k":"C","t":"Ứng dụng không có bugs"},{"k":"D","t":"Không cần thêm tests"}],"ans":"B","expl":"**Giải thích:**\n```javascript\n// 100% coverage doesn't mean bug-free!\n\nfunction divide(a, b) {\n  return a / b;\n}\n\n// This achieves 100% line coverage\ntest('divide', () => {\n  expect(divide(10, 2)).toBe(5);\n});\n\n// But misses edge cases!\ndivide(10, 0);  // Returns Infinity - is this correct?\ndivide('10', 2); // Returns 5 - should it validate types?\n\n// Better approach: Test behavior, not just coverage\ntest('divide handles division by zero', () => {\n  expect(() => divide(10, 0)).toThrow('Cannot divide by zero');\n});\n```\n\n**Good coverage targets:**\n- 70-80% for most projects\n- Focus on critical paths\n- Don't chase 100% blindly\n\n---"},{"id":"08-4","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"Mocking","prompt":"**Khi nào nên mock dependencies?**","opts":[{"k":"A","t":"Luôn luôn"},{"k":"B","t":"External services, APIs, modules that are slow/unpredictable/have side effects"},{"k":"C","t":"Chỉ trong E2E tests"},{"k":"D","t":"Không bao giờ"}],"ans":"B","expl":"**Giải thích:**\n```javascript\n// Mock external services\njest.mock('./api', () => ({\n  fetchUser: jest.fn().mockResolvedValue({ name: 'John' }),\n}));\n\n// Mock slow operations\njest.mock('./heavyComputation', () => ({\n  calculate: jest.fn().mockReturnValue(100),\n}));\n\n// Mock side effects\njest.mock('./analytics', () => ({\n  track: jest.fn(),\n}));\n\n// DON'T mock everything - test real behavior when possible\n// Unit under test should use real implementation\nfunction processOrder(order) {\n  const validated = validateOrder(order);  // Real function\n  const total = calculateTotal(validated); // Real function\n  return saveOrder(validated, total);      // Mock this (database)\n}\n```\n\n---"},{"id":"08-5","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"AAA Pattern","prompt":"**AAA pattern trong testing là gì?**","opts":[{"k":"A","t":"Arrange, Act, Assert"},{"k":"B","t":"Add, Alter, Affirm"},{"k":"C","t":"Analyze, Apply, Approve"},{"k":"D","t":"Async, Await, Assert"}],"ans":"A","expl":"**Giải thích:**\n```javascript\ntest('user can login', async () => {\n  // Arrange - Setup test conditions\n  const user = { email: 'test@example.com', password: 'password123' };\n  render(\u003CLoginForm />);\n\n  // Act - Perform the action\n  await userEvent.type(screen.getByLabelText('Email'), user.email);\n  await userEvent.type(screen.getByLabelText('Password'), user.password);\n  await userEvent.click(screen.getByRole('button', { name: 'Login' }));\n\n  // Assert - Verify the result\n  expect(screen.getByText('Welcome!')).toBeInTheDocument();\n});\n\n// Alternative pattern: Given-When-Then (BDD)\ndescribe('Login', () => {\n  it('should redirect to dashboard when credentials are valid', () => {\n    // Given\n    const validCredentials = { email: 'test@test.com', password: 'valid' };\n\n    // When\n    login(validCredentials);\n\n    // Then\n    expect(window.location.pathname).toBe('/dashboard');\n  });\n});\n```\n\n---"},{"id":"08-6","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"Test Doubles","prompt":"**Sự khác biệt giữa Mock, Stub, và Spy?**","opts":[{"k":"A","t":"Không có sự khác biệt"},{"k":"B","t":"Mock: programmable fake, Stub: simple fake return, Spy: wraps real function and records calls"},{"k":"C","t":"Mock cho async, Stub cho sync"},{"k":"D","t":"Spy chỉ dùng trong E2E"}],"ans":"B","expl":"**Giải thích:**\n```javascript\n// STUB - Simple fake return value\nconst userStub = {\n  getName: () => 'John Doe',\n};\n\n// MOCK - Programmable fake with expectations\nconst userMock = jest.fn();\nuserMock.mockReturnValue({ name: 'John' });\n// Can verify: expect(userMock).toHaveBeenCalledWith('123');\n\n// SPY - Wraps real function, records calls\nconst user = {\n  getName() {\n    return this.name;\n  },\n  name: 'John',\n};\nconst spy = jest.spyOn(user, 'getName');\nuser.getName();\nexpect(spy).toHaveBeenCalled();\nexpect(spy).toHaveReturnedWith('John');\n\n// FAKE - Working implementation with shortcuts\nclass FakeUserRepository {\n  constructor() {\n    this.users = [];\n  }\n\n  save(user) {\n    this.users.push(user);\n    return { ...user, id: this.users.length };\n  }\n\n  findById(id) {\n    return this.users[id - 1];\n  }\n}\n```\n\n---"},{"id":"08-7","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"Snapshot Testing","prompt":"**Khi nào nên sử dụng snapshot testing?**","opts":[{"k":"A","t":"Cho tất cả components"},{"k":"B","t":"Thay thế hoàn toàn unit tests"},{"k":"C","t":"Cho detecting unintended UI changes, không thay thế explicit assertions"},{"k":"D","t":"Chỉ cho large components"}],"ans":"C","expl":"**Giải thích:**\n```javascript\n// Good use of snapshots - detect unintended changes\ntest('renders correctly', () => {\n  const { container } = render(\u003CButton>Click me\u003C/Button>);\n  expect(container).toMatchSnapshot();\n});\n\n// But snapshots have limitations:\n// - Easy to update without reviewing\n// - Large snapshots are hard to review\n// - Don't test behavior\n\n// Better: Combine with explicit assertions\ntest('Button renders with correct text and styles', () => {\n  render(\u003CButton variant=\"primary\">Click me\u003C/Button>);\n\n  const button = screen.getByRole('button', { name: 'Click me' });\n  expect(button).toHaveClass('btn-primary');\n  expect(button).toBeEnabled();\n});\n\n// Use inline snapshots for small outputs\ntest('formats date', () => {\n  expect(formatDate(new Date('2024-01-01'))).toMatchInlineSnapshot(\n    `\"January 1, 2024\"`\n  );\n});\n```\n\n---"},{"id":"08-8","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"Test Isolation","prompt":"**Tại sao tests cần isolated?**","opts":[{"k":"A","t":"Để tiết kiệm bộ nhớ"},{"k":"B","t":"Để viết code ngắn hơn"},{"k":"C","t":"Không cần thiết"},{"k":"D","t":"Để chạy song song và không ảnh hưởng lẫn nhau"}],"ans":"D","expl":"**Giải thích:**\n```javascript\n// ❌ Tests that share state - can fail randomly\nlet counter = 0;\n\ntest('increments counter', () => {\n  counter++;\n  expect(counter).toBe(1);\n});\n\ntest('counter is still 1', () => {\n  expect(counter).toBe(1); // Depends on previous test!\n});\n\n// ✅ Isolated tests\ndescribe('Counter', () => {\n  let counter;\n\n  beforeEach(() => {\n    counter = 0; // Fresh state for each test\n  });\n\n  test('increments counter', () => {\n    counter++;\n    expect(counter).toBe(1);\n  });\n\n  test('starts at zero', () => {\n    expect(counter).toBe(0); // Independent!\n  });\n});\n\n// Benefits of isolation:\n// - Tests can run in parallel\n// - Tests can run in any order\n// - Failures are easier to debug\n// - Tests are independent units\n```\n\n---"},{"id":"08-9","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"Flaky Tests","prompt":"**Flaky test là gì và cách handle?**","opts":[{"k":"A","t":"Test chạy chậm"},{"k":"B","t":"Test luôn pass, ignore được"},{"k":"C","t":"Test không ổn định (pass/fail randomly), cần fix root cause như timing, async issues"},{"k":"D","t":"Test cho edge cases"}],"ans":"C","expl":"**Giải thích:**\n```javascript\n// Flaky test causes:\n// 1. Timing issues\ntest('shows notification', async () => {\n  render(\u003CApp />);\n  // ❌ Arbitrary timeout\n  await new Promise(resolve => setTimeout(resolve, 100));\n  expect(screen.getByText('Notification')).toBeInTheDocument();\n\n  // ✅ Wait for element\n  expect(await screen.findByText('Notification')).toBeInTheDocument();\n});\n\n// 2. Shared state\n// 3. Network dependencies\n// 4. Date/time dependencies\ntest('shows current date', () => {\n  // ❌ Flaky - depends on actual time\n  expect(screen.getByText(new Date().toDateString()));\n\n  // ✅ Mock time\n  jest.useFakeTimers().setSystemTime(new Date('2024-01-01'));\n  expect(screen.getByText('Mon Jan 01 2024'));\n});\n\n// 5. Random data\ntest('generates ID', () => {\n  // ❌ Random output\n  const id = generateId();\n  expect(id).toBeDefined();\n\n  // ✅ Mock randomness or test pattern\n  jest.spyOn(Math, 'random').mockReturnValue(0.5);\n  expect(generateId()).toBe('expected-id');\n});\n```\n\n---"},{"id":"08-10","topic":"Testing","group":"TESTING FUNDAMENTALS","title":"TDD","prompt":"**Test-Driven Development workflow?**","opts":[{"k":"A","t":"Write test (fail) → Write code (pass) → Refactor"},{"k":"B","t":"Write test → Deploy → Debug"},{"k":"C","t":"Write code → Write test → Refactor"},{"k":"D","t":"Write code → Debug → Write test"}],"ans":"A","expl":"**Giải thích:**\n```javascript\n// TDD Cycle: Red → Green → Refactor\n\n// 1. RED - Write failing test first\ntest('adds two numbers', () => {\n  expect(add(1, 2)).toBe(3);\n});\n// Test fails: add is not defined\n\n// 2. GREEN - Write minimum code to pass\nfunction add(a, b) {\n  return a + b;\n}\n// Test passes!\n\n// 3. REFACTOR - Improve code without changing behavior\nfunction add(...numbers) {\n  return numbers.reduce((sum, n) => sum + n, 0);\n}\n// Tests still pass!\n\n// Benefits:\n// - Tests drive design\n// - High test coverage naturally\n// - Confidence to refactor\n// - Documentation through tests\n```\n\n---"},{"id":"08-11","topic":"Testing","group":"REACT TESTING","title":"Testing Library Philosophy","prompt":"**React Testing Library philosophy là gì?**","opts":[{"k":"A","t":"Test internal state"},{"k":"B","t":"Test như cách users interact với UI, không test implementation"},{"k":"C","t":"Test lifecycle methods"},{"k":"D","t":"Test implementation details"}],"ans":"B","expl":"**Giải thích:**\n```jsx\n// ❌ Testing implementation details\ntest('sets state when clicked', () => {\n  const { result } = renderHook(() => useState(false));\n  // Don't test internal state!\n});\n\n// ❌ Testing component internals\ntest('calls internal method', () => {\n  const wrapper = shallow(\u003CButton />);\n  wrapper.instance().handleClick();\n  // Don't test private methods!\n});\n\n// ✅ Test like a user\ntest('button shows loading state when clicked', async () => {\n  render(\u003CSubmitButton />);\n\n  // User sees a button\n  const button = screen.getByRole('button', { name: 'Submit' });\n\n  // User clicks it\n  await userEvent.click(button);\n\n  // User sees loading indicator\n  expect(screen.getByRole('button', { name: 'Loading...' })).toBeDisabled();\n});\n```\n\n**Guiding principles:**\n- Test what users see and do\n- Don't test implementation details\n- If refactoring breaks tests, tests are too coupled\n\n---"},{"id":"08-12","topic":"Testing","group":"REACT TESTING","title":"Query Priorities","prompt":"**Query priority order đúng trong React Testing Library?**","opts":[{"k":"A","t":"getByRole > getByLabelText > getByText > getByTestId"},{"k":"B","t":"getByText > getByRole > getByTestId"},{"k":"C","t":"getByTestId > getByRole > getByText"},{"k":"D","t":"Tất cả queries bằng nhau"}],"ans":"A","expl":"**Giải thích:**\n```jsx\n// Query Priority Order (most to least preferred):\n\n// 1. Accessible by Everyone\nscreen.getByRole('button', { name: 'Submit' }); // ✅ Best\nscreen.getByLabelText('Email');                  // ✅ For form fields\nscreen.getByPlaceholderText('Enter email');      // OK\nscreen.getByText('Welcome');                     // OK\n\n// 2. Semantic Queries\nscreen.getByAltText('Profile photo');            // For images\nscreen.getByTitle('Close');                      // For tooltips\n\n// 3. Test IDs (last resort)\nscreen.getByTestId('submit-button');             // ❌ Avoid if possible\n\n// Why this order?\n// - getByRole uses accessibility tree (tests a11y for free)\n// - getByLabelText ensures labels are associated\n// - getByTestId doesn't reflect user experience\n\n// Example\nfunction LoginForm() {\n  return (\n    \u003Cform>\n      \u003Clabel htmlFor=\"email\">Email\u003C/label>\n      \u003Cinput id=\"email\" type=\"email\" />\n\n      \u003Cbutton type=\"submit\">Log In\u003C/button>\n    \u003C/form>\n  );\n}\n\ntest('login form', () => {\n  render(\u003CLoginForm />);\n\n  // ✅ Preferred\n  screen.getByRole('textbox', { name: 'Email' });\n  screen.getByRole('button', { name: 'Log In' });\n\n  // ❌ Avoid\n  screen.getByTestId('email-input');\n});\n```\n\n---"},{"id":"08-13","topic":"Testing","group":"REACT TESTING","title":"Async Testing","prompt":"**Cách test async operations đúng?**\n\n```jsx\n// Component fetches data on mount\nfunction UserProfile({ userId }) {\n  const [user, setUser] = useState(null);\n\n  useEffect(() => {\n    fetchUser(userId).then(setUser);\n  }, [userId]);\n\n  if (!user) return \u003Cdiv>Loading...\u003C/div>;\n  return \u003Cdiv>{user.name}\u003C/div>;\n}\n```","opts":[{"k":"A","t":"`setTimeout` trong test"},{"k":"B","t":"`getByText('Loading...')` rồi `getByText(user.name)`"},{"k":"C","t":"Sử dụng `findByText` hoặc `waitFor`"},{"k":"D","t":"Skip async tests"}],"ans":"C","expl":"**Giải thích:**\n```jsx\nfunction UserProfile({ userId }) {\n  const [user, setUser] = useState(null);\n\n  useEffect(() => {\n    fetchUser(userId).then(setUser);\n  }, [userId]);\n\n  if (!user) return \u003Cdiv>Loading...\u003C/div>;\n  return \u003Cdiv>{user.name}\u003C/div>;\n}\n\n// ❌ Won't work - assertion runs before fetch completes\ntest('bad async test', () => {\n  render(\u003CUserProfile userId=\"1\" />);\n  expect(screen.getByText('John')).toBeInTheDocument(); // Fails!\n});\n\n// ✅ Use findBy (combines getBy + waitFor)\ntest('shows user name after loading', async () => {\n  render(\u003CUserProfile userId=\"1\" />);\n\n  // findBy waits for element to appear\n  expect(await screen.findByText('John')).toBeInTheDocument();\n});\n\n// ✅ Use waitFor for complex assertions\ntest('shows user name after loading', async () => {\n  render(\u003CUserProfile userId=\"1\" />);\n\n  await waitFor(() => {\n    expect(screen.getByText('John')).toBeInTheDocument();\n  });\n});\n\n// ✅ Verify loading state first\ntest('shows loading then user', async () => {\n  render(\u003CUserProfile userId=\"1\" />);\n\n  // Initially shows loading\n  expect(screen.getByText('Loading...')).toBeInTheDocument();\n\n  // Then shows user\n  expect(await screen.findByText('John')).toBeInTheDocument();\n  expect(screen.queryByText('Loading...')).not.toBeInTheDocument();\n});\n```\n\n---"},{"id":"08-14","topic":"Testing","group":"REACT TESTING","title":"User Events","prompt":"**Cách simulate user typing?**\n\n```jsx\nconst input = screen.getByRole('textbox');\n// ?\n```","opts":[{"k":"A","t":"`fireEvent.change(input, { target: { value: 'hello' } })`"},{"k":"B","t":"`userEvent.type(input, 'hello')`"},{"k":"C","t":"Cả A và B, nhưng B simulate thực tế hơn"},{"k":"D","t":"`input.value = 'hello'`"}],"ans":"C","expl":"**Giải thích:**\n```jsx\n// fireEvent - low level DOM events\ntest('using fireEvent', () => {\n  render(\u003Cinput />);\n  const input = screen.getByRole('textbox');\n\n  // Directly sets value - doesn't simulate typing\n  fireEvent.change(input, { target: { value: 'hello' } });\n  expect(input).toHaveValue('hello');\n});\n\n// userEvent - simulates real user behavior (PREFERRED)\ntest('using userEvent', async () => {\n  render(\u003Cinput />);\n  const input = screen.getByRole('textbox');\n\n  // Simulates actual typing - fires focus, keydown, keypress, input, keyup\n  await userEvent.type(input, 'hello');\n  expect(input).toHaveValue('hello');\n});\n\n// userEvent advantages:\n// - Fires all events a real user would trigger\n// - Tests event handlers properly\n// - More realistic testing\n\n// More userEvent examples\nawait userEvent.click(button);           // Click\nawait userEvent.dblClick(element);       // Double click\nawait userEvent.hover(element);          // Hover\nawait userEvent.tab();                   // Tab navigation\nawait userEvent.keyboard('{Enter}');     // Keyboard input\nawait userEvent.selectOptions(select, ['option1']); // Select\nawait userEvent.clear(input);            // Clear input\nawait userEvent.upload(fileInput, file); // File upload\n```\n\n---"},{"id":"08-15","topic":"Testing","group":"REACT TESTING","title":"Custom Hooks Testing","prompt":"**Cách test custom hooks?**","opts":[{"k":"A","t":"Test trong component thực tế"},{"k":"B","t":"Sử dụng `renderHook` từ @testing-library/react"},{"k":"C","t":"Không cần test hooks"},{"k":"D","t":"Cả A và B đều valid approaches"}],"ans":"D","expl":"**Giải thích:**\n```jsx\n// Custom hook\nfunction useCounter(initialValue = 0) {\n  const [count, setCount] = useState(initialValue);\n\n  const increment = useCallback(() => setCount(c => c + 1), []);\n  const decrement = useCallback(() => setCount(c => c - 1), []);\n\n  return { count, increment, decrement };\n}\n\n// Option A: Test in component (integration test)\nfunction TestComponent() {\n  const { count, increment } = useCounter(0);\n  return (\n    \u003Cdiv>\n      \u003Cspan data-testid=\"count\">{count}\u003C/span>\n      \u003Cbutton onClick={increment}>+\u003C/button>\n    \u003C/div>\n  );\n}\n\ntest('useCounter in component', async () => {\n  render(\u003CTestComponent />);\n\n  expect(screen.getByTestId('count')).toHaveTextContent('0');\n  await userEvent.click(screen.getByRole('button'));\n  expect(screen.getByTestId('count')).toHaveTextContent('1');\n});\n\n// Option B: Test with renderHook (unit test)\nimport { renderHook, act } from '@testing-library/react';\n\ntest('useCounter with renderHook', () => {\n  const { result } = renderHook(() => useCounter(0));\n\n  expect(result.current.count).toBe(0);\n\n  act(() => {\n    result.current.increment();\n  });\n\n  expect(result.current.count).toBe(1);\n});\n\n// renderHook with rerender\ntest('useCounter with initial value change', () => {\n  const { result, rerender } = renderHook(\n    ({ initialValue }) => useCounter(initialValue),\n    { initialProps: { initialValue: 0 } }\n  );\n\n  expect(result.current.count).toBe(0);\n\n  rerender({ initialValue: 10 });\n  // Note: count doesn't change on rerender (useState behavior)\n});\n```\n\n---"},{"id":"08-16","topic":"Testing","group":"REACT TESTING","title":"Context Testing","prompt":"**Cách test component sử dụng Context?**\n\n```jsx\nfunction UserName() {\n  const { user } = useContext(UserContext);\n  return \u003Cspan>{user.name}\u003C/span>;\n}\n```","opts":[{"k":"A","t":"Test không thể"},{"k":"B","t":"Sử dụng shallow rendering"},{"k":"C","t":"Mock useContext"},{"k":"D","t":"Wrap component với Provider trong test"}],"ans":"D","expl":"**Giải thích:**\n```jsx\n// Component using context\nfunction UserName() {\n  const { user } = useContext(UserContext);\n  return \u003Cspan>{user.name}\u003C/span>;\n}\n\n// Test with wrapper\nconst mockUser = { name: 'John Doe', email: 'john@example.com' };\n\ntest('displays user name from context', () => {\n  render(\n    \u003CUserContext.Provider value={{ user: mockUser }}>\n      \u003CUserName />\n    \u003C/UserContext.Provider>\n  );\n\n  expect(screen.getByText('John Doe')).toBeInTheDocument();\n});\n\n// Custom render function for reusability\nconst AllTheProviders = ({ children }) => {\n  return (\n    \u003CUserContext.Provider value={{ user: mockUser }}>\n      \u003CThemeContext.Provider value=\"light\">\n        {children}\n      \u003C/ThemeContext.Provider>\n    \u003C/UserContext.Provider>\n  );\n};\n\nconst customRender = (ui, options) =>\n  render(ui, { wrapper: AllTheProviders, ...options });\n\n// Usage\ntest('with custom render', () => {\n  customRender(\u003CUserName />);\n  expect(screen.getByText('John Doe')).toBeInTheDocument();\n});\n```\n\n---"},{"id":"08-17","topic":"Testing","group":"REACT TESTING","title":"Testing Forms","prompt":"**Best practice test form validation?**","opts":[{"k":"A","t":"Chỉ test submit button"},{"k":"B","t":"Skip form tests"},{"k":"C","t":"Test implementation của validation logic"},{"k":"D","t":"Test user flow: input → submit → verify error messages hoặc success"}],"ans":"D","expl":"**Giải thích:**\n```jsx\nfunction LoginForm({ onSubmit }) {\n  const [email, setEmail] = useState('');\n  const [password, setPassword] = useState('');\n  const [errors, setErrors] = useState({});\n\n  const validate = () => {\n    const newErrors = {};\n    if (!email) newErrors.email = 'Email is required';\n    if (password.length \u003C 8) newErrors.password = 'Password must be 8+ chars';\n    setErrors(newErrors);\n    return Object.keys(newErrors).length === 0;\n  };\n\n  const handleSubmit = (e) => {\n    e.preventDefault();\n    if (validate()) {\n      onSubmit({ email, password });\n    }\n  };\n\n  return (\n    \u003Cform onSubmit={handleSubmit}>\n      \u003Clabel>\n        Email\n        \u003Cinput\n          type=\"email\"\n          value={email}\n          onChange={e => setEmail(e.target.value)}\n          aria-describedby=\"email-error\"\n        />\n      \u003C/label>\n      {errors.email && \u003Cspan id=\"email-error\">{errors.email}\u003C/span>}\n\n      \u003Clabel>\n        Password\n        \u003Cinput\n          type=\"password\"\n          value={password}\n          onChange={e => setPassword(e.target.value)}\n          aria-describedby=\"password-error\"\n        />\n      \u003C/label>\n      {errors.password && \u003Cspan id=\"password-error\">{errors.password}\u003C/span>}\n\n      \u003Cbutton type=\"submit\">Login\u003C/button>\n    \u003C/form>\n  );\n}\n\n// Test user flow, not implementation\ndescribe('LoginForm', () => {\n  test('shows error when email is empty', async () => {\n    const onSubmit = jest.fn();\n    render(\u003CLoginForm onSubmit={onSubmit} />);\n\n    await userEvent.click(screen.getByRole('button', { name: 'Login' }));\n\n    expect(screen.getByText('Email is required')).toBeInTheDocument();\n    expect(onSubmit).not.toHaveBeenCalled();\n  });\n\n  test('shows error when password too short', async () => {\n    render(\u003CLoginForm onSubmit={jest.fn()} />);\n\n    await userEvent.type(screen.getByLabelText('Email'), 'test@test.com');\n    await userEvent.type(screen.getByLabelText('Password'), '1234567');\n    await userEvent.click(screen.getByRole('button'));\n\n    expect(screen.getByText('Password must be 8+ chars')).toBeInTheDocument();\n  });\n\n  test('submits when valid', async () => {\n    const onSubmit = jest.fn();\n    render(\u003CLoginForm onSubmit={onSubmit} />);\n\n    await userEvent.type(screen.getByLabelText('Email'), 'test@test.com');\n    await userEvent.type(screen.getByLabelText('Password'), 'password123');\n    await userEvent.click(screen.getByRole('button'));\n\n    expect(onSubmit).toHaveBeenCalledWith({\n      email: 'test@test.com',\n      password: 'password123',\n    });\n  });\n});\n```\n\n---"},{"id":"08-18","topic":"Testing","group":"REACT TESTING","title":"Component Rendering","prompt":"**Sự khác biệt giữa `render` và `rerender`?**","opts":[{"k":"A","t":"`rerender` cho async components"},{"k":"B","t":"`render` mounts mới, `rerender` update props của component đã mounted"},{"k":"C","t":"`render` chỉ cho class components"},{"k":"D","t":"Không có sự khác biệt"}],"ans":"B","expl":"**Giải thích:**\n```jsx\nfunction Greeting({ name }) {\n  return \u003Ch1>Hello, {name}!\u003C/h1>;\n}\n\ntest('render vs rerender', () => {\n  // render - mounts new component\n  const { rerender } = render(\u003CGreeting name=\"John\" />);\n  expect(screen.getByText('Hello, John!')).toBeInTheDocument();\n\n  // rerender - updates props of existing component\n  rerender(\u003CGreeting name=\"Jane\" />);\n  expect(screen.getByText('Hello, Jane!')).toBeInTheDocument();\n\n  // Component instance is preserved (same as prop change in real app)\n});\n\n// Use rerender to test prop changes\ntest('component updates on prop change', () => {\n  const { rerender } = render(\u003CCounter count={0} />);\n  expect(screen.getByText('Count: 0')).toBeInTheDocument();\n\n  rerender(\u003CCounter count={5} />);\n  expect(screen.getByText('Count: 5')).toBeInTheDocument();\n});\n\n// Contrast with unmount + remount\ntest('remount creates new instance', () => {\n  const { unmount } = render(\u003CStatefulComponent />);\n  // Do something\n  unmount();\n  render(\u003CStatefulComponent />); // Fresh instance, state reset\n});\n```\n\n---"},{"id":"08-19","topic":"Testing","group":"REACT TESTING","title":"Testing Error Boundaries","prompt":"**Cách test Error Boundary?**","opts":[{"k":"A","t":"Không thể test"},{"k":"B","t":"Chỉ test trong browser"},{"k":"C","t":"Mock Error Boundary"},{"k":"D","t":"Render child component mà throws error, verify fallback UI"}],"ans":"D","expl":"**Giải thích:**\n```jsx\n// Error Boundary component\nclass ErrorBoundary extends React.Component {\n  state = { hasError: false };\n\n  static getDerivedStateFromError() {\n    return { hasError: true };\n  }\n\n  render() {\n    if (this.state.hasError) {\n      return \u003Cdiv>Something went wrong\u003C/div>;\n    }\n    return this.props.children;\n  }\n}\n\n// Component that throws\nfunction BrokenComponent() {\n  throw new Error('Test error');\n}\n\n// Test\ntest('ErrorBoundary catches errors', () => {\n  // Suppress console.error for cleaner test output\n  const consoleSpy = jest.spyOn(console, 'error').mockImplementation(() => {});\n\n  render(\n    \u003CErrorBoundary>\n      \u003CBrokenComponent />\n    \u003C/ErrorBoundary>\n  );\n\n  expect(screen.getByText('Something went wrong')).toBeInTheDocument();\n\n  consoleSpy.mockRestore();\n});\n\n// Test that it renders children normally\ntest('ErrorBoundary renders children when no error', () => {\n  render(\n    \u003CErrorBoundary>\n      \u003Cdiv>Child content\u003C/div>\n    \u003C/ErrorBoundary>\n  );\n\n  expect(screen.getByText('Child content')).toBeInTheDocument();\n});\n```\n\n---"},{"id":"08-20","topic":"Testing","group":"REACT TESTING","title":"MSW (Mock Service Worker)","prompt":"**MSW được sử dụng để?**","opts":[{"k":"A","t":"Render components"},{"k":"B","t":"Debug performance"},{"k":"C","t":"Create new components"},{"k":"D","t":"Mock API responses at network level"}],"ans":"D","expl":"**Giải thích:**\n```javascript\n// MSW - Mock Service Worker\nimport { rest } from 'msw';\nimport { setupServer } from 'msw/node';\n\n// Define handlers\nconst handlers = [\n  rest.get('/api/user/:id', (req, res, ctx) => {\n    return res(\n      ctx.json({ id: req.params.id, name: 'John Doe' })\n    );\n  }),\n\n  rest.post('/api/login', async (req, res, ctx) => {\n    const { email, password } = await req.json();\n    if (password === 'correct') {\n      return res(ctx.json({ token: 'fake-token' }));\n    }\n    return res(ctx.status(401), ctx.json({ error: 'Invalid credentials' }));\n  }),\n];\n\n// Setup server\nconst server = setupServer(...handlers);\n\nbeforeAll(() => server.listen());\nafterEach(() => server.resetHandlers());\nafterAll(() => server.close());\n\n// Test\ntest('fetches user data', async () => {\n  render(\u003CUserProfile userId=\"123\" />);\n\n  // MSW intercepts the real fetch call\n  expect(await screen.findByText('John Doe')).toBeInTheDocument();\n});\n\n// Override handler for specific test\ntest('handles error', async () => {\n  server.use(\n    rest.get('/api/user/:id', (req, res, ctx) => {\n      return res(ctx.status(500));\n    })\n  );\n\n  render(\u003CUserProfile userId=\"123\" />);\n  expect(await screen.findByText('Error loading user')).toBeInTheDocument();\n});\n```\n\n---"},{"id":"08-21","topic":"Testing","group":"END-TO-END TESTING","title":"E2E Test Scope","prompt":"**E2E tests nên test gì?**","opts":[{"k":"A","t":"Tất cả functionality"},{"k":"B","t":"Critical user journeys và happy paths"},{"k":"C","t":"Unit logic"},{"k":"D","t":"Styling"}],"ans":"B","expl":"**Giải thích:**\n```javascript\n// E2E tests are expensive - focus on critical paths\n\n// ✅ Test critical user journeys\ndescribe('E-commerce checkout', () => {\n  it('user can complete purchase', () => {\n    cy.visit('/products');\n    cy.get('[data-testid=\"product-1\"]').click();\n    cy.contains('Add to Cart').click();\n    cy.visit('/cart');\n    cy.contains('Checkout').click();\n    cy.get('#email').type('user@example.com');\n    cy.get('#card').type('4242424242424242');\n    cy.contains('Pay').click();\n    cy.contains('Order Confirmed').should('be.visible');\n  });\n});\n\n// ✅ Test authentication flow\ndescribe('Authentication', () => {\n  it('user can sign up and log in', () => {\n    cy.visit('/signup');\n    cy.get('#email').type('new@user.com');\n    cy.get('#password').type('password123');\n    cy.contains('Sign Up').click();\n    cy.contains('Welcome').should('be.visible');\n  });\n});\n\n// ❌ Don't test every edge case in E2E\n// Use unit/integration tests for that\n```\n\n---"},{"id":"08-22","topic":"Testing","group":"END-TO-END TESTING","title":"Cypress vs Playwright","prompt":"**Điểm khác biệt chính giữa Cypress và Playwright?**","opts":[{"k":"A","t":"Playwright multi-browser native, Cypress có rich debugging, cả hai đều tốt"},{"k":"B","t":"Không có sự khác biệt"},{"k":"C","t":"Playwright chỉ cho Chromium"},{"k":"D","t":"Cypress nhanh hơn"}],"ans":"A","expl":"**Giải thích:**\n```javascript\n// CYPRESS\n// Pros:\n// - Rich debugging (time travel, DOM snapshots)\n// - Automatic waiting\n// - Great DX\n// - Large ecosystem\n\n// Cypress example\ncy.visit('/login');\ncy.get('[data-testid=\"email\"]').type('user@test.com');\ncy.get('[data-testid=\"password\"]').type('password');\ncy.get('button[type=\"submit\"]').click();\ncy.url().should('include', '/dashboard');\n\n// PLAYWRIGHT\n// Pros:\n// - Multi-browser native (Chrome, Firefox, Safari)\n// - Faster execution\n// - Better for CI/CD\n// - Auto-waiting\n\n// Playwright example\nawait page.goto('/login');\nawait page.fill('[data-testid=\"email\"]', 'user@test.com');\nawait page.fill('[data-testid=\"password\"]', 'password');\nawait page.click('button[type=\"submit\"]');\nawait expect(page).toHaveURL(/dashboard/);\n\n// Both are excellent choices - pick based on team needs\n```\n\n---"},{"id":"08-23","topic":"Testing","group":"END-TO-END TESTING","title":"Test Selectors","prompt":"**Best practice cho E2E selectors?**","opts":[{"k":"A","t":"XPath"},{"k":"B","t":"Random selectors"},{"k":"C","t":"data-testid attributes cho test-specific selectors"},{"k":"D","t":"CSS selectors phức tạp"}],"ans":"C","expl":"**Giải thích:**\n```html\n\u003C!-- data-testid for reliable selection -->\n\u003Cbutton data-testid=\"submit-button\">Submit\u003C/button>\n\n\u003C!-- Don't rely on implementation details -->\n\u003Cbutton class=\"btn btn-primary\">Submit\u003C/button> \u003C!-- Classes can change -->\n```\n\n```javascript\n// ✅ Good selectors\ncy.get('[data-testid=\"submit-button\"]');  // Test-specific\ncy.contains('Submit');                      // By text\ncy.get('button[type=\"submit\"]');           // By semantic attribute\n\n// ❌ Avoid\ncy.get('.btn-primary');                     // CSS classes change\ncy.get('#submit-btn');                      // IDs are implementation detail\ncy.get('div > div > button:first-child'); // Brittle structure\ncy.get('[style*=\"color: red\"]');           // Styling is not behavior\n\n// Best practices:\n// 1. Prefer data-testid for test-only selectors\n// 2. Use semantic selectors when possible\n// 3. Avoid implementation-dependent selectors\n// 4. Keep selectors simple and stable\n```\n\n---"},{"id":"08-24","topic":"Testing","group":"END-TO-END TESTING","title":"Page Object Model","prompt":"**Page Object Model (POM) là gì?**","opts":[{"k":"A","t":"Testing framework"},{"k":"B","t":"Design pattern encapsulate page elements và actions, improve test maintainability"},{"k":"C","t":"CSS methodology"},{"k":"D","t":"Browser API"}],"ans":"B","expl":"**Giải thích:**\n```javascript\n// Page Object Model - encapsulate page structure\n\n// pages/LoginPage.js\nclass LoginPage {\n  // Selectors\n  get emailInput() { return cy.get('[data-testid=\"email\"]'); }\n  get passwordInput() { return cy.get('[data-testid=\"password\"]'); }\n  get submitButton() { return cy.get('[data-testid=\"submit\"]'); }\n  get errorMessage() { return cy.get('[data-testid=\"error\"]'); }\n\n  // Actions\n  visit() {\n    cy.visit('/login');\n    return this;\n  }\n\n  login(email, password) {\n    this.emailInput.type(email);\n    this.passwordInput.type(password);\n    this.submitButton.click();\n    return this;\n  }\n\n  // Assertions\n  assertErrorVisible(message) {\n    this.errorMessage.should('contain', message);\n    return this;\n  }\n}\n\n// Usage in tests\ndescribe('Login', () => {\n  const loginPage = new LoginPage();\n\n  it('shows error for invalid credentials', () => {\n    loginPage\n      .visit()\n      .login('invalid@email.com', 'wrongpassword')\n      .assertErrorVisible('Invalid credentials');\n  });\n});\n\n// Benefits:\n// - DRY - selectors defined once\n// - Maintainable - change in one place\n// - Readable - tests describe behavior, not mechanics\n```\n\n---"},{"id":"08-25","topic":"Testing","group":"END-TO-END TESTING","title":"Visual Regression Testing","prompt":"**Visual regression testing dùng để?**","opts":[{"k":"A","t":"Detect unintended visual changes bằng screenshot comparison"},{"k":"B","t":"Test performance"},{"k":"C","t":"Test accessibility"},{"k":"D","t":"Test SEO"}],"ans":"A","expl":"**Giải thích:**\n```javascript\n// Visual regression with Percy (or Chromatic)\ndescribe('Button', () => {\n  it('renders correctly', () => {\n    cy.visit('/buttons');\n    cy.percySnapshot('Button variants');\n  });\n});\n\n// Visual regression with Playwright\ntest('homepage', async ({ page }) => {\n  await page.goto('/');\n  await expect(page).toHaveScreenshot('homepage.png');\n});\n\n// With threshold for minor differences\nawait expect(page).toHaveScreenshot('homepage.png', {\n  maxDiffPixels: 100,\n});\n\n// Tools:\n// - Percy (paid, CI integration)\n// - Chromatic (Storybook integration)\n// - Playwright built-in\n// - BackstopJS (open source)\n\n// Best practices:\n// - Test on consistent environment (CI)\n// - Handle dynamic content (mock dates, hide animations)\n// - Review changes carefully before approving\n```\n\n---"},{"id":"08-26","topic":"Testing","group":"TESTING PATTERNS","title":"Factory Functions","prompt":"**Factory functions trong testing dùng để?**","opts":[{"k":"A","t":"Run tests faster"},{"k":"B","t":"Create database connections"},{"k":"C","t":"Generate test data với default/custom values"},{"k":"D","t":"Mock APIs"}],"ans":"C","expl":"**Giải thích:**\n```javascript\n// Factory function for test data\nfunction createUser(overrides = {}) {\n  return {\n    id: 'user-1',\n    name: 'John Doe',\n    email: 'john@example.com',\n    role: 'user',\n    createdAt: new Date('2024-01-01'),\n    ...overrides,\n  };\n}\n\n// Usage\ntest('displays user name', () => {\n  const user = createUser(); // Use defaults\n  render(\u003CUserCard user={user} />);\n  expect(screen.getByText('John Doe')).toBeInTheDocument();\n});\n\ntest('displays admin badge for admin users', () => {\n  const adminUser = createUser({ role: 'admin' }); // Override role\n  render(\u003CUserCard user={adminUser} />);\n  expect(screen.getByText('Admin')).toBeInTheDocument();\n});\n\n// Factory with relationships\nfunction createOrder(overrides = {}) {\n  return {\n    id: 'order-1',\n    user: createUser(),\n    items: [createProduct(), createProduct()],\n    status: 'pending',\n    total: 100,\n    ...overrides,\n  };\n}\n\n// Using faker for realistic data\nimport { faker } from '@faker-js/faker';\n\nfunction createRandomUser() {\n  return {\n    id: faker.string.uuid(),\n    name: faker.person.fullName(),\n    email: faker.internet.email(),\n    avatar: faker.image.avatar(),\n  };\n}\n```\n\n---"},{"id":"08-27","topic":"Testing","group":"TESTING PATTERNS","title":"Testing Async Code","prompt":"**Pattern nào đúng cho async tests?**\n\n```javascript\n// A\ntest('fetches data', () => {\n  const data = fetchData();\n  expect(data).toBe('data');\n});\n\n// B\ntest('fetches data', async () => {\n  const data = await fetchData();\n  expect(data).toBe('data');\n});\n```","opts":[{"k":"A","t":"Pattern B đúng - phải await async operations"},{"k":"B","t":"Cả hai đều đúng"},{"k":"C","t":"Cả hai đều sai"},{"k":"D","t":"Pattern A đúng"}],"ans":"A","expl":"**Giải thích:**\n```javascript\n// ❌ Pattern A - Won't work for async\ntest('bad async test', () => {\n  const data = fetchData(); // Returns Promise, not data!\n  expect(data).toBe('data'); // Comparing Promise to string\n});\n\n// ✅ Pattern B - Properly awaits\ntest('good async test', async () => {\n  const data = await fetchData();\n  expect(data).toBe('data');\n});\n\n// More async patterns\n// Using .resolves\ntest('with resolves', async () => {\n  await expect(fetchData()).resolves.toBe('data');\n});\n\n// Using .rejects\ntest('handles rejection', async () => {\n  await expect(fetchBadData()).rejects.toThrow('Not found');\n});\n\n// Testing multiple async operations\ntest('parallel async', async () => {\n  const [user, posts] = await Promise.all([\n    fetchUser(),\n    fetchPosts(),\n  ]);\n\n  expect(user.name).toBe('John');\n  expect(posts).toHaveLength(5);\n});\n```\n\n---"},{"id":"08-28","topic":"Testing","group":"TESTING PATTERNS","title":"Testing Error Cases","prompt":"**Cách test function throws error?**\n\n```javascript\nfunction divide(a, b) {\n  if (b === 0) throw new Error('Cannot divide by zero');\n  return a / b;\n}\n```","opts":[{"k":"A","t":"Cannot test throws"},{"k":"B","t":"`expect(divide(1, 0)).toThrow()`"},{"k":"C","t":"`expect(() => divide(1, 0)).toThrow('Cannot divide by zero')`"},{"k":"D","t":"`expect(divide(1, 0)).toBe(Error)`"}],"ans":"C","expl":"**Giải thích:**\n```javascript\nfunction divide(a, b) {\n  if (b === 0) throw new Error('Cannot divide by zero');\n  return a / b;\n}\n\n// ✅ Wrap in function for toThrow\ntest('throws on divide by zero', () => {\n  expect(() => divide(1, 0)).toThrow('Cannot divide by zero');\n});\n\n// Can also match error type\ntest('throws Error type', () => {\n  expect(() => divide(1, 0)).toThrow(Error);\n});\n\n// Match with regex\ntest('throws with pattern', () => {\n  expect(() => divide(1, 0)).toThrow(/divide by zero/);\n});\n\n// For async throws\nasync function asyncDivide(a, b) {\n  if (b === 0) throw new Error('Cannot divide by zero');\n  return a / b;\n}\n\ntest('async throws', async () => {\n  await expect(asyncDivide(1, 0)).rejects.toThrow('Cannot divide by zero');\n});\n\n// ❌ Common mistake - calling function directly\ntest('wrong way', () => {\n  expect(divide(1, 0)).toThrow(); // Error thrown before expect runs!\n});\n```\n\n---"},{"id":"08-29","topic":"Testing","group":"TESTING PATTERNS","title":"Parameterized Tests","prompt":"**Cách viết parameterized tests trong Jest?**","opts":[{"k":"A","t":"Không có cách"},{"k":"B","t":"Chỉ trong Mocha"},{"k":"C","t":"Copy paste tests"},{"k":"D","t":"Sử dụng `test.each` hoặc `it.each`"}],"ans":"D","expl":"**Giải thích:**\n```javascript\n// test.each with array\ntest.each([\n  [1, 1, 2],\n  [1, 2, 3],\n  [2, 2, 4],\n])('add(%i, %i) = %i', (a, b, expected) => {\n  expect(add(a, b)).toBe(expected);\n});\n\n// test.each with objects\ntest.each([\n  { input: 'hello', expected: 'HELLO' },\n  { input: 'World', expected: 'WORLD' },\n  { input: '', expected: '' },\n])('toUpperCase(\"$input\") = \"$expected\"', ({ input, expected }) => {\n  expect(input.toUpperCase()).toBe(expected);\n});\n\n// test.each with template literal\ntest.each`\n  a    | b    | expected\n  ${1} | ${1} | ${2}\n  ${1} | ${2} | ${3}\n  ${2} | ${2} | ${4}\n`('add($a, $b) = $expected', ({ a, b, expected }) => {\n  expect(add(a, b)).toBe(expected);\n});\n\n// describe.each for grouped tests\ndescribe.each([\n  ['admin', true],\n  ['user', false],\n  ['guest', false],\n])('%s role', (role, canDelete) => {\n  test(`canDelete is ${canDelete}`, () => {\n    const user = createUser({ role });\n    expect(user.canDelete()).toBe(canDelete);\n  });\n});\n```\n\n---"},{"id":"08-30","topic":"Testing","group":"TESTING PATTERNS","title":"Before/After Hooks","prompt":"**Sự khác biệt giữa `beforeAll` và `beforeEach`?**","opts":[{"k":"A","t":"`beforeAll` chạy một lần trước tất cả tests, `beforeEach` chạy trước mỗi test"},{"k":"B","t":"`beforeAll` cho async only"},{"k":"C","t":"`beforeEach` chạy một lần"},{"k":"D","t":"Không có sự khác biệt"}],"ans":"A","expl":"**Giải thích:**\n```javascript\ndescribe('Hooks', () => {\n  // beforeAll - once before all tests in describe\n  beforeAll(() => {\n    console.log('Setup database connection');\n    // Runs once\n  });\n\n  // beforeEach - before each test\n  beforeEach(() => {\n    console.log('Reset state');\n    // Runs before every test\n  });\n\n  // afterEach - after each test\n  afterEach(() => {\n    console.log('Cleanup');\n    // Runs after every test\n  });\n\n  // afterAll - once after all tests\n  afterAll(() => {\n    console.log('Close database');\n    // Runs once at end\n  });\n\n  test('test 1', () => {});\n  test('test 2', () => {});\n});\n\n// Execution order:\n// 1. beforeAll\n// 2. beforeEach\n// 3. test 1\n// 4. afterEach\n// 5. beforeEach\n// 6. test 2\n// 7. afterEach\n// 8. afterAll\n\n// Async hooks\nbeforeAll(async () => {\n  await connectDatabase();\n});\n\nafterAll(async () => {\n  await disconnectDatabase();\n});\n```\n\n---"},{"id":"08-31","topic":"Testing","group":"BEST PRACTICES & CODE QUALITY","title":"Code Review","prompt":"**Code review nên focus vào gì?**","opts":[{"k":"A","t":"Chỉ tìm bugs"},{"k":"B","t":"Chỉ coding style"},{"k":"C","t":"Logic, security, performance, maintainability, testing"},{"k":"D","t":"Chỉ formatting"}],"ans":"C","expl":"**Giải thích:**\nCode review checklist:\n```markdown\n## Functionality\n- [ ] Code does what it's supposed to do\n- [ ] Edge cases handled\n- [ ] Error handling appropriate\n\n## Security\n- [ ] No exposed secrets\n- [ ] Input validated\n- [ ] XSS/SQL injection prevented\n\n## Performance\n- [ ] No obvious performance issues\n- [ ] Efficient algorithms\n- [ ] Appropriate caching\n\n## Maintainability\n- [ ] Code is readable\n- [ ] Good naming conventions\n- [ ] No unnecessary complexity\n- [ ] DRY principles followed\n\n## Testing\n- [ ] Tests cover new functionality\n- [ ] Tests are meaningful (not just coverage)\n- [ ] Edge cases tested\n\n## Style\n- [ ] Follows team conventions\n- [ ] Consistent formatting\n- [ ] No commented-out code\n```\n\n---"},{"id":"08-32","topic":"Testing","group":"BEST PRACTICES & CODE QUALITY","title":"Git Branching","prompt":"**Git Flow branching strategy phù hợp khi nào?**","opts":[{"k":"A","t":"Small projects"},{"k":"B","t":"Mọi project"},{"k":"C","t":"Projects với scheduled releases, multiple versions in production"},{"k":"D","t":"Single developer"}],"ans":"C","expl":"**Giải thích:**\n```\nGit Flow:\n├── main (production)\n├── develop (integration)\n├── feature/* (new features)\n├── release/* (release preparation)\n├── hotfix/* (production fixes)\n└── support/* (older version support)\n\nBest for:\n- Scheduled releases\n- Multiple versions in production\n- Larger teams\n\nNot ideal for:\n- Continuous deployment\n- Small teams\n- Simple projects\n\nAlternative: GitHub Flow (simpler)\n├── main (production)\n└── feature/* (everything else)\n```\n\n---"},{"id":"08-33","topic":"Testing","group":"BEST PRACTICES & CODE QUALITY","title":"Semantic Versioning","prompt":"**Version 2.3.1 có nghĩa gì?**","opts":[{"k":"A","t":"Team.Sprint.Task"},{"k":"B","t":"Year.Month.Day"},{"k":"C","t":"Random numbers"},{"k":"D","t":"MAJOR.MINOR.PATCH - breaking changes, new features, bug fixes"}],"ans":"D","expl":"**Giải thích:**\n```\nSemantic Versioning: MAJOR.MINOR.PATCH\n\n2.3.1\n│ │ └── PATCH: Bug fixes (backward compatible)\n│ └──── MINOR: New features (backward compatible)\n└────── MAJOR: Breaking changes\n\nExamples:\n1.0.0 → 1.0.1  Bug fix\n1.0.1 → 1.1.0  New feature\n1.1.0 → 2.0.0  Breaking change\n\nPre-release versions:\n1.0.0-alpha.1\n1.0.0-beta.2\n1.0.0-rc.1\n\nRules:\n- Increment MAJOR for breaking changes\n- Increment MINOR for new features (reset PATCH)\n- Increment PATCH for bug fixes\n- Pre-1.0.0: Development, anything goes\n```\n\n---"},{"id":"08-34","topic":"Testing","group":"BEST PRACTICES & CODE QUALITY","title":"Documentation","prompt":"**Code documentation nên include?**","opts":[{"k":"A","t":"Public API docs, complex logic explanation, examples, không comment obvious code"},{"k":"B","t":"Chỉ README"},{"k":"C","t":"Không cần documentation"},{"k":"D","t":"Comment mọi line"}],"ans":"A","expl":"**Giải thích:**\n```javascript\n// ❌ Over-commenting obvious code\n// Increment i by 1\ni++;\n\n// ✅ Document complex logic\n/**\n * Calculate discount based on user tier and cart value.\n *\n * Discount tiers:\n * - Gold: 20% on orders > $100\n * - Silver: 15% on orders > $50\n * - Bronze: 10% on orders > $25\n *\n * @param {User} user - User with tier information\n * @param {number} cartValue - Total cart value\n * @returns {number} Discount percentage (0-100)\n */\nfunction calculateDiscount(user, cartValue) {\n  // ...\n}\n\n// ✅ Document public APIs\n/**\n * Custom hook for managing form state.\n *\n * @example\n * ```tsx\n * const { values, errors, handleChange } = useForm({\n *   initialValues: { email: '' },\n *   validate: (values) => ({ email: !values.email ? 'Required' : null }),\n * });\n * ```\n */\nfunction useForm\u003CT>(config: FormConfig\u003CT>): FormResult\u003CT> {\n  // ...\n}\n\n// ✅ Document \"why\", not \"what\"\n// Using setTimeout to debounce rapid state updates\n// that were causing performance issues (see #123)\nsetTimeout(() => {\n  setSearchResults(results);\n}, 100);\n```\n\n---"},{"id":"08-35","topic":"Testing","group":"BEST PRACTICES & CODE QUALITY","title":"Technical Debt","prompt":"**Cách manage technical debt?**","opts":[{"k":"A","t":"Track, prioritize, allocate time để address incrementally"},{"k":"B","t":"Rewrite từ đầu"},{"k":"C","t":"Ignore hoàn toàn"},{"k":"D","t":"Đợi đến khi có problems\n---"}],"ans":"A","expl":"**Giải thích:**\n```markdown\n## Technical Debt Management\n\n### 1. Track\n- Document in issue tracker\n- Tag with \"tech-debt\"\n- Include impact assessment\n\n### 2. Prioritize\n- High impact, low effort → Do now\n- High impact, high effort → Plan into roadmap\n- Low impact, low effort → Boy Scout rule\n- Low impact, high effort → Monitor\n\n### 3. Allocate Time\n- 20% rule: Reserve time in each sprint\n- Tech debt sprints: Periodic focused cleanup\n- Boy Scout rule: Leave code better than you found it\n\n### 4. Prevent\n- Code reviews catch new debt\n- Testing prevents regression\n- Documentation reduces confusion\n- Regular refactoring keeps code healthy\n\n### 5. Measure\n- Track debt items over time\n- Monitor code quality metrics\n- Review velocity impact\n```\n\n---"}];
const QUIZ_BY_ID = new Map(QUIZ.map(q => [q.id, q]));

/* ===================== phân tách giáo án ===================== */
const parseGiaoAn = md => {
  const out = [];
  let sec = null, q = null;
  for (const line of md.split('\n')) {
    const s = /^# (.+)$/.exec(line);
    const h = /^## (Câu [^:]+):\s*(.*)$/.exec(line);
    if (s) {
      sec = { title: s[1], intro: [], questions: [] };
      out.push(sec);
      q = null;
    } else if (h && sec) {
      if (h[1].trim() === 'Câu X') { q = null; continue; }
      q = { id: h[1].trim(), title: h[2].trim(), section: sec.title, body: [] };
      sec.questions.push(q);
    } else if (q) q.body.push(line);
    else if (sec) sec.intro.push(line);
  }
  return out;
};

const ALL_SECS = parseGiaoAn(MD.giaoan);
const SECTIONS = ALL_SECS.filter(({ questions }) => questions.length);
const DOCSECS = ALL_SECS
  .filter(({ questions }) => !questions.length)
  .map(({ title, intro }, i) => ({
    key: `doc${i}`,
    label: i === 0 ? 'Mở đầu' : title.replace(/^Phụ lục:\s*/, 'Phụ lục — '),
    md: intro.join('\n').trim(),
  }))
  .filter(({ md }) => md.length > 40);

const QUESTIONS = SECTIONS.flatMap(({ questions }) => questions);
const BY_ID = new Map(QUESTIONS.map(q => [q.id, q]));

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => `${s}`.replace(/[&<>"']/g, c => ESCAPES[c]);

const el = (tag, cls = '', html = null) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html !== null) node.innerHTML = html;
  return node;
};

const pct = (part, whole) => (whole ? Math.round((part / whole) * 100) : 0);
const width = (part, whole) => `${whole ? (part / whole) * 100 : 0}%`;

/* ===================== markdown ===================== */
marked.setOptions({ gfm: true, breaks: false });

const render = md => {
  const box = el('div', 'prose', marked.parse(md));

  for (const table of box.querySelectorAll('table')) {
    const wrap = el('div', 'tablewrap');
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  }

  for (const code of box.querySelectorAll('pre code')) {
    const [, lang] = code.className.match(/language-([\w-]+)/) ?? [];
    if (lang === 'mermaid') { code.parentElement.className = 'mermaid'; continue; }
    try {
      const { value } = lang && hljs.getLanguage(lang)
        ? hljs.highlight(code.textContent, { language: lang })
        : hljs.highlightAuto(code.textContent);
      code.innerHTML = value;
      code.classList.add('hljs');
    } catch {
      /* tô màu hỏng thì để nguyên văn bản thuần */
    }
  }
  return box;
};

  set: (key, value) => {

};

const saveQuiz = () => { LS.set('quiz', state.quizRes); queueLinkedWrite(); };
const saveProgress = () => {
  LS.set('status', state.status);
  LS.set('route', state.route);
  queueLinkedWrite();
};

/* ===================== thống kê ===================== */
const statOf = id => state.status[id] ?? 'none';

const tally = list => {
  const counts = { known: 0, vague: 0, none: 0 };
  for (const { id } of list) counts[statOf(id)]++;
  return counts;
};

const noteCount = () => Object.values(state.notes).filter(t => t?.trim()).length;
const hasNote = id => Boolean(state.notes[id]?.trim());

/* ===================== trắc nghiệm: dữ liệu ===================== */
const qzRes = id => state.quizRes[id];
const qzDone = () => Object.keys(state.quizRes).length;
const qzRight = () => Object.values(state.quizRes).filter(({ ok }) => ok).length;
const qzWrongIds = () => QUIZ.filter(({ id }) => qzRes(id) && !qzRes(id).ok).map(({ id }) => id);
const qzNewIds = () => QUIZ.filter(({ id }) => !qzRes(id)).map(({ id }) => id);

const qzPool = () => {
  const { quizPick } = state;
  if (quizPick === 'all') return QUIZ.map(({ id }) => id);
  if (quizPick === 'wrong') return qzWrongIds();
  if (quizPick === 'new') return qzNewIds();
  return QUIZ.filter(({ topic }) => topic === quizPick).map(({ id }) => id);
};

const shuffled = list => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};

const toTop = () => window.scrollTo({ top: 0, behavior: 'instant' });

const startQuiz = (ids, len = 0) => {
  const picked = shuffled(ids);
  state.quiz = { ids: len ? picked.slice(0, len) : picked, i: 0, picked: null, right: 0 };
  draw();
  toTop();
};

const pickAnswer = key => {
  const { quiz } = state;
  if (quiz.picked) return;
  const q = QUIZ_BY_ID.get(quiz.ids[quiz.i]);
  const ok = key === q.ans;
  quiz.picked = key;
  if (ok) quiz.right++;
  state.quizRes[q.id] = { picked: key, ok, at: Date.now() };
  saveQuiz();
  draw();
};

const nextQuestion = () => {
  state.quiz.i++;
  state.quiz.picked = null;
  draw();
  toTop();
};

/* ===================== khung ===================== */
const MODES = [
  { id: 'today', label: 'Hôm nay' },
  { id: 'giaoan', label: 'Giáo án' },
  { id: 'playbook', label: 'Playbook' },
  { id: 'quiz', label: 'Trắc nghiệm' },
  { id: 'algo', label: 'Thuật toán' },
  { id: 'notes', label: 'Ghi chú' },
];

const modeTick = id => {
  if (id === 'giaoan') {
    const { known, vague } = tally(QUESTIONS);
    return `${known + vague}/${QUESTIONS.length}`;
  }
  if (id === 'quiz') return `${qzDone()}/${QUIZ.length}`;
  if (id === 'notes') return `${noteCount()}`;
  return '';
};

const drawModes = () => {
  const nav = document.getElementById('modes');
  nav.replaceChildren();

  for (const { id, label } of MODES) {
    const tick = modeTick(id);
    const btn = el('button', 'mode', `<span>${label}</span>${tick ? `<span class="tick">${tick}</span>` : ''}`);
    btn.setAttribute('aria-current', state.mode === id);
    btn.onclick = () => go({ mode: id, question: null, section: null, docsec: null });
    nav.appendChild(btn);
  }

  const railsec = document.getElementById('railsec');
  railsec.hidden = state.mode !== 'giaoan';
  if (railsec.hidden) return;

  const list = document.getElementById('seclist');
  list.replaceChildren();

  const all = el('button', 'secbtn', `<div class="row"><span class="nm">Tất cả</span><span class="ct">${QUESTIONS.length}</span></div>`);
  all.setAttribute('aria-current', state.section === null && !state.docsec);
  all.onclick = () => go({ section: null, question: null, docsec: null });
  list.appendChild(all);

  for (const { title, questions } of SECTIONS) {
    const { known, vague } = tally(questions);
    const n = questions.length;
    const btn = el('button', 'secbtn', `
      <div class="row"><span class="nm">${esc(shortSec(title))}</span><span class="ct">${n}</span></div>
      <div class="bar"><i class="k" style="width:${width(known, n)}"></i><i class="v" style="width:${width(vague, n)}"></i></div>`);
    btn.setAttribute('aria-current', state.section === title);
    btn.onclick = () => go({ section: title, question: null, docsec: null });
    list.appendChild(btn);
  }

  for (const { key, label } of DOCSECS) {
    const btn = el('button', 'secbtn', `<div class="row"><span class="nm">${esc(label)}</span><span class="ct">·</span></div>`);
    btn.setAttribute('aria-current', state.docsec === key);
    btn.onclick = () => go({ docsec: key, section: null, question: null });
    list.appendChild(btn);
  }
};

const go = patch => {
  Object.assign(state, patch);
  if (patch.mode && patch.mode !== 'giaoan') {
    state.query = '';
    state.docsec = null;
  }
  if (patch.mode && patch.mode !== 'quiz') state.quiz = null;
  closeRail();
  draw();
  toTop();
};

const draw = () => {
  drawModes();
  const page = document.getElementById('page');
  page.replaceChildren();

  if (state.question) return page.appendChild(viewQuestion(BY_ID.get(state.question)));
  if (state.mode === 'giaoan' && state.docsec) {
    return page.appendChild(viewDoc(DOCSECS.find(({ key }) => key === state.docsec)?.md ?? ''));
  }

  const views = {
    today: viewToday,
    giaoan: viewList,
    playbook: () => viewDoc(MD.playbook),
    quiz: viewQuiz,
    algo: () => viewDoc(MD.algo),
    notes: viewNotes,
  };
  page.appendChild((views[state.mode] ?? viewToday)());
};
