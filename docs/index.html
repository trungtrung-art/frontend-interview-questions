","group":"SENIOR LEVEL","title":"Portals","prompt":"**Khi nào sử dụng React Portals?**","opts":[{"k":"A","t":"Render children vào DOM node khác ngoài parent hierarchy"},{"k":"B","t":"Để state management"},{"k":"C","t":"Để code splitting"},{"k":"D","t":"Để routing"}],"ans":"A","expl":"**Giải thích:**\n- Portals render children vào DOM node khác\n- Use cases: modals, tooltips, dropdowns\n- Events vẫn bubble up qua React tree\n\n```jsx\nfunction Modal({ children }) {\n  return ReactDOM.createPortal(\n    children,\n    document.getElementById('modal-root')\n  );\n}\n```\n\n**Tham khảo:** [React - createPortal](https://react.dev/reference/react-dom/createPortal)\n\n---"},{"id":"02-28","topic":"ReactJS","group":"SENIOR LEVEL","title":"useLayoutEffect vs useEffect","prompt":"**Sự khác biệt chính?**","opts":[{"k":"A","t":"Không có sự khác biệt"},{"k":"B","t":"useEffect chạy trước useLayoutEffect"},{"k":"C","t":"useLayoutEffect chạy synchronously sau DOM mutations, trước browser paint"},{"k":"D","t":"useLayoutEffect không có cleanup function"}],"ans":"C","expl":"**Giải thích:**\n- `useLayoutEffect`: Fires synchronously after DOM mutations, BEFORE browser paint\n- `useEffect`: Fires asynchronously AFTER browser paint\n- useLayoutEffect cho DOM measurements, prevent flicker\n\n```jsx\n// useLayoutEffect: Measure DOM before paint\nuseLayoutEffect(() => {\n  const { height } = ref.current.getBoundingClientRect();\n  setHeight(height);\n}, []);\n\n// useEffect: Most cases, doesn't block paint\nuseEffect(() => {\n  fetchData();\n}, []);\n```\n\n**Tham khảo:** [React - useLayoutEffect](https://react.dev/reference/react/useLayoutEffect)\n\n---"},{"id":"02-29","topic":"ReactJS","group":"SENIOR LEVEL","title":"Strict Mode","prompt":"**React.StrictMode làm gì?**","opts":[{"k":"A","t":"Enforce TypeScript"},{"k":"B","t":"Enable production optimizations"},{"k":"C","t":"Double-invoke functions để detect side effects, warn về deprecated APIs"},{"k":"D","t":"Handle errors"}],"ans":"C","expl":"**Giải thích:**\nStrictMode in development:\n- Double-invokes components, effects, reducers to find bugs\n- Warns about deprecated APIs\n- Warns about legacy string refs\n- Helps detect side effects\n\n```jsx\n\u003CReact.StrictMode>\n  \u003CApp />\n\u003C/React.StrictMode>\n```\n\n**Tham khảo:** [React - StrictMode](https://react.dev/reference/react/StrictMode)\n\n---"},{"id":"02-30","topic":"ReactJS","group":"SENIOR LEVEL","title":"Performance Optimization","prompt":"**Cách nào KHÔNG phải là best practice cho performance trong React?**","opts":[{"k":"A","t":"Virtualization cho long lists"},{"k":"B","t":"Memoize tất cả functions với useCallback"},{"k":"C","t":"Sử dụng React.memo cho pure components"},{"k":"D","t":"Code splitting với React.lazy"}],"ans":"B","expl":"**Giải thích:**\n- Over-memoization is an anti-pattern\n- useCallback có cost: dependency comparison mỗi render\n- Chỉ memoize khi cần: pass to memoized children, trong dependency arrays\n\n**Good practices:**\n- React.memo cho components nhận stable props\n- Virtualization (react-window, react-virtualized)\n- Code splitting với React.lazy\n- Proper key usage\n- Avoid inline objects/arrays in props\n\n**Tham khảo:** [React - Performance](https://react.dev/learn/render-and-commit)\n\n---"},{"id":"02-31","topic":"ReactJS","group":"SENIOR LEVEL","title":"State Colocation","prompt":"**\"State Colocation\" principle là gì?**","opts":[{"k":"A","t":"Chỉ sử dụng local state"},{"k":"B","t":"Đặt tất cả state ở global store"},{"k":"C","t":"Chỉ sử dụng Context"},{"k":"D","t":"Đặt state gần nhất với nơi sử dụng nó"}],"ans":"D","expl":"**Giải thích:**\n- State Colocation: Đặt state gần nhất với nơi cần nó\n- Don't lift state higher than necessary\n- Improves performance và maintainability\n\n```jsx\n// ❌ State too high - causes unnecessary re-renders\nfunction App() {\n  const [searchTerm, setSearchTerm] = useState('');\n  return (\n    \u003CHeader />  {/* Re-renders unnecessarily */}\n    \u003CSearchInput value={searchTerm} onChange={setSearchTerm} />\n  );\n}\n\n// ✅ State colocated\nfunction App() {\n  return (\n    \u003CHeader />\n    \u003CSearchSection />  {/* State inside */}\n  );\n}\n```\n\n**Tham khảo:** [Kent C. Dodds - State Colocation](https://kentcdodds.com/blog/state-colocation-will-make-your-react-app-faster)\n\n---"},{"id":"02-32","topic":"ReactJS","group":"SENIOR LEVEL","title":"Render Props vs HOC vs Hooks","prompt":"**Ưu điểm của Custom Hooks so với HOC và Render Props?**","opts":[{"k":"A","t":"Performance tốt hơn"},{"k":"B","t":"Tránh wrapper hell, share logic dễ dàng hơn"},{"k":"C","t":"Chỉ hoạt động với class components"},{"k":"D","t":"Không có ưu điểm"}],"ans":"B","expl":"**Giải thích:**\n- Custom Hooks tránh wrapper hell (HOC, Render Props)\n- Dễ compose và share logic\n- Better TypeScript support\n- Easier to test\n\n```jsx\n// HOC - wrapper hell\nexport default withAuth(withTheme(withRouter(MyComponent)));\n\n// Render Props - nested callbacks\n\u003CAuth>\n  {user => (\n    \u003CTheme>\n      {theme => \u003CMyComponent user={user} theme={theme} />}\n    \u003C/Theme>\n  )}\n\u003C/Auth>\n\n// Custom Hooks - clean và composable\nfunction MyComponent() {\n  const user = useAuth();\n  const theme = useTheme();\n  // ...\n}\n```\n\n---"},{"id":"02-33","topic":"ReactJS","group":"SENIOR LEVEL","title":"Batching","prompt":"**Automatic batching trong React 18 là gì?**\n\n```jsx\nfunction handleClick() {\n  setCount(c => c + 1);\n  setFlag(f => !f);\n  // Trong React 18, bao nhiêu re-renders?\n}\n```","opts":[{"k":"A","t":"1 re-render (batched)"},{"k":"B","t":"Depends on environment"},{"k":"C","t":"0 re-renders"},{"k":"D","t":"2 re-renders"}],"ans":"A","expl":"**Giải thích:**\n- React 18 automatic batching: batch ALL updates\n- Trước React 18: chỉ batch trong React event handlers\n- Bây giờ: batch trong promises, setTimeout, native events\n\n```jsx\n// React 18: All batched into 1 re-render\nfunction handleClick() {\n  setCount(c => c + 1);\n  setFlag(f => !f);\n}\n\n// Even in async code\nsetTimeout(() => {\n  setCount(c => c + 1);\n  setFlag(f => !f);\n  // Still 1 re-render!\n}, 1000);\n\n// Opt-out với flushSync\nimport { flushSync } from 'react-dom';\nflushSync(() => setCount(c => c + 1)); // Force immediate render\nsetFlag(f => !f); // Separate render\n```\n\n**Tham khảo:** [React 18 - Automatic Batching](https://react.dev/blog/2022/03/29/react-v18#new-feature-automatic-batching)\n\n---"},{"id":"02-34","topic":"ReactJS","group":"SENIOR LEVEL","title":"useTransition","prompt":"**useTransition hook được sử dụng cho?**","opts":[{"k":"A","t":"CSS transitions"},{"k":"B","t":"Mark state updates as non-urgent, keep UI responsive"},{"k":"C","t":"Data fetching"},{"k":"D","t":"Route transitions"}],"ans":"B","expl":"**Giải thích:**\n- useTransition marks updates as non-urgent\n- UI remains responsive\n- Shows pending state while transitioning\n\n```jsx\nfunction SearchResults() {\n  const [isPending, startTransition] = useTransition();\n  const [query, setQuery] = useState('');\n\n  function handleChange(e) {\n    // Urgent: Update input immediately\n    setInputValue(e.target.value);\n\n    // Non-urgent: Update results (can be interrupted)\n    startTransition(() => {\n      setQuery(e.target.value);\n    });\n  }\n\n  return (\n    \u003C>\n      \u003Cinput onChange={handleChange} />\n      {isPending && \u003CSpinner />}\n      \u003CResults query={query} />\n    \u003C/>\n  );\n}\n```\n\n**Tham khảo:** [React - useTransition](https://react.dev/reference/react/useTransition)\n\n---"},{"id":"02-35","topic":"ReactJS","group":"SENIOR LEVEL","title":"useDeferredValue","prompt":"**Khi nào sử dụng useDeferredValue?**","opts":[{"k":"A","t":"Để cache values"},{"k":"B","t":"Để routing"},{"k":"C","t":"Để handle forms"},{"k":"D","t":"Để delay rendering của expensive computations\n---"}],"ans":"D","expl":"**Giải thích:**\n- useDeferredValue defers updating part of UI\n- Shows \"stale\" value while new value is computing\n- Good for expensive renders\n\n```jsx\nfunction SearchResults({ query }) {\n  // deferredQuery lags behind query\n  const deferredQuery = useDeferredValue(query);\n  const isStale = query !== deferredQuery;\n\n  return (\n    \u003Cdiv style={{ opacity: isStale ? 0.5 : 1 }}>\n      \u003CExpensiveList query={deferredQuery} />\n    \u003C/div>\n  );\n}\n```\n\n**Tham khảo:** [React - useDeferredValue](https://react.dev/reference/react/useDeferredValue)\n\n---"},{"id":"03-1","topic":"Performance","group":"WEB VITALS & METRICS","title":"Core Web Vitals","prompt":"**Core Web Vitals bao gồm những metrics nào?**","opts":[{"k":"A","t":"FCP, TTI, TBT"},{"k":"B","t":"TTFB, FMP, SI"},{"k":"C","t":"LCP, FID, CLS"},{"k":"D","t":"DCL, Load, FCP"}],"ans":"C","expl":"**Giải thích:**\nCore Web Vitals (Google's key metrics):\n- **LCP (Largest Contentful Paint):** Loading performance - khi largest content element visible\n- **FID (First Input Delay):** Interactivity - time từ first interaction đến browser response\n- **CLS (Cumulative Layout Shift):** Visual stability - unexpected layout shifts\n\n*Note: FID đang được thay thế bởi INP (Interaction to Next Paint) từ March 2024*\n\n**Tham khảo:** [web.dev - Core Web Vitals](https://web.dev/vitals/)\n\n---"},{"id":"03-2","topic":"Performance","group":"WEB VITALS & METRICS","title":"LCP (Largest Contentful Paint)","prompt":"**LCP tốt được coi là bao nhiêu?**","opts":[{"k":"A","t":"\u003C 5.0 giây"},{"k":"B","t":"\u003C 2.5 giây"},{"k":"C","t":"\u003C 1.0 giây"},{"k":"D","t":"\u003C 4.0 giây"}],"ans":"B","expl":"**Giải thích:**\nLCP thresholds:\n- **Good:** ≤ 2.5s\n- **Needs Improvement:** 2.5s - 4.0s\n- **Poor:** > 4.0s\n\n**Improve LCP:**\n- Optimize server response time\n- Eliminate render-blocking resources\n- Optimize images\n- Preload important resources\n\n**Tham khảo:** [web.dev - LCP](https://web.dev/lcp/)\n\n---"},{"id":"03-3","topic":"Performance","group":"WEB VITALS & METRICS","title":"CLS (Cumulative Layout Shift)","prompt":"**Nguyên nhân chính gây ra CLS cao?**","opts":[{"k":"A","t":"Server response time chậm"},{"k":"B","t":"JavaScript execution time dài"},{"k":"C","t":"Images không có dimensions, late-loading content, dynamic injected content"},{"k":"D","t":"Large JavaScript bundles"}],"ans":"C","expl":"**Giải thích:**\nCommon causes of CLS:\n1. **Images without dimensions:** Browser doesn't know space to reserve\n2. **Ads, embeds, iframes without dimensions**\n3. **Dynamically injected content**\n4. **Web fonts causing FOIT/FOUT**\n5. **Actions waiting for network before updating DOM**\n\n**Fix:**\n```html\n\u003C!-- Always include width and height -->\n\u003Cimg src=\"image.jpg\" width=\"640\" height=\"480\" alt=\"...\" />\n\n\u003C!-- Or use aspect-ratio -->\n\u003Cstyle>\nimg {\n  aspect-ratio: 16 / 9;\n  width: 100%;\n  height: auto;\n}\n\u003C/style>\n```\n\n**Tham khảo:** [web.dev - CLS](https://web.dev/cls/)\n\n---"},{"id":"03-4","topic":"Performance","group":"WEB VITALS & METRICS","title":"FID vs INP","prompt":"**Sự khác biệt giữa FID (First Input Delay) và INP (Interaction to Next Paint)?**","opts":[{"k":"A","t":"INP chỉ đo click events"},{"k":"B","t":"FID đo first interaction, INP đo overall interaction responsiveness"},{"k":"C","t":"Không có sự khác biệt"},{"k":"D","t":"FID accurate hơn INP"}],"ans":"B","expl":"**Giải thích:**\n- **FID:** Measures delay của FIRST interaction only\n- **INP:** Measures responsiveness của ALL interactions throughout page lifecycle\n- INP là metric toàn diện hơn, captures overall interactivity\n\n**Tham khảo:** [web.dev - INP](https://web.dev/inp/)\n\n---"},{"id":"03-5","topic":"Performance","group":"WEB VITALS & METRICS","title":"TTFB","prompt":"**TTFB (Time to First Byte) đo gì?**","opts":[{"k":"A","t":"Thời gian parse HTML"},{"k":"B","t":"Thời gian từ request đến byte đầu tiên của response"},{"k":"C","t":"Thời gian render page"},{"k":"D","t":"Thời gian download tất cả resources"}],"ans":"B","expl":"**Giải thích:**\nTTFB measures time from:\n1. Request start\n2. → DNS lookup\n3. → TCP connection\n4. → SSL handshake\n5. → Server processing\n6. → First byte of response\n\n**Improve TTFB:**\n- Use CDN\n- Optimize server code\n- Use caching\n- Reduce redirects\n\n**Tham khảo:** [web.dev - TTFB](https://web.dev/ttfb/)\n\n---"},{"id":"03-6","topic":"Performance","group":"JAVASCRIPT PERFORMANCE","title":"Main Thread Blocking","prompt":"**Cách nào tốt nhất để tránh block main thread với heavy computation?**","opts":[{"k":"A","t":"Sử dụng setTimeout với delay 0"},{"k":"B","t":"Sử dụng Promise.all"},{"k":"C","t":"Sử dụng Web Workers"},{"k":"D","t":"Sử dụng async/await"}],"ans":"C","expl":"**Giải thích:**\n- Web Workers run in separate thread\n- Don't block main thread\n- Perfect cho heavy computations\n\n```javascript\n// main.js\nconst worker = new Worker('worker.js');\nworker.postMessage({ data: largeArray });\nworker.onmessage = (e) => {\n  console.log('Result:', e.data);\n};\n\n// worker.js\nself.onmessage = (e) => {\n  const result = heavyComputation(e.data);\n  self.postMessage(result);\n};\n```\n\n**Alternatives:**\n- `requestIdleCallback` cho low-priority tasks\n- Breaking work into chunks với `setTimeout`\n\n**Tham khảo:** [MDN - Web Workers](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API)\n\n---"},{"id":"03-7","topic":"Performance","group":"JAVASCRIPT PERFORMANCE","title":"Memory Management","prompt":"**Đoạn code nào có thể gây memory leak?**","opts":[{"k":"A","t":"```javascript\nfunction createHandler() {\n  const data = new Array(1000000);\n  return () => console.log('clicked');\n}\nelement.addEventListener('click', createHandler());\n```"},{"k":"B","t":"```javascript\nfunction createHandler() {\n  const data = new Array(1000000);\n  return () => console.log(data.length);\n}\nelement.addEventListener('click', createHandler());\n```"},{"k":"C","t":"Cả A và B"},{"k":"D","t":"Không có đoạn nào"}],"ans":"B","expl":"**Giải thích:**\n- **Option A:** `data` không được reference trong closure → garbage collected\n- **Option B:** `data` được reference trong closure → CANNOT be garbage collected\n\n```javascript\n// Memory leak - data array cannot be freed\nfunction createHandler() {\n  const data = new Array(1000000); // 1MB+\n  return () => console.log(data.length); // References data\n}\n// Every call creates new handler holding 1MB\n```\n\n**Prevention:**\n```javascript\n// Only capture what you need\nfunction createHandler() {\n  const data = new Array(1000000);\n  const length = data.length; // Capture only needed value\n  return () => console.log(length);\n}\n```\n\n**Tham khảo:** [Chrome DevTools - Memory](https://developer.chrome.com/docs/devtools/memory-problems/)\n\n---"},{"id":"03-8","topic":"Performance","group":"JAVASCRIPT PERFORMANCE","title":"Event Delegation Performance","prompt":"**Tại sao Event Delegation tốt hơn cho performance?**","opts":[{"k":"A","t":"Tăng FCP"},{"k":"B","t":"Giảm số lượng event listeners, tiết kiệm memory"},{"k":"C","t":"Giảm JavaScript bundle size"},{"k":"D","t":"Tăng tốc độ event bubbling"}],"ans":"B","expl":"**Giải thích:**\nEvent Delegation benefits:\n1. **Fewer event listeners** → Less memory\n2. **Works with dynamic elements** → No need to re-attach\n3. **Single point of handling** → Easier maintenance\n\n```javascript\n// ❌ Bad: 1000 listeners\nitems.forEach(item => {\n  item.addEventListener('click', handleClick);\n});\n\n// ✅ Good: 1 listener\ncontainer.addEventListener('click', (e) => {\n  if (e.target.matches('.item')) {\n    handleClick(e);\n  }\n});\n```\n\n---"},{"id":"03-9","topic":"Performance","group":"JAVASCRIPT PERFORMANCE","title":"requestAnimationFrame","prompt":"**Khi nào nên sử dụng requestAnimationFrame?**","opts":[{"k":"A","t":"Cho tất cả async operations"},{"k":"B","t":"Thay thế setTimeout"},{"k":"C","t":"Cho API calls"},{"k":"D","t":"Cho animations và DOM updates cần sync với browser repaint"}],"ans":"D","expl":"**Giải thích:**\n`requestAnimationFrame`:\n- Syncs với browser's repaint cycle (typically 60fps)\n- Browser can optimize and batch\n- Pauses when tab is inactive\n\n```javascript\n// Smooth animation\nfunction animate() {\n  element.style.transform = `translateX(${x}px)`;\n  x += 1;\n  if (x \u003C 100) {\n    requestAnimationFrame(animate);\n  }\n}\nrequestAnimationFrame(animate);\n\n// Efficient DOM reads/writes\nrequestAnimationFrame(() => {\n  // Batch reads\n  const width = element.offsetWidth;\n  const height = element.offsetHeight;\n\n  // Then batch writes\n  element.style.transform = `translate(${width}px, ${height}px)`;\n});\n```\n\n**Tham khảo:** [MDN - requestAnimationFrame](https://developer.mozilla.org/en-US/docs/Web/API/window/requestAnimationFrame)\n\n---"},{"id":"03-10","topic":"Performance","group":"JAVASCRIPT PERFORMANCE","title":"Script Loading","prompt":"**Sự khác biệt giữa `async` và `defer` trong script loading?**","opts":[{"k":"A","t":"Cả hai đều block HTML parsing"},{"k":"B","t":"`async` execute ngay khi download xong, `defer` chờ HTML parsing xong"},{"k":"C","t":"`defer` execute ngay khi download xong, `async` chờ HTML parsing xong"},{"k":"D","t":"Không có sự khác biệt"}],"ans":"B","expl":"**Giải thích:**\n\n| Attribute | Download | Execute | Blocks HTML |\n|-----------|----------|---------|-------------|\n| None | When encountered | Immediately | Yes |\n| `async` | Parallel | When ready | Partially |\n| `defer` | Parallel | After HTML parsed | No |\n\n```html\n\u003C!-- Blocks parsing -->\n\u003Cscript src=\"script.js\">\u003C/script>\n\n\u003C!-- Download parallel, execute when ready (order not guaranteed) -->\n\u003Cscript async src=\"analytics.js\">\u003C/script>\n\n\u003C!-- Download parallel, execute after parsing (order preserved) -->\n\u003Cscript defer src=\"app.js\">\u003C/script>\n```\n\n**Best practices:**\n- `defer` for scripts that depend on DOM\n- `async` for independent scripts (analytics)\n\n**Tham khảo:** [JavaScript.info - Scripts async defer](https://javascript.info/script-async-defer)\n\n---"},{"id":"03-11","topic":"Performance","group":"REACT PERFORMANCE","title":"Unnecessary Re-renders","prompt":"**Cách nào giúp tránh unnecessary re-renders?**","opts":[{"k":"A","t":"Sử dụng React.memo"},{"k":"B","t":"Sử dụng useMemo và useCallback appropriately"},{"k":"C","t":"Tránh inline objects/functions trong props"},{"k":"D","t":"Tất cả các đáp án trên"}],"ans":"D","expl":"**Giải thích:**\n\n```jsx\n// 1. React.memo - prevent re-render if props same\nconst MemoizedComponent = React.memo(Component);\n\n// 2. useMemo - cache expensive computations\nconst expensiveValue = useMemo(() => compute(a, b), [a, b]);\n\n// 3. useCallback - stable function reference\nconst handleClick = useCallback(() => {\n  doSomething(id);\n}, [id]);\n\n// 4. Avoid inline objects/functions\n// ❌ Bad - new object every render\n\u003CComponent style={{ color: 'red' }} />\n\n// ✅ Good - stable reference\nconst style = useMemo(() => ({ color: 'red' }), []);\n\u003CComponent style={style} />\n```\n\n**Tham khảo:** [React - Performance](https://react.dev/learn/render-and-commit)\n\n---"},{"id":"03-12","topic":"Performance","group":"REACT PERFORMANCE","title":"React Profiler","prompt":"**React Profiler đo những gì?**","opts":[{"k":"A","t":"Memory usage"},{"k":"B","t":"Network requests"},{"k":"C","t":"Render time và commit phases"},{"k":"D","t":"Bundle size"}],"ans":"C","expl":"**Giải thích:**\nReact Profiler measures:\n- **Render phase:** Component render times\n- **Commit phase:** Time để apply changes to DOM\n- Which components rendered và why\n- Wasted renders\n\n```jsx\n\u003CProfiler id=\"App\" onRender={onRenderCallback}>\n  \u003CApp />\n\u003C/Profiler>\n\nfunction onRenderCallback(\n  id,           // Profiler tree id\n  phase,        // \"mount\" | \"update\"\n  actualDuration,  // Time spent rendering\n  baseDuration,    // Estimated time without memoization\n  startTime,\n  commitTime,\n) {\n  console.log({ id, phase, actualDuration });\n}\n```\n\n**Tham khảo:** [React - Profiler](https://react.dev/reference/react/Profiler)\n\n---"},{"id":"03-13","topic":"Performance","group":"REACT PERFORMANCE","title":"Virtualization","prompt":"**Khi nào nên sử dụng virtualization (react-window, react-virtuoso)?**","opts":[{"k":"A","t":"Chỉ cho infinite scroll"},{"k":"B","t":"Khi render large lists (100+ items) với complex components"},{"k":"C","t":"Cho tất cả lists"},{"k":"D","t":"Khi sử dụng pagination"}],"ans":"B","expl":"**Giải thích:**\nVirtualization renders only visible items:\n- **When to use:** 100+ items với complex components\n- **Benefits:** Constant render time regardless of list size\n\n```jsx\nimport { FixedSizeList } from 'react-window';\n\nfunction VirtualList({ items }) {\n  return (\n    \u003CFixedSizeList\n      height={400}\n      width={300}\n      itemCount={items.length}\n      itemSize={50}\n    >\n      {({ index, style }) => (\n        \u003Cdiv style={style}>{items[index].name}\u003C/div>\n      )}\n    \u003C/FixedSizeList>\n  );\n}\n```\n\n**Libraries:**\n- `react-window` (lighter)\n- `react-virtuoso` (more features)\n- `@tanstack/react-virtual`\n\n---"},{"id":"03-14","topic":"Performance","group":"REACT PERFORMANCE","title":"Code Splitting Impact","prompt":"**Code splitting giúp improve metric nào nhất?**","opts":[{"k":"A","t":"TTFB"},{"k":"B","t":"CLS"},{"k":"C","t":"FID"},{"k":"D","t":"TTI (Time to Interactive) và FCP"}],"ans":"D","expl":"**Giải thích:**\nCode splitting improves:\n- **FCP:** Faster initial render với smaller initial bundle\n- **TTI:** Page becomes interactive sooner\n- **LCP:** Can improve if critical content loads faster\n\n```jsx\n// Route-based splitting\nconst Home = lazy(() => import('./Home'));\nconst Dashboard = lazy(() => import('./Dashboard'));\n\n// Component-based splitting\nconst HeavyChart = lazy(() => import('./HeavyChart'));\n```\n\n---"},{"id":"03-15","topic":"Performance","group":"REACT PERFORMANCE","title":"State Management Performance","prompt":"**Điều nào gây performance issues trong state management?**","opts":[{"k":"A","t":"Storing too much data in global state"},{"k":"B","t":"Not normalizing data"},{"k":"C","t":"Re-rendering entire tree khi một phần state thay đổi"},{"k":"D","t":"Tất cả các đáp án trên"}],"ans":"D","expl":"**Giải thích:**\n\n1. **Too much global state:**\n```jsx\n// ❌ Everything in global store\nconst store = { user, posts, comments, ui, forms, ... };\n\n// ✅ Colocate state\n// Only truly global data in store\n```\n\n2. **Not normalizing:**\n```jsx\n// ❌ Nested data - hard to update\n{ posts: [{ id: 1, comments: [...] }] }\n\n// ✅ Normalized\n{\n  posts: { 1: { id: 1, commentIds: [1, 2] } },\n  comments: { 1: {...}, 2: {...} }\n}\n```\n\n3. **Re-rendering entire tree:**\n```jsx\n// ✅ Use selectors to minimize re-renders\nconst user = useSelector(state => state.user.name);\n// NOT: useSelector(state => state.user)\n```\n\n---"},{"id":"03-16","topic":"Performance","group":"NETWORK & LOADING","title":"Resource Hints","prompt":"**Sự khác biệt giữa preload, prefetch, và preconnect?**","opts":[{"k":"A","t":"preload: high priority current page, prefetch: low priority future navigation, preconnect: establish connection early"},{"k":"B","t":"Không có sự khác biệt"},{"k":"C","t":"Chỉ khác về browser support"},{"k":"D","t":"Tất cả đều load resources ngay lập tức"}],"ans":"A","expl":"**Giải thích:**\n\n```html\n\u003C!-- Preconnect: Establish connection early (DNS, TCP, TLS) -->\n\u003Clink rel=\"preconnect\" href=\"https://api.example.com\">\n\n\u003C!-- Preload: High priority, current page, specific resource -->\n\u003Clink rel=\"preload\" href=\"/critical.css\" as=\"style\">\n\u003Clink rel=\"preload\" href=\"/hero.jpg\" as=\"image\">\n\n\u003C!-- Prefetch: Low priority, future navigation -->\n\u003Clink rel=\"prefetch\" href=\"/next-page.js\">\n\n\u003C!-- DNS-prefetch: Only DNS lookup -->\n\u003Clink rel=\"dns-prefetch\" href=\"https://cdn.example.com\">\n```\n\n**Tham khảo:** [web.dev - Resource Hints](https://web.dev/preconnect-and-dns-prefetch/)\n\n---"},{"id":"03-17","topic":"Performance","group":"NETWORK & LOADING","title":"Image Optimization","prompt":"**Cách nào KHÔNG phải best practice cho image optimization?**","opts":[{"k":"A","t":"Sử dụng modern formats (WebP, AVIF)"},{"k":"B","t":"Load tất cả images ở highest quality"},{"k":"C","t":"Lazy loading với `loading=\"lazy\"`"},{"k":"D","t":"Responsive images với srcset"}],"ans":"B","expl":"**Giải thích:**\nImage optimization best practices:\n\n```html\n\u003C!-- 1. Modern formats -->\n\u003Cpicture>\n  \u003Csource srcset=\"image.avif\" type=\"image/avif\">\n  \u003Csource srcset=\"image.webp\" type=\"image/webp\">\n  \u003Cimg src=\"image.jpg\" alt=\"...\">\n\u003C/picture>\n\n\u003C!-- 2. Lazy loading -->\n\u003Cimg src=\"image.jpg\" loading=\"lazy\" alt=\"...\">\n\n\u003C!-- 3. Responsive images -->\n\u003Cimg\n  srcset=\"small.jpg 300w, medium.jpg 600w, large.jpg 1200w\"\n  sizes=\"(max-width: 600px) 300px, (max-width: 1200px) 600px, 1200px\"\n  src=\"medium.jpg\"\n  alt=\"...\"\n>\n\n\u003C!-- 4. Proper dimensions -->\n\u003Cimg src=\"image.jpg\" width=\"800\" height=\"600\" alt=\"...\">\n```\n\n---"},{"id":"03-18","topic":"Performance","group":"NETWORK & LOADING","title":"HTTP/2 & HTTP/3","prompt":"**Ưu điểm của HTTP/2 so với HTTP/1.1?**","opts":[{"k":"A","t":"Multiplexing - multiple requests trên single connection"},{"k":"B","t":"Header compression"},{"k":"C","t":"Server push"},{"k":"D","t":"Tất cả các đáp án trên"}],"ans":"D","expl":"**Giải thích:**\nHTTP/2 improvements:\n1. **Multiplexing:** Multiple requests/responses trên single connection\n2. **Header compression:** HPACK compression\n3. **Server push:** Push resources before client requests\n4. **Binary protocol:** More efficient parsing\n\nHTTP/3 adds:\n- QUIC protocol (UDP-based)\n- Better performance on unreliable networks\n- Faster connection establishment\n\n---"},{"id":"03-19","topic":"Performance","group":"NETWORK & LOADING","title":"Caching Strategies","prompt":"**Cache-Control header nào cho phép browser cache và revalidate?**","opts":[{"k":"A","t":"`no-store`"},{"k":"B","t":"`no-cache`"},{"k":"C","t":"`max-age=0`"},{"k":"D","t":"B và C đều đúng"}],"ans":"D","expl":"**Giải thích:**\n\n```\nCache-Control: no-store\n→ Don't cache at all\n\nCache-Control: no-cache\n→ Cache but always revalidate before use\n\nCache-Control: max-age=0\n→ Same as no-cache, must revalidate\n\nCache-Control: max-age=31536000, immutable\n→ Cache for 1 year, never revalidate (for versioned assets)\n```\n\n**Strategy:**\n```\n# HTML - always fresh\nCache-Control: no-cache\n\n# JS/CSS with hash - cache forever\nCache-Control: max-age=31536000, immutable\n\n# API responses - short cache\nCache-Control: max-age=60, stale-while-revalidate=600\n```\n\n**Tham khảo:** [MDN - Cache-Control](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control)\n\n---"},{"id":"03-20","topic":"Performance","group":"NETWORK & LOADING","title":"Bundle Optimization","prompt":"**Cách nào giúp giảm JavaScript bundle size?**","opts":[{"k":"A","t":"Tree shaking"},{"k":"B","t":"Code splitting"},{"k":"C","t":"Minification và compression"},{"k":"D","t":"Tất cả các đáp án trên"}],"ans":"D","expl":"**Giải thích:**\n\n1. **Tree shaking:** Remove unused code\n```javascript\n// Only imports what's used\nimport { debounce } from 'lodash-es';\n```\n\n2. **Code splitting:** Load on demand\n```javascript\nconst Dashboard = lazy(() => import('./Dashboard'));\n```\n\n3. **Minification & Compression:**\n- Terser cho JS minification\n- Gzip/Brotli compression\n- Remove dead code, comments\n\n**Analysis tools:**\n- `webpack-bundle-analyzer`\n- `source-map-explorer`\n\n---"},{"id":"03-21","topic":"Performance","group":"RENDERING & BROWSER","title":"Critical Rendering Path","prompt":"**Thứ tự đúng của Critical Rendering Path?**","opts":[{"k":"A","t":"DOM → Layout → Paint → CSSOM → Composite"},{"k":"B","t":"DOM → Paint → Layout → CSSOM → Composite"},{"k":"C","t":"DOM → CSSOM → Render Tree → Layout → Paint → Composite"},{"k":"D","t":"CSSOM → DOM → Paint → Layout → Composite"}],"ans":"C","expl":"**Giải thích:**\nCritical Rendering Path:\n\n1. **DOM Construction:** Parse HTML → DOM tree\n2. **CSSOM Construction:** Parse CSS → CSSOM tree\n3. **Render Tree:** Combine DOM + CSSOM\n4. **Layout:** Calculate positions and dimensions\n5. **Paint:** Fill pixels\n6. **Composite:** Layer composition\n\n**Optimize:**\n- Minimize critical resources\n- Minimize critical path length\n- Minimize critical bytes\n\n**Tham khảo:** [web.dev - Critical Rendering Path](https://web.dev/critical-rendering-path/)\n\n---"},{"id":"03-22","topic":"Performance","group":"RENDERING & BROWSER","title":"Reflow vs Repaint","prompt":"**Điều nào trigger reflow (layout)?**","opts":[{"k":"A","t":"Changing `background-color`"},{"k":"B","t":"Changing `width` hoặc `height`"},{"k":"C","t":"Changing `opacity`"},{"k":"D","t":"Changing `visibility`"}],"ans":"B","expl":"**Giải thích:**\n\n| Property | Trigger |\n|----------|---------|\n| `width`, `height`, `margin`, `padding`, `top`, `left` | Reflow + Repaint |\n| `background-color`, `color`, `visibility` | Repaint only |\n| `transform`, `opacity` | Composite only |\n\n```javascript\n// ❌ Forces reflow\nelement.style.width = '100px';\nconst width = element.offsetWidth; // Forces layout\n\n// ✅ Batch reads and writes\n// Read phase\nconst width = element.offsetWidth;\nconst height = element.offsetHeight;\n\n// Write phase\nelement.style.transform = `translate(${width}px, ${height}px)`;\n```\n\n**Tham khảo:** [CSS Triggers](https://csstriggers.com/)\n\n---"},{"id":"03-23","topic":"Performance","group":"RENDERING & BROWSER","title":"CSS Containment","prompt":"**CSS `contain` property giúp gì cho performance?**","opts":[{"k":"A","t":"Không ảnh hưởng performance"},{"k":"B","t":"Isolate element's rendering, limit scope của layout/paint/style calculations"},{"k":"C","t":"Hide overflow content"},{"k":"D","t":"Create new stacking context"}],"ans":"B","expl":"**Giải thích:**\nCSS Containment isolates subtree:\n\n```css\n.card {\n  contain: layout;     /* Layout changes don't affect outside */\n  contain: paint;      /* Painting limited to element bounds */\n  contain: style;      /* Counters and quotes scoped */\n  contain: size;       /* Size independent of children */\n  contain: content;    /* layout + paint + style */\n  contain: strict;     /* All containment */\n}\n\n/* content-visibility for lazy rendering */\n.section {\n  content-visibility: auto;\n  contain-intrinsic-size: 0 500px;\n}\n```\n\n**Tham khảo:** [web.dev - CSS Containment](https://web.dev/content-visibility/)\n\n---"},{"id":"03-24","topic":"Performance","group":"RENDERING & BROWSER","title":"will-change Property","prompt":"**Khi nào KHÔNG nên sử dụng `will-change`?**","opts":[{"k":"A","t":"Khi element sẽ animate"},{"k":"B","t":"Khi cần create new compositor layer"},{"k":"C","t":"Apply cho tất cả elements \"just in case\""},{"k":"D","t":"Trước heavy visual changes"}],"ans":"C","expl":"**Giải thích:**\n`will-change` creates new compositor layer:\n- Uses GPU memory\n- Overhead của layer management\n\n```css\n/* ❌ Bad - applied to everything */\n* { will-change: transform; }\n\n/* ❌ Bad - always on */\n.element { will-change: transform; }\n\n/* ✅ Good - apply before animation */\n.element:hover { will-change: transform; }\n.element:active { transform: scale(1.1); }\n\n/* ✅ Good - JavaScript control */\nelement.style.willChange = 'transform';\n// After animation\nelement.style.willChange = 'auto';\n```\n\n**Tham khảo:** [MDN - will-change](https://developer.mozilla.org/en-US/docs/Web/CSS/will-change)\n\n---"},{"id":"03-25","topic":"Performance","group":"RENDERING & BROWSER","title":"Compositor-only Properties","prompt":"**Properties nào có thể animate mà không trigger layout hoặc paint?**","opts":[{"k":"A","t":"`width`, `height`, `margin`"},{"k":"B","t":"`padding`, `border`"},{"k":"C","t":"`transform`, `opacity`"},{"k":"D","t":"`top`, `left`, `right`, `bottom`"}],"ans":"C","expl":"**Giải thích:**\nCompositor-only properties:\n- `transform`\n- `opacity`\n- `filter` (partially)\n\n```css\n/* ❌ Triggers layout */\n.animate {\n  animation: move 1s;\n}\n@keyframes move {\n  to { left: 100px; }\n}\n\n/* ✅ Compositor only - smooth 60fps */\n.animate {\n  animation: move 1s;\n}\n@keyframes move {\n  to { transform: translateX(100px); }\n}\n```\n\n---"},{"id":"03-26","topic":"Performance","group":"RENDERING & BROWSER","title":"Long Tasks","prompt":"**Long Task được định nghĩa là task chạy hơn bao nhiêu ms?**","opts":[{"k":"A","t":"10ms"},{"k":"B","t":"200ms"},{"k":"C","t":"100ms"},{"k":"D","t":"50ms"}],"ans":"D","expl":"**Giải thích:**\n- Long Task: > 50ms on main thread\n- Blocks user interactions\n- Causes jank\n\n**Detect Long Tasks:**\n```javascript\nconst observer = new PerformanceObserver((list) => {\n  for (const entry of list.getEntries()) {\n    console.log('Long Task:', entry.duration);\n  }\n});\nobserver.observe({ type: 'longtask', buffered: true });\n```\n\n**Solutions:**\n- Break up long tasks\n- Use Web Workers\n- `requestIdleCallback` for non-critical work\n\n**Tham khảo:** [web.dev - Long Tasks](https://web.dev/optimize-long-tasks/)\n\n---"},{"id":"03-27","topic":"Performance","group":"RENDERING & BROWSER","title":"Intersection Observer","prompt":"**Ưu điểm của Intersection Observer so với scroll event listeners?**","opts":[{"k":"A","t":"Asynchronous, không block main thread"},{"k":"B","t":"More accurate"},{"k":"C","t":"Better performance - browser optimized"},{"k":"D","t":"Tất cả các đáp án trên"}],"ans":"D","expl":"**Giải thích:**\n\n```javascript\n// ❌ Scroll event - fires many times, blocks main thread\nwindow.addEventListener('scroll', () => {\n  elements.forEach(el => {\n    if (isInViewport(el)) loadImage(el);\n  });\n});\n\n// ✅ Intersection Observer - async, optimized\nconst observer = new IntersectionObserver((entries) => {\n  entries.forEach(entry => {\n    if (entry.isIntersecting) {\n      loadImage(entry.target);\n      observer.unobserve(entry.target);\n    }\n  });\n}, { rootMargin: '100px' });\n\nimages.forEach(img => observer.observe(img));\n```\n\n**Use cases:**\n- Lazy loading images\n- Infinite scroll\n- Analytics (element visibility)\n- Animations on scroll\n\n**Tham khảo:** [MDN - Intersection Observer](https://developer.mozilla.org/en-US/docs/Web/API/Intersection_Observer_API)\n\n---"},{"id":"03-28","topic":"Performance","group":"RENDERING & BROWSER","title":"Service Worker Caching","prompt":"**Service Worker caching strategy nào phù hợp cho static assets?**","opts":[{"k":"A","t":"Stale While Revalidate"},{"k":"B","t":"Network First"},{"k":"C","t":"Cache First"},{"k":"D","t":"Network Only"}],"ans":"C","expl":"**Giải thích:**\n\n| Strategy | Use Case |\n|----------|----------|\n| Cache First | Static assets (JS, CSS, images) |\n| Network First | API calls, frequently changing data |\n| Stale While Revalidate | Semi-static content |\n| Network Only | Real-time data |\n| Cache Only | Offline-first apps |\n\n```javascript\n// Cache First for static assets\nself.addEventListener('fetch', (event) => {\n  if (event.request.destination === 'image') {\n    event.respondWith(\n      caches.match(event.request).then((cached) => {\n        return cached || fetch(event.request).then((response) => {\n          const clone = response.clone();\n          caches.open('images').then(cache => cache.put(event.request, clone));\n          return response;\n        });\n      })\n    );\n  }\n});\n```\n\n**Tham khảo:** [web.dev - Service Worker Caching](https://web.dev/service-worker-caching-and-http-caching/)\n\n---"},{"id":"03-29","topic":"Performance","group":"RENDERING & BROWSER","title":"Font Loading","prompt":"**Cách nào giúp tránh FOIT (Flash of Invisible Text)?**","opts":[{"k":"A","t":"`font-display: swap`"},{"k":"B","t":"`font-display: block`"},{"k":"C","t":"Preload fonts"},{"k":"D","t":"A và C"}],"ans":"D","expl":"**Giải thích:**\nFont loading issues:\n- **FOIT (Flash of Invisible Text):** Text invisible until font loads\n- **FOUT (Flash of Unstyled Text):** Fallback font then switches\n\n```html\n\u003C!-- Preload critical fonts -->\n\u003Clink rel=\"preload\" href=\"/font.woff2\" as=\"font\" type=\"font/woff2\" crossorigin>\n```\n\n```css\n@font-face {\n  font-family: 'MyFont';\n  src: url('/font.woff2') format('woff2');\n  font-display: swap; /* Show fallback immediately, swap when ready */\n}\n\n/* font-display values:\n   auto - browser decides\n   block - FOIT (short)\n   swap - FOUT (recommended)\n   fallback - short FOIT, then fallback if slow\n   optional - use font only if already cached\n*/\n```\n\n**Tham khảo:** [web.dev - Font best practices](https://web.dev/font-best-practices/)\n\n---"},{"id":"03-30","topic":"Performance","group":"RENDERING & BROWSER","title":"Performance Budget","prompt":"**Performance budget thường bao gồm những metrics nào?**","opts":[{"k":"A","t":"Bundle size limits"},{"k":"B","t":"Core Web Vitals thresholds"},{"k":"C","t":"Number of requests"},{"k":"D","t":"Tất cả các đáp án trên\n---"}],"ans":"D","expl":"**Giải thích:**\nPerformance Budget examples:\n\n```javascript\n// Budget configuration\n{\n  \"budgets\": [\n    {\n      \"resourceSizes\": [\n        { \"resourceType\": \"script\", \"budget\": 300 }, // KB\n        { \"resourceType\": \"total\", \"budget\": 500 }\n      ],\n      \"resourceCounts\": [\n        { \"resourceType\": \"third-party\", \"budget\": 10 }\n      ],\n      \"timings\": [\n        { \"metric\": \"interactive\", \"budget\": 3000 }, // ms\n        { \"metric\": \"first-contentful-paint\", \"budget\": 1500 }\n      ]\n    }\n  ]\n}\n```\n\n**Tools:**\n- Lighthouse CI\n- bundlesize\n- webpack performance hints\n- SpeedCurve\n\n**Tham khảo:** [web.dev - Performance Budgets](https://web.dev/performance-budgets-101/)\n\n---"},{"id":"04-1","topic":"System Design","group":"PROBLEM SOLVING","title":"Debugging Performance","prompt":"**Ứng dụng React của bạn render chậm. Bước đầu tiên bạn làm gì để debug?**","opts":[{"k":"A","t":"Chuyển sang class components"},{"k":"B","t":"Thêm React.memo vào tất cả components"},{"k":"C","t":"Sử dụng React DevTools Profiler để identify bottlenecks"},{"k":"D","t":"Upgrade React version"}],"ans":"C","expl":"**Giải thích:**\nDebugging workflow:\n1. **React DevTools Profiler:** Identify which components render, render time, why rendered\n2. **Chrome Performance tab:** Analyze runtime performance\n3. **Analyze findings:** Find actual bottleneck\n4. **Apply targeted fixes:** React.memo, useMemo, code splitting based on data\n\n```jsx\n// After identifying slow component\nconst SlowComponent = React.memo(({ data }) => {\n  // Component code\n}, (prevProps, nextProps) => {\n  return prevProps.id === nextProps.id;\n});\n```\n\n**Tham khảo:** [React Profiler](https://react.dev/reference/react/Profiler)\n\n---"},{"id":"04-2","topic":"System Design","group":"PROBLEM SOLVING","title":"Memory Leak Detection","prompt":"**User report rằng app ngày càng chậm khi sử dụng lâu. Bạn nghi ngờ memory leak. Cách nào để xác nhận?**","opts":[{"k":"A","t":"Restart server"},{"k":"B","t":"Sử dụng Chrome DevTools Memory tab, take heap snapshots"},{"k":"C","t":"Clear browser cache"},{"k":"D","t":"Tăng server RAM"}],"ans":"B","expl":"**Giải thích:**\nMemory leak detection:\n1. **Take heap snapshot** trước user interaction\n2. **Perform actions** (navigate, open modals, etc.)\n3. **Take another snapshot**\n4. **Compare:** Objects retained between snapshots\n\nCommon leaks:\n- Event listeners not removed\n- Timers not cleared\n- Closures holding references\n- Detached DOM nodes\n\n```javascript\n// Common leak pattern\nuseEffect(() => {\n  const handler = () => { /* ... */ };\n  window.addEventListener('resize', handler);\n  // ❌ Missing cleanup!\n\n  // ✅ Fix\n  return () => window.removeEventListener('resize', handler);\n}, []);\n```\n\n**Tham khảo:** [Chrome Memory Tools](https://developer.chrome.com/docs/devtools/memory-problems/)\n\n---"},{"id":"04-3","topic":"System Design","group":"PROBLEM SOLVING","title":"Race Condition","prompt":"**User gặp bug: search results hiển thị kết quả của search query cũ. Nguyên nhân và cách fix?**","opts":[{"k":"A","t":"React re-render issue"},{"k":"B","t":"Browser caching issue"},{"k":"C","t":"Server response chậm, cần upgrade server"},{"k":"D","t":"Race condition - responses trả về không theo thứ tự, cần cancel previous requests hoặc ignore stale responses"}],"ans":"D","expl":"**Giải thích:**\nRace condition scenario:\n- User types \"abc\", request sent\n- User types \"abcd\", another request sent\n- \"abcd\" response arrives first\n- \"abc\" response arrives later, overwrites correct result\n\n**Solutions:**\n\n```javascript\n// 1. AbortController\nfunction useSearch(query) {\n  const [results, setResults] = useState([]);\n\n  useEffect(() => {\n    const controller = new AbortController();\n\n    fetch(`/api/search?q=${query}`, { signal: controller.signal })\n      .then(res => res.json())\n      .then(setResults)\n      .catch(err => {\n        if (err.name !== 'AbortError') throw err;\n      });\n\n    return () => controller.abort();\n  }, [query]);\n\n  return results;\n}\n\n// 2. Request ID tracking\nfunction useSearch(query) {\n  const requestIdRef = useRef(0);\n\n  useEffect(() => {\n    const currentRequestId = ++requestIdRef.current;\n\n    fetch(`/api/search?q=${query}`)\n      .then(res => res.json())\n      .then(data => {\n        // Ignore stale responses\n        if (currentRequestId === requestIdRef.current) {\n          setResults(data);\n        }\n      });\n  }, [query]);\n}\n```\n\n---"},{"id":"04-4","topic":"System Design","group":"PROBLEM SOLVING","title":"State Synchronization","prompt":"**Bạn có multiple browser tabs mở cùng một app. User update data ở tab 1 nhưng tab 2 không cập nhật. Solution?**","opts":[{"k":"A","t":"Auto refresh mỗi 5 giây"},{"k":"B","t":"Disable multiple tabs"},{"k":"C","t":"Sử dụng BroadcastChannel API, localStorage events, hoặc WebSocket"},{"k":"D","t":"Yêu cầu user refresh manually"}],"ans":"C","expl":"**Giải thích:**\nCross-tab synchronization options:\n\n```javascript\n// 1. BroadcastChannel API\nconst channel = new BroadcastChannel('app-sync');\n\n// Send update\nchannel.postMessage({ type: 'DATA_UPDATE', payload: newData });\n\n// Receive in other tabs\nchannel.onmessage = (event) => {\n  if (event.data.type === 'DATA_UPDATE') {\n    updateLocalState(event.data.payload);\n  }\n};\n\n// 2. localStorage event\nwindow.addEventListener('storage', (event) => {\n  if (event.key === 'userData') {\n    const newData = JSON.parse(event.newValue);\n    updateLocalState(newData);\n  }\n});\n\n// 3. WebSocket - real-time sync\nsocket.on('dataUpdate', (data) => {\n  updateLocalState(data);\n});\n```\n\n---"},{"id":"04-5","topic":"System Design","group":"PROBLEM SOLVING","title":"Error Handling Strategy","prompt":"**Cách tiếp cận tốt nhất cho error handling trong large React app?**","opts":[{"k":"A","t":"try-catch trong mỗi component"},{"k":"B","t":"Let errors crash và rely on user refresh"},{"k":"C","t":"Chỉ sử dụng Error Boundaries"},{"k":"D","t":"Error Boundaries cho UI errors + global error handler cho async errors + proper logging"}],"ans":"D","expl":"**Giải thích:**\nComprehensive error handling:\n\n```jsx\n// 1. Error Boundary for UI errors\nclass ErrorBoundary extends React.Component {\n  state = { hasError: false };\n\n  static getDerivedStateFromError(error) {\n    return { hasError: true };\n  }\n\n  componentDidCatch(error, info) {\n    errorReportingService.log(error, info);\n  }\n\n  render() {\n    if (this.state.hasError) {\n      return \u003CErrorFallback onRetry={() => this.setState({ hasError: false })} />;\n    }\n    return this.props.children;\n  }\n}\n\n// 2. Global error handler\nwindow.addEventListener('unhandledrejection', (event) => {\n  errorReportingService.log(event.reason);\n});\n\n// 3. API error handling\nconst api = {\n  async fetch(url) {\n    try {\n      const response = await fetch(url);\n      if (!response.ok) {\n        throw new ApiError(response.status, await response.text());\n      }\n      return response.json();\n    } catch (error) {\n      errorReportingService.log(error);\n      throw error;\n    }\n  }\n};\n```\n\n---"},{"id":"04-6","topic":"System Design","group":"PROBLEM SOLVING","title":"Form Performance","prompt":"**Form với 50+ fields render chậm khi user type. Giải pháp?**","opts":[{"k":"A","t":"Sử dụng uncontrolled components"},{"k":"B","t":"Disable real-time validation"},{"k":"C","t":"Implement field-level subscription (react-hook-form), debounce validation"},{"k":"D","t":"Reduce số lượng fields"}],"ans":"C","expl":"**Giải thích:**\nForm performance optimization:\n\n```jsx\n// ❌ Re-renders entire form on every change\nfunction SlowForm() {\n  const [form, setForm] = useState({ field1: '', field2: '', ... });\n\n  return (\n    \u003Cform>\n      {Object.keys(form).map(key => (\n        \u003Cinput\n          value={form[key]}\n          onChange={e => setForm({ ...form, [key]: e.target.value })}\n        />\n      ))}\n    \u003C/form>\n  );\n}\n\n// ✅ react-hook-form - field-level subscription\nimport { useForm } from 'react-hook-form';\n\nfunction FastForm() {\n  const { register, handleSubmit } = useForm();\n\n  return (\n    \u003Cform onSubmit={handleSubmit(onSubmit)}>\n      \u003Cinput {...register('field1')} />\n      \u003Cinput {...register('field2')} />\n    \u003C/form>\n  );\n}\n\n// ✅ Debounced validation\nconst { register } = useForm({\n  mode: 'onChange',\n  reValidateMode: 'onChange',\n  delayError: 500 // Debounce validation\n});\n```\n\n---"},{"id":"04-7","topic":"System Design","group":"PROBLEM SOLVING","title":"Infinite Scroll Issues","prompt":"**Infinite scroll list của bạn gây lag sau khi load nhiều items. Vấn đề và solution?**","opts":[{"k":"A","t":"DOM có quá nhiều elements, cần virtualization (react-window)"},{"k":"B","t":"CSS animation issue"},{"k":"C","t":"Server pagination issue"},{"k":"D","t":"API rate limiting"}],"ans":"A","expl":"**Giải thích:**\nVirtualization solution:\n\n```jsx\n// ❌ Problem: 10,000 DOM nodes\nfunction SlowList({ items }) {\n  return (\n    \u003Cdiv>\n      {items.map(item => \u003CComplexItem key={item.id} item={item} />)}\n    \u003C/div>\n  );\n}\n\n// ✅ Solution: Only render visible items\nimport { FixedSizeList } from 'react-window';\n\nfunction FastList({ items }) {\n  return (\n    \u003CFixedSizeList\n      height={600}\n      itemCount={items.length}\n      itemSize={50}\n      width=\"100%\"\n    >\n      {({ index, style }) => (\n        \u003Cdiv style={style}>\n          \u003CComplexItem item={items[index]} />\n        \u003C/div>\n      )}\n    \u003C/FixedSizeList>\n  );\n}\n\n// For variable height items\nimport { VariableSizeList } from 'react-window';\n// Or use react-virtuoso for dynamic heights\nimport { Virtuoso } from 'react-virtuoso';\n```\n\n---"},{"id":"04-8","topic":"System Design","group":"PROBLEM SOLVING","title":"Authentication Flow","prompt":"**JWT token expired trong khi user đang sử dụng app. Best approach?**","opts":[{"k":"A","t":"Store token vĩnh viễn trong localStorage"},{"k":"B","t":"Extend token expiry lên 1 năm"},{"k":"C","t":"Force logout immediately"},{"k":"D","t":"Implement silent refresh với refresh token, queue failed requests, retry sau khi refresh"}],"ans":"D","expl":"**Giải thích:**\nToken refresh strategy:\n\n```javascript\n// API interceptor pattern\nlet isRefreshing = false;\nlet failedQueue = [];\n\nconst processQueue = (error, token = null) => {\n  failedQueue.forEach(prom => {\n    if (error) {\n      prom.reject(error);\n    } else {\n      prom.resolve(token);\n    }\n  });\n  failedQueue = [];\n};\n\napi.interceptors.response.use(\n  response => response,\n  async error => {\n    const originalRequest = error.config;\n\n    if (error.response?.status === 401 && !originalRequest._retry) {\n      if (isRefreshing) {\n        // Queue requests while refreshing\n        return new Promise((resolve, reject) => {\n          failedQueue.push({ resolve, reject });\n        }).then(token => {\n          originalRequest.headers.Authorization = `Bearer ${token}`;\n          return api(originalRequest);\n        });\n      }\n\n      originalRequest._retry = true;\n      isRefreshing = true;\n\n      try {\n        const { token } = await refreshToken();\n        processQueue(null, token);\n        originalRequest.headers.Authorization = `Bearer ${token}`;\n        return api(originalRequest);\n      } catch (refreshError) {\n        processQueue(refreshError, null);\n        logout();\n        throw refreshError;\n      } finally {\n        isRefreshing = false;\n      }\n    }\n\n    return Promise.reject(error);\n  }\n);\n```\n\n---"},{"id":"04-9","topic":"System Design","group":"PROBLEM SOLVING","title":"API Error Handling","prompt":"**API trả về 500 error intermittently. Strategy để handle?**","opts":[{"k":"A","t":"Retry vô hạn"},{"k":"B","t":"Implement retry với exponential backoff, circuit breaker pattern, fallback UI"},{"k":"C","t":"Ignore errors"},{"k":"D","t":"Show error message và stop"}],"ans":"B","expl":"**Giải thích:**\nResilient API handling:\n\n```javascript\n// Exponential backoff with jitter\nasync function fetchWithRetry(url, options = {}, maxRetries = 3) {\n  for (let attempt = 0; attempt \u003C= maxRetries; attempt++) {\n    try {\n      const response = await fetch(url, options);\n      if (response.ok) return response;\n\n      // Don't retry client errors (4xx)\n      if (response.status >= 400 && response.status \u003C 500) {\n        throw new Error(`Client error: ${response.status}`);\n      }\n\n      throw new Error(`Server error: ${response.status}`);\n    } catch (error) {\n      if (attempt === maxRetries) throw error;\n\n      // Exponential backoff with jitter\n      const delay = Math.min(1000 * 2 ** attempt + Math.random() * 1000, 10000);\n      await new Promise(resolve => setTimeout(resolve, delay));\n    }\n  }\n}\n\n// Circuit breaker pattern\nclass CircuitBreaker {\n  constructor(threshold = 5, resetTimeout = 30000) {\n    this.failures = 0;\n    this.threshold = threshold;\n    this.resetTimeout = resetTimeout;\n    this.state = 'CLOSED';\n  }\n\n  async call(fn) {\n    if (this.state === 'OPEN') {\n      throw new Error('Circuit is open');\n    }\n\n    try {\n      const result = await fn();\n      this.failures = 0;\n      return result;\n    } catch (error) {\n      this.failures++;\n      if (this.failures >= this.threshold) {\n        this.state = 'OPEN';\n        setTimeout(() => {\n          this.state = 'HALF-OPEN';\n        }, this.resetTimeout);\n      }\n      throw error;\n    }\n  }\n}\n```\n\n---"},{"id":"04-10","topic":"System Design","group":"PROBLEM SOLVING","title":"Bundle Size Crisis","prompt":"**Bundle size quá lớn (5MB), app load chậm. Immediate actions?**","opts":[{"k":"A","t":"Upgrade hosting plan"},{"k":"B","t":"Enable caching"},{"k":"C","t":"Analyze bundle, code split, lazy load routes, remove unused dependencies, dynamic imports"},{"k":"D","t":"Chuyển sang HTTP/3"}],"ans":"C","expl":"**Giải thích:**\nBundle optimization steps:\n\n```javascript\n// 1. Analyze bundle\n// npm install -D webpack-bundle-analyzer\n// Add to webpack config:\nconst BundleAnalyzerPlugin = require('webpack-bundle-analyzer').BundleAnalyzerPlugin;\nplugins: [new BundleAnalyzerPlugin()]\n\n// 2. Code splitting - Route-based\nconst Home = lazy(() => import('./routes/Home'));\nconst Dashboard = lazy(() => import('./routes/Dashboard'));\n\n// 3. Dynamic imports for heavy libraries\nconst handleExport = async () => {\n  const { exportToPDF } = await import('./utils/pdfExport');\n  exportToPDF(data);\n};\n\n// 4. Replace heavy dependencies\n// ❌ moment.js (300KB) → ✅ date-fns (tree-shakeable)\n// ❌ lodash (70KB) → ✅ lodash-es or individual imports\n\n// 5. Check for duplicates\n// Use npm ls or yarn why to find duplicate packages\n\n// 6. Tree shaking - use ES modules\n// ❌ import _ from 'lodash';\n// ✅ import { debounce } from 'lodash-es';\n```\n\n---"},{"id":"04-11","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Notification System","prompt":"**Design real-time notification system cho web app. Considerations?**","opts":[{"k":"A","t":"Browser alerts"},{"k":"B","t":"Polling every second"},{"k":"C","t":"WebSocket/SSE for real-time, notification queue, read/unread state, persistence, push notifications"},{"k":"D","t":"Email notifications only"}],"ans":"C","expl":"**Giải thích:**\nNotification system design:\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                    NOTIFICATION SYSTEM                        │\n├─────────────────────────────────────────────────────────────┤\n│                                                               │\n│  ┌─────────────┐     ┌──────────────┐     ┌───────────────┐ │\n│  │   Server    │────▶│  WebSocket   │────▶│   Client      │ │\n│  │  (Events)   │     │  /SSE        │     │  (Real-time)  │ │\n│  └─────────────┘     └──────────────┘     └───────────────┘ │\n│                              │                               │\n│                              ▼                               │\n│  ┌──────────────────────────────────────────────────────┐   │\n│  │                 NOTIFICATION STATE                     │   │\n│  │  - Notification Queue (priority-based)                │   │\n│  │  - Read/Unread tracking                               │   │\n│  │  - Persistence (IndexedDB/localStorage)               │   │\n│  │  - Push notification integration                      │   │\n│  └──────────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────────┘\n```\n\n```typescript\n// Notification service\ninterface Notification {\n  id: string;\n  type: 'info' | 'warning' | 'error' | 'success';\n  title: string;\n  message: string;\n  timestamp: Date;\n  read: boolean;\n  priority: 'low' | 'medium' | 'high';\n  action?: { label: string; url: string };\n}\n\nclass NotificationService {\n  private socket: WebSocket;\n  private queue: Notification[] = [];\n  private listeners: Set\u003C(n: Notification) => void> = new Set();\n\n  connect() {\n    this.socket = new WebSocket('wss://api.example.com/notifications');\n    this.socket.onmessage = (event) => {\n      const notification = JSON.parse(event.data);\n      this.handleNotification(notification);\n    };\n  }\n\n  private handleNotification(notification: Notification) {\n    this.queue.push(notification);\n    this.persist();\n    this.notifyListeners(notification);\n    this.showPushNotification(notification);\n  }\n\n  subscribe(callback: (n: Notification) => void) {\n    this.listeners.add(callback);\n    return () => this.listeners.delete(callback);\n  }\n}\n```\n\n---"},{"id":"04-12","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Image Upload","prompt":"**Design image upload component with preview, progress, validation. Key considerations?**","opts":[{"k":"A","t":"Server-side only processing"},{"k":"B","t":"Base64 encoding"},{"k":"C","t":"Simple file input"},{"k":"D","t":"Client-side validation, compression, chunked upload for large files, progress tracking, retry mechanism, preview generation"}],"ans":"D","expl":"**Giải thích:**\nImage upload design:\n\n```typescript\ninterface UploadConfig {\n  maxSize: number;           // bytes\n  allowedTypes: string[];    // ['image/jpeg', 'image/png']\n  maxDimensions?: { width: number; height: number };\n  compression?: { quality: number; maxWidth: number };\n  chunkSize?: number;        // for chunked upload\n}\n\nclass ImageUploader {\n  // Client-side validation\n  validate(file: File, config: UploadConfig): ValidationResult {\n    if (file.size > config.maxSize) {\n      return { valid: false, error: 'File too large' };\n    }\n    if (!config.allowedTypes.includes(file.type)) {\n      return { valid: false, error: 'Invalid file type' };\n    }\n    return { valid: true };\n  }\n\n  // Generate preview\n  async createPreview(file: File): Promise\u003Cstring> {\n    return new Promise((resolve) => {\n      const reader = new FileReader();\n      reader.onload = (e) => resolve(e.target.result as string);\n      reader.readAsDataURL(file);\n    });\n  }\n\n  // Compress image\n  async compress(file: File, config: CompressionConfig): Promise\u003CBlob> {\n    const canvas = document.createElement('canvas');\n    const ctx = canvas.getContext('2d');\n    const img = await this.loadImage(file);\n\n    // Calculate dimensions\n    const { width, height } = this.calculateDimensions(img, config.maxWidth);\n    canvas.width = width;\n    canvas.height = height;\n\n    ctx.drawImage(img, 0, 0, width, height);\n    return new Promise(resolve => {\n      canvas.toBlob(resolve, 'image/jpeg', config.quality);\n    });\n  }\n\n  // Chunked upload with progress\n  async uploadChunked(file: File, chunkSize: number): AsyncGenerator\u003CProgress> {\n    const totalChunks = Math.ceil(file.size / chunkSize);\n\n    for (let i = 0; i \u003C totalChunks; i++) {\n      const start = i * chunkSize;\n      const end = Math.min(start + chunkSize, file.size);\n      const chunk = file.slice(start, end);\n\n      await this.uploadChunk(chunk, i, totalChunks);\n\n      yield {\n        uploaded: end,\n        total: file.size,\n        percentage: Math.round((end / file.size) * 100)\n      };\n    }\n  }\n}\n```\n\n---"},{"id":"04-13","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Search Autocomplete","prompt":"**Design search autocomplete like Google. Technical considerations?**","opts":[{"k":"A","t":"Debounce input, cache results, keyboard navigation, highlight matches, handle no results, recent searches"},{"k":"B","t":"Only search on Enter"},{"k":"C","t":"Pre-load all results"},{"k":"D","t":"Search on every keystroke"}],"ans":"A","expl":"**Giải thích:**\nSearch autocomplete design:\n\n```typescript\nclass SearchAutocomplete {\n  private cache = new Map\u003Cstring, SearchResult[]>();\n  private debounceTimer: number;\n  private abortController: AbortController;\n\n  constructor(\n    private inputElement: HTMLInputElement,\n    private config: AutocompleteConfig\n  ) {\n    this.setupEventListeners();\n  }\n\n  private setupEventListeners() {\n    this.inputElement.addEventListener('input', this.handleInput);\n    this.inputElement.addEventListener('keydown', this.handleKeyboard);\n  }\n\n  private handleInput = (e: Event) => {\n    const query = (e.target as HTMLInputElement).value;\n\n    clearTimeout(this.debounceTimer);\n\n    if (query.length \u003C this.config.minChars) {\n      this.hideResults();\n      return;\n    }\n\n    // Debounce\n    this.debounceTimer = setTimeout(() => {\n      this.search(query);\n    }, this.config.debounceMs);\n  };\n\n  private async search(query: string) {\n    // Check cache\n    if (this.cache.has(query)) {\n      this.showResults(this.cache.get(query)!);\n      return;\n    }\n\n    // Cancel previous request\n    this.abortController?.abort();\n    this.abortController = new AbortController();\n\n    try {\n      const results = await this.fetchResults(query);\n      this.cache.set(query, results);\n      this.showResults(results);\n    } catch (error) {\n      if (error.name !== 'AbortError') {\n        this.showError(error);\n      }\n    }\n  }\n\n  private handleKeyboard = (e: KeyboardEvent) => {\n    switch (e.key) {\n      case 'ArrowDown':\n        this.highlightNext();\n        break;\n      case 'ArrowUp':\n        this.highlightPrevious();\n        break;\n      case 'Enter':\n        this.selectHighlighted();\n        break;\n      case 'Escape':\n        this.hideResults();\n        break;\n    }\n  };\n\n  private showResults(results: SearchResult[]) {\n    // Highlight matching text\n    const html = results.map(result => `\n      \u003Cli class=\"autocomplete-item\" data-id=\"${result.id}\">\n        ${this.highlightMatch(result.text, this.inputElement.value)}\n      \u003C/li>\n    `).join('');\n\n    this.resultsContainer.innerHTML = html;\n    this.resultsContainer.style.display = 'block';\n  }\n}\n```\n\n---"},{"id":"04-14","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Data Table","prompt":"**Design reusable data table component với sorting, filtering, pagination. Architecture?**","opts":[{"k":"A","t":"Use native HTML table only"},{"k":"B","t":"CSS Grid layout"},{"k":"C","t":"Monolithic component"},{"k":"D","t":"Composable design (Table, Header, Body, Row, Cell), server-side operations for large data, virtualization option, controlled/uncontrolled modes"}],"ans":"D","expl":"**Giải thích:**\nData table architecture:\n\n```tsx\n// Composable design\ninterface TableProps\u003CT> {\n  data: T[];\n  columns: ColumnDef\u003CT>[];\n  // Controlled modes\n  sorting?: SortingState;\n  onSortingChange?: (sorting: SortingState) => void;\n  pagination?: PaginationState;\n  onPaginationChange?: (pagination: PaginationState) => void;\n  // Features\n  enableSorting?: boolean;\n  enableFiltering?: boolean;\n  enablePagination?: boolean;\n  enableVirtualization?: boolean;\n  // Server-side\n  serverSide?: boolean;\n  totalCount?: number;\n  loading?: boolean;\n}\n\nfunction DataTable\u003CT>({\n  data,\n  columns,\n  serverSide = false,\n  enableVirtualization = false,\n  ...props\n}: TableProps\u003CT>) {\n  // Use TanStack Table for headless logic\n  const table = useReactTable({\n    data,\n    columns,\n    getCoreRowModel: getCoreRowModel(),\n    getSortedRowModel: serverSide ? undefined : getSortedRowModel(),\n    getFilteredRowModel: serverSide ? undefined : getFilteredRowModel(),\n    getPaginationRowModel: serverSide ? undefined : getPaginationRowModel(),\n  });\n\n  const { rows } = table.getRowModel();\n\n  return (\n    \u003Cdiv className=\"table-container\">\n      \u003CTable>\n        \u003CTableHeader>\n          {table.getHeaderGroups().map(headerGroup => (\n            \u003CTableRow key={headerGroup.id}>\n              {headerGroup.headers.map(header => (\n                \u003CTableHead\n                  key={header.id}\n                  sortable={header.column.getCanSort()}\n                  sorted={header.column.getIsSorted()}\n                  onSort={header.column.getToggleSortingHandler()}\n                >\n                  {flexRender(header.column.columnDef.header, header.getContext())}\n                \u003C/TableHead>\n              ))}\n            \u003C/TableRow>\n          ))}\n        \u003C/TableHeader>\n\n        \u003CTableBody virtualized={enableVirtualization} rowCount={rows.length}>\n          {rows.map(row => (\n            \u003CTableRow key={row.id}>\n              {row.getVisibleCells().map(cell => (\n                \u003CTableCell key={cell.id}>\n                  {flexRender(cell.column.columnDef.cell, cell.getContext())}\n                \u003C/TableCell>\n              ))}\n            \u003C/TableRow>\n          ))}\n        \u003C/TableBody>\n      \u003C/Table>\n\n      {props.enablePagination && \u003CTablePagination table={table} />}\n    \u003C/div>\n  );\n}\n```\n\n---"},{"id":"04-15","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Form Builder","prompt":"**Design dynamic form builder (user có thể tạo forms). Architecture decisions?**","opts":[{"k":"A","t":"Schema-driven approach, field type registry, validation rules engine, conditional logic, drag-drop interface"},{"k":"B","t":"Use Google Forms embed"},{"k":"C","t":"Only support text fields"},{"k":"D","t":"Hard-code tất cả field types"}],"ans":"A","expl":"**Giải thích:**\nForm builder architecture:\n\n```typescript\n// Schema-driven form\ninterface FormSchema {\n  fields: FieldConfig[];\n  validation?: ValidationRule[];\n  conditionalLogic?: ConditionalRule[];\n}\n\ninterface FieldConfig {\n  id: string;\n  type: FieldType;\n  label: string;\n  required?: boolean;\n  defaultValue?: any;\n  options?: SelectOption[];\n  validation?: FieldValidation[];\n}\n\n// Field type registry\nconst fieldRegistry = {\n  text: TextInput,\n  number: NumberInput,\n  select: SelectInput,\n  checkbox: CheckboxInput,\n  date: DatePicker,\n  file: FileUpload,\n  // Custom fields can be registered\n};\n\n// Dynamic form renderer\nfunction FormBuilder({ schema, onSubmit }: FormBuilderProps) {\n  const form = useForm({\n    defaultValues: buildDefaultValues(schema),\n    resolver: buildResolver(schema.validation),\n  });\n\n  const visibleFields = useConditionalLogic(schema, form.watch());\n\n  return (\n    \u003Cform onSubmit={form.handleSubmit(onSubmit)}>\n      {visibleFields.map(field => {\n        const FieldComponent = fieldRegistry[field.type];\n\n        if (!FieldComponent) {\n          console.warn(`Unknown field type: ${field.type}`);\n          return null;\n        }\n\n        return (\n          \u003CFieldComponent\n            key={field.id}\n            {...field}\n            control={form.control}\n            errors={form.formState.errors}\n          />\n        );\n      })}\n\n      \u003Cbutton type=\"submit\">Submit\u003C/button>\n    \u003C/form>\n  );\n}\n\n// Validation rules engine\nfunction buildResolver(rules?: ValidationRule[]) {\n  return async (values: Record\u003Cstring, any>) => {\n    const errors: Record\u003Cstring, { message: string }> = {};\n\n    for (const rule of rules || []) {\n      const fieldValue = values[rule.field];\n      const isValid = await validateRule(rule, fieldValue, values);\n\n      if (!isValid) {\n        errors[rule.field] = { message: rule.message };\n      }\n    }\n\n    return { values, errors };\n  };\n}\n```\n\n---"},{"id":"04-16","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Multi-step Wizard","prompt":"**Design multi-step form wizard. State management approach?**","opts":[{"k":"A","t":"Mỗi step giữ state riêng trong component của nó và submit lên server ngay khi step đó xong"},{"k":"B","t":"Một form dài duy nhất, dùng CSS ẩn hiện từng phần, validate toàn bộ lúc submit"},{"k":"C","t":"State tập trung ở cấp wizard, validate theo từng step trước khi cho đi tiếp, quay lại không mất dữ liệu, và lưu nháp để khôi phục khi tải lại trang"},{"k":"D","t":"Đẩy toàn bộ state lên URL query string, mỗi step là một route riêng, không cần state chung"}],"ans":"C","expl":"**Giải thích:**\nWizard khác form dài ở chỗ người dùng được đi tới đi lui. Điều đó buộc state phải sống ở cấp wizard chứ không nằm trong từng step — step bị unmount mà dữ liệu vẫn còn. Validate theo từng step là thứ chặn người dùng mang lỗi sang bước sau. Lưu nháp vào `sessionStorage` hoặc server là để đóng nhầm tab không mất 10 phút vừa nhập.\n\n**Đánh đổi:** state tập trung làm các step dính vào nhau — thêm một step là phải sửa hình dạng state dùng chung, và mọi step cùng re-render nếu không tách selector. Nếu các step thực sự độc lập và ngắn, phương án A đơn giản hơn hẳn.\n\nPhương án D không sai về nguyên tắc: với wizard 2–3 bước, đưa state lên URL cho ngay nút back của trình duyệt và link chia sẻ được. Nhưng URL bị ghi vào log server, lịch sử duyệt web và Referer header — không đặt dữ liệu cá nhân ở đó, và URL có giới hạn độ dài.\n\nA tạo bản ghi dở dang trên server mỗi lần người dùng bỏ ngang, phải có việc dọn dẹp. B thì mọi field vẫn được mount và validate cuối cùng, mất đúng cái lợi của wizard là chia nhỏ gánh nặng nhập liệu.\n\n---"},{"id":"04-17","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Offline-first App","prompt":"**Design app hoạt động offline. Architecture?**","opts":[{"k":"A","t":"Cache toàn bộ response API vào localStorage rồi đọc từ đó khi mất mạng"},{"k":"B","t":"Service Worker cache phần vỏ ứng dụng, IndexedDB giữ dữ liệu, hàng đợi mutation gửi lại khi có mạng, kèm chiến lược giải quyết xung đột"},{"k":"C","t":"Theo dõi `navigator.onLine` rồi khoá mọi thao tác ghi cho tới khi có mạng lại"},{"k":"D","t":"Đặt `Cache-Control` thời hạn dài để trình duyệt tự phục vụ từ HTTP cache khi offline"}],"ans":"B","expl":"**Giải thích:**\nBốn mảnh ghép, mỗi mảnh giải một việc khác nhau. Service Worker chặn được tầng network nên mở app lúc offline vẫn ra giao diện. IndexedDB giữ dữ liệu có cấu trúc, bất đồng bộ và dung lượng lớn. Hàng đợi mutation là thứ biến app từ *đọc được khi offline* thành *offline-first* — người dùng ghi được, thao tác xếp hàng, có mạng thì gửi. Và ngay khi chấp nhận ghi lúc offline thì xung đột là chuyện chắc chắn xảy ra, phải chọn cách xử lý từ đầu.\n\n**Đánh đổi:** phần đắt nhất là giải quyết xung đột. Lấy bản ghi sau cùng thì rẻ nhưng mất dữ liệu của người kia. Gộp theo từng trường hoặc dùng CRDT thì giữ được nhưng tốn rất nhiều công. Chọn theo câu hỏi: hai người có sửa cùng một bản ghi không? Nếu không, lấy bản sau cùng là đủ.\n\nA sai vì `localStorage` là API đồng bộ nên chặn luồng chính, chỉ chứa chuỗi, và giới hạn khoảng 5MB. C là *chịu được offline* chứ không phải offline-first, và `navigator.onLine` nói dối — nối wifi ở quán cà phê chưa đăng nhập thì nó vẫn báo true. D không dùng được cho POST, mà cũng không xếp hàng được thao tác ghi.\n\n---"},{"id":"04-18","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Real-time Collaboration","prompt":"**Design real-time document editing (như Google Docs). Key challenges?**","opts":[{"k":"A","t":"Khoá tài liệu cho một người sửa tại một thời điểm, người khác chỉ xem"},{"k":"B","t":"Mỗi client gửi toàn bộ nội dung sau mỗi thay đổi, server giữ bản đến sau cùng"},{"k":"C","t":"Gộp thay đổi bằng thuật toán diff ba chiều lúc lưu, giống cách Git merge"},{"k":"D","t":"Operational Transform hoặc CRDT để hợp nhất thao tác đồng thời, kèm con trỏ của người khác, lịch sử phiên bản và quản lý vòng đời kết nối WebSocket"}],"ans":"D","expl":"**Giải thích:**\nVấn đề gốc là hai người gõ cùng lúc vào cùng một chỗ. OT và CRDT là hai lời giải cho đúng việc đó: biến thao tác của người này qua hệ quy chiếu đã đổi bởi người kia, sao cho mọi bản sao hội tụ về cùng một kết quả.\n\n**Đánh đổi giữa hai cách:** OT cần một server đứng giữa để xếp thứ tự thao tác, dữ liệu gọn nhưng hàm transform rất khó viết đúng — Google Docs mất nhiều năm mới ổn định. CRDT hội tụ được mà không cần trọng tài, dễ suy luận hơn, nhưng mang theo metadata phình dần theo lịch sử sửa, tài liệu dùng lâu sẽ nặng.\n\nCon trỏ người khác và lịch sử phiên bản không phải trang trí: thấy người khác đang ở đâu thì người dùng tự tránh nhau, còn lịch sử là đường lùi khi thuật toán hợp nhất ra kết quả không như mong đợi.\n\nA đúng về mặt kỹ thuật nhưng hỏng trải nghiệm ngay khi có người thứ hai. B là lấy bản sau cùng, tức là xoá thẳng những gì người kia vừa gõ. C dùng được cho những lần commit rời rạc, không dùng được cho từng phím gõ.\n\n---"},{"id":"04-19","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Chat Application","prompt":"**Design chat UI. Technical considerations?**","opts":[{"k":"A","t":"WebSocket cho tin đến, trạng thái gửi/nhận/đã đọc, optimistic update khi gửi, danh sách ảo hoá, và chỉ báo đang gõ"},{"k":"B","t":"Gọi API mỗi 2 giây để lấy tin mới rồi render lại toàn bộ danh sách"},{"k":"C","t":"Dùng Server-Sent Events cho cả chiều gửi lẫn chiều nhận"},{"k":"D","t":"Tải toàn bộ lịch sử khi mở phòng và giữ hết trong state, không phân trang"}],"ans":"A","expl":"**Giải thích:**\nWebSocket vì chat cần hai chiều và độ trễ thấp. Optimistic update là thứ làm nút gửi có cảm giác tức thì: hiện tin ngay với id tạm phía client, khi server trả về thì khớp lại bằng id đó. Ảo hoá danh sách là bắt buộc vì lịch sử chat không có giới hạn trên.\n\n**Đánh đổi:** optimistic update bắt buộc phải có đường lùi. Gửi hỏng thì tin đó phải chuyển sang trạng thái lỗi cho gửi lại, chứ không được lặng lẽ biến mất. Và phải có id tạm ổn định, nếu không lúc server trả về sẽ thành hai tin trùng nhau. Bỏ qua hai chi tiết này là lỗi hay gặp nhất khi làm chat.\n\nC không hẳn sai: SSE nhận tin rất tốt, nhẹ hơn WebSocket và tự kết nối lại. Nhưng SSE chỉ có một chiều server đến client, nên vẫn phải gửi tin bằng HTTP POST — thành kiến trúc lai. Chọn được khi phần lớn lưu lượng là chiều nhận.\n\nB tốn request mà vẫn trễ tới 2 giây, lại render lại cả danh sách. D làm bộ nhớ phình theo lịch sử, phòng chat cũ là treo máy.\n\n---"},{"id":"04-20","topic":"System Design","group":"FRONTEND SYSTEM DESIGN","title":"Design Dashboard","prompt":"**Design analytics dashboard với multiple widgets. Architecture?**","opts":[{"k":"A","t":"Một lần gọi API lấy toàn bộ dữ liệu cho mọi widget rồi render một lượt"},{"k":"B","t":"Mỗi widget là một route riêng, xem widget khác thì chuyển trang"},{"k":"C","t":"Kiến trúc theo widget: mỗi widget tự lấy dữ liệu và tự quản trạng thái tải, lưới bố cục đáp ứng, nhịp làm mới riêng cho từng widget"},{"k":"D","t":"Render sẵn toàn bộ dashboard ở server rồi trả về ảnh tĩnh, làm mới theo chu kỳ"}],"ans":"C","expl":"**Giải thích:**\nCái lợi chính là cách ly: một widget gọi API chậm hoặc lỗi thì phần còn lại vẫn hiện. Và nhịp làm mới khác nhau theo bản chất dữ liệu — ô \"doanh thu hôm nay\" cần 30 giây một lần, ô \"tổng quan năm\" một giờ một lần là thừa.\n\n**Đánh đổi:** N widget là N request. Dashboard 20 ô sẽ tạo ra một đợt request đồng loạt, ăn hết giới hạn kết nối của trình duyệt và làm chậm chính nó. Cách dung hoà thường dùng là gom lại ở tầng BFF: client gọi một lần, server tự fan-out rồi trả về theo từng phần dưới dạng stream. Nên phương án A không sai về ý tưởng, nó chỉ sai khi áp dụng tuyệt đối — gom request tốt, nhưng đừng để một truy vấn chậm giữ toàn bộ dashboard trắng trang.\n\nB phá đúng lý do dashboard tồn tại là nhìn nhiều chỉ số cùng lúc. D mất hết tương tác, không chọn được khoảng thời gian, không đọc được bằng trình đọc màn hình, và không cho phép sao chép số liệu.\n\n---"},{"id":"04-21","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"Micro-frontends","prompt":"**Khi nào nên sử dụng micro-frontends architecture?**","opts":[{"k":"A","t":"Large teams, independent deployment needs, different tech stacks, clear domain boundaries"},{"k":"B","t":"Mọi project"},{"k":"C","t":"Startups với 2 developers"},{"k":"D","t":"Small projects"}],"ans":"A","expl":"**Giải thích:**\nMicro-frontends use cases:\n\n**When to use:**\n- Large organizations với multiple teams\n- Need independent deployment cycles\n- Different tech requirements per domain\n- Clear domain boundaries\n\n**When NOT to use:**\n- Small teams (\u003C 10 developers)\n- Tightly coupled domains\n- Performance-critical apps (overhead)\n- Simple applications\n\n```\n┌────────────────────────────────────────────────────────┐\n│                    Container App                        │\n│  ┌────────────┐ ┌────────────┐ ┌────────────┐        │\n│  │  Team A    │ │  Team B    │ │  Team C    │        │\n│  │  (React)   │ │  (Vue)     │ │  (Angular) │        │\n│  │  Products  │ │  Cart      │ │  Checkout  │        │\n│  └────────────┘ └────────────┘ └────────────┘        │\n│                                                        │\n│  ┌─────────────────────────────────────────────────┐  │\n│  │              Shared Dependencies                  │  │\n│  │  - Design System                                  │  │\n│  │  - Authentication                                 │  │\n│  │  - Routing                                        │  │\n│  └─────────────────────────────────────────────────┘  │\n└────────────────────────────────────────────────────────┘\n```\n\n**Tham khảo:** [Micro Frontends](https://micro-frontends.org/)\n\n---"},{"id":"04-22","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"State Management Selection","prompt":"**Criteria nào để chọn state management solution?**","opts":[{"k":"A","t":"Popularity"},{"k":"B","t":"App complexity, team familiarity, bundle size, DevTools support, server state vs client state needs"},{"k":"C","t":"GitHub stars"},{"k":"D","t":"Company recommendation"}],"ans":"B","expl":"**Giải thích:**\nState management decision matrix:\n\n| Criteria | Local State | Context | Redux/Zustand | React Query |\n|----------|-------------|---------|---------------|-------------|\n| Component state | ✅ | ❌ | ❌ | ❌ |\n| Shared UI state | ❌ | ✅ | ✅ | ❌ |\n| Complex state logic | ❌ | ❌ | ✅ | ❌ |\n| Server state | ❌ | ❌ | ⚠️ | ✅ |\n| DevTools | ❌ | ❌ | ✅ | ✅ |\n| Bundle size | 0KB | 0KB | ~2-15KB | ~12KB |\n\n**Recommendations:**\n- **Server state:** React Query / SWR / Apollo\n- **Client state:** Zustand / Jotai (simple), Redux Toolkit (complex)\n- **Form state:** React Hook Form / Formik\n- **URL state:** React Router / nuqs\n\n---"},{"id":"04-23","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"API Layer Design","prompt":"**Best practice cho API layer trong React app?**","opts":[{"k":"A","t":"Gọi `fetch` thẳng trong component và xử lý lỗi ngay tại chỗ dùng"},{"k":"B","t":"Bọc tất cả vào một hàm request duy nhất nhận URL và trả về JSON đã parse"},{"k":"C","t":"Chuyển toàn bộ sang GraphQL để client tự chọn trường cần lấy"},{"k":"D","t":"Tầng API tách riêng, xử lý lỗi tập trung, interceptor cho request và response, và kiểu dữ liệu ràng buộc theo hợp đồng API"}],"ans":"D","expl":"**Giải thích:**\nLý do tách tầng không phải cho gọn mà là để những việc lặp lại chỉ viết một lần: gắn token, làm mới token khi gặp 401, thử lại khi lỗi mạng, ghi log, huỷ request cũ. Kiểu dữ liệu ràng buộc bắt được lúc build khi backend đổi hợp đồng, thay vì để người dùng gặp `undefined` lúc chạy.\n\n**Đánh đổi:** thêm một lớp là thêm một chặng khi debug, và lớp đó rất dễ phình. Dấu hiệu hỏng là component bắt đầu truyền đủ loại tuỳ chọn riêng xuống tầng API — lúc đó lớp trừu tượng đang rò rỉ. Giữ nó mỏng: chỉ lo chuyện vận chuyển, không nhét logic nghiệp vụ vào.\n\nB là bản rút gọn của D và dùng tốt cho dự án nhỏ, nhưng thiếu chỗ móc cho interceptor nên việc làm mới token sẽ lại rải ra khắp nơi. C nhầm tầng: GraphQL là lựa chọn thiết kế API phía server, chọn nó rồi thì client vẫn cần một tầng lo cache, lỗi và xác thực. A gọn cho một hai chỗ, nhưng khi có 40 chỗ gọi API thì mỗi lần đổi cách xử lý lỗi là sửa 40 nơi.\n\n---"},{"id":"04-24","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"Feature Flags","prompt":"**Implement feature flags system. Considerations?**","opts":[{"k":"A","t":"Dùng biến môi trường và build riêng cho từng cấu hình"},{"k":"B","t":"Cấu hình từ xa, bật dần theo phần trăm người dùng, phân nhóm đối tượng, và công tắc tắt nhanh không cần deploy"},{"k":"C","t":"Tạo nhánh Git riêng cho mỗi tính năng rồi merge khi sẵn sàng"},{"k":"D","t":"Đọc cờ từ `localStorage` để mỗi người tự bật tính năng muốn thử"}],"ans":"B","expl":"**Giải thích:**\nGiá trị cốt lõi của feature flag là đổi hành vi mà không cần deploy. Công tắc tắt nhanh là phần quan trọng nhất: tính năng mới gây sự cố lúc 2 giờ sáng thì tắt trong 10 giây, thay vì chờ một vòng build và deploy. Bật dần theo phần trăm và phân nhóm là thứ biến việc phát hành thành có kiểm soát.\n\n**Đánh đổi lớn nhất là nợ tích luỹ.** Mỗi cờ nhân đôi số nhánh code phải kiểm thử, và cờ thì không tự chết. Một codebase có 80 cờ đang sống thì về lý thuyết có 2^80 tổ hợp trạng thái, thực tế nghĩa là không ai còn dám xoá nhánh nào. Cách chữa là quy định từ đầu: mỗi cờ có người chịu trách nhiệm và hạn xoá, quá hạn thì hoặc gỡ hoặc chuyển thành cấu hình chính thức.\n\nA hỏng đúng chỗ cờ sinh ra để giải quyết: biến môi trường cố định lúc build nên đổi là phải build và deploy lại. C là vấn đề mà cờ giải, vì nhánh sống lâu thì merge càng ngày càng đau. D không có điều khiển tập trung nên không tắt được cho tất cả người dùng khi có sự cố.\n\n---"},{"id":"04-25","topic":"System Design","group":"ARCHITECTURE PATTERNS","title":"Design System","prompt":"**Key components của Frontend Design System?**","opts":[{"k":"A","t":"Design token, thư viện component, tài liệu sử dụng, chuẩn accessibility, hệ thống theme, và quy tắc đánh phiên bản"},{"k":"B","t":"Một thư viện comp
