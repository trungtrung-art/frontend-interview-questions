<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn Luyện Frontend Senior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@600;700&display=swap">
<script>/*! marked v18.0.13 — MIT — https://github.com/markedjs/marked */
__LIB_MARKED__</script>
<script>__LIB_HLJS__</script>
<style>
/* ============ nền chung ============ */
html{color-scheme:light dark}
img{max-width:100%}
[hidden]{display:none!important}

/* ============ tokens ============ */
:root{
  --bg:#F2F5F4; --surface:#FBFCFC; --sunk:#E8EDEB; --line:#D3DBD8; --line-soft:#E2E8E6;
  --text:#13201E; --dim:#5B6C68; --faint:#8798943;
  --accent:#0B5D57; --accent-ink:#083F3B; --accent-soft:#DCEEEA; --on-accent:#FFFFFF;
  --known:#2F7D52; --known-soft:#DDEDE2;
  --vague:#9A6B06; --vague-soft:#F4E9D2;
  --poor:#A83226; --poor-soft:#F6E0DD;
  --shadow:0 1px 2px rgba(19,32,30,.05), 0 8px 24px -16px rgba(19,32,30,.28);
  --radius:6px;
  --rail:248px;
}
:root{ --faint:#879894; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1513; --surface:#141F1D; --sunk:#1B2725; --line:#263633; --line-soft:#1F2C2A;
    --text:#E3EBE8; --dim:#93A5A1; --faint:#6B7D79;
    --accent:#5FCDB9; --accent-ink:#8FE0D1; --accent-soft:#12302C; --on-accent:#06201D;
    --known:#5CBA85; --known-soft:#14301F;
    --vague:#D6A23F; --vague-soft:#332715;
    --poor:#E0705F; --poor-soft:#3A1E1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#141F1D; --sunk:#1B2725; --line:#263633; --line-soft:#1F2C2A;
  --text:#E3EBE8; --dim:#93A5A1; --faint:#6B7D79;
  --accent:#5FCDB9; --accent-ink:#8FE0D1; --accent-soft:#12302C; --on-accent:#06201D;
  --known:#5CBA85; --known-soft:#14301F;
  --vague:#D6A23F; --vague-soft:#332715;
  --poor:#E0705F; --poor-soft:#3A1E1A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; text-wrap:balance; line-height:1.25; margin:0}
code,kbd,pre,.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--accent); text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent); text-underline-offset:2px}
a:hover{text-decoration-color:var(--accent)}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ============ shell ============ */
.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:18px 18px 14px; border-bottom:1px solid var(--line-soft)}
.brand h1{font-size:17px; letter-spacing:-.01em}
.brand .sub{font-size:11.5px; color:var(--faint); margin-top:3px; letter-spacing:.06em; text-transform:uppercase}
.modes{display:flex; flex-direction:column; gap:1px; padding:10px 10px 6px}
.mode{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius);
  font-size:14px; font-weight:500; color:var(--dim); text-align:left; width:100%;
  transition:background .12s, color .12s;
}
.mode:hover{background:var(--sunk); color:var(--text)}
.mode[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.mode .tick{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--faint); margin-left:auto; font-variant-numeric:tabular-nums}
.mode[aria-current="true"] .tick{color:var(--accent-ink)}

.railsec{padding:8px 10px 20px; border-top:1px solid var(--line-soft); margin-top:8px}
.railsec > .lbl{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); padding:6px 10px 8px}
.secbtn{width:100%; text-align:left; padding:7px 10px; border-radius:var(--radius); display:block; transition:background .12s}
.secbtn:hover{background:var(--sunk)}
.secbtn[aria-current="true"]{background:var(--sunk)}
.secbtn .row{display:flex; align-items:baseline; gap:8px; font-size:13px}
.secbtn .nm{font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.secbtn .ct{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--faint); font-variant-numeric:tabular-nums}
.bar{height:3px; background:var(--line-soft); border-radius:2px; margin-top:6px; display:flex; overflow:hidden}
.bar i{display:block; height:100%}
.bar .k{background:var(--known)} .bar .v{background:var(--vague)}

/* ============ main ============ */
.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:10px 28px;
}
.search{position:relative; flex:1; max-width:440px}
.search input{
  width:100%; padding:7px 12px 7px 32px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); color:var(--text); font:inherit; font-size:13.5px;
}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint)}
.search kbd{
  position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:10px; color:var(--faint);
  border:1px solid var(--line); border-radius:3px; padding:1px 4px; background:var(--bg);
}
.tools{margin-left:auto; display:flex; align-items:center; gap:8px}
.iconbtn{padding:6px 9px; border-radius:var(--radius); color:var(--dim); border:1px solid transparent; transition:background .12s,color .12s}
.iconbtn:hover{background:var(--sunk); color:var(--text)}
.syncdot{font-size:11px; color:var(--faint); display:flex; align-items:center; gap:6px; padding-right:4px}
.syncdot b{width:6px; height:6px; border-radius:50%; background:var(--faint); display:block}
.syncdot[data-on="1"] b{background:var(--known)}

.page{padding:30px 28px 90px; max-width:1180px; width:100%}
.reading{max-width:74ch}

/* ============ dashboard ============ */
.hero{margin-bottom:26px}
.hero .eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:8px}
.hero h2{font-size:29px; letter-spacing:-.02em}
.hero p{color:var(--dim); margin:8px 0 0; max-width:62ch; font-size:14.5px}

.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin:22px 0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
.card .lbl{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint)}
.card .val{font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:500; margin-top:6px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.card .val small{font-size:14px; color:var(--faint); font-weight:400}
.card .note{font-size:12px; color:var(--dim); margin-top:4px}
.card.k .val{color:var(--known)} .card.v .val{color:var(--vague)} .card.a .val{color:var(--accent)}

h3.blk{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-family:"Be Vietnam Pro",sans-serif; font-weight:600; margin:30px 0 12px}

.progtable{width:100%; border-collapse:collapse; font-size:13.5px}
.progtable th{text-align:left; font-weight:600; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); padding:0 10px 8px; border-bottom:1px solid var(--line)}
.progtable td{padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
.progtable tr:hover td{background:var(--surface)}
.progtable .num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; color:var(--dim); white-space:nowrap}
.progtable .go{color:var(--accent); font-size:12.5px; font-weight:500}
.wbar{height:6px; width:100%; min-width:80px; background:var(--line-soft); border-radius:3px; display:flex; overflow:hidden}
.wbar i{display:block; height:100%}

.routes{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px}
.route{
  text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; transition:border-color .12s, background .12s;
}
.route:hover{border-color:var(--accent)}
.route[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.route .t{font-family:"IBM Plex Serif",serif; font-weight:600; font-size:16px}
.route .d{font-size:12.5px; color:var(--dim); margin-top:5px}
.routebody{margin-top:14px}

/* ============ question list ============ */
.qhead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:6px}
.qhead h2{font-size:23px; letter-spacing:-.015em}
.qhead .meta{font-size:12.5px; color:var(--faint); font-family:"IBM Plex Mono",monospace}
.filters{display:flex; gap:6px; margin:16px 0 18px; flex-wrap:wrap}
.chip{
  font-size:12.5px; padding:4px 11px; border-radius:100px; border:1px solid var(--line);
  color:var(--dim); background:var(--surface); transition:all .12s;
}
.chip:hover{border-color:var(--accent); color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:500}

.qlist{display:flex; flex-direction:column; gap:1px}
.qrow{
  display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--radius);
  text-align:left; width:100%; border-left:3px solid transparent; transition:background .12s;
}
.qrow:hover{background:var(--surface)}
.qrow[data-st="known"]{border-left-color:var(--known)}
.qrow[data-st="vague"]{border-left-color:var(--vague)}
.qrow .id{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--faint);
  min-width:62px; font-variant-numeric:tabular-nums;
}
.qrow .ttl{flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.qrow .tags{display:flex; gap:5px; align-items:center}
.pip{width:7px; height:7px; border-radius:50%; background:var(--line)}
.pip[data-st="known"]{background:var(--known)} .pip[data-st="vague"]{background:var(--vague)}
.hasnote{color:var(--accent); font-size:11px; font-weight:600; font-family:"IBM Plex Mono",monospace}
.empty{color:var(--faint); font-size:14px; padding:40px 12px; text-align:center}

/* ============ question detail ============ */
.crumb{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--faint); margin-bottom:14px; flex-wrap:wrap}
.crumb button{color:var(--accent); font-weight:500}
.qtitle{font-size:25px; letter-spacing:-.02em; margin-bottom:4px}
.qid{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--faint); letter-spacing:.04em}
.rate{display:flex; gap:7px; margin:18px 0 26px; flex-wrap:wrap; align-items:center}
.rate .lbl{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-right:4px}
.rbtn{
  font-size:13px; padding:5px 13px; border-radius:100px; border:1px solid var(--line);
  background:var(--surface); color:var(--dim); font-weight:500; transition:all .12s;
}
.rbtn:hover{border-color:var(--dim); color:var(--text)}
.rbtn[aria-pressed="true"][data-v="known"]{background:var(--known-soft); border-color:var(--known); color:var(--known)}
.rbtn[aria-pressed="true"][data-v="vague"]{background:var(--vague-soft); border-color:var(--vague); color:var(--vague)}
.rbtn[aria-pressed="true"][data-v="unknown"]{background:var(--sunk); border-color:var(--dim); color:var(--text)}

.prose{font-size:15px}
.prose h1,.prose h2{font-size:21px; margin:32px 0 10px}
.prose h3{font-size:17px; margin:26px 0 8px}
.prose h4{font-size:15px; margin:20px 0 6px; font-family:"Be Vietnam Pro",sans-serif; font-weight:600}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 14px; padding-left:22px}
.prose li{margin-bottom:5px}
.prose li::marker{color:var(--faint)}
.prose strong{font-weight:600}
.prose blockquote{
  margin:0 0 16px; padding:2px 0 2px 16px; border-left:2px solid var(--accent);
  color:var(--dim); font-style:normal;
}
.prose blockquote p:last-child{margin-bottom:0}
.prose hr{border:0; border-top:1px solid var(--line); margin:28px 0}
.prose code{
  font-size:.875em; background:var(--sunk); padding:1.5px 5px; border-radius:3px;
  border:1px solid var(--line-soft);
}
.prose pre{
  background:var(--sunk); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; overflow-x:auto; margin:0 0 16px; font-size:12.8px; line-height:1.6;
}
.prose pre code{background:none; border:0; padding:0; font-size:inherit}
.tablewrap{overflow-x:auto; margin:0 0 18px}
.prose table{border-collapse:collapse; font-size:13.5px; min-width:100%}
.prose th{
  text-align:left; font-weight:600; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--faint); padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
.prose td{padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.prose tbody tr:hover td{background:var(--surface)}
.prose img{max-width:100%}
.prose .mermaid{white-space:pre; font-family:"IBM Plex Mono",monospace; font-size:12px}

/* ============ notes ============ */
.notebox{
  margin:34px 0 10px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--accent); border-radius:var(--radius); padding:14px 16px;
}
.notebox .nhead{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.notebox .nhead .t{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:600}
.notebox .nhead .st{margin-left:auto; font-size:11.5px; color:var(--faint); font-family:"IBM Plex Mono",monospace}
.notebox textarea{
  width:100%; min-height:110px; resize:vertical; border:0; background:none; color:var(--text);
  font:inherit; font-size:14px; line-height:1.65; padding:0;
}
.notebox textarea:focus{outline:none}
.notebox textarea::placeholder{color:var(--faint)}

.qnav{display:flex; gap:10px; margin-top:34px; padding-top:18px; border-top:1px solid var(--line)}
.navbtn{
  flex:1; text-align:left; border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px;
  background:var(--surface); transition:border-color .12s; min-width:0;
}
.navbtn:hover{border-color:var(--accent)}
.navbtn[disabled]{opacity:.4; cursor:default}
.navbtn[disabled]:hover{border-color:var(--line)}
.navbtn .d{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.navbtn .n{font-size:13.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.navbtn.next{text-align:right}

/* ============ notes index ============ */
.notecard{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; width:100%; text-align:left;
  transition:border-color .12s;
}
.notecard:hover{border-color:var(--accent)}
.notecard .h{display:flex; gap:10px; align-items:baseline; margin-bottom:6px}
.notecard .h .id{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--faint)}
.notecard .h .t{font-size:14px; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.notecard .b{font-size:13.5px; color:var(--dim); white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}

/* ============ highlight.js (tokens của trang) ============ */
.hljs-comment,.hljs-quote{color:var(--faint); font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-type{color:var(--accent); font-weight:500}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--known)}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--vague)}
.hljs-title,.hljs-name,.hljs-section,.hljs-attr{color:var(--text); font-weight:600}
.hljs-built_in,.hljs-class .hljs-title{color:var(--accent-ink)}
.hljs-variable,.hljs-template-variable,.hljs-attribute{color:var(--text)}
.hljs-deletion{color:var(--poor)}
.hljs-meta{color:var(--faint)}

#link[data-on="1"]{color:var(--known)}
#link[data-on="1"]:hover{background:var(--known-soft)}

/* ============ thông báo ============ */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:10px 18px; border-radius:100px;
  font-size:13.5px; font-weight:500; z-index:60; box-shadow:var(--shadow); max-width:calc(100vw - 32px);
}
.backup{
  display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--vague); border-radius:var(--radius); padding:12px 15px; margin:22px 0 0;
  font-size:13.5px; color:var(--dim);
}
.backup b{color:var(--text); font-weight:600}
.backup button{color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:2px}

/* ============ trắc nghiệm ============ */
.qz{max-width:80ch}
.qzmeta{display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap}
.qzmeta .step{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
.qzmeta .track{flex:1; min-width:120px; height:4px; background:var(--line-soft); border-radius:2px; overflow:hidden}
.qzmeta .track i{display:block; height:100%; background:var(--accent); transition:width .25s}
.qzmeta .score{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}
.qztopic{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); margin-bottom:6px}
.qztitle{font-size:21px; letter-spacing:-.015em; margin-bottom:14px}
.opts{display:flex; flex-direction:column; gap:8px; margin:18px 0 6px}
.opt{
  display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; padding:12px 14px;
  border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);
  transition:border-color .12s, background .12s;
}
.opt:not([disabled]):hover{border-color:var(--accent); background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.opt .k{font-family:"IBM Plex Mono",monospace; font-weight:500; color:var(--faint); flex:0 0 16px; line-height:1.6}
.opt .t{flex:1; min-width:0}
.opt .mark{flex:0 0 auto; font-size:11.5px; font-weight:600; font-family:"IBM Plex Mono",monospace; align-self:center}
.opt[data-r="right"]{border-color:var(--known); background:var(--known-soft)}
.opt[data-r="right"] .k,.opt[data-r="right"] .mark{color:var(--known)}
.opt[data-r="wrong"]{border-color:var(--poor); background:var(--poor-soft)}
.opt[data-r="wrong"] .k,.opt[data-r="wrong"] .mark{color:var(--poor)}
.opt .prose{font-size:14px}
.opt .prose > *:last-child{margin-bottom:0}
.opt .prose p{margin:0 0 8px}
.opt .prose pre{margin:0; font-size:12.2px}
.verdict{
  display:flex; align-items:center; gap:10px; margin:20px 0 4px; padding:11px 14px;
  border-radius:var(--radius); font-size:14px; font-weight:500;
}
.verdict[data-r="right"]{background:var(--known-soft); color:var(--known)}
.verdict[data-r="wrong"]{background:var(--poor-soft); color:var(--poor)}
.expl{border-top:1px solid var(--line); margin-top:18px; padding-top:16px}
.qzactions{display:flex; gap:10px; margin-top:26px; padding-top:18px; border-top:1px solid var(--line); flex-wrap:wrap}
.btn{
  padding:9px 18px; border-radius:var(--radius); background:var(--accent); color:var(--on-accent);
  font-weight:600; font-size:14px; border:1px solid var(--accent);
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none; color:var(--dim); border-color:var(--line); font-weight:500}
.btn.ghost:hover{border-color:var(--accent); color:var(--text); filter:none}
.setup{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-bottom:8px}
.tcard{
  text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px 15px; transition:border-color .12s, background .12s;
}
.tcard:hover{border-color:var(--accent)}
.tcard[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.tcard .t{font-weight:600; font-size:14.5px}
.tcard .s{font-size:12px; color:var(--dim); margin-top:5px; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.tcard .tr{height:4px; background:var(--line-soft); border-radius:2px; margin-top:8px; overflow:hidden; display:flex}
.tcard .tr i{display:block; height:100%}

/* ============ responsive ============ */
.railtoggle{display:none}
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:fixed; z-index:40; width:var(--rail); transform:translateX(-100%);
    transition:transform .2s ease; box-shadow:var(--shadow);
  }
  .rail[data-open="1"]{transform:none}
  .railtoggle{display:inline-flex}
  .page{padding:24px 18px 80px}
  .topbar{padding:10px 18px}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:35}
}
@media (max-width:620px){
  .search kbd{display:none}
  .hero h2{font-size:24px}
  .qrow .id{min-width:52px}
}
</style>
</head>
<body>

          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1"/></svg>
        </button>

<script>
/* ===================== dữ liệu nhúng ===================== */
const MD = { giaoan: __MD_GIAOAN__, playbook: __MD_PLAYBOOK__, algo: __MD_ALGO__ };
const QUIZ = __QUIZ_DATA__;
const QUIZ_BY_ID = new Map(QUIZ.map(q => [q.id, q]));
const QUIZ_TOPICS = [...new Set(QUIZ.map(({ topic }) => topic))];

/* ===================== phân tách giáo án ===================== */
const parseGiaoAn = md => {
  const out = [];
  let sec = null, q = null;
  for (const line of md.split('\n')) {
    const s = /^# (.+)$/.exec(line);
    const h = /^## (Câu [^:]+):\s*(.*)$/.exec(line);
    if (s) {
      sec = { title: s[1], intro: [], questions: [] };
      out.push(sec);
      q = null;
    } else if (h && sec) {
      if (h[1].trim() === 'Câu X') { q = null; continue; }
      q = { id: h[1].trim(), title: h[2].trim(), section: sec.title, body: [] };
      sec.questions.push(q);
    } else if (q) q.body.push(line);
    else if (sec) sec.intro.push(line);
  }
  return out;
};

const ALL_SECS = parseGiaoAn(MD.giaoan);
const SECTIONS = ALL_SECS.filter(({ questions }) => questions.length);
const DOCSECS = ALL_SECS
  .filter(({ questions }) => !questions.length)
  .map(({ title, intro }, i) => ({
    key: `doc${i}`,
    label: i === 0 ? 'Mở đầu' : title.replace(/^Phụ lục:\s*/, 'Phụ lục — '),
    md: intro.join('\n').trim(),
  }))
  .filter(({ md }) => md.length > 40);

const QUESTIONS = SECTIONS.flatMap(({ questions }) => questions);
const BY_ID = new Map(QUESTIONS.map(q => [q.id, q]));
const shortSec = t => t.replace(/^Phần\s*[\d.]+:\s*/, '').replace(/^Phụ lục:\s*/, 'Phụ lục ');

/* ===================== tiện ích ===================== */
const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => `${s}`.replace(/[&<>"']/g, c => ESCAPES[c]);

const el = (tag, cls = '', html = null) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html !== null) node.innerHTML = html;
  return node;
};

const pct = (part, whole) => (whole ? Math.round((part / whole) * 100) : 0);
const width = (part, whole) => `${whole ? (part / whole) * 100 : 0}%`;

/* ===================== markdown ===================== */
marked.setOptions({ gfm: true, breaks: false });

const render = md => {
  const box = el('div', 'prose', marked.parse(md));

  for (const table of box.querySelectorAll('table')) {
    const wrap = el('div', 'tablewrap');
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  }

  for (const code of box.querySelectorAll('pre code')) {
    const [, lang] = code.className.match(/language-([\w-]+)/) ?? [];
    if (lang === 'mermaid') { code.parentElement.className = 'mermaid'; continue; }
    try {
      const { value } = lang && hljs.getLanguage(lang)
        ? hljs.highlight(code.textContent, { language: lang })
        : hljs.highlightAuto(code.textContent);
      code.innerHTML = value;
      code.classList.add('hljs');
    } catch {
      /* tô màu hỏng thì để nguyên văn bản thuần */
    }
  }
  return box;
};

/* ===================== lưu trữ ===================== */
const LS = {
  get: (key, fallback) => {
    try {
      const raw = localStorage.getItem(`fe.${key}`);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  },
  set: (key, value) => {
    try {
      localStorage.setItem(`fe.${key}`, JSON.stringify(value));
    } catch {
      /* chế độ riêng tư hoặc hết dung lượng: bỏ qua */
    }
  },
};

const state = {
  mode: 'today',
  section: null,
  question: null,
  docsec: null,
  filter: 'all',
  query: '',
  route: LS.get('route', null),
  status: LS.get('status', {}),
  notes: LS.get('notes', {}),
  quizRes: LS.get('quiz', {}),
  quizPick: LS.get('quizPick', 'all'),
  quiz: null,
};

const saveNotes = () => { LS.set('notes', state.notes); queueLinkedWrite(); };
const saveQuiz = () => { LS.set('quiz', state.quizRes); queueLinkedWrite(); };
const saveProgress = () => {
  LS.set('status', state.status);
  LS.set('route', state.route);
  queueLinkedWrite();
};

/* ===================== thống kê ===================== */
const statOf = id => state.status[id] ?? 'none';

const tally = list => {
  const counts = { known: 0, vague: 0, none: 0 };
  for (const { id } of list) counts[statOf(id)]++;
  return counts;
};

const noteCount = () => Object.values(state.notes).filter(t => t?.trim()).length;
const hasNote = id => Boolean(state.notes[id]?.trim());

/* ===================== trắc nghiệm: dữ liệu ===================== */
const qzRes = id => state.quizRes[id];
const qzDone = () => Object.keys(state.quizRes).length;
const qzRight = () => Object.values(state.quizRes).filter(({ ok }) => ok).length;
const qzWrongIds = () => QUIZ.filter(({ id }) => qzRes(id) && !qzRes(id).ok).map(({ id }) => id);
const qzNewIds = () => QUIZ.filter(({ id }) => !qzRes(id)).map(({ id }) => id);

const qzPool = () => {
  const { quizPick } = state;
  if (quizPick === 'all') return QUIZ.map(({ id }) => id);
  if (quizPick === 'wrong') return qzWrongIds();
  if (quizPick === 'new') return qzNewIds();
  return QUIZ.filter(({ topic }) => topic === quizPick).map(({ id }) => id);
};

const shuffled = list => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};

const toTop = () => window.scrollTo({ top: 0, behavior: 'instant' });

const startQuiz = (ids, len = 0) => {
  const picked = shuffled(ids);
  state.quiz = { ids: len ? picked.slice(0, len) : picked, i: 0, picked: null, right: 0 };
  draw();
  toTop();
};

const pickAnswer = key => {
  const { quiz } = state;
  if (quiz.picked) return;
  const q = QUIZ_BY_ID.get(quiz.ids[quiz.i]);
  const ok = key === q.ans;
  quiz.picked = key;
  if (ok) quiz.right++;
  state.quizRes[q.id] = { picked: key, ok, at: Date.now() };
  saveQuiz();
  draw();
};

const nextQuestion = () => {
  state.quiz.i++;
  state.quiz.picked = null;
  draw();
  toTop();
};

/* ===================== khung ===================== */
const MODES = [
  { id: 'today', label: 'Hôm nay' },
  { id: 'giaoan', label: 'Giáo án' },
  { id: 'playbook', label: 'Playbook' },
  { id: 'quiz', label: 'Trắc nghiệm' },
  { id: 'algo', label: 'Thuật toán' },
  { id: 'notes', label: 'Ghi chú' },
];

const modeTick = id => {
  if (id === 'giaoan') {
    const { known, vague } = tally(QUESTIONS);
    return `${known + vague}/${QUESTIONS.length}`;
  }
  if (id === 'quiz') return `${qzDone()}/${QUIZ.length}`;
  if (id === 'notes') return `${noteCount()}`;
  return '';
};

const drawModes = () => {
  const nav = document.getElementById('modes');
  nav.replaceChildren();

  for (const { id, label } of MODES) {
    const tick = modeTick(id);
    const btn = el('button', 'mode', `<span>${label}</span>${tick ? `<span class="tick">${tick}</span>` : ''}`);
    btn.setAttribute('aria-current', state.mode === id);
    btn.onclick = () => go({ mode: id, question: null, section: null, docsec: null });
    nav.appendChild(btn);
  }

  const railsec = document.getElementById('railsec');
  railsec.hidden = state.mode !== 'giaoan';
  if (railsec.hidden) return;

  const list = document.getElementById('seclist');
  list.replaceChildren();

  const all = el('button', 'secbtn', `<div class="row"><span class="nm">Tất cả</span><span class="ct">${QUESTIONS.length}</span></div>`);
  all.setAttribute('aria-current', state.section === null && !state.docsec);
  all.onclick = () => go({ section: null, question: null, docsec: null });
  list.appendChild(all);

  for (const { title, questions } of SECTIONS) {
    const { known, vague } = tally(questions);
    const n = questions.length;
    const btn = el('button', 'secbtn', `
      <div class="row"><span class="nm">${esc(shortSec(title))}</span><span class="ct">${n}</span></div>
      <div class="bar"><i class="k" style="width:${width(known, n)}"></i><i class="v" style="width:${width(vague, n)}"></i></div>`);
    btn.setAttribute('aria-current', state.section === title);
    btn.onclick = () => go({ section: title, question: null, docsec: null });
    list.appendChild(btn);
  }

  for (const { key, label } of DOCSECS) {
    const btn = el('button', 'secbtn', `<div class="row"><span class="nm">${esc(label)}</span><span class="ct">·</span></div>`);
    btn.setAttribute('aria-current', state.docsec === key);
    btn.onclick = () => go({ docsec: key, section: null, question: null });
    list.appendChild(btn);
  }
};

const go = patch => {
  Object.assign(state, patch);
  if (patch.mode && patch.mode !== 'giaoan') {
    state.query = '';
    state.docsec = null;
  }
  if (patch.mode && patch.mode !== 'quiz') state.quiz = null;
  closeRail();
  draw();
  toTop();
};

const draw = () => {
  drawModes();
  const page = document.getElementById('page');
  page.replaceChildren();

  if (state.question) return page.appendChild(viewQuestion(BY_ID.get(state.question)));
  if (state.mode === 'giaoan' && state.docsec) {
    return page.appendChild(viewDoc(DOCSECS.find(({ key }) => key === state.docsec)?.md ?? ''));
  }

  const views = {
    today: viewToday,
    giaoan: viewList,
    playbook: () => viewDoc(MD.playbook),
    quiz: viewQuiz,
    algo: () => viewDoc(MD.algo),
    notes: viewNotes,
  };
  page.appendChild((views[state.mode] ?? viewToday)());
};

/* ===================== màn hình: Hôm nay ===================== */
const ROUTES = [
  {
    id: '2d',
    t: 'Còn 2 ngày',
    d: 'Cấp tốc — 32 câu nền, bỏ Design System và System Design',
    plan: [
      ['Ngày 1 sáng', 'Closure, event loop, bộ nhớ', 'Câu 6', 'Câu 7', 'Câu 8', 'Câu 9', 'Câu 14', 'Câu 15', 'Câu 16', 'Câu 17', 'Câu 18'],
      ['Ngày 1 chiều', 'Render, memo, chọn loại state', 'Câu 21', 'Câu 22', 'Câu 23', 'Câu 24', 'Câu 25', 'Câu 26', 'Câu 27', 'Câu 28', 'Câu 31', 'Câu 32', 'Câu 33'],
      ['Ngày 2 sáng', 'Hiệu năng, lưu trữ, bảo mật', 'Câu 80', 'Câu 85', 'Câu 86', 'Câu 93', 'Câu 55', 'Câu 56', 'Câu 73', 'Câu 74', 'Câu 75', 'Câu 76', 'Câu 77'],
      ['Ngày 2 chiều', 'Đọc Playbook mục 4, 5 rồi viết 6 câu chuyện dự án ở mục 7'],
    ],
  },
  {
    id: '1w',
    t: 'Còn 1 tuần',
    d: 'Tiêu chuẩn — đi hết 9 phần, mỗi ngày một mảng',
    plan: [
      ['Ngày 1–2', 'JavaScript và React', '#Phần 1: JavaScript', '#Phần 2: React'],
      ['Ngày 3', 'Browser, network, storage', '#Phần 3: Browser'],
      ['Ngày 4', 'Hiệu năng', '#Phần 6: Performance'],
      ['Ngày 5', 'Bảo mật và kiến trúc', '#Phần 5: Security', '#Phần 4: Architecture'],
      ['Ngày 6', 'System Design và thuật toán', '#Phần 7: System Design'],
      ['Ngày 7', 'Engineering, behavioral và Playbook', '#Phần 8: Engineering'],
    ],
  },
  {
    id: '3w',
    t: 'Còn 3 tuần',
    d: 'Chuyên sâu — thêm follow-up và trắc nghiệm cho từng câu',
    plan: [
      ['Tuần 1', 'Nền tảng, mỗi câu tự đặt thêm một follow-up', '#Phần 1: JavaScript', '#Phần 2: React', '#Phần 3: Browser'],
      ['Tuần 2', 'Kiến trúc, design system, bảo mật, hiệu năng', '#Phần 4: Architecture', '#Phần 4.1: Design System', '#Phần 5: Security', '#Phần 6: Performance'],
      ['Tuần 3', 'System Design, engineering, live coding, mock interview', '#Phần 7: System Design', '#Phần 8: Engineering'],
    ],
  },
];

const heroLine = done =>
  done === 0 ? 'Bắt đầu từ đâu cũng được, miễn là bắt đầu'
  : done === QUESTIONS.length ? `Đã rà hết ${QUESTIONS.length} câu`
  : `Đã rà ${done} trên ${QUESTIONS.length} câu`;

const viewToday = () => {
  const w = el('div');
  const { known, vague } = tally(QUESTIONS);
  const done = known + vague;

  w.appendChild(el('div', 'hero', `
    <div class="eyebrow">Phỏng vấn Frontend Senior</div>
    <h2>${heroLine(done)}</h2>
    <p>Đánh dấu từng câu là <em>biết rõ</em>, <em>mơ hồ</em> hay <em>chưa biết</em> khi đọc.
       Ghi chú viết ở cuối mỗi câu và gom lại ở mục Ghi chú.</p>`));

  w.appendChild(el('div', 'cards', `
    <div class="card a"><div class="lbl">Tiến độ</div><div class="val">${pct(done, QUESTIONS.length)}<small>%</small></div><div class="note">${done}/${QUESTIONS.length} câu đã rà</div></div>
    <div class="card k"><div class="lbl">Biết rõ</div><div class="val">${known}</div><div class="note">không cần đọc lại</div></div>
    <div class="card v"><div class="lbl">Mơ hồ</div><div class="val">${vague}</div><div class="note">ưu tiên ôn trước</div></div>
    <div class="card"><div class="lbl">Ghi chú</div><div class="val">${noteCount()}</div><div class="note">câu đã có ghi chú</div></div>`));

  if (vague > 0) {
    w.appendChild(el('h3', 'blk', 'Ôn lại những câu còn mơ hồ'));
    const list = el('div', 'qlist');
    for (const q of QUESTIONS.filter(({ id }) => statOf(id) === 'vague').slice(0, 8)) list.appendChild(qrow(q));
    w.appendChild(list);
  }

  w.appendChild(el('h3', 'blk', 'Tiến độ theo phần'));
  const tbl = el('table', 'progtable', '<thead><tr><th>Phần</th><th>Câu</th><th style="width:34%">Đã rà</th><th></th></tr></thead>');
  const tbody = el('tbody');
  for (const { title, questions } of SECTIONS) {
    const t = tally(questions);
    const n = questions.length;
    const tr = el('tr', '', `
      <td>${esc(shortSec(title))}</td>
      <td class="num">${n}</td>
      <td><div class="wbar"><i style="width:${width(t.known, n)};background:var(--known)"></i><i style="width:${width(t.vague, n)};background:var(--vague)"></i></div></td>
      <td class="num">${t.known + t.vague}/${n}</td>`);
    tr.style.cursor = 'pointer';
    tr.onclick = () => go({ mode: 'giaoan', section: title, question: null });
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  w.appendChild(el('div', 'tablewrap')).appendChild(tbl);

  const backup = el('div', 'backup');
  const line = el('div');
  line.id = 'linkline';
  line.append(...linkLineParts());
  backup.appendChild(line);
  w.appendChild(backup);

  if (DOCSECS.length) {
    w.appendChild(el('h3', 'blk', 'Tài liệu nền'));
    const row = el('div', 'filters');
    for (const { key, label } of DOCSECS) {
      const chip = el('button', 'chip', esc(label));
      chip.onclick = () => go({ mode: 'giaoan', docsec: key, section: null, question: null });
      row.appendChild(chip);
    }
    w.appendChild(row);
  }

  w.appendChild(el('h3', 'blk', 'Lộ trình theo quỹ thời gian'));
  const routes = el('div', 'routes');
  for (const { id, t, d } of ROUTES) {
    const btn = el('button', 'route', `<div class="t">${t}</div><div class="d">${d}</div>`);
    btn.setAttribute('aria-pressed', state.route === id);
    btn.onclick = () => {
      state.route = state.route === id ? null : id;
      saveProgress();
      draw();
    };
    routes.appendChild(btn);
  }
  w.appendChild(routes);

  const chosen = ROUTES.find(({ id }) => id === state.route);
  if (!chosen) return w;

  const planTbl = el('table', 'progtable', '<thead><tr><th>Buổi</th><th>Nội dung</th></tr></thead>');
  const planBody = el('tbody');
  for (const [when, what, ...refs] of chosen.plan) {
    const cell = el('td');
    cell.append(what);
    if (refs.length) {
      const chips = el('div', 'filters');
      chips.style.margin = '6px 0 0';
      for (const ref of refs) {
        const isSection = ref.startsWith('#');
        const chip = el('button', 'chip', isSection ? esc(shortSec(ref.slice(1))) : esc(ref));
        chip.onclick = isSection
          ? () => go({ mode: 'giaoan', section: ref.slice(1), question: null })
          : () => go({ mode: 'giaoan', question: ref });
        chips.appendChild(chip);
      }
      cell.appendChild(chips);
    }
    const tr = el('tr');
    tr.appendChild(el('td', 'num', esc(when)));
    tr.appendChild(cell);
    planBody.appendChild(tr);
  }
  planTbl.appendChild(planBody);
  w.appendChild(el('div', 'routebody')).appendChild(el('div', 'tablewrap')).appendChild(planTbl);
  return w;
};

/* ===================== màn hình: danh sách câu ===================== */
const qrow = ({ id, title }) => {
  const btn = el('button', 'qrow', `
    <span class="id">${esc(id.replace(/^Câu\s*/, ''))}</span>
    <span class="ttl">${esc(title)}</span>
    <span class="tags">${hasNote(id) ? '<span class="hasnote">ghi chú</span>' : ''}<span class="pip" data-st="${statOf(id)}"></span></span>`);
  btn.dataset.st = statOf(id);
  btn.onclick = () => go({ mode: 'giaoan', question: id });
  return btn;
};

const viewList = () => {
  const w = el('div');
  const query = state.query.trim().toLowerCase();

  let pool = state.section
    ? SECTIONS.find(({ title }) => title === state.section)?.questions ?? []
    : QUESTIONS;
  if (state.filter !== 'all') pool = pool.filter(({ id }) => statOf(id) === state.filter);
  if (query) pool = pool.filter(({ id, title, section }) => `${id} ${title} ${section}`.toLowerCase().includes(query));

  w.appendChild(el('div', 'qhead',
    `<h2>${esc(state.section ? shortSec(state.section) : 'Toàn bộ câu hỏi')}</h2><span class="meta">${pool.length} câu</span>`));

  const filters = el('div', 'filters');
  for (const [value, label] of [['all', 'Tất cả'], ['none', 'Chưa rà'], ['vague', 'Mơ hồ'], ['known', 'Biết rõ']]) {
    const chip = el('button', 'chip', label);
    chip.setAttribute('aria-pressed', state.filter === value);
    chip.onclick = () => { state.filter = value; draw(); };
    filters.appendChild(chip);
  }
  w.appendChild(filters);

  if (!pool.length) {
    w.appendChild(el('div', 'empty', 'Không có câu nào khớp. Thử bỏ bớt bộ lọc.'));
    return w;
  }

  const list = el('div', 'qlist');
  const grouped = !state.section && !query && state.filter === 'all';
  if (grouped) {
    for (const { title, questions } of SECTIONS) {
      list.appendChild(el('h3', 'blk', esc(shortSec(title))));
      for (const q of questions) list.appendChild(qrow(q));
    }
  } else {
    for (const q of pool) list.appendChild(qrow(q));
  }
  w.appendChild(list);
  return w;
};

/* ===================== màn hình: một câu ===================== */
const RATINGS = [['known', 'Biết rõ'], ['vague', 'Mơ hồ'], ['unknown', 'Chưa biết']];

const viewQuestion = q => {
  const w = el('div', 'reading');
  if (!q) {
    w.appendChild(el('div', 'empty', 'Không tìm thấy câu này.'));
    return w;
  }
  const idx = QUESTIONS.indexOf(q);

  const crumb = el('div', 'crumb');
  const back = el('button', '', '← Danh sách');
  back.onclick = () => go({ question: null });
  const toSection = el('button', '', esc(shortSec(q.section)));
  toSection.onclick = () => go({ section: q.section, question: null });
  crumb.append(back, '·', toSection);
  w.appendChild(crumb);

  w.appendChild(el('div', 'qid', esc(q.id)));
  w.appendChild(el('h2', 'qtitle', esc(q.title)));

  const rate = el('div', 'rate', '<span class="lbl">Tự chấm</span>');
  for (const [value, label] of RATINGS) {
    const btn = el('button', 'rbtn', label);
    btn.dataset.v = value;
    btn.setAttribute('aria-pressed', statOf(q.id) === value);
    btn.onclick = () => {
      if (state.status[q.id] === value) delete state.status[q.id];
      else state.status[q.id] = value;
      saveProgress();
      draw();
    };
    rate.appendChild(btn);
  }
  w.appendChild(rate);
  w.appendChild(render(q.body.join('\n')));

  const box = el('div', 'notebox', '<div class="nhead"><span class="t">Ghi chú của anh</span><span class="st"></span></div>');
  const status = box.querySelector('.st');
  const area = el('textarea');
  area.placeholder = 'Viết lại bằng lời của mình, ghi chỗ chưa hiểu, hoặc dán ví dụ từ dự án thật…';
  area.value = state.notes[q.id] ?? '';
  area.setAttribute('aria-label', `Ghi chú cho ${q.id}`);
  let timer = null;
  area.oninput = () => {
    state.notes[q.id] = area.value;
    saveNotes();
    status.textContent = 'đang lưu…';
    clearTimeout(timer);
    timer = setTimeout(() => {
      status.textContent = 'đã lưu';
      setTimeout(() => { status.textContent = ''; }, 1600);
    }, 700);
  };
  box.appendChild(area);
  w.appendChild(box);

  const nav = el('div', 'qnav');
  for (const [dir, target, cls] of [['Câu trước', QUESTIONS[idx - 1], 'navbtn'], ['Câu sau', QUESTIONS[idx + 1], 'navbtn next']]) {
    const btn = el('button', cls, `<div class="d">${dir}</div><div class="n">${target ? esc(target.title) : '—'}</div>`);
    btn.disabled = !target;
    if (target) btn.onclick = () => go({ question: target.id });
    nav.appendChild(btn);
  }
  w.appendChild(nav);
  return w;
};

/* ===================== màn hình: tài liệu và ghi chú ===================== */
const viewDoc = md => {
  const w = el('div', 'reading');
  w.appendChild(render(md));
  return w;
};

const viewNotes = () => {
  const w = el('div');
  const ids = Object.keys(state.notes)
    .filter(hasNote)
    .sort((a, b) => QUESTIONS.findIndex(({ id }) => id === a) - QUESTIONS.findIndex(({ id }) => id === b));

  if (!ids.length) {

  }

  for (const id of ids) {

/* ===================== màn hình: trắc nghiệm ===================== */
const viewQuiz = () => {
  if (state.quiz) return state.quiz.i >= state.quiz.ids.length ? viewQuizDone() : viewQuizRun();

  const w = el('div');
  const done = qzDone();
  const right = qzRight();

  w.appendChild(el('div', 'qhead', `<h2>Trắc nghiệm</h2><span class="meta">${QUIZ.length} câu · ${QUIZ_TOPICS.length} chủ đề</span>`));
  w.appendChild(el('div', 'cards', `
    <div class="card a"><div class="lbl">Đã làm</div><div class="val">${done}<small>/${QUIZ.length}</small></div></div>
    <div class="card k"><div class="lbl">Đúng</div><div class="val">${right}</div></div>
    <div class="card v"><div class="lbl">Sai</div><div class="val">${done - right}</div><div class="note">nên làm lại</div></div>
    <div class="card"><div class="lbl">Tỉ lệ đúng</div><div class="val">${pct(right, done)}<small>%</small></div></div>`));

  w.appendChild(el('h3', 'blk', 'Chọn bộ câu'));
  const picks = [
    { key: 'all', label: 'Tất cả chủ đề', ids: QUIZ.map(({ id }) => id) },
    ...(qzWrongIds().length ? [{ key: 'wrong', label: 'Câu đã làm sai', ids: qzWrongIds() }] : []),
    ...(qzNewIds().length ? [{ key: 'new', label: 'Câu chưa làm', ids: qzNewIds() }] : []),
    ...QUIZ_TOPICS.map(topic => ({ key: topic, label: topic, ids: QUIZ.filter(q => q.topic === topic).map(({ id }) => id) })),
  ];

  const setup = el('div', 'setup');
  for (const { key, label, ids } of picks) {
    const tried = ids.filter(id => qzRes(id)).length;
    const correct = ids.filter(id => qzRes(id)?.ok).length;
    const card = el('button', 'tcard', `
      <div class="t">${esc(label)}</div>
      <div class="s">${ids.length} câu · đã làm ${tried}${tried ? ` · đúng ${pct(correct, tried)}%` : ''}</div>
      <div class="tr"><i style="width:${width(correct, ids.length)};background:var(--known)"></i><i style="width:${width(tried - correct, ids.length)};background:var(--poor)"></i></div>`);
    card.setAttribute('aria-pressed', state.quizPick === key);
    card.onclick = () => {
      state.quizPick = key;
      LS.set('quizPick', key);
      draw();
    };
    setup.appendChild(card);
  }
  w.appendChild(setup);

  const pool = qzPool();
  w.appendChild(el('h3', 'blk', 'Số câu mỗi lượt'));
  const lens = el('div', 'filters');
  for (const [len, label] of [[10, '10 câu'], [20, '20 câu'], [0, `Tất cả ${pool.length} câu`]]) {
    if (len && len >= pool.length) continue;
    const chip = el('button', 'chip', label);
    chip.onclick = () => startQuiz(pool, len);
    lens.appendChild(chip);
  }
  if (!pool.length) lens.appendChild(el('div', 'empty', 'Bộ này đang trống.'));
  w.appendChild(lens);
  return w;
};

const viewQuizRun = () => {
  const { ids, i, picked, right } = state.quiz;
  const q = QUIZ_BY_ID.get(ids[i]);
  const w = el('div', 'qz');

  w.appendChild(el('div', 'qzmeta', `
    <span class="step">${i + 1} / ${ids.length}</span>
    <span class="track"><i style="width:${width(i, ids.length)}"></i></span>
    <span class="score">đúng ${right}</span>`));
  w.appendChild(el('div', 'qztopic', `${esc(q.topic)} · ${esc(q.group)}`));
  w.appendChild(el('h2', 'qztitle', esc(q.title)));
  w.appendChild(render(q.prompt));

  const box = el('div', 'opts');
  for (const { k, t } of q.opts) {
    const btn = el('button', 'opt');
    btn.appendChild(el('span', 'k', `${k})`));
    const body = el('span', 't');
    body.appendChild(render(t));
    btn.appendChild(body);

    if (picked) {
      btn.disabled = true;
      if (k === q.ans) {
        btn.dataset.r = 'right';
        btn.appendChild(el('span', 'mark', 'đúng'));
      } else if (k === picked) {
        btn.dataset.r = 'wrong';
        btn.appendChild(el('span', 'mark', 'đã chọn'));
      }
    } else {
      btn.onclick = () => pickAnswer(k);
    }
    box.appendChild(btn);
  }
  w.appendChild(box);
  if (!picked) return w;

  const ok = picked === q.ans;
  const verdict = el('div', 'verdict', ok ? 'Đúng' : `Chưa đúng — đáp án là ${q.ans}`);
  verdict.dataset.r = ok ? 'right' : 'wrong';
  w.appendChild(verdict);
  w.appendChild(el('div', 'expl')).appendChild(render(q.expl));

  const actions = el('div', 'qzactions');
  const next = el('button', 'btn', i + 1 >= ids.length ? 'Xem kết quả' : 'Câu tiếp →');
  next.onclick = nextQuestion;
  const stop = el('button', 'btn ghost', 'Dừng lượt này');
  stop.onclick = () => { state.quiz = null; draw(); };
  actions.append(next, stop);
  w.appendChild(actions);
  return w;
};

const verdictLine = score =>
  score >= 80 ? 'Mảng này nắm chắc rồi, chuyển sang chủ đề khác được.'
  : score >= 50 ? 'Ổn, nhưng còn chỗ hổng. Làm lại những câu sai bên dưới.'
  : 'Nên đọc lại lý thuyết của chủ đề này trước khi làm tiếp.';

const viewQuizDone = () => {
  const { ids, right } = state.quiz;
  const score = pct(right, ids.length);
  const wrong = ids.filter(id => state.quizRes[id] && !state.quizRes[id].ok);
  const w = el('div', 'qz');

  w.appendChild(el('div', 'hero', `
    <div class="eyebrow">Kết quả lượt này</div>
    <h2>${right} trên ${ids.length} câu · ${score}%</h2>
    <p>${verdictLine(score)}</p>`));

  if (wrong.length) {
    w.appendChild(el('h3', 'blk', 'Những câu làm sai'));
    const list = el('div', 'qlist');
    for (const id of wrong) {
      const q = QUIZ_BY_ID.get(id);
      const btn = el('button', 'qrow', `
        <span class="id">${esc(q.topic.slice(0, 4))}</span>
        <span class="ttl">${esc(q.title)}</span>
        <span class="tags"><span class="hasnote">chọn ${state.quizRes[id].picked} · đúng ${q.ans}</span></span>`);
      btn.dataset.st = 'vague';
      btn.onclick = () => startQuiz([id]);
      list.appendChild(btn);
    }
    w.appendChild(list);
  }

  const actions = el('div', 'qzactions');
  if (wrong.length) {
    const again = el('button', 'btn', `Làm lại ${wrong.length} câu sai`);
    again.onclick = () => startQuiz(wrong);
    actions.appendChild(again);
  }
  const back = el('button', 'btn ghost', 'Chọn bộ khác');
  back.onclick = () => { state.quiz = null; draw(); };
  actions.appendChild(back);
  w.appendChild(actions);
  return w;
};

/* ===================== sao lưu ===================== */
const BACKUP_FORMAT = 'on-luyen-frontend';

const toast = msg => {
  for (const old of document.querySelectorAll('.toast')) old.remove();
  const node = el('div', 'toast', esc(msg));
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 3200);
};

const backupPayload = () => ({
  format: BACKUP_FORMAT,
  version: 1,
  exportedAt: new Date().toISOString(),
  status: state.status,
  notes: state.notes,
  quiz: state.quizRes,
  route: state.route,
});

const mergeBackup = data => {
  if (data?.format !== BACKUP_FORMAT) return 0;
  const { notes = {}, status = {}, quiz = {}, route } = data;
  const changed = Object.entries(notes).filter(([id, text]) => text !== state.notes[id]).length;
  Object.assign(state.notes, notes);
  Object.assign(state.status, status);
  Object.assign(state.quizRes, quiz);
  if (route) state.route = route;
  saveNotes();
  saveProgress();
  saveQuiz();
  return changed;
};


const exportData = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(backupPayload(), null, 2)], { type: 'application/json' }));
  const link = el('a');
  link.href = url;
  link.download = `${BACKUP_FORMAT}-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Đã xuất ${noteCount()} ghi chú và ${qzDone()} kết quả trắc nghiệm`);
};

const importData = file => {
  const reader = new FileReader();
  reader.onerror = () => toast('Không đọc được file');
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch {
      toast('File không đọc được — cần đúng file JSON đã xuất từ trang này');
      return;
    }
    if (data?.format !== BACKUP_FORMAT) {
      toast('File không đúng định dạng của trang này');
      return;
    }
    const added = mergeBackup(data);
    draw();
    toast(`Đã nhập xong — ${added} ghi chú được cập nhật`);
  };
  reader.readAsText(file);
};

/* ===================== nối thẳng với file trong repo ===================== */
/*
 * File System Access API cho phép trang ghi thẳng vào một file người dùng đã
 * chọn. Chọn một lần, quyền và "tay cầm" file được cất trong IndexedDB nên lần
 * mở sau vẫn còn — chỉ cần bấm cho phép lại. Firefox và Safari chưa có API này,
 * ở đó trang tự rơi về nút xuất/nhập thủ công.
 */
const FS_OK = typeof window.showSaveFilePicker === 'function';
const IDB_KEY = 'repoFile';

const idb = {
  open: () => new Promise((resolve, reject) => {
    const req = indexedDB.open('fe-onluyen', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }),
  run: async (mode, fn) => {
    const db = await idb.open();
    return new Promise((resolve, reject) => {
      const req = fn(db.transaction('kv', mode).objectStore('kv'));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  get: key => idb.run('readonly', store => store.get(key)),
  set: (key, value) => idb.run('readwrite', store => store.put(value, key)),
  del: key => idb.run('readwrite', store => store.delete(key)),
};

const link = { handle: null, name: '', ready: false };

let linkTimer = null;
let linkWriting = false;

const writeLinked = async () => {
  if (!link.ready || linkWriting) return;
  linkWriting = true;
  try {
    const stream = await link.handle.createWritable();
    await stream.write(JSON.stringify(backupPayload(), null, 2));
    await stream.close();
  } catch {
    link.ready = false;
    drawLinkState();
    toast(`Mất quyền ghi vào ${link.name} — bấm nối lại`);
  } finally {
    linkWriting = false;
  }
};

const queueLinkedWrite = () => {
  if (!link.ready) return;
  clearTimeout(linkTimer);
  linkTimer = setTimeout(writeLinked, 1200);
};

const drawLinkState = () => {
  const btn = document.getElementById('link');
  if (!btn) return;
  btn.hidden = !FS_OK;
  btn.dataset.on = link.ready ? '1' : '0';
  btn.title = link.ready
    ? `Đang ghi thẳng vào ${link.name}`
    : link.handle
      ? `Bấm để cấp quyền ghi lại vào ${link.name}`
      : 'Nối với một file trong repo để ghi chú tự lưu vào đó';
  const box = document.getElementById('linkline');
  if (box) box.replaceChildren(...linkLineParts());
};

const pickRepoFile = async () => {
  try {
    link.handle = await window.showSaveFilePicker({
      suggestedName: 'ghi-chu.json',
      types: [{ description: 'Ghi chú ôn luyện', accept: { 'application/json': ['.json'] } }],
    });
    link.name = link.handle.name;
    link.ready = true;
    await idb.set(IDB_KEY, link.handle);

    // file đã có sẵn nội dung (ví dụ vừa pull từ git) thì nạp vào trước
    const file = await link.handle.getFile();
    if (file.size) {
      try {
        const merged = mergeBackup(JSON.parse(await file.text()));
        if (merged) toast(`Đã nạp ${merged} ghi chú từ ${link.name}`);
      } catch {
        /* file rỗng hoặc không đúng định dạng: cứ ghi đè bằng dữ liệu hiện tại */
      }
    }
    await writeLinked();
    draw();
    toast(`Ghi chú giờ tự lưu vào ${link.name}`);
  } catch {
    /* người dùng bấm huỷ hộp thoại */
  }
};

const relink = async () => {
  try {
    const granted = await link.handle.requestPermission({ mode: 'readwrite' });
    if (granted !== 'granted') return toast('Chưa được cấp quyền ghi vào file');
    link.ready = true;
    const file = await link.handle.getFile();
    if (file.size) {
      try {
        const merged = mergeBackup(JSON.parse(await file.text()));
        if (merged) toast(`Đã nạp ${merged} ghi chú từ ${link.name}`);
      } catch {
        /* bỏ qua nội dung hỏng */
      }
    }
    draw();
    drawLinkState();
  } catch {
    toast('Không nối lại được, thử chọn lại file');
  }
};

const onLinkButton = () => (link.handle && !link.ready ? relink() : pickRepoFile());

const unlinkFile = async () => {
  link.handle = null;
  link.name = '';
  link.ready = false;
  try { await idb.del(IDB_KEY); } catch { /* không sao */ }
  draw();
  toast('Đã ngắt nối, ghi chú quay về lưu trong trình duyệt');
};

const linkLineParts = () => {
  const parts = [];
  const text = document.createElement('span');
  if (!FS_OK) {
    text.innerHTML = '<b>Ghi chú chỉ nằm trong trình duyệt này.</b> Trình duyệt của anh chưa hỗ trợ ghi thẳng vào file, '
      + 'nên thỉnh thoảng bấm nút xuất ở góc phải trên rồi cất file JSON vào repo. ';
    parts.push(text);
    const btn = el('button', '', 'Xuất ngay');
    btn.onclick = exportData;
    parts.push(btn);
    return parts;
  }
  if (link.ready) {
    text.innerHTML = `<b>Đang tự ghi vào ${esc(link.name)}.</b> Mỗi lần anh sửa ghi chú là file được cập nhật. `
      + 'Nhớ <code>git add notes/ &amp;&amp; git commit</code> để giữ lại. ';
    parts.push(text);
    const btn = el('button', '', 'Ngắt nối');
    btn.onclick = unlinkFile;
    parts.push(btn);
    return parts;
  }
  if (link.handle) {
    text.innerHTML = `<b>Đã nối với ${esc(link.name)} nhưng chưa được cấp quyền ghi.</b> `
      + 'Trình duyệt hỏi lại quyền sau mỗi lần mở trang. ';
    parts.push(text);
    const btn = el('button', '', 'Cấp quyền lại');
    btn.onclick = relink;
    parts.push(btn);
    return parts;
  }
  text.innerHTML = '<b>Ghi chú đang chỉ nằm trong trình duyệt này.</b> Nối với một file trong repo '
    + 'thì mỗi lần gõ là tự ghi vào đó, chỉ còn việc commit. ';
  parts.push(text);
  const btn = el('button', '', 'Nối với file trong repo');
  btn.onclick = pickRepoFile;
  parts.push(btn);
  return parts;
};

const restoreLink = async () => {
  if (!FS_OK) return drawLinkState();
  try {
    const handle = await idb.get(IDB_KEY);
    if (!handle) return drawLinkState();
    link.handle = handle;
    link.name = handle.name;
    link.ready = (await handle.queryPermission({ mode: 'readwrite' })) === 'granted';
    if (link.ready) {
      const file = await handle.getFile();
      if (file.size) {
        try { mergeBackup(JSON.parse(await file.text())); } catch { /* bỏ qua */ }
      }
    }
    draw();
    drawLinkState();
  } catch {
    drawLinkState();
  }
};

/* ===================== giao diện chung ===================== */
const THEMES = ['system', 'dark', 'light'];

const applyTheme = theme => {
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  LS.set('theme', theme);
};
applyTheme(LS.get('theme', 'system'));

document.getElementById('theme').onclick = () => {
  const current = LS.get('theme', 'system');
  applyTheme(THEMES[(THEMES.indexOf(current) + 1) % THEMES.length]);
};

document.getElementById('link').onclick = onLinkButton;
document.getElementById('export').onclick = exportData;
document.getElementById('import').onclick = () => document.getElementById('importfile').click();
document.getElementById('importfile').onchange = ({ target }) => {
  const [file] = target.files ?? [];
  if (file) importData(file);
  target.value = '';
};

const rail = document.getElementById('rail');
let scrim = null;

const closeRail = () => {
  rail.dataset.open = '0';
  scrim?.remove();
  scrim = null;
};

document.getElementById('railtoggle').onclick = () => {
  if (rail.dataset.open === '1') return closeRail();
  rail.dataset.open = '1';
  scrim = el('div', 'scrim');
  scrim.onclick = closeRail;
  document.body.appendChild(scrim);
};

const searchBox = document.getElementById('q');
let searchTimer = null;
searchBox.oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = searchBox.value;
    if (state.query && (state.mode !== 'giaoan' || state.question)) {
      Object.assign(state, { mode: 'giaoan', question: null, section: null, docsec: null, filter: 'all' });
    }
    draw();
  }, 140);
};

const NUMBER_KEYS = { 1: 'A', 2: 'B', 3: 'C', 4: 'D' };

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);

  if (e.key === '/' && !typing) {
    e.preventDefault();
    searchBox.focus();
    searchBox.select();
    return;
  }
  if (e.key === 'Escape') {
    if (document.activeElement === searchBox) searchBox.blur();
    closeRail();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;

  const { quiz } = state;
  if (state.mode === 'quiz' && quiz && quiz.i < quiz.ids.length) {
    if (!quiz.picked) {
      const key = NUMBER_KEYS[e.key] ?? (/^[a-d]$/i.test(e.key) ? e.key.toUpperCase() : null);
      if (key && QUIZ_BY_ID.get(quiz.ids[quiz.i]).opts.some(o => o.k === key)) {
        e.preventDefault();
        pickAnswer(key);
        return;
      }
    } else if (e.key === 'Enter' || e.key === 'n') {
      e.preventDefault();
      nextQuestion();
      return;
    }
  }

  if (state.question && (e.key === 'j' || e.key === 'k')) {
    const idx = QUESTIONS.findIndex(({ id }) => id === state.question);
    const target = QUESTIONS[e.key === 'j' ? idx + 1 : idx - 1];
    if (target) go({ question: target.id });
  }
});

draw();
drawLinkState();
restoreLink();
</script>
